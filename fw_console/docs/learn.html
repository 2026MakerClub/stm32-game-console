<title>從暫存器到掌機</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F0F2EE; --paper2:#E6EAE4; --raise:#FAFBF9;
  --ink:#131B17; --ink2:#3A4A42; --mute:#6C7C73; --line:#CDD4CC;
  --panel:#0A1210; --panel2:#142019; --panelline:#22332A;
  --ch1:#E8B32A; --ch2:#2FD3D3; --copper:#B4530A; --ok:#2E7D53;
  --shadow:0 1px 2px rgba(19,27,23,.06), 0 8px 24px rgba(19,27,23,.05);
  --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
  --sans:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0D1310; --paper2:#151D18; --raise:#131B16;
    --ink:#E4EAE5; --ink2:#AFBCB4; --mute:#7F8F86; --line:#263029;
    --panel:#060B09; --panel2:#101A14; --panelline:#1E2C24;
    --copper:#E0863A; --ok:#4FBF85;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0D1310; --paper2:#151D18; --raise:#131B16;
  --ink:#E4EAE5; --ink2:#AFBCB4; --mute:#7F8F86; --line:#263029;
  --panel:#060B09; --panel2:#101A14; --panelline:#1E2C24;
  --copper:#E0863A; --ok:#4FBF85;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.35;
  text-wrap:balance;margin:0}
code,kbd,pre,.mono{font-family:var(--mono);font-variant-ligatures:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ch2);outline-offset:2px;border-radius:2px}

/* ---------- top bar ---------- */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.barin{max-width:1120px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:14px}
.brand{font-family:var(--serif);font-weight:700;font-size:15px;
  letter-spacing:.02em;white-space:nowrap}
.brand b{color:var(--copper)}
#nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
#nav::-webkit-scrollbar{display:none}
#nav button{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink2);
  background:none;border:0;padding:7px 12px;border-radius:7px;cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s}
#nav button:hover{background:var(--paper2);color:var(--ink)}
#nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
#themeBtn{font:inherit;font-size:12px;background:none;border:1px solid var(--line);
  color:var(--mute);padding:5px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}

/* ---------- layout ---------- */
main{max-width:1120px;margin:0 auto;padding-block:34px 90px;padding-inline:16px}
.col{max-width:68ch}
.lede{font-size:17.5px;color:var(--ink2);line-height:1.8}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--mute);margin-bottom:10px}
p{margin:0 0 1.05em}
main h2{font-size:26px;margin:0 0 .5em}
main h3{font-size:19px;margin:2.2em 0 .6em}
main h4{font-size:15.5px;margin:1.6em 0 .4em;font-family:var(--sans);font-weight:700}
ul,ol{margin:0 0 1.05em;padding-left:1.4em}
li{margin:.3em 0}
hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}

/* ---------- map ---------- */
.maphead{display:grid;gap:26px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
  align-items:start;margin-bottom:34px}
@media (max-width:760px){.maphead{grid-template-columns:1fr}}
.factbox{background:var(--panel);color:#DCE5DF;border-radius:12px;padding:18px 20px;
  font-family:var(--mono);font-size:12.5px;line-height:2}
.factbox .k{color:var(--mute)}
.factbox .v{color:var(--ch1)}
.factbox .v2{color:var(--ch2)}
.factbox h4{font-family:var(--mono);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:500}

.path{display:flex;flex-direction:column;gap:0;position:relative}
.st{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;
  padding:14px 0;border-top:1px solid var(--line);text-align:left;
  background:none;border-left:0;border-right:0;border-bottom:0;
  font:inherit;color:inherit;cursor:pointer;width:100%;position:relative}
.st:last-child{border-bottom:1px solid var(--line)}
.st:hover .stn{border-color:var(--ink);color:var(--ink)}
.st:hover .stt{color:var(--copper)}
.stn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:15px;
  font-weight:600;color:var(--mute);transition:.15s;position:relative;flex:none}
.st[data-done="1"] .stn{background:var(--ok);border-color:var(--ok);color:#fff}
.stt{font-family:var(--serif);font-weight:700;font-size:18px;transition:.15s}
.stsub{color:var(--ink2);font-size:14.5px;line-height:1.7;margin-top:2px}
.stmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;
  background:var(--paper2);color:var(--ink2);border:1px solid var(--line)}
.tag.reg{background:color-mix(in srgb,var(--ch1) 18%,var(--paper));
  border-color:color-mix(in srgb,var(--ch1) 40%,var(--paper));color:var(--ink)}
.tag.file{background:none;color:var(--mute)}
.tag.lab{background:color-mix(in srgb,var(--ch2) 16%,var(--paper));
  border-color:color-mix(in srgb,var(--ch2) 38%,var(--paper));color:var(--ink)}

/* ---------- blocks ---------- */
.why{background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--copper);
  border-radius:0 10px 10px 0;padding:16px 18px;margin:0 0 1.6em}
.why h4{margin:0 0 .35em;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--copper)}
.why p:last-child{margin-bottom:0}

.land{background:var(--paper2);border-radius:10px;padding:14px 16px;margin:1.6em 0;
  font-size:14.5px}
.land h4{margin:0 0 .4em;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute)}
.land a{font-family:var(--mono);font-size:13.5px;color:var(--ink);
  text-decoration-color:var(--ch2);text-decoration-thickness:2px;text-underline-offset:3px}
.land ul{margin:.4em 0 0;padding-left:1.2em}

.pit{border:1px dashed color-mix(in srgb,var(--copper) 55%,var(--line));
  border-radius:10px;padding:14px 16px;margin:1.6em 0;font-size:15px;
  background:color-mix(in srgb,var(--copper) 6%,var(--paper))}
.pit h4{margin:0 0 .35em;font-size:14px;color:var(--copper);font-family:var(--sans)}
.pit p:last-child,.pit ul:last-child{margin-bottom:0}

pre{background:var(--panel);color:#DCE5DF;border-radius:10px;padding:14px 16px;
  overflow-x:auto;font-size:13px;line-height:1.75;margin:1.2em 0}
pre .c{color:#6E8378}      /* comment */
pre .k{color:#8FD6FF}      /* keyword */
pre .n{color:var(--ch1)}   /* number  */
pre .r{color:#FF9FB2}      /* register */
pre .s{color:#9FE8A8}      /* string  */
pre .hl{background:rgba(232,179,42,.15);display:block;margin:0 -16px;padding:0 16px}
:not(pre)>code{background:var(--paper2);border-radius:4px;padding:1px 5px;font-size:.9em}
.fileref{font-family:var(--mono);font-size:11.5px;color:var(--mute);
  margin:-.7em 0 1.4em;display:block}

.term{border-bottom:1px dotted var(--copper);cursor:help;font-weight:500}

/* ---------- instrument panels ---------- */
.inst{background:var(--panel);color:#DCE5DF;border-radius:14px;margin:2.2em 0;
  overflow:hidden;box-shadow:var(--shadow)}
.insthead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid var(--panelline);background:var(--panel2)}
.insthead h4{font-family:var(--mono);font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ch2);margin:0;font-weight:500}
.insthead .sim{font-family:var(--mono);font-size:10.5px;color:var(--mute);
  border:1px solid var(--panelline);padding:2px 6px;border-radius:4px}
.instbody{padding:18px}
.instnote{font-size:12.5px;color:#8DA096;line-height:1.7;margin:14px 0 0;
  padding-top:12px;border-top:1px solid var(--panelline)}
.instbody label{font-family:var(--mono);font-size:11.5px;color:#8DA096;
  display:block;margin-bottom:5px;letter-spacing:.06em}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.row>div{min-width:0}
select,input[type=text],input[type=number]{font-family:var(--mono);font-size:13px;
  background:var(--panel2);color:#DCE5DF;border:1px solid var(--panelline);
  border-radius:7px;padding:7px 9px;min-width:0;max-width:100%}
input[type=range]{width:100%;accent-color:var(--ch2)}
.btn{font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
  background:var(--panel2);color:#DCE5DF;border:1px solid var(--panelline);
  border-radius:7px;padding:7px 13px;transition:.15s}
.btn:hover{border-color:var(--ch2);color:#fff}
.btn.on{background:var(--ch2);border-color:var(--ch2);color:#04201F;font-weight:700}
.btn.amber{background:var(--ch1);border-color:var(--ch1);color:#2A1D00;font-weight:700}

/* bit strip */
.strip{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;margin:10px 0}
.bit{flex:none;width:23px;text-align:center;font-family:var(--mono)}
.bit .b{height:26px;line-height:26px;font-size:13px;border-radius:4px;
  background:var(--panel2);border:1px solid var(--panelline);color:#5E7268}
.bit .b.one{background:var(--ch1);border-color:var(--ch1);color:#2A1D00;font-weight:600}
.bit .b.tgt{box-shadow:0 0 0 2px var(--ch2)}
.bit .i{font-size:9.5px;color:#5E7268;margin-top:3px}
.hexout{font-family:var(--mono);font-size:20px;color:var(--ch1);letter-spacing:.04em;
  font-variant-numeric:tabular-nums}
.calcout{font-family:var(--mono);font-size:15px;color:var(--ch2);
  font-variant-numeric:tabular-nums;line-height:1.9}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.gencode{background:#040907;border:1px solid var(--panelline);border-radius:8px;
  padding:11px 13px;font-family:var(--mono);font-size:12.5px;line-height:1.8;
  overflow-x:auto;white-space:pre;color:#DCE5DF;margin-top:12px}

/* LED sim */
.ledwrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:16px 0}
.led{text-align:center;font-family:var(--mono);font-size:11px;color:#8DA096}
.bulb{width:40px;height:40px;border-radius:50%;margin:0 auto 6px;
  background:#16231C;border:1px solid var(--panelline);transition:.2s}
.bulb.on{background:var(--ch1);border-color:var(--ch1);
  box-shadow:0 0 16px 3px rgba(232,179,42,.5)}
.bulb.on.g{background:var(--ok);border-color:var(--ok);box-shadow:0 0 16px 3px rgba(79,191,133,.45)}

/* joystick sim */
.meter{height:24px;border-radius:5px;background:var(--panel2);
  border:1px solid var(--panelline);position:relative;overflow:hidden;margin:8px 0}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ch2);opacity:.8}
.meter .dz{position:absolute;top:0;bottom:0;background:rgba(232,179,42,.16);
  border-left:1px solid rgba(232,179,42,.5);border-right:1px solid rgba(232,179,42,.5)}
.meter .ctr{position:absolute;top:0;bottom:0;width:2px;background:var(--copper)}
.dirpad{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);
  gap:4px;justify-content:center}
.dirpad span{border:1px solid var(--panelline);border-radius:5px;background:var(--panel2);
  display:grid;place-items:center;font-size:14px;color:#42544B}
.dirpad span.lit{background:var(--ch2);border-color:var(--ch2);color:#04201F;font-weight:700}

/* lcd canvas */
canvas{image-rendering:pixelated;border-radius:6px;border:1px solid var(--panelline);
  max-width:100%;display:block;background:#F7F7F5}

/* pin map */
.pingrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
.pin{font-family:var(--mono);font-size:12px;padding:8px 4px;border-radius:7px;
  border:1px solid var(--line);background:var(--raise);cursor:pointer;text-align:center;
  color:var(--ink);transition:.12s;font:inherit;font-family:var(--mono);font-size:12px}
.pin:hover{border-color:var(--ink)}
.pin[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pin b{display:block;font-weight:600;font-size:13px}
.pin em{display:block;font-style:normal;font-size:9.5px;color:var(--mute);margin-top:2px}
.pin[aria-pressed="true"] em{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.pin.lcd{background:color-mix(in srgb,var(--ch2) 14%,var(--paper))}
.pin.ours{background:color-mix(in srgb,var(--ch1) 20%,var(--paper))}
.pin.touch{background:color-mix(in srgb,var(--copper) 13%,var(--paper))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:12px 0 18px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;
  border:1px solid var(--line);margin-right:5px;vertical-align:-1px}

/* exercises */
.ex{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:1.3em 0;
  background:var(--raise)}
.ex[data-state="ok"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--raise))}
.ex[data-state="no"]{border-color:var(--copper);background:color-mix(in srgb,var(--copper) 7%,var(--raise))}
.exq{font-weight:500;margin:0 0 .7em}
.exn{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.1em;
  text-transform:uppercase;display:block;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:7px;margin:0 0 .9em}
.opt{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;cursor:pointer;
  padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  transition:.12s;line-height:1.7}
.opt:hover{border-color:var(--ink2)}
.opt input{margin:5px 0 0;flex:none;accent-color:var(--copper)}
.opt code{font-size:13px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--paper))}
.opt.wrong{border-color:var(--copper);background:color-mix(in srgb,var(--copper) 10%,var(--paper))}
.exin{font-family:var(--mono);font-size:13.5px;width:100%;padding:9px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
textarea.exin{min-height:84px;line-height:1.8;resize:vertical}
.fb{font-size:14px;line-height:1.75;margin-top:.8em;padding-top:.8em;
  border-top:1px solid var(--line)}
.fb.ok{color:var(--ok)}
.fb.no{color:var(--copper)}
.fb b{display:block;margin-bottom:.2em}

/* glossary */
.gl{border-top:1px solid var(--line);padding:14px 0}
.gl h4{font-size:16px;margin:0 0 .25em}
.gl h4 span{font-family:var(--mono);font-size:12px;color:var(--mute);
  font-weight:400;margin-left:8px}
.gl p{margin:0;color:var(--ink2);font-size:14.5px}

/* progress */
.pbar{height:9px;border-radius:5px;background:var(--paper2);overflow:hidden;margin:10px 0 4px}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable th,.ptable td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.ptable th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);font-weight:500}
.ptable td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:20px;
  border:1px solid var(--line);color:var(--mute)}
.chip.done{background:var(--ok);border-color:var(--ok);color:#fff}

.navfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:3em;padding-top:1.4em;border-top:1px solid var(--line)}
.navfoot .btn{background:var(--raise);color:var(--ink);border-color:var(--line)}
.navfoot .btn:hover{border-color:var(--ink)}
.navfoot .btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.hint{font-size:13px;color:var(--mute);margin-top:.5em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="bar">
  <div class="barin">
    <span class="brand">從暫存器到<b>掌機</b></span>
    <nav id="nav" aria-label="主導覽">
      <button data-view="map">學習地圖</button>
      <button data-view="code">程式導覽</button>
      <button data-view="pins">腳位圖</button>
      <button data-view="glossary">詞彙表</button>
      <button data-view="progress">我的進度</button>
    </nav>
    <button id="themeBtn" type="button">深色</button>
  </div>
</div>

<main>
  <div id="v-map"></div>
  <div id="v-station" hidden></div>
  <div id="v-pins" hidden></div>
  <div id="v-glossary" hidden></div>
  <div id="v-progress" hidden></div>
</main>
<script>
/* =====================================================================
   從暫存器到掌機 — 教學網站
   事實基準：fw_console/ 專案原始碼、PINMAP.md、README.md
   ===================================================================== */

const GLOSSARY = [
 ["暫存器","register","周邊硬體內部的一格記憶體。CPU 對它寫值，硬體就改變行為。STM32 的每個周邊都是一組暫存器，寫韌體就是在填這些格子。"],
 ["記憶體映射","memory-mapped I/O","把硬體暫存器排進 CPU 的位址空間，於是「控制硬體」和「寫記憶體」是同一個動作。GPIOE 的暫存器就住在 0x40021000 起。"],
 ["遮罩","mask","一個只有你在意的位元是 1 的常數，例如 <code>3UL &lt;&lt; (5*2)</code>。用它配合 <code>&amp;</code> 和 <code>|</code> 就能只動那幾個位元。"],
 ["讀改寫","read-modify-write","先讀出暫存器現值、只改想改的位元、再寫回去。<code>|=</code> 和 <code>&amp;= ~</code> 就是這件事的縮寫。"],
 ["周邊時脈","peripheral clock","周邊要有時脈才會動。RCC 裡的 enable 位元沒開，該周邊的暫存器寫進去等於沒寫。"],
 ["上拉","pull-up","晶片內部把腳位輕輕拉到高電位的電阻（約 40 kΩ）。有了它，按鈕只要把腳位短路到地就能被讀出來，不必外接電阻。"],
 ["active low","active low","按下時讀到 0、放開時讀到 1。本專案所有按鍵都是這樣接的，所以判斷式是 <code>if (!(IDR &amp; bit))</code>。"],
 ["去彈跳","debounce","機械接點在按下瞬間會連續通斷好幾毫秒。軟體上要求「連續幾次取樣一致」才承認狀態改變。"],
 ["邊緣偵測","edge detection","分辨「現在是按著」和「剛剛才按下去」。用這次狀態和上次狀態相減即可：<code>held &amp; ~prev</code>。"],
 ["取樣","sampling","ADC 把外界電壓轉成數字時，內部電容要先充電到那個電壓。來源阻抗越高，需要的取樣時間越長。"],
 ["ADC","analog-to-digital converter","把電壓變成整數的周邊。本專案用 12 位元，所以 0 V 對到 0、3.3 V 對到 4095。"],

n:1, title:"微控制器與暫存器", sub:"為什麼「寫一個位址」就能讓一支腳變成高電位。",
tags:[["reg","記憶體映射"],["file","App/app_main.c"]],
html:`
<p class="lede">這台掌機裡沒有作業系統。開機之後，CPU 從 <code>main()</code> 第一行開始跑，一路跑到你關電源為止。中間所有事情——螢幕亮起來、按鍵被讀到、蜂鳴器發聲——都是你寫的程式對某些特定位址寫值造成的。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>在電腦上寫程式，你呼叫函式庫，函式庫再去呼叫作業系統。在這裡沒有這一層。你要自己告訴硬體該做什麼，而告訴的方式只有一種：<strong>對某個記憶體位址寫一個數字</strong>。理解這件事，後面十一站都只是「哪個位址、寫什麼數字」的細節。</p></div>

<h3>暫存器就是硬體裡的一格記憶體</h3>
<p>每個周邊（GPIO、ADC、計時器）內部都有幾個 32 位元的格子，叫做<span class="term" data-t="暫存器">暫存器</span>。這些格子不是普通記憶體——它們的每一個位元都接到實際的電路上。把某個位元寫成 1，對應的電路就切換狀態。</p>

<p>關鍵設計在於：這些格子被排進 CPU 的位址空間，和一般變數共用同一套位址。這叫<span class="term" data-t="記憶體映射">記憶體映射</span>。所以「控制硬體」和「寫記憶體」在程式碼上長得一模一樣。</p>

<pre><span class="c">/* STM32F407 的位址分配，數字來自參考手冊 RM0090 的 Memory map */</span>
0x0800 0000   <span class="c">Flash，你的程式碼住在這裡</span>
0x2000 0000   <span class="c">SRAM，變數住在這裡</span>
0x4002 0000   <span class="c">GPIOA 的暫存器</span>
0x4002 0400   <span class="c">GPIOB   （每個埠間隔 0x400）</span>
0x4002 0800   <span class="c">GPIOC</span>
0x4002 1000   <span class="c">GPIOE   ← 本專案的四顆按鍵在這個埠</span>
0x4001 2000   <span class="c">ADC1    ← 搖桿</span>
0x4000 0400   <span class="c">TIM3    ← 蜂鳴器</span>
0x6C00 007E   <span class="c">LCD     ← 對，螢幕也有位址</span></pre>

<h3>CMSIS 幫你把位址包成結構</h3>
<p>你不會真的手寫 <code>*(volatile uint32_t*)0x40021014 = 4;</code>。廠商提供的 CMSIS 標頭檔已經把每個周邊宣告成一個結構指標，所以你寫的是這樣：</p>

<pre><span class="r">GPIOE</span>-&gt;ODR = 4;   <span class="c">/* 等於對 0x40021014 寫 4 */</span></pre>

<p><code>GPIOE</code> 是一個指到 0x40021000 的指標，<code>ODR</code> 是結構裡偏移 0x14 的欄位。兩者合起來就是那個位址。這只是打字上的方便，底層完全一樣。</p>

<h3>本專案的第一行</h3>
<p>開機順序寫在 <code>App/app_main.c</code> 的 <code>main()</code>。注意它有嚴格的先後關係，註解裡也寫明了原因：</p>

<pre>int main(void)
{
    AppScreen screen;

<span class="hl">    stm32f4_Hardware_Init();   <span class="c">/* 設 PLL、SysTick、算出各匯流排時脈 */</span></span>
    LCD_Init();                <span class="c">/* FSMC + ILI9341 */</span>
    LCD_DisplayOn();
    Default_Calibration();     <span class="c">/* 觸控座標係數，必須在 LCD_Init 之後 */</span>
    Driver_GPIO();             <span class="c">/* 觸控的 SPI 腳位 + 板載 KEY1 */</span>

    Input_Init();              <span class="c">/* 我們的按鍵、搖桿 ADC，並量搖桿中心 */</span>
    Sound_Init();              <span class="c">/* 需要第一步算出來的 PCLK1_Freq */</span>

    splash();

    for (;;) { ... }           <span class="c">/* 永遠不回傳 */</span>
}</pre>
<span class="fileref">App/app_main.c:94–123</span>

<p>最後那個 <code>for(;;)</code> 是重點：韌體沒有「結束」。<code>main()</code> 不回傳，因為沒有人在等它回傳。</p>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/app_main.c:94</code> — <code>main()</code>，整台機器的入口</li>
<li><code>App/console.h:19</code> — <code>SCR_W</code> / <code>SCR_H</code> 定成 320 × 240，整份程式的座標基準</li>
</ul></div>

n:2, title:"位元運算基本功", sub:"為什麼要用 |= 和 &amp;= ~，而不是直接用 =。",
tags:[["reg","遮罩／讀改寫"],["file","App/input.c:93"]],
html:`
<p class="lede">一個 32 位元暫存器裡通常擠著十六支腳的設定。你要改第 5 支腳，就不能動到其他十五支。這一站只教三個動作，但這三個動作會出現在後面每一行程式裡。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>初學者最常犯的錯是寫 <code>GPIOE-&gt;MODER = 0x400;</code>。這行「看起來」把第 5 支腳設成輸出——而它確實做到了，同時把另外十五支腳全部設回 00。如果那十五支腳裡有一支正在驅動 LCD，畫面就黑了，而你會完全找不到原因。</p></div>

<h3>三個動作</h3>
<h4>1. 做出<span class="term" data-t="遮罩">遮罩</span></h4>
<p><code>1UL &lt;&lt; n</code> 是一個只有第 n 位是 1 的數字。要一次蓋住相鄰兩位就用 <code>3UL &lt;&lt; n</code>，因為 3 的二進位是 <code>11</code>。</p>
<pre>1UL &lt;&lt; 5        <span class="c">→ 0x0000 0020   只有 bit 5</span>
3UL &lt;&lt; 10       <span class="c">→ 0x0000 0C00   bit 11 和 bit 10</span>
0xFUL &lt;&lt; 24     <span class="c">→ 0x0F00 0000   bit 27..24</span></pre>

<h4>2. 把某些位設成 1：<code>|=</code></h4>
<pre><span class="r">RCC</span>-&gt;AHB1ENR |= (1UL &lt;&lt; 2);   <span class="c">/* 只開 GPIOC，其他位元原樣保留 */</span></pre>

<h4>3. 把某些位清成 0：<code>&amp;= ~</code></h4>
<pre>port-&gt;MODER &amp;= ~(3UL &lt;&lt; (pin * 2));   <span class="c">/* 只清這兩位 */</span></pre>
<p><code>~</code> 把遮罩反過來：本來 <code>...0000 1100 0000 0000</code>，反過來成 <code>...1111 0011 1111 1111</code>。跟它做 <code>&amp;</code>，就是「其他位跟自己 AND 所以不變，這兩位跟 0 AND 所以歸零」。</p>

<h3>要寫入一個非零的值，就得先清再設</h3>
<p>如果目標值不是「全 1」或「全 0」，<code>|=</code> 自己辦不到——它只能把 0 變 1，不能把 1 變 0。所以兩位元的欄位一律兩步走，這就是<span class="term" data-t="讀改寫">讀改寫</span>：</p>

<pre><span class="c">/* 本專案真正的寫法，App/input.c:93 */</span>
static void gpio_input_pullup(GPIO_TypeDef *port, uint8_t pin)
{
<span class="hl">    port-&gt;MODER &amp;= ~(3UL &lt;&lt; (pin * 2));                  <span class="c">/* 00 = 輸入   */</span></span>
<span class="hl">    port-&gt;PUPDR  = (port-&gt;PUPDR &amp; ~(3UL &lt;&lt; (pin * 2)))</span>
<span class="hl">                 | (1UL &lt;&lt; (pin * 2));                   <span class="c">/* 01 = 上拉   */</span></span>
}</pre>
<span class="fileref">App/input.c:91–96</span>

<p>第二個敘述把「清」和「設」寫在同一行，是同一件事的緊湊寫法：括號裡先清掉那兩位，再用 <code>|</code> 填進 01。</p>

<h3>為什麼是 <code>pin * 2</code></h3>
<p>MODER 用兩個位元描述一支腳，所以第 n 支腳的欄位在 bit <code>2n+1</code> 和 <code>2n</code>。忘記乘 2 是第二常見的錯誤，症狀是「改 pin 5 卻影響到 pin 2」。相對地 ODR 和 IDR 一支腳只用一位，那裡就<strong>不</strong>乘 2。</p>

<div data-inst="bitlab"></div>

<div data-inst="hunt"></div>

<div class="pit"><h4>三個真的會發生的錯</h4>
<ul>
<li><code>MODER = ...</code> 直接覆蓋 → 其他十五支腳被清成輸入，LCD 或按鍵莫名失效。</li>
<li><code>MODER |= (1UL &lt;&lt; (pin*2))</code> 卻沒有先清 → 如果那欄原本是 <code>10</code>，變成 <code>11</code>（類比模式），不是你要的 <code>01</code>。</li>
<li><code>3UL &lt;&lt; pin</code> 忘記乘 2 → 改到隔壁腳的設定。</li>
</ul></div>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/input.c:91–102</code> — <code>gpio_input_pullup()</code> 和 <code>gpio_analog()</code>，全專案設定腳位都走這兩個函式</li>
<li><code>App/input.c:238–240</code> — 去彈跳那三行是純位元運算，第 5 站會回來看</li>
</ul></div>

  fb:"pin 3 的欄位在 bit 7:6，所以位移量是 <code>3*2 = 6</code>。要寫入 <code>01</code> 必須先用 <code>&amp;= ~(3UL&lt;&lt;6)</code> 把兩位清掉，再 <code>|= (1UL&lt;&lt;6)</code> 填進去。選項 1 會清掉其他腳；選項 2 沒先清，原本是 10 就會變成 11；選項 4 忘了乘 2。"},
 {id:"s2b", type:"fill", q:"寫一行程式，只把 <code>GPIOC-&gt;PUPDR</code> 的 bit 9 和 bit 8 清成 0，其他位元不動。",
  ph:"GPIOC->PUPDR ...",
  need:[[/PUPDR/,"要動的是 PUPDR"],[/&=/,"清位元要用 &="],[/~/,"需要把遮罩反過來，少了 ~"],[/3\s*(UL|ul|u)?\s*<<\s*8|0x300|768/,"bit 9:8 兩個位元的遮罩是 3 &lt;&lt; 8"]],
  ans:"GPIOC-&gt;PUPDR &amp;= ~(3UL &lt;&lt; 8);",
  fb:"兩個相鄰位元的遮罩是 <code>3UL &lt;&lt; 8</code>。清除就是 <code>&amp;= ~遮罩</code>。這正好是 pin 4 的 PUPDR 欄位，也就是本專案搖桿 1 按鍵那支腳。"},
 {id:"s2c", type:"mc", q:"以下哪一個敘述會把 <code>MODER</code> 某欄從 <code>10</code> 變成 <code>11</code>，而作者其實只想要 <code>01</code>？",
  opts:["先 <code>&amp;= ~</code> 再 <code>|=</code>","只用 <code>|=</code>","只用 <code>&amp;= ~</code>","直接用 <code>=</code>"], ans:1,
  fb:"<code>|=</code> 只能把 0 變 1。欄位原本是 <code>10</code>，OR 進 <code>01</code> 之後變成 <code>11</code>，在 MODER 裡代表類比模式，腳位就啞了。這是為什麼兩位元欄位一定要先清再設。"}
]},

{
n:3, title:"時脈與 RCC", sub:"忘記開周邊時脈，後面每一行都白寫。",
tags:[["reg","RCC AHB1ENR / APB1ENR / APB2ENR"],["file","App/input.c:107"]],
html:`
<p class="lede">這一站只有一個觀念，但它值得單獨一站，因為它是這類程式最常見的坑，而且失敗的樣子最沒有線索：程式編得過、跑得動、什麼事都沒發生。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>STM32 為了省電，出廠時大部分周邊的時脈是關掉的。沒有時脈，那個周邊內部的邏輯完全不動，它的暫存器你寫進去讀回來會是 0。你會盯著一行沒有錯的程式看半小時。</p></div>

<h3>RCC 是總電源開關</h3>
<p>RCC（Reset and Clock Control）管住每個周邊的<span class="term" data-t="周邊時脈">周邊時脈</span>。周邊掛在哪條匯流排上，開關就在對應的暫存器裡：</p>

<pre><span class="r">RCC</span>-&gt;AHB1ENR   <span class="c">GPIOA..GPIOK      bit 0 = GPIOA, bit 1 = GPIOB, ...</span>
<span class="r">RCC</span>-&gt;APB1ENR   <span class="c">TIM2..TIM7、USART2/3、I2C ...   bit 1 = TIM3</span>
<span class="r">RCC</span>-&gt;APB2ENR   <span class="c">ADC1..3、USART1、SPI1 ...        bit 8 = ADC1</span></pre>

<p>本專案三處都用到了。<code>Input_Init()</code> 一次開三個埠：</p>

<pre><span class="c">/* GPIOB(1), GPIOC(2), GPIOE(4) —— 按鍵在 E，搖桿在 C，KEY1 在 B */</span>
<span class="hl">RCC-&gt;AHB1ENR |= (1UL &lt;&lt; 1) | (1UL &lt;&lt; 2) | (1UL &lt;&lt; 4);</span></pre>
<span class="fileref">App/input.c:107</span>

<pre><span class="c">/* ADC1 掛在 APB2 */</span>
<span class="hl">RCC-&gt;APB2ENR |= (1UL &lt;&lt; 8);            <span class="c">/* ADC1EN */</span></span></pre>
<span class="fileref">App/input.c:135</span>

<pre><span class="c">/* 蜂鳴器：GPIOA 給腳位，TIM3 給波形，兩個都要開 */</span>
<span class="hl">RCC-&gt;AHB1ENR |= (1UL &lt;&lt; 0);            <span class="c">/* GPIOA */</span></span>
...
<span class="hl">RCC-&gt;APB1ENR |= (1UL &lt;&lt; 1);            <span class="c">/* TIM3EN */</span></span></pre>
<span class="fileref">App/sound.c:37 與 App/sound.c:49</span>

<h3>為什麼用 <code>|=</code> 而不是 <code>=</code></h3>
<p>AHB1ENR 裡已經有別人開好的位元——LCD 在 <code>LCD_Init()</code> 裡開了 GPIOD、E、F、G。如果 <code>Input_Init()</code> 寫成 <code>RCC-&gt;AHB1ENR = ...</code>，就會把 LCD 的時脈關掉，螢幕當場變黑。第 2 站講的規矩在這裡有具體後果。</p>

<h3>時脈樹也決定了別的事</h3>
<p><code>stm32f4_Hardware_Init()</code> 設好 PLL 之後，把算出來的頻率存進四個全域變數。第 8 站的發聲要用到其中一個：</p>

<pre>SYS_Freq   = 168000000   <span class="c">系統時脈</span>
HCLK_Freq  = 168000000   <span class="c">CPU 與 AHB</span>
PCLK1_Freq =  42000000   <span class="c">APB1（TIM3 掛在這裡）</span>
PCLK2_Freq =  84000000   <span class="c">APB2（ADC1 掛在這裡）</span></pre>
<span class="fileref">User_common/HardwareSystem_Ini.c:878–883</span>

<div class="pit"><h4>怎麼辨認你踩到這個坑</h4>
<p>症狀是「寫了設定但完全沒反應」，而且讀回暫存器是 0。debug 時把那個暫存器的值印出來或用 Keil 的 watch 看：如果你剛寫 <code>0x55</code> 進去卻讀回 <code>0x00</code>，幾乎一定是時脈沒開。</p></div>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/input.c:107</code>、<code>:135</code>、<code>:302</code> — 三處 RCC 開關</li>
<li><code>App/sound.c:37</code>、<code>:49</code> — 腳位埠和計時器要分別開</li>
</ul></div>
`,
ex:[
 {id:"s3a", type:"mc", q:"你把 PA6 設成 AF2、把 TIM3 的 PSC 和 ARR 都算好寫進去，但蜂鳴器完全不響，而且用除錯器看 <code>TIM3-&gt;ARR</code> 讀回來是 0。最可能的原因是？",
  opts:["ARR 的值超過 16 位元","忘記 <code>RCC-&gt;APB1ENR |= (1UL &lt;&lt; 1)</code>","AF 應該設 3 不是 2","CCR1 沒設成 ARR 的一半"], ans:1,
  fb:"寫進去讀回 0 是「這個周邊沒有時脈」的典型指紋。TIM3 掛在 APB1，開關是 <code>RCC-&gt;APB1ENR</code> 的 bit 1。其他三個選項都會讓聲音不對，但暫存器仍然讀得回你寫的值。"},
 {id:"s3b", type:"mc", q:"<code>Input_Init()</code> 若寫成 <code>RCC-&gt;AHB1ENR = (1UL&lt;&lt;1)|(1UL&lt;&lt;2)|(1UL&lt;&lt;4);</code>，會發生什麼？",
  opts:["完全一樣，因為要開的就是這三個","按鍵不會動，但螢幕正常","螢幕變黑，因為 LCD 用的 GPIOD／E／F／G 時脈被關掉","編譯器會報錯"], ans:2,
  fb:"<code>=</code> 把整個暫存器換掉，所以 <code>LCD_Init()</code> 先前開的 GPIOD、GPIOF、GPIOG 全部歸零。注意 GPIOE 剛好也被重新開起來，所以按鍵還會動——壞掉的只有螢幕，這種半死狀態最難查。"}
]},

{
n:4, title:"GPIO 輸出", sub:"從點亮一顆燈開始：MODER、OTYPER、OSPEEDR、ODR、BSRR。",
tags:[["reg","MODER / OTYPER / ODR / BSRR"],["lab","LED 模擬"],["file","App/sound.c:96"]],
html:`
<p class="lede">一支腳要能輸出，要先宣告它是輸出，再決定輸出什麼。前者是 MODER，後者是 ODR 或 BSRR。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>輸出是最直接的驗證手段。當你不確定程式有沒有跑到某一行，最快的辦法就是在那裡翻轉一支腳、接一顆 LED 或示波器。本專案診斷蜂鳴器時就是這樣做的：<code>Sound_DC()</code> 把 PA6 當成普通輸出直接拉高，繞開計時器，用來確認「這支腳到底能不能驅動任何東西」。</p></div>

<h3>四個設定暫存器</h3>
<pre>MODER    <span class="c">2 位元/腳   00 輸入   01 輸出   10 替代功能   11 類比</span>
OTYPER   <span class="c">1 位元/腳   0 推挽（推得動高也拉得動低）  1 開汲（只拉低）</span>
OSPEEDR  <span class="c">2 位元/腳   邊緣轉換速度，越快雜訊越大</span>
PUPDR    <span class="c">2 位元/腳   00 無   01 上拉   10 下拉</span></pre>

<p>一般輸出用「輸出 + 推挽 + 無上下拉」，速度挑夠用就好。<code>Sound_Init()</code> 設 PA6 的那一段把四個都寫了一次，因為它要的是替代功能：</p>

<pre>GPIOA-&gt;MODER   = (GPIOA-&gt;MODER   &amp; ~(3UL &lt;&lt; (PIN_SPK * 2)))
               | (2UL &lt;&lt; (PIN_SPK * 2));            <span class="c">/* 10 = AF   */</span>
GPIOA-&gt;OTYPER &amp;= ~(1UL &lt;&lt; PIN_SPK);                 <span class="c">/* 推挽      */</span>
GPIOA-&gt;OSPEEDR = (GPIOA-&gt;OSPEEDR &amp; ~(3UL &lt;&lt; (PIN_SPK * 2)))
               | (1UL &lt;&lt; (PIN_SPK * 2));            <span class="c">/* 中速      */</span>
GPIOA-&gt;PUPDR  &amp;= ~(3UL &lt;&lt; (PIN_SPK * 2));           <span class="c">/* 無上下拉  */</span></pre>
<span class="fileref">App/sound.c:39–44，PIN_SPK 是 6</span>

<h3>輸出電位：ODR 還是 BSRR</h3>
<p><code>ODR</code> 是「輸出資料暫存器」，一支腳一位元。你可以 <code>ODR |= bit</code> 設高、<code>ODR &amp;= ~bit</code> 設低。這需要讀改寫，兩個動作之間如果被中斷插進來改了同一個暫存器，就會出錯。</p>

<p><code>BSRR</code> 是為了解決這件事存在的。它是 32 位元，<strong>低 16 位寫 1 就把那支腳設高，高 16 位寫 1 就設低</strong>。它是唯寫的，所以不需要先讀，一個敘述就結束，不可能被插斷。</p>

<pre><span class="c">/* 這兩行效果相同，但 BSRR 是原子操作 */</span>
GPIOA-&gt;ODR  |= (1UL &lt;&lt; 6);          <span class="c">/* 讀改寫，三個動作   */</span>
GPIOA-&gt;BSRR  = (1UL &lt;&lt; 6);          <span class="c">/* 一次寫入，設高     */</span>
GPIOA-&gt;BSRR  = (1UL &lt;&lt; (6 + 16));   <span class="c">/* 一次寫入，設低     */</span></pre>

<p>本專案一律用 BSRR。<code>Sound_DC()</code> 把腳位切回普通輸出再驅動：</p>

<pre>void Sound_DC(uint8_t on)
{
    TIM3-&gt;CCER &amp;= ~(1UL &lt;&lt; 0);          <span class="c">/* 先把腳從計時器手上拿回來 */</span>
    TIM3-&gt;CR1  &amp;= ~(1UL &lt;&lt; 0);

    GPIOA-&gt;MODER = (GPIOA-&gt;MODER &amp; ~(3UL &lt;&lt; (PIN_SPK * 2)))
                 | (1UL &lt;&lt; (PIN_SPK * 2));            <span class="c">/* 01 = 輸出 */</span>
<span class="hl">    GPIOA-&gt;BSRR  = on ? (1UL &lt;&lt; PIN_SPK) : (1UL &lt;&lt; (PIN_SPK + 16));</span>
}</pre>
<span class="fileref">App/sound.c:96–105</span>

<div data-inst="ledsim"></div>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/sound.c:39–46</code> — 設成替代功能的完整四步</li>
<li><code>App/sound.c:96–105</code> — <code>Sound_DC()</code>，把同一支腳切回普通輸出</li>
<li><code>App/iotest.c</code> 的 <code>pin_warble()</code> — 用 BSRR 直接把腳位來回翻轉，找出蜂鳴器接在哪支腳</li>
</ul></div>
`,
ex:[
 {id:"s4a", type:"mc", q:"為什麼本專案用 <code>BSRR</code> 而不是 <code>ODR |=</code>？",
  opts:["BSRR 比較省電","BSRR 是單次寫入，不需要讀改寫，中斷插進來也不會出錯","ODR 是唯讀的","BSRR 可以同時設定 MODER"], ans:1,
  fb:"<code>ODR |= bit</code> 是讀、改、寫三個動作。如果中斷在中間發生並且也改了 ODR，回來之後你寫回去的是舊值。BSRR 唯寫、單次、原子，所以不會有這個問題。"},
 {id:"s4b", type:"fill", q:"用 BSRR 把 <code>GPIOF</code> 的 pin 10 拉<strong>低</strong>。",
  ph:"GPIOF->BSRR = ...",
  need:[[/BSRR/,"要用 BSRR"],[/26|10\s*\+\s*16|0x04000000|67108864/,"拉低要寫高 16 位，也就是 1UL &lt;&lt; (10+16)"]],
  ans:"GPIOF-&gt;BSRR = (1UL &lt;&lt; (10 + 16));",
  fb:"BSRR 的低 16 位是 set、高 16 位是 reset。所以拉低 pin 10 要寫 bit 26。寫成 <code>(1UL &lt;&lt; 26)</code> 也對，但 <code>(10 + 16)</code> 讀起來清楚得多。"}
]},
{
n:5, title:"GPIO 輸入與按鍵", sub:"PUPDR、IDR、active low、去彈跳、邊緣偵測。",
tags:[["reg","PUPDR / IDR"],["file","App/input.c:206"]],
html:`
<p class="lede">按鍵看起來是最簡單的周邊，實際上是本專案邏輯最精緻的一段。原因不在讀腳位，而在「一次按下要只算一次」。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>把按鍵接到腳位，你會遇到三個問題：腳位沒接東西時電位是浮動的、機械接點在按下瞬間會連續通斷、以及「按著」和「剛按下」在遊戲裡意義完全不同。這一站三個問題各有一個解法。</p></div>

<h3>問題一：浮動 → 上拉</h3>
<p>一支設成輸入的腳如果什麼都沒接，它的電位由周圍的雜訊決定，讀回來是隨機的。解法是打開晶片內部的<span class="term" data-t="上拉">上拉</span>電阻，把腳位輕輕拉到 3.3 V。按鈕的另一端接地，按下時就把它硬拉到 0 V。</p>

<p>所以按下讀到 0、放開讀到 1，這叫 <span class="term" data-t="active low">active low</span>。判斷式要取反，本專案就是這樣寫的：</p>

<pre>if (!(e &amp; (1UL &lt;&lt; PIN_BTN_UP)))    raw |= BTN_UP;</pre>
<span class="fileref">App/input.c:213，e 是先讀進來的 GPIOE-&gt;IDR</span>

<p>好處是按鍵完全不需要外接電阻。<code>Input_Init()</code> 只做兩件事就完成一支按鍵的設定：MODER 設 00、PUPDR 設 01。</p>

<h3>問題二：接點彈跳 → 連續兩次取樣一致</h3>
<p>輕觸開關按下的瞬間，金屬片會在幾毫秒內彈好幾下，腳位電位跟著抖動。如果每次抖動都算一次按下，一次按鍵會變成三四次。</p>

<p>本專案的解法只有三行，而且沒有用計時器：</p>

<pre>agree     = (uint16_t)~(raw ^ s_lastRaw);
s_held    = (uint16_t)((s_held &amp; ~agree) | (raw &amp; agree));
s_lastRaw = raw;</pre>
<span class="fileref">App/input.c:238–240</span>

<p>拆開來看：<code>raw ^ s_lastRaw</code> 是「這次和上次不一樣的位元」，取反之後 <code>agree</code> 就是「這兩次一致的位元」。第二行的意思是：<strong>只有連續兩次取樣一致的位元才准改變 <code>s_held</code></strong>，其他位元沿用舊值。</p>

<p>迴圈是 10 毫秒一次，所以這等於一個 20 毫秒的濾波器，比輕觸開關的彈跳時間長。用三行位元運算換掉一整組計時器，這是第 2 站那些技巧的實際價值。</p>

<h3>問題三：按著 vs 剛按下 → 邊緣偵測</h3>
<p>跳躍要在按下的那一瞬間觸發一次；蹲下要按著才成立。所以模組同時提供兩種查詢：</p>

<pre>s_edge |= (uint16_t)(s_held &amp; ~s_prev);   <span class="c">/* 這次有、上次沒有 = 剛按下 */</span>
s_prev  = s_held;</pre>
<span class="fileref">App/input.c:242–243</span>

<pre><span class="c">/* 遊戲裡的用法，App/game_dino.c */</span>
if (pressed &amp; ANY_UP)  { ... 起跳 ... }      <span class="c">/* 邊緣：只在按下那一幀 */</span>
s_ducking = (held &amp; ANY_DOWN) ? 1 : 0;      <span class="c">/* 電位：按著就蹲 */</span></pre>

<p><code>Input_Pressed()</code> 讀取後會把 <code>s_edge</code> 清掉，所以每個「剛按下」只會被消費一次，不會漏也不會重複。</p>

<h3>那個看起來多餘的兩次 poll</h3>
<p>開機畫面裡有這三行，看起來像贅碼：</p>

<pre>Input_Poll();
Input_Poll();
Input_Flush();</pre>
<span class="fileref">App/app_main.c:59–61</span>

<p>原因是：開機畫面允許「按任意鍵跳過」。但 <code>s_prev</code> 初始是 0，如果有一顆按鍵因為接線錯誤一直被拉低，第一次 poll 就會產生一個假的「剛按下」邊緣，開機畫面瞬間被跳過，而你完全不知道為什麼。</p>

<p>連 poll 兩次讓去彈跳濾波器有兩筆資料可以比對並把 <code>s_held</code> 填成真實狀態，再 <code>Input_Flush()</code> 把累積的邊緣丟掉。之後任何邊緣都是使用者真的按的。</p>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/input.c:206–244</code> — <code>Input_Poll()</code>，去彈跳與邊緣偵測</li>
<li><code>App/input.c:288–313</code> — <code>Input_DiagInit()</code> 與 <code>Input_ScanLow()</code>，接線診斷用的掃腳功能，只動 PUPDR 不動 MODER</li>
<li><code>App/iotest.c</code> — I/O TEST 畫面，按鍵按下時方格變綠</li>
</ul></div>
`,
ex:[
 {id:"s5a", type:"mc", q:"按鍵接地並開內部上拉。現在要判斷「PE3 被按著」，哪個寫法對？",
  opts:["<code>if (GPIOE-&gt;IDR &amp; (1UL &lt;&lt; 3))</code>",
        "<code>if (!(GPIOE-&gt;IDR &amp; (1UL &lt;&lt; 3)))</code>",
        "<code>if (GPIOE-&gt;ODR &amp; (1UL &lt;&lt; 3))</code>",
        "<code>if (GPIOE-&gt;IDR &amp; (3UL &lt;&lt; 6))</code>"], ans:1,

{
n:6, title:"時間", sub:"SysTick、delay，以及為什麼遊戲迴圈不能用 delay 撐場。",
tags:[["reg","SysTick"],["file","App/game_dino.c:63"]],
html:`
<p class="lede">遊戲要讓東西以固定速度移動，就需要知道時間過了多久。方法有兩種，其中一種會毀掉你的遊戲。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>用 <code>delay_ms(20)</code> 撐出一幀，CPU 在那 20 毫秒裡什麼都不做——不讀按鍵、不推進音樂、不檢查碰撞。玩家在這段時間按的鍵會直接消失。遊戲會「有時候按沒反應」，而這種 bug 幾乎不可能靠看程式找出來。</p></div>

<h3>SysTick 提供一個毫秒計數器</h3>
<p><span class="term" data-t="SysTick">SysTick</span> 是 Cortex-M 內建的倒數計時器。設成每毫秒中斷一次，中斷處理函式只做一件事：</p>

<pre>volatile uint32_t msTick;

void SysTick_Handler(void)
{
    msTick++;
    ...
}</pre>
<span class="fileref">User_common/user_defined.c:19–23</span>

<p><code>volatile</code> 不能省。它告訴編譯器「這個變數會被你看不到的程式改動」，否則編譯器會把 <code>while (msTick - t0 &lt; 20)</code> 最佳化成永遠成立的無窮迴圈。</p>

<h3>阻塞式的 delay</h3>
<pre>void delay_ms(uint32_t wait_ms)
{
    uint32_t Time_last = msTick;
    while ((msTick - Time_last) &lt; wait_ms);   <span class="c">/* 什麼都不做，純等 */</span>
}</pre>
<span class="fileref">User_common/user_defined.c:26–30</span>

<p>這在開機、在切換畫面、在「GOOD!」提示停留 700 毫秒的時候完全沒問題，因為那時本來就不需要反應。它不能出現在遊戲迴圈裡。</p>

<h3>非阻塞的固定幀率</h3>
<p><span class="term" data-t="非阻塞">非阻塞</span>的寫法是：記下這一幀開始的時間，把該做的事全部做完，最後才等到這一幀的時間額度用完。Dino 的主迴圈長這樣：</p>

<pre>for (;;) {
    uint32_t t0 = msTick;          <span class="c">/* 記住起點       */</span>

    Input_Poll();                  <span class="c">/* 讀按鍵與搖桿   */</span>
    Sound_Update();                <span class="c">/* 推進音樂       */</span>
    dino_step(held, pressed);      <span class="c">/* 物理           */</span>
    ... 畫面 ...
    ... 碰撞 ...

<span class="hl">    while (msTick - t0 &lt; TICK_MS) { }   <span class="c">/* 把剩下的時間補滿 */</span></span>
}</pre>
<span class="fileref">App/game_dino.c，TICK_MS 定義在 :63，值是 20</span>

<p>差別在於：工作發生在等待<strong>之前</strong>。如果某一幀畫得比較久，等待自然變短，幀率仍然穩定。這也讓「每幀移動幾個像素」有意義——第 12 站的速度常數全部建立在這個固定間隔上。</p>

<h3>減法可以跨越溢位</h3>
<p><code>msTick</code> 是 32 位元，大約 49 天後會繞回 0。<code>msTick - t0</code> 用無號數運算，即使中間繞回一次，差值仍然正確。所以寫法一律是 <code>msTick - t0 &lt; 間隔</code>，不要寫 <code>msTick &lt; t0 + 間隔</code>。</p>

<p>要比較「時刻到了沒有」時本專案用另一種寫法，理由相同：</p>

<pre>if ((int32_t)(msTick - s_noteEnd) &gt;= 0) { ... }   <span class="c">/* 音符時間到了 */</span></pre>
<span class="fileref">App/sound.c:136</span>

<div class="pit"><h4>常見錯誤</h4>
<p>在遊戲迴圈裡呼叫 <code>delay_ms()</code>。本專案有一個折衷方案：<code>App_Wait()</code>。它會阻塞，但在等待期間持續呼叫 <code>Sound_Update()</code>，這樣「GOOD!」提示停留的 700 毫秒裡音樂還會繼續播。若直接用 <code>delay_ms()</code>，第一個音符會卡住整整 700 毫秒。</p>
<pre>void App_Wait(uint32_t ms)
{
    uint32_t until = msTick + ms;
    while ((int32_t)(msTick - until) &lt; 0) Sound_Update();
}</pre>
<span class="fileref">App/ui.c:6–10</span></div>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/game_dino.c:63</code> — <code>TICK_MS</code> 20 毫秒；<code>App/game_gate.c:114</code> — 25 毫秒</li>
<li><code>App/ui.c:6</code> — <code>App_Wait()</code>，會讓音效引擎繼續走的等待</li>
<li><code>App/sound.c:129–145</code> — <code>Sound_Update()</code>，靠 <code>msTick</code> 推進音符</li>
</ul></div>
`,

  opts:["讓它存進 SRAM 而不是暫存器，這樣中斷才改得到，迴圈才讀得到新值",

 {id:"s6b", type:"code", q:"寫一個非阻塞的判斷：若距離 <code>last</code> 已經過了 <code>PERIOD</code> 毫秒就執行 <code>tick()</code> 並更新 <code>last</code>。不要用 delay。",
  ph:"if ( ... ) {\n    tick();\n    last = ...;\n}",
  need:[[/msTick/,"要拿 msTick 來比較"],[/msTick\s*-\s*last|msTick-last/,"用減法 msTick - last，這樣才能跨越 32 位元溢位"],[/PERIOD/,"要和 PERIOD 比較"],[/tick\s*\(\s*\)/,"條件成立要呼叫 tick()"],[/last\s*=/,"別忘了更新 last"]],
  ans:"if (msTick - last &gt;= PERIOD) {\n    tick();\n    last = msTick;\n}",

  opts:["恐龍完全不動","畫面閃爍變嚴重","幀率變成不固定，畫面越複雜時遊戲越慢","按鍵反應變快"], ans:2,
  fb:"原本的寫法是「補滿剩下的時間」，所以一幀總長固定。換成 <code>delay_ms(20)</code> 變成「工作時間 + 20 毫秒」，障礙物越多那一幀就越長，速度跟著飄。真實的遊戲迴圈要先做事、最後才補時間。"}

{
n:7, title:"ADC 與搖桿", sub:"12 位元讀數、開機量中心、遲滯為什麼要兩個門檻。",
tags:[["reg","ADC SMPR1 / SQR3 / CR2 / DR"],["lab","搖桿模擬"],["file","App/input.c:39"]],
html:`
<p class="lede">搖桿其實是兩個可變電阻。ADC 把它們的電壓變成數字。這一站的難點不在讀值，而在「怎麼從一個會抖的數字做出一個不會抖的方向」。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>這是整台機器唯一真正的類比輸入，也是「為什麼不乾脆多接四顆按鍵」的答案：Gate Keeper 的收集器要能平滑地斜著移動，四顆按鍵做不到。代價是你必須處理雜訊、中心偏移和門檻抖動。</p></div>

<h3>搖桿是分壓電路</h3>
<p>模組裡是兩個 10 kΩ 電位器。兩端接電源和地，中間的滑動接點輸出電壓。搖桿推到底輸出接近電源電壓，回中間輸出約一半。</p>

<p>所以模組必須吃 3.3 V 而不是 5 V——滑動接點的輸出會跟著電源走，5 V 會超過 ADC 腳位的絕對上限。這也讓讀數變成<em>比例式</em>的：電源稍微下降時，中心值不會跑掉。</p>

<h3>三個要設的暫存器</h3>
<pre>SMPR1   <span class="c">取樣時間。3 位元一個通道，通道 10 在 bit 2:0，通道 11 在 5:3 ...</span>
SQR3    <span class="c">要轉換哪個通道（序列的第 1 個）</span>
CR2     <span class="c">bit 0 = ADON 開機，bit 30 = SWSTART 開始轉換</span>
DR      <span class="c">讀結果，12 位元所以取低 12 位</span></pre>

<p><span class="term" data-t="取樣">取樣</span>時間要長，因為 10 kΩ 是高阻抗來源，ADC 內部的取樣電容需要時間充到那個電壓。本專案選 112 個週期：</p>

<pre>ADC-&gt;CCR = (ADC-&gt;CCR &amp; ~(3UL &lt;&lt; 16))
         | (1UL &lt;&lt; 16);                <span class="c">/* ADCPRE = 01 → PCLK2 / 4 = 21 MHz */</span>

<span class="c">/* 四個通道都設成 101b = 112 週期 */</span>
ADC1-&gt;SMPR1 = (ADC1-&gt;SMPR1 &amp; ~0x00000FFFUL)
            | (5UL &lt;&lt; 0) | (5UL &lt;&lt; 3) | (5UL &lt;&lt; 6) | (5UL &lt;&lt; 9);

ADC1-&gt;SQR1 = 0;          <span class="c">/* L = 0000 → 序列長度 1 */</span>
ADC1-&gt;CR2 |= (1UL &lt;&lt; 0); <span class="c">/* ADON */</span></pre>
<span class="fileref">App/input.c:135–149</span>

<h3>讀一次的完整流程</h3>
<pre>uint16_t Input_AdcRaw(uint8_t ch)
{
    uint32_t guard = 200000;

    ADC1-&gt;SQR3 = ch;                 <span class="c">/* 這次要轉哪個通道 */</span>
    ADC1-&gt;SR  &amp;= ~(1UL &lt;&lt; 1);        <span class="c">/* 清掉舊的 EOC     */</span>
    ADC1-&gt;CR2 |=  (1UL &lt;&lt; 30);       <span class="c">/* SWSTART 開始     */</span>

    while ((ADC1-&gt;SR &amp; (1UL &lt;&lt; 1)) == 0) {
<span class="hl">        if (--guard == 0) { s_adcFaults++; return 0; }</span>
    }
    return (uint16_t)(ADC1-&gt;DR &amp; 0x0FFF);
}</pre>
<span class="fileref">App/input.c:61–77</span>

<p>那個 <code>guard</code> 不是為了計時。一次轉換只要 6 微秒，正常永遠不會用到。它的作用是：<strong>如果 ADC 設定錯了導致 EOC 永遠不來，整台機器不要當掉</strong>，而是讓搖桿讀 0 並把錯誤記下來。I/O TEST 畫面上那個 <code>ADC OK</code> 就是在顯示這個計數器。讓故障變成可見的資訊，而不是一片死寂。</p>

<h3>為什麼開機要量中心值</h3>
<p>理論上中心是 2048，實際上不是。電位器有公差、電源有誤差，每一支搖桿的靜止讀數都不同，可能是 1980 也可能是 2120。如果程式假設 2048，搖桿放開時會被判定成一直往某個方向推。</p>

<p>所以 <code>Input_Init()</code> 最後會把「現在的讀數」定義成中心，每軸平均 16 次：</p>

<pre>void Input_Recalibrate(void)
{
    s_centre[0] = adc_avg(CH_J1X, 16);
    s_centre[1] = adc_avg(CH_J1Y, 16);
    s_centre[2] = adc_avg(CH_J2X, 16);
    s_centre[3] = adc_avg(CH_J2Y, 16);
}</pre>
<span class="fileref">App/input.c:161–168</span>

<p>這直接解釋了一條使用規則：<strong>開機時不要碰搖桿</strong>。你在那一刻推著的位置會被記成「中心」，之後放手畫面就會自己跑。I/O TEST 裡有一顆 CENTRE STICKS 可以重新量。</p>

<h3>為什麼遲滯要兩個門檻</h3>
<p>如果只用一個門檻，搖桿剛好停在門檻附近時，雜訊會讓它反覆跨越，方向訊號一秒抖幾十次。<span class="term" data-t="遲滯">遲滯</span>的做法是「進入」和「離開」用不同的值：</p>

<pre>#define JOY_ON     700      <span class="c">/* 離開中心多少才算推了       */</span>
#define JOY_OFF    450      <span class="c">/* 要回到多近才算放掉         */</span></pre>
<span class="fileref">App/input.c:39–40</span>

<pre>static uint16_t axis_bits(uint16_t raw, uint16_t centre,
                          uint16_t negBit, uint16_t posBit,
                          uint16_t was, uint8_t invert)
{
    int32_t  d   = (int32_t)raw - (int32_t)centre;
    uint16_t out = 0;

    if (invert) d = -d;

<span class="hl">    if ((was &amp; posBit) &amp;&amp; d &gt;  JOY_OFF) out |= posBit;   <span class="c">/* 已經推著：用低門檻 */</span></span>
<span class="hl">    else if (d &gt;  JOY_ON)               out |= posBit;   <span class="c">/* 還沒推：用高門檻   */</span></span>

    if ((was &amp; negBit) &amp;&amp; d &lt; -JOY_OFF) out |= negBit;
    else if (d &lt; -JOY_ON)               out |= negBit;

    return out;
}</pre>
<span class="fileref">App/input.c:187–201</span>

<p><code>was</code> 是上一幀的結果。已經處在「推著」狀態的軸，用比較寬鬆的 450 判斷是否還推著；還沒推的軸，要跨過比較嚴格的 700 才算推。700 和 450 之間那 250 個計數就是不會抖動的緩衝區。下面可以自己調來看效果。</p>

<div data-inst="joysim"></div>

<h3>類比值的另一條路</h3>
<p>方向位元夠 Dino 用，但 Gate Keeper 的收集器要平滑移動，所以另外有一個函式回傳 −512 到 +511：</p>

<pre>d = (int32_t)s_raw[idx] - (int32_t)s_centre[idx];
if (d &gt; -JOY_DEAD &amp;&amp; d &lt; JOY_DEAD) return 0;
<span class="hl">d = (d &gt; 0) ? (d - JOY_DEAD) : (d + JOY_DEAD);   <span class="c">/* 減掉死區，不是歸零 */</span></span>
d = (d * 512) / (2048 - JOY_DEAD);</pre>
<span class="fileref">App/input.c:259–267</span>

<p>注意那一行是「減掉死區」而不是「死區內回 0、死區外照原值」。如果照原值，搖桿一離開死區輸出就從 0 跳到 250，收集器會瞬間彈開。減掉之後輸出從死區邊緣的 0 平滑爬升。</p>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/input.c:39–41</code> — <code>JOY_ON</code>、<code>JOY_OFF</code>、<code>JOY_DEAD</code> 三個門檻</li>
<li><code>App/input.c:187–201</code> — <code>axis_bits()</code>，遲滯的實作</li>
<li><code>App/input.c:250–270</code> — <code>Input_JoyAxis()</code>，類比輸出</li>
<li><code>App/iotest.c</code> — 四條長條圖和橘色的中心刻度</li>
</ul></div>
`,

  opts:["約 0.23 V","約 0.56 V","約 1.13 V","約 2.31 V"], ans:1,

{
n:8, title:"計時器與 PWM 發聲", sub:"PSC 與 ARR 怎麼算出一個頻率，AF 怎麼把腳位交給 TIM3。",
tags:[["reg","TIM3 PSC / ARR / CCR1 / CCMR1 / CCER"],["lab","音高計算器"],["file","App/sound.c:72"]],
html:`
<p class="lede">蜂鳴器要的是一個方波。計時器天生就在做週期性的事，把它的輸出接到腳位，頻率由週期決定，音高就出來了。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>你當然可以用 <code>while</code> 迴圈手動翻腳位，但那樣 CPU 什麼別的事都做不了。交給計時器之後，硬體自己產生波形，CPU 只在換音符時寫兩個數字。這是「把工作丟給周邊」最乾淨的例子。</p></div>

<h3>計時器怎麼產生頻率</h3>
<p>計時器有一個計數器，每個時脈週期加一，數到 <code>ARR</code> 就歸零重來。<code>PSC</code> 是前置除頻器，先把時脈除慢。所以一個週期的長度是：</p>

<pre>f = 計時器時脈 / ((PSC + 1) × (ARR + 1))</pre>
<span class="fileref">App/sound.c:67，註解裡就寫著這條式子</span>

<p>加一是因為兩個暫存器都從 0 算起：<code>PSC = 0</code> 代表不除頻，<code>ARR = 0</code> 代表每個週期都歸零。</p>

<h3>計時器時脈是多少</h3>
<p>TIM3 掛在 APB1。F4 有一個容易踩的規則：<strong>APB 除頻器不是 1 的時候，計時器拿到的是 PCLK 的兩倍</strong>。本專案直接讀暫存器判斷，不寫死：</p>

<pre>static uint32_t timer_clock(void)
{
    uint32_t ppre1 = (RCC-&gt;CFGR &gt;&gt; 10) &amp; 0x7;   <span class="c">/* bits 12:10 */</span>
    return (ppre1 &lt; 4) ? PCLK1_Freq : (PCLK1_Freq * 2);
}</pre>
<span class="fileref">App/sound.c:28–32</span>

<p>課程板的時脈樹是 HCLK 168 MHz、PCLK1 42 MHz，除頻器是 4，所以 <code>ppre1</code> 是 5、條件成立，TIM3 拿到 <strong>84 MHz</strong>。I/O TEST 畫面上的 <code>SPK 84000k</code> 顯示的就是這個值——如果它不是 84000k，問題在時脈設定而不是喇叭。</p>

<h3>從目標頻率反算</h3>
<p>已知 <code>f</code> 要求 <code>PSC</code> 和 <code>ARR</code>，答案不唯一。<code>ARR</code> 只有 16 位元，所以策略是：先算出總計數，再用最小的 <code>PSC</code> 把它壓進 65536 以內。</p>

<pre>total = s_timClk / freq;
if (total == 0) { Sound_Stop(); return; }

<span class="hl">psc = (total + 65535UL) / 65536UL;     <span class="c">/* 最小的 PSC+1 使 ARR 放得下 */</span></span>
if (psc == 0) psc = 1;
arr = total / psc;

TIM3-&gt;PSC  = (uint16_t)(psc - 1);
TIM3-&gt;ARR  = (uint16_t)(arr - 1);
<span class="hl">TIM3-&gt;CCR1 = (uint16_t)(arr / 2);      <span class="c">/* 50% 工作週期 = 方波 */</span></span>
TIM3-&gt;EGR  = 1UL;                      <span class="c">/* UG：讓新值立刻生效  */</span>
TIM3-&gt;CCER |= (1UL &lt;&lt; 0);              <span class="c">/* CC1E：開始驅動腳位  */</span>
TIM3-&gt;CR1  |= (1UL &lt;&lt; 0);              <span class="c">/* CEN：跑             */</span></pre>
<span class="fileref">App/sound.c:74–93</span>

<p>算一次看看：C5 是 523 Hz。<code>total = 84000000 / 523 = 160611</code>。<code>psc = (160611 + 65535) / 65536 = 3</code>，<code>arr = 160611 / 3 = 53537</code>。寫進去的是 <code>PSC = 2</code>、<code>ARR = 53536</code>，實際頻率 <code>84000000 / (3 × 53537) = 523.0 Hz</code>。</p>

<p>工作週期固定在一半，因為音高只由週期決定。<span class="term" data-t="PWM">PWM</span> 在這裡不是用來調亮度或音量，只是產生方波最方便的模式。</p>

<div data-inst="pwmcalc"></div>

<h3>腳位怎麼交給計時器</h3>
<p>計時器的輸出不會自動出現在腳位上。要把腳位設成<span class="term" data-t="AF">替代功能</span>，而且要指定「哪一個」替代功能——每支腳有 16 個 AF 編號，對應不同周邊。PA6 的 AF2 是 TIM3_CH1，這張對應表在資料手冊（DS8626）的 Alternate function mapping，不在參考手冊裡。</p>

<pre>#define PIN_SPK   6            <span class="c">/* PA6 */</span>
#define AF_TIM3   2

GPIOA-&gt;MODER   = ... | (2UL &lt;&lt; (PIN_SPK * 2));    <span class="c">/* 10 = 替代功能   */</span>
<span class="hl">GPIOA-&gt;AFR[0]  = (GPIOA-&gt;AFR[0]  &amp; ~(0xFUL &lt;&lt; (PIN_SPK * 4)))</span>
<span class="hl">               | ((uint32_t)AF_TIM3 &lt;&lt; (PIN_SPK * 4));</span></pre>
<span class="fileref">App/sound.c:8–9 與 :39–46</span>

<p><code>AFR</code> 是一個兩元素陣列：<code>AFR[0]</code> 管 pin 0 到 7，<code>AFR[1]</code> 管 pin 8 到 15。一支腳佔 4 位元，所以位移是 <code>pin * 4</code>，而 <code>AFR[1]</code> 要用 <code>(pin - 8) * 4</code>。</p>

<div class="pit"><h4>兩個實際踩過的坑</h4>
<ul>
<li><strong>音高全部高三個八度</strong>：<code>timer_clock()</code> 少了 ×2，用 42 MHz 去算而硬體實際跑 84 MHz。</li>
<li><strong>完全沒聲音但暫存器值正確</strong>：這台機器真的遇到了。<code>SPK 84000k</code> 和 <code>ARR</code> 都對，Hz 也在跳，最後發現是杜邦線整排錯一格。這就是把計算結果顯示在畫面上的價值——它把「韌體問題」和「接線問題」切開了。</li>
</ul></div>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/sound.c:28–32</code> — <code>timer_clock()</code>，APB1 的 ×2 規則</li>
<li><code>App/sound.c:74–93</code> — <code>tone_on()</code>，從頻率反算 PSC 與 ARR</li>
<li><code>App/sound.c:8–9</code> — <code>PIN_SPK</code> 與 <code>AF_TIM3</code>，換腳位只改這裡</li>
<li><code>App/sound.h:38–41</code> — <code>Note</code> 結構與旋律播放，第 11 站會看到它怎麼非阻塞推進</li>
</ul></div>
`,

  opts:["83999","84000","41999","65535"], ans:0,
  fb:"<code>f = 84000000 / ((0+1) × (ARR+1))</code>，所以 <code>ARR + 1 = 84000</code>，<code>ARR = 83999</code>。但 84000 超過 16 位元上限 65535，所以本專案的演算法會改用 <code>PSC = 1</code>、<code>ARR = 41999</code>。這題要你先算對，再看出為什麼需要 PSC。"},
 {id:"s8b", type:"fill", q:"計時器時脈 84 MHz，目標 440 Hz（A4）。照 <code>tone_on()</code> 的演算法，寫進 <code>TIM3-&gt;PSC</code> 的值是多少？（只填數字）",

{
n:9, title:"螢幕與 FSMC", sub:"為什麼 LCD 可以被當成一塊記憶體來寫。",
tags:[["reg","FSMC / LCD_BASE"],["lab","畫布模擬"],["file","App/gfx.c"]],
html:`
<p class="lede">這塊板子的 LCD 不走 SPI。它接在 FSMC 上，而 FSMC 本來是設計來外接 SRAM 的。結果是：對某個位址寫一個 16 位元值，就等於送出一個像素。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>這是整台機器最違反直覺、也最漂亮的一段。理解它之後，你會知道為什麼「畫一個像素」和「寫一個變數」的成本是同一個量級，也才會懂第 11 站的防閃爍技巧為什麼有效。</p></div>

<h3>FSMC 把外部裝置變成位址</h3>
<p><span class="term" data-t="FSMC">FSMC</span> 會把資料線、位址線、讀寫致能拉出來。接一顆 SRAM 上去，你就能直接對那個位址範圍讀寫。ILI9341 的並列介面長得跟 SRAM 很像：一組資料線、一支寫入腳、一支「這次寫的是指令還是資料」的腳（叫 RS 或 D/C）。</p>

<p>訣竅在 RS 這支腳——它<strong>接到一條位址線</strong>。本專案接的是 A6：</p>

<pre>#define  RS_bit              6
#define  LCD_BASE_sel        0x6C000000
#define  LCD_BASE            (LCD_BASE_sel | ((0x01UL &lt;&lt; (RS_bit+1)) - 2))
                             <span class="c">/* → 0x6C00007E */</span></pre>
<span class="fileref">GLCD/stm324xg_lcd_ILI9341_Pro.c:5–7</span>

<p>於是位址的第 6 位元就是 RS。驅動宣告一個兩欄的結構，兩欄剛好差 A6：</p>

<pre>typedef struct {
  volatile uint16_t LCD_REG;    <span class="c">/* RS = 0 → 這是指令 */</span>
  volatile uint16_t LCD_RAM;    <span class="c">/* RS = 1 → 這是資料 */</span>
} LCD_TypeDef;

#define LCD  ((LCD_TypeDef *) LCD_BASE)

#define LCD_WriteReg(x)   (LCD-&gt;LCD_REG = (uint16_t) x)
#define LCD_WriteData(x)  (LCD-&gt;LCD_RAM = (uint16_t) x)</pre>
<span class="fileref">GLCD/stm324xg_lcd_ILI9341_Pro.c:141–147 附近</span>

<p>所以「傳一個指令給螢幕」在 C 裡就是一次結構欄位賦值。<code>0x6C000000</code> 這個位址對應 FSMC 的 Bank1 NE4，也就是 PG12 那支晶片選擇腳。</p>

<h3>用到哪些腳位</h3>
<p>驅動用四個位元圖描述，格式是「哪個埠、哪些位元」：</p>

<pre>#define PNr_FSMC_set1 3       <span class="c">GPIOD</span>
#define PinBit_FSMC_set1 0xC733   <span class="c">→ PD0,1,4,5,8,9,10,14,15</span>
#define PNr_FSMC_set2 4       <span class="c">GPIOE</span>
#define PinBit_FSMC_set2 0xFF80   <span class="c">→ PE7..PE15</span>
#define PNr_FSMC_set3 6       <span class="c">GPIOG</span>
#define PinBit_FSMC_set3 0x1000   <span class="c">→ PG12   （NE4）</span>
#define PNr_FSMC_set4 5       <span class="c">GPIOF</span>
#define PinBit_FSMC_set4 0x1000   <span class="c">→ PF12   （A6 = RS）</span></pre>
<span class="fileref">GLCD/stm324xg_lcd_ILI9341_Pro.c:25–33</span>

<p>這四行就是腳位圖上那一大片標成「LCD」的來源，也是整個專案的腳位預算起點——這些腳一支都不能碰。第 4 站的 AF 觀念在這裡再次出現：所有 FSMC 腳都要設成 AF12。</p>

<h3>從一個像素到一張圖</h3>
<p>畫一個像素要三步：設定行位址、設定列位址、寫顏色。顏色是 <span class="term" data-t="RGB565">RGB565</span>，紅 5 位、綠 6 位、藍 5 位。</p>

<p>但如果要畫一塊矩形，逐點設定位址就太浪費了。ILI9341 支援「開一個視窗」：告訴它範圍，然後連續寫顏色，它自己會換行。於是一塊 w×h 的區域只要一次位址設定加上 w×h 次資料寫入。</p>

<pre>void LCD_DrawRGBImage(uint16_t Xpos, uint16_t Ypos,
                      uint16_t Xsize, uint16_t Ysize, uint8_t *pdata)</pre>
<span class="fileref">GLCD/stm324xg_lcd_ILI9341_Pro.c:2341</span>

<p>本專案的 <code>gfx.c</code> 就建立在這個函式上。它在 RAM 裡準備好一整塊像素，然後一次送出去：</p>

<pre>#define GFX_BUF_PIX  4800            <span class="c">/* 9600 位元組的組圖緩衝區 */</span>
static uint16_t s_buf[GFX_BUF_PIX];

void Gfx_BandBegin(uint16_t w, uint16_t h, uint16_t bg);   <span class="c">/* 填背景     */</span>
void Gfx_BandSprite(const Sprite *s, int16_t x, int16_t y, uint16_t ink);
void Gfx_BandEnd(int16_t screenX, int16_t screenY);        <span class="c">/* 一次送出   */</span></pre>
<span class="fileref">App/gfx.c:7 與 App/gfx.h:31</span>

<p><span class="term" data-t="sprite">Sprite</span> 用 1 位元一像素存，畫的時候才指定顏色：</p>

<pre>stride = (uint16_t)((s-&gt;w + 7) / 8);        <span class="c">/* 一列佔幾個位元組 */</span>
...
if (row[sx &gt;&gt; 3] &amp; (0x80u &gt;&gt; (sx &amp; 7)))    <span class="c">/* 取出第 sx 個位元 */</span>
    s_buf[(uint32_t)dy * s_w + dx] = ink;</pre>
<span class="fileref">App/gfx.c:51–64</span>

<p><code>sx &gt;&gt; 3</code> 是除以 8（第幾個位元組），<code>sx &amp; 7</code> 是取餘數（位元組裡的第幾位）。第 2 站的位元運算在這裡變成了畫圖。</p>

<div data-inst="lcdsim"></div>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>GLCD/stm324xg_lcd_ILI9341_Pro.c:5–7</code> — <code>LCD_BASE</code> 怎麼被 RS_bit 決定</li>
<li><code>GLCD/stm324xg_lcd_ILI9341_Pro.c:25–33</code> — FSMC 佔用的腳位</li>
<li><code>App/gfx.c:44–66</code> — 1bpp sprite 的取位元與繪製</li>
<li><code>App/dino_sprites.h</code> — 16 個 sprite，總共 2050 位元組，由 <code>tools/gen_sprites.py</code> 從真的 Chrome Dino PNG 產生</li>
</ul></div>
`,
ex:[
 {id:"s9a", type:"mc", q:"LCD 的 RS 腳接到 FSMC 的位址線 A6。這代表什麼？",
  opts:["螢幕最多只能有 64 個像素","寫到位址的 bit 6 是 1 或 0，就決定這次送的是資料還是指令","A6 用來選擇螢幕的旋轉方向","FSMC 只能接六條資料線"], ans:1,
  fb:"位址線本來是用來選記憶體位置的，這裡被借來當一個訊號腳。結構裡兩個欄位剛好差 0x40（bit 6），所以寫 <code>LCD-&gt;LCD_REG</code> 和 <code>LCD-&gt;LCD_RAM</code> 就是在切換 RS。這也是 <code>LCD_BASE</code> 為什麼是 0x6C00007E 而不是整數位址。"},
 {id:"s9b", type:"mc", q:"一個 31×34 的 sprite 用 1 位元一像素存，一列要補滿整個位元組。它佔多少位元組？",
  opts:["132","136","155","1054"], ans:1,
  fb:"一列 31 個像素需要 <code>(31+7)/8 = 4</code> 個位元組，34 列就是 136。這正是 <code>dino_run1_bits[]</code> 的大小。如果改成一像素兩位元組的 RGB565，同一張圖要 2108 位元組——差了 15 倍，這在 32 KB 的預算裡是決定性的。"}
]},

{
n:10, title:"觸控與 SPI", sub:"四條線各自在做什麼，座標為什麼要校正。",
tags:[["reg","軟體 SPI"],["file","SPI_touch/Driver_SPI.c"]],
html:`
<p class="lede">觸控面板本身只是四條電阻線。真正做 ADC 的是面板旁邊一顆獨立晶片，MCU 透過 SPI 問它「現在被按在哪裡」。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>這一站示範了另一種常見情況：功能不是由 MCU 內部周邊完成的，而是外接晶片。你的工作變成「照對方的協定跟它說話」。SPI 是這類對話最常見的形式。</p></div>

<h3>SPI 的四條線</h3>
<pre>SCK    <span class="c">時脈。由主機產生，每一個邊緣搬一個位元</span>
MOSI   <span class="c">主出從入。主機說話（要量哪一軸）</span>
MISO   <span class="c">主入從出。從機回答（量到的值）</span>
CS     <span class="c">晶片選擇。拉低表示「接下來這段是跟你講的」</span></pre>

<p><span class="term" data-t="SPI">SPI</span> 是同步的：沒有鮑率設定，因為時脈由主機自己送。也是全雙工的：同一個時脈邊緣上，MOSI 和 MISO 同時各搬一個位元。</p>

<h3>本專案用軟體模擬，不是硬體周邊</h3>
<p>F407 有硬體 SPI 周邊，但這個驅動沒用。它把四支腳當普通 GPIO，自己一位一位翻時脈。原因是腳位：這四支腳不在同一組硬體 SPI 的腳位上。</p>

<pre>#define GPIO_SCK  GPIOB     <span class="c">PB0</span>
#define GPIO_CS   GPIOC     <span class="c">PC13</span>
#define GPIO_MI   GPIOB     <span class="c">PB2   （MISO）</span>
#define GPIO_MO   GPIOF     <span class="c">PF11  （MOSI）</span></pre>
<span class="fileref">SPI_touch/Driver_SPI.c:19–22</span>

<p>另外還有一支 PB1 是觸控晶片的中斷輸出，手指按下時被拉低。程式先看這支腳決定「有沒有人在摸」，有才去 SPI 問座標，省掉不必要的通訊。</p>

<p>對本專案有一個直接後果：<strong>PB0 已經被觸控佔用</strong>。蜂鳴器原本規劃在 PB0（TIM3_CH3），發現衝突之後才改到 PA6。第 3 站說腳位預算要先查清楚，這就是理由。</p>

<h3>為什麼座標要校正</h3>
<p>電阻式面板回來的是兩個 ADC 讀數，不是像素座標。讀數和像素之間是線性關係，但係數取決於面板貼合的位置、邊框壓力、批次差異。所以要先量幾個已知點，解出一組係數。</p>

<pre>void Default_Calibration(void);   <span class="c">/* 載入預設係數 */</span>
void Cal_GetXY(uint16_t* pX, uint16_t* pY);   <span class="c">/* 讀數 → 像素 */</span></pre>
<span class="fileref">SPI_touch/touch_module.h</span>

<p>注意 <code>main()</code> 裡的順序：<code>Default_Calibration()</code> 必須在 <code>LCD_Init()</code> 之後。因為係數的計算要用到 <code>LCD_Pixel_Width()</code>，而那個值在 LCD 初始化前沒有意義。</p>

<h3>觸控事件怎麼變成手勢</h3>
<p>2048 需要判斷滑動方向。做法是記下按下的位置、持續更新目前位置、放開時比較位移：</p>

<pre>static SwipeDir swipe_dir(int16_t dx, int16_t dy)
{
    int16_t adx = dx &lt; 0 ? (int16_t)-dx : dx;
    int16_t ady = dy &lt; 0 ? (int16_t)-dy : dy;

    if (adx &lt; SWIPE_MIN &amp;&amp; ady &lt; SWIPE_MIN) return SW_NONE;   <span class="c">/* 太短，忽略 */</span>
    if (adx &gt;= ady) return (dx &gt; 0) ? SW_RIGHT : SW_LEFT;      <span class="c">/* 主軸決定   */</span>
    return (dy &gt; 0) ? SW_DOWN : SW_UP;
}</pre>
<span class="fileref">App/game_2048.c:394–403，SWIPE_MIN 是 28 像素</span>

<p>「放開」也需要去彈跳，理由和按鍵一樣：面板讀數會有一兩次假的「沒人摸」。所以要求連續三次取樣都沒摸到才承認放手，在 10 毫秒的迴圈上是 30 毫秒。</p>

<pre>#define REL_DEBOUNCE 3u</pre>
<span class="fileref">App/game_2048.c:419</span>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>SPI_touch/Driver_SPI.c:19–22</code> — 四條線的腳位，以及 PB0 衝突的來源</li>
<li><code>App/game_2048.c:394–443</code> — 手勢判斷與放開去彈跳</li>
<li><code>App/app_main.c:100–102</code> — 為什麼 <code>Default_Calibration()</code> 要排在 <code>LCD_Init()</code> 後面</li>
</ul></div>
`,

  opts:["SPI 速度固定是 1 MHz","時脈由主機用 SCK 直接送給從機，雙方不需要事先約定速率","SPI 只能傳 8 位元","從機會自己產生時脈"], ans:1,
  fb:"這是同步和非同步通訊的根本差別。UART 沒有時脈線，所以兩邊必須事先講好鮑率。SPI 有 SCK，從機跟著主機的邊緣走，主機想多快就多快（在從機的上限內）。"},

  opts:["PB0 沒有計時器功能","PB0 已經被觸控面板的 SPI 時脈佔用","PB0 的電流能力不足","PA6 比較靠近板邊"], ans:1,
  fb:"<code>Driver_SPI.c</code> 把 PB0 當 SCK 用。兩個功能搶同一支腳，結果會是觸控失靈或蜂鳴器失靈，而且很難聯想。所以規劃腳位的第一步是把所有既有驅動的佔用表整理出來——這也是 PINMAP.md 第 1 節存在的原因。"}
]},

n:11, title:"把它變成一台遊戲機", sub:"主迴圈、狀態機、防閃爍，從輸入到畫面的整條路徑。",
tags:[["reg","無"],["file","App/app_main.c:110"]],
html:`
<p class="lede">前面十站都是零件。這一站把它們接成一台會動的機器。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>周邊都會動不代表遊戲會好玩。真正決定手感的是三件事：主迴圈的結構、狀態怎麼切換、以及畫面怎麼更新才不閃。</p></div>

<h3>狀態機就是一個 switch</h3>
<p>這台機器同時只在一個畫面裡。<span class="term" data-t="狀態機">狀態機</span>不需要框架，一個列舉加一個 <code>switch</code> 就夠：</p>

<pre>for (;;) {
    screen = Menu_Run();               <span class="c">/* 阻塞，直到玩家選了 */</span>

    switch (screen) {
    case APP_DINO:   Dino_Run();     break;
    case APP_2048:   Game2048_Run(); break;
    case APP_GATE:   Gate_Run();     break;
    case APP_IOTEST: IoTest_Run();   break;
    }

    Sound_Stop();                      <span class="c">/* 離開遊戲一定關聲音 */</span>
}</pre>
<span class="fileref">App/app_main.c:110–122</span>

<p>每個 <code>*_Run()</code> 內部自己有主迴圈，玩家按 KEY1 就 <code>return</code>，控制權回到這裡。這個設計讓每個遊戲完全獨立——不共用全域狀態，加一個遊戲就是加一個檔案和一個 case。</p>

<h3>一幀裡面發生什麼</h3>
<pre>t0 = msTick;

Input_Poll();          <span class="c">/* 1. 讀四顆按鍵 + 四軸 ADC，去彈跳    */</span>
Sound_Update();        <span class="c">/* 2. 音符到時間了就換下一個           */</span>
p = Input_Pressed();   <span class="c">/* 3. 取出這一幀的「剛按下」            */</span>

if (p &amp; BTN_UP)    fire(LN_UP);        <span class="c">/* 4. 輸入 → 遊戲動作   */</span>
...
move_collector();      <span class="c">/* 5. 類比搖桿 → 位置                  */</span>
step_world();          <span class="c">/* 6. 推進物理與碰撞                   */</span>
render();              <span class="c">/* 7. 只重畫變動的區塊                 */</span>

while (msTick - t0 &lt; TICK_MS) { }      <span class="c">/* 8. 補滿這一幀     */</span></pre>
<span class="fileref">App/game_gate.c，gate_play() 的主迴圈</span>

<p>順序不是隨便排的。輸入必須在物理之前，物理必須在畫面之前，補時間必須在最後。</p>

<h3>防閃爍：組好再送</h3>
<p>直覺的畫法是「用背景色把舊位置擦掉，再在新位置畫」。問題是這在螢幕上是兩次可見的寫入，眼睛會看到中間那個空白的瞬間，也就是閃爍。</p>

<p>本專案的做法是：<strong>在 RAM 裡把整塊區域組好——背景、地面線、角色全部畫進緩衝區——然後一次送到面板</strong>。像素從來沒有處在中間狀態，所以沒有東西可以閃。</p>

<pre>Gfx_BandBegin(DINO_BAND_W, DINO_BAND_H, SKY);          <span class="c">/* 填天空色 */</span>
Gfx_BandSprite(dino_sprite(), 0, dino_top() - DINO_BAND_TOP, INK);
Gfx_BandEnd(DINO_X, DINO_BAND_TOP);                    <span class="c">/* 一次送出 */</span></pre>
<span class="fileref">App/game_dino.c，draw_dino()</span>

<p>更聰明的是障礙物。它們每幀往左移 <code>step</code> 像素，所以送出的區塊寬度是「sprite 寬 + step」——多出來的那幾個像素是天空色，剛好把剛剛讓出來的尾巴擦掉。一次寫入同時完成「畫新的」和「擦舊的」：</p>

<pre>int16_t bw = (int16_t)(s-&gt;w + step);   <span class="c">/* 多出 step 像素當橡皮擦 */</span></pre>
<span class="fileref">App/game_dino.c，draw_obst()</span>

<h3>繪製順序決定誰蓋住誰</h3>
<p>Gate Keeper 的收集器可以跑到任何地方，包含車道上。所以順序是：先擦掉收集器的舊位置，再畫四條車道、核心、掉落物，最後才畫收集器。</p>

<pre>if (s_ocx != s_cx || s_ocy != s_cy)
    wipe(舊位置);                      <span class="c">/* 先擦，讓下面的重畫補回來 */</span>

for (i = 0; i &lt; LN_N; i++) draw_lane(i);
draw_core();
for (i = 0; i &lt; MAX_PU; i++) if (s_pu[i].active) draw_pickup(&amp;s_pu[i]);
draw_collector();                      <span class="c">/* 最後畫，所以在最上層 */</span>
hud_update();</pre>
<span class="fileref">App/game_gate.c，render()</span>

<h3>只在變化時才畫文字</h3>
<p>分數每幀都重畫會閃，也浪費時間。所以 HUD 記住「目前顯示的是什麼」，只有不一樣才重畫：</p>

<pre>if (s_hudScore != s_score) {
    s_hudScore = s_score;
    ... 畫 ...
}</pre>
<span class="fileref">App/game_gate.c，hud_update()</span>

<h3>一個把遊戲變公平的細節</h3>
<p>Gate Keeper 的左右車道長 148 像素，上下只有 92——螢幕是 320×240。如果所有敵人都用同樣的像素速度，短車道會難得多。解法是把速度按車道長度縮放，讓每個敵人走進來的<strong>時間</strong>相同：</p>

<pre>static int16_t lane_scale(uint8_t l, int16_t v)
{
    return (l &lt; LN_LEFT) ? (int16_t)((int32_t)v * LANE_V / LANE_H) : v;
}</pre>
<span class="fileref">App/game_gate.c:84–87</span>

<p>玩家看不到這件事，但少了它遊戲會莫名覺得不公平。另一個同類的決定是 <code>COOLDOWN_MS</code> 260 毫秒：沒有冷卻，玩家只要瘋狂連打就能通關，反應時機就不再重要。</p>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/app_main.c:110–122</code> — 狀態機</li>
<li><code>App/gfx.h:8–23</code> — 組圖再送出的完整說明</li>
<li><code>App/game_gate.c:84–87</code> — <code>lane_scale()</code>，等時間而不是等像素</li>
<li><code>App/game_gate.c:110</code> — <code>COOLDOWN_MS</code> 260 毫秒</li>
</ul></div>
`,

{
n:12, title:"資源限制下的取捨", sub:"32 KB 上限、為什麼不用浮點數、sprite 怎麼存。",
tags:[["reg","無"],["lab","32 KB 預算"],["file","App/game_dino.c:57"]],
html:`
<p class="lede">這台機器用的是 Keil MDK-Lite，連結器上限 32768 位元組。目前用掉 29748。這個限制不是障礙，它是這份程式碼很多寫法的原因。</p>

<div class="why"><h4>為什麼需要這個觀念</h4>
<p>在有限資源下寫程式會逼你回答一個問題：這個功能真的值那些位元組嗎？這個訓練在任何平台上都有用，只是在這裡你躲不掉。</p></div>

<h3>目前的預算</h3>
<pre>Code      21428 bytes   <span class="c">程式碼</span>
RO-data    8280 bytes   <span class="c">常數：字型表、sprite、文字</span>
RW-data      40 bytes
                        ----------
影像合計   29748 bytes   <span class="c">上限 32768，剩 3020</span>

ZI-data   11752 bytes   <span class="c">RAM，其中 9600 是 gfx 的組圖緩衝區</span></pre>
<span class="fileref">數字來自 Keil 的連結器輸出，見 README.md</span>

<h3>最大的一刀：字型</h3>
<p>第一次加完 Gate Keeper，影像是 32488——只剩 280 位元組，等於不能再加任何東西。試過的便宜手段都沒用：<code>-ffunction-sections</code> 沒有變化（AC6 預設就已經做了），移掉沒用到的 <code>PWR_group</code> 只省了 208 位元組。</p>

<p>真正有效的是砍字型。點陣字型是純資料，一個字元佔「寬度位元組 × 高度」：</p>

<pre>Font24   17×24    →  6840 bytes
Font20   14×20    →  3800 bytes
Font16   11×16    →  3040 bytes
Font12    7×12    →  1140 bytes</pre>

<p>所以驅動裡改一個位元圖就換來 10.6 KB：</p>

<pre>#define __Fonts_select   0x00000006   <span class="c">/* 只留 Font12 與 Font16 */</span>
#define __default_Font   2            <span class="c">/* 預設改成 Font16       */</span></pre>
<span class="fileref">GLCD/stm324xg_lcd_ILI9341_Pro.c:13–14</span>

<p>代價是標題變小，而且所有依賴 14 像素字寬的版面都要重算。這是真實的取捨：<strong>四個遊戲，或是大字型，選一個</strong>。</p>

<h3>為什麼不用浮點數</h3>
<p>F407 有硬體浮點單元，但一旦用了 <code>float</code>，連結器就會拉進浮點的格式化與函式庫程式碼，那是好幾 KB。而且遊戲根本不需要浮點的精度。</p>

<p>解法是<span class="term" data-t="定點數">定點數</span>：用整數表示小數，單位自己約定。Dino 的垂直位置存成「1/16 像素」：</p>

<pre>#define GRAVITY16      5        <span class="c">/* 每幀加 5/16 像素的速度  */</span>
#define JUMP_V16    (-102)      <span class="c">/* 起跳 −102/16 像素/幀    */</span>
#define SPEED_MIN16   48        <span class="c">/* 3.0 像素/幀             */</span>
#define SPEED_MAX16  128        <span class="c">/* 8.0 像素/幀             */</span></pre>
<span class="fileref">App/game_dino.c:57–61</span>

<p>要拿真正的像素座標就除以 16，而 16 是 2 的次方，所以編譯器用一個位移指令就完成，沒有除法。變數名稱結尾的 <code>16</code> 就是在提醒讀者「這個值的單位是 1/16」。</p>

<p>跳躍的物理因此完全是整數：</p>

<pre>s_vy16 += GRAVITY16;
s_y16  += s_vy16;</pre>

<p>起跳速度 −102、重力 5，20 幀後速度歸零，累積上升 990/16 ≈ 62 像素，再 20 幀落地。20 毫秒一幀就是 0.8 秒的滯空時間。全部用整數算完。</p>

<h3>sprite：1 位元一像素</h3>
<p>16 個 sprite 總共 2050 位元組。如果存成 RGB565，光是恐龍的六個姿勢就要超過 12 KB。1bpp 的代價是每張圖只能有一個顏色——但 Chrome Dino 本來就是單色的，所以這裡沒有損失。</p>

<pre>dino_run1    31 × 34    136 bytes
dino_duck1   43 × 22    132 bytes
cac_s1       15 × 26     52 bytes
gameover    135 × 14    238 bytes
                        ----------
16 個 sprite 合計      2050 bytes</pre>
<span class="fileref">tools/gen_sprites.py 的輸出</span>

<h3>查表為什麼常常比運算划算</h3>
<p>2048 的磁磚顏色沒有用公式算，而是一張表，索引是 log2(值)：</p>

<pre>static const uint16_t TILE_BG_COLOR[] = {
    0x7BEF, 0xEF5D, 0xEDB6, 0xFD20, ...
};</pre>
<span class="fileref">App/game_2048.c:57–61</span>

<p>13 個項目 26 位元組，換到的是「顏色可以任意挑」和「每幀只要一次陣列索引」。同樣的道理讓車道幾何也用表：</p>

<pre>static const Band LB[LN_N] = {
    { CX - LANE_W/2, CY - LANE_V - LANE_PAD, LANE_W, LANE_V - CORE_R + LANE_PAD },
    ...
};</pre>
<span class="fileref">App/game_gate.c:74–79</span>

<p>不過查表不是萬靈丹。音高就<strong>沒有</strong>用表——<code>tone_on()</code> 每次現算 PSC 與 ARR，因為要支援任意頻率的掃頻，而一張涵蓋所有頻率的表會比那幾行除法大得多。判斷標準是：表格的大小對上它省下的程式碼與時間。</p>

<div class="pit"><h4>如果你把它加爆了</h4>
<p>連結器會說 <code>L6047U: The size of this image exceeds the maximum allowed for this version of the linker</code>。這不是你的程式有 bug，是 MDK-Lite 的授權限制。下一刀可以砍 Font16（3 KB）、把 <code>gameover</code> sprite 換成文字（238 B），或在 <code>tools/gen_sprites.py</code> 裡把 sprite 改小。</p></div>

<div class="land"><h4>專案落點</h4>
<ul>
<li><code>App/game_dino.c:57–61</code> — 定點數常數</li>
<li><code>GLCD/stm324xg_lcd_ILI9341_Pro.c:13–14</code> — 那兩行換來 10.6 KB</li>
<li><code>App/gfx.h:31</code> — <code>GFX_BUF_PIX</code> 4800，RAM 裡最大的單一配置</li>
<li><code>tools/gen_sprites.py</code> — 改 <code>JOBS</code> 表就能調整所有 sprite 的大小</li>
</ul></div>
`,
ex:[
 {id:"s12a", type:"mc", q:"為什麼 Dino 的垂直位置存成「1/16 像素」的整數，而不是用 <code>float</code>？",
  opts:["F407 沒有浮點單元",
        "整數夠精確，而且用 float 會拉進好幾 KB 的浮點函式庫，在 32 KB 預算裡太貴",
        "float 在 Keil 裡不能用",
        "1/16 像素比 float 精確"], ans:1,
  fb:"F407 其實有硬體浮點單元。問題是連結器會一併拉進浮點的格式化與函式庫程式碼。定點數用整數運算就夠精確，而且除以 16 是一個位移指令，比浮點除法還快。"},
 {id:"s12b", type:"mc", q:"為什麼顏色用查表，音高卻每次現算？",
  opts:["顏色的計算比較複雜",
        "13 個顏色只要 26 位元組；而要涵蓋任意頻率的 PSC/ARR 表會遠大於那幾行除法",
        "音高不能預先算",
        "查表在 RAM 裡，運算在 Flash 裡"], ans:1,

 {id:"s12c", type:"fill", go:"計算", q:"Font20 是 14×20 的點陣字型，每列補滿位元組，共 95 個字元。整張字型表大約多少位元組？（填數字）",

/* =====================================================================
   互動儀器。全部標明為示意，行為以真實硬體為準。
   ===================================================================== */
const el = (t, cls, html) => { const n = document.createElement(t);
  if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const hex32 = v => "0x" + (v >>> 0).toString(16).toUpperCase().padStart(8, "0");
const bin = (v, w) => (v >>> 0).toString(2).padStart(w, "0");

function panel(title, simNote){
  const w = el("div","inst");
  const h = el("div","insthead");
  h.appendChild(el("h4",null,title));
  h.appendChild(el("span","sim",simNote || "瀏覽器示意，行為以真實硬體為準"));
  w.appendChild(h);
  const b = el("div","instbody");
  w.appendChild(b);
  return {wrap:w, body:b};
}
function stripEl(value, width, hiFrom, hiTo){
  const s = el("div","strip");
  for (let i = width - 1; i >= 0; i--){
    const c = el("div","bit");
    const one = (value >>> i) & 1;
    const tgt = (hiFrom != null && i >= hiFrom && i <= hiTo);
    c.appendChild(el("div","b" + (one ? " one" : "") + (tgt ? " tgt" : ""), String(one)));
    c.appendChild(el("div","i", String(i)));
    s.appendChild(c);
  }
  return s;
}

/* ------------------------------------------------------------------
   1. 暫存器積木 — GPIO MODER / PUPDR / ODR / BSRR
   ------------------------------------------------------------------ */
const REGS = {
  MODER:{port:"GPIOE", w:2, real:"App/input.c:93",
    opts:[["00","輸入"],["01","輸出"],["10","替代功能 AF"],["11","類比"]],
    realLine:'port-&gt;MODER &amp;= ~(3UL &lt;&lt; (pin * 2));'},
  PUPDR:{port:"GPIOC", w:2, real:"App/input.c:94",
    opts:[["00","無上下拉"],["01","上拉"],["10","下拉"],["11","保留"]],
    realLine:'port-&gt;PUPDR = (port-&gt;PUPDR &amp; ~(3UL &lt;&lt; (pin * 2)))<br>             | (1UL &lt;&lt; (pin * 2));'},
  ODR:{port:"GPIOF", w:1, real:"App/sound.c:104",
    opts:[["0","低電位"],["1","高電位"]],
    realLine:'GPIOA-&gt;BSRR = (1UL &lt;&lt; (PIN_SPK + 16));   /* 本專案改用 BSRR */'},
  BSRR:{port:"GPIOA", w:1, bsrr:true, real:"App/sound.c:104",
    opts:[["set","設高（低 16 位）"],["reset","設低（高 16 位）"]],
    realLine:'GPIOA-&gt;BSRR = on ? (1UL &lt;&lt; PIN_SPK)<br>                 : (1UL &lt;&lt; (PIN_SPK + 16));'}
};

function makeBitLab(host){
  const p = panel("暫存器積木 · GPIO");
  let regName = "MODER", pin = 5, value = 0, choice = 1;

  const ctl = el("div","row");
  const selReg = el("select"); Object.keys(REGS).forEach(k =>
    selReg.appendChild(el("option",null,k)));
  const selPin = el("select"); for (let i=0;i<16;i++)
    selPin.appendChild(el("option",null,"pin "+i));
  selPin.selectedIndex = 5;
  const selVal = el("select");
  const d1 = el("div"); d1.appendChild(el("label",null,"暫存器")); d1.appendChild(selReg);
  const d2 = el("div"); d2.appendChild(el("label",null,"腳位")); d2.appendChild(selPin);
  const d3 = el("div"); d3.appendChild(el("label",null,"要設成")); d3.appendChild(selVal);
  const bApply = el("button","btn amber","寫入這一格");
  const bReset = el("button","btn","歸零");
  ctl.append(d1,d2,d3,bApply,bReset);
  p.body.appendChild(ctl);

  const stripHost = el("div"); p.body.appendChild(stripHost);
  const out = el("div","row"); p.body.appendChild(out);
  const hexBox = el("div"); hexBox.appendChild(el("label",null,"暫存器目前的值"));
  const hexV = el("div","hexout","0x00000000"); hexBox.appendChild(hexV);
  const mskBox = el("div"); mskBox.appendChild(el("label",null,"這一格的遮罩"));
  const mskV = el("div","hexout"); mskBox.appendChild(mskV);
  out.append(hexBox, mskBox);
  const gen = el("div","gencode"); p.body.appendChild(gen);
  const cmp = el("div","instnote"); p.body.appendChild(cmp);

  function fillVals(){
    const r = REGS[regName];
    selVal.innerHTML = "";
    r.opts.forEach((o,i) => selVal.appendChild(el("option",null,o[0]+"  "+o[1])));
    choice = Math.min(choice, r.opts.length - 1);
    selVal.selectedIndex = choice;
  }
  function render(){
    const r = REGS[regName];
    const width = r.bsrr ? 32 : 32;
    let lo, hi, mask, code;
    if (r.bsrr){
      lo = choice === 0 ? pin : pin + 16; hi = lo;
      mask = (1 << lo) >>> 0;
      code = r.port + "->BSRR = (1UL << " + (choice === 0 ? pin : "(" + pin + " + 16)") + ");";
    } else if (r.w === 2){
      lo = pin * 2; hi = lo + 1;
      mask = (3 << lo) >>> 0;
      const want = choice;
      code = r.port + "->" + regName + " &= ~(3UL << " + lo + ");";
      if (want) code += "\n" + r.port + "->" + regName + " |=  (" + want + "UL << " + lo + ");";
      else      code += "\n/* 目標是 00，清完就結束，不需要第二行 */";
    } else {
      lo = pin; hi = lo; mask = (1 << lo) >>> 0;
      code = choice ? r.port + "->" + regName + " |=  (1UL << " + lo + ");"
                    : r.port + "->" + regName + " &= ~(1UL << " + lo + ");";
    }
    stripHost.innerHTML = "";
    stripHost.appendChild(stripEl(value, width, lo, hi));
    hexV.textContent = hex32(value);
    mskV.textContent = hex32(mask);
    gen.textContent = code;
    cmp.innerHTML = "欄位在 bit <b style='color:var(--ch2)'>" + hi + ":" + lo + "</b>"
      + (r.w === 2 && !r.bsrr ? "，位移量是 <code style='color:var(--ch1)'>" + pin
         + " × 2 = " + lo + "</code>。" : "。")
      + " 專案裡對應的那一行在 <b style='color:var(--ch2)'>" + r.real + "</b>：<br>"
      + "<code style='color:#DCE5DF'>" + r.realLine + "</code>";
  }
  function apply(){
    const r = REGS[regName];
    if (r.bsrr){
      /* BSRR 是唯寫的：寫下去之後暫存器本身不保存，所以這裡只示意一次寫入 */
      value = (choice === 0 ? (1 << pin) : (1 << (pin + 16))) >>> 0;
    } else if (r.w === 2){
      value = ((value & ~(3 << (pin * 2))) | (choice << (pin * 2))) >>> 0;
    } else {
      value = (choice ? (value | (1 << pin)) : (value & ~(1 << pin))) >>> 0;
    }
    render();
  }
  selReg.onchange = () => { regName = selReg.value; value = 0; fillVals(); render(); };
  selPin.onchange = () => { pin = selPin.selectedIndex; render(); };
  selVal.onchange = () => { choice = selVal.selectedIndex; render(); };
  bApply.onclick = apply;
  bReset.onclick = () => { value = 0; render(); };

  fillVals(); render(); apply();
  host.appendChild(p.wrap);
}

/* ------------------------------------------------------------------
   2. LED 模擬 — 為什麼不能用 =
   ------------------------------------------------------------------ */
function makeLedSim(host){
  const p = panel("LED 模擬 · 用 = 會發生什麼",
    "示意電路：LED1 接 PF10、LED2 接 PF9，active high");
  let odr = (1 << 9) >>> 0;              /* LED2 一開始是亮的 */

  const ctl = el("div","row");
  const selReg = el("select");
  ["ODR","BSRR","MODER","IDR"].forEach(k => selReg.appendChild(el("option",null,k)));
  const selOp = el("select");
  ["=","|=","&= ~"].forEach(k => selOp.appendChild(el("option",null,k)));
  selOp.selectedIndex = 1;
  const inShift = el("input"); inShift.type = "number"; inShift.value = "10";
  inShift.min = "0"; inShift.max = "31"; inShift.style.width = "76px";
  const d1 = el("div"); d1.appendChild(el("label",null,"暫存器")); d1.appendChild(selReg);
  const d2 = el("div"); d2.appendChild(el("label",null,"運算子")); d2.appendChild(selOp);
  const d3 = el("div"); d3.appendChild(el("label",null,"1UL << ?")); d3.appendChild(inShift);
  const bRun = el("button","btn amber","執行這一行");
  const bRst = el("button","btn","重設（LED2 亮）");
  ctl.append(d1,d2,d3,bRun,bRst);
  p.body.appendChild(ctl);

  const line = el("div","gencode"); p.body.appendChild(line);
  const leds = el("div","ledwrap");
  const l1 = el("div","led"); const b1 = el("div","bulb"); l1.append(b1, el("div",null,"LED1<br>PF10"));
  const l2 = el("div","led"); const b2 = el("div","bulb g"); l2.append(b2, el("div",null,"LED2<br>PF9"));
  const odrBox = el("div"); odrBox.appendChild(el("label",null,"GPIOF->ODR"));
  const odrV = el("div","hexout"); odrBox.appendChild(odrV);
  leds.append(l1,l2,odrBox);
  p.body.appendChild(leds);
  const msg = el("div","instnote"); p.body.appendChild(msg);

  function draw(){
    const shift = Math.max(0, Math.min(31, parseInt(inShift.value,10) || 0));
    line.textContent = "GPIOF->" + selReg.value + " " + selOp.value
      + (selOp.value === "&= ~" ? "(1UL << " + shift + ");" : " (1UL << " + shift + ");");
    b1.classList.toggle("on", !!((odr >>> 10) & 1));
    b2.classList.toggle("on", !!((odr >>> 9) & 1));
    odrV.textContent = hex32(odr);
  }
  function run(){
    const shift = Math.max(0, Math.min(31, parseInt(inShift.value,10) || 0));
    const bit = (1 << shift) >>> 0;
    const reg = selReg.value, op = selOp.value;
    const before = odr;
    let note = "";

    if (reg === "IDR"){
      note = "<b style='color:var(--copper)'>IDR 是唯讀的。</b>寫它不會有任何效果——輸入資料暫存器反映腳位上的電位，不是你能設定的。";
    } else if (reg === "MODER"){
      note = "<b style='color:var(--copper)'>MODER 決定腳位的方向，不是電位。</b>燈不會因為這一行亮起來。它只會決定這支腳能不能輸出。";
    } else if (reg === "BSRR"){
      if (shift < 16){ odr = (odr | (1 << shift)) >>> 0;
        note = "BSRR 低 16 位 → 把 pin " + shift + " 設高。<b style='color:var(--ok)'>其他腳位完全沒被動到。</b>單次寫入，不需要讀改寫。"; }
      else { odr = (odr & ~(1 << (shift - 16))) >>> 0;
        note = "BSRR 高 16 位 → 把 pin " + (shift-16) + " 設低。同樣是單次寫入。"; }
      if (op !== "=") note += "<br><span style='color:var(--copper)'>注意：BSRR 是唯寫的，用 <code>|=</code> 要先讀它，讀回來的值沒有意義。實務上一律用 <code>=</code>。</span>";
    } else { /* ODR */
      if (op === "="){
        odr = bit;
        note = "<b style='color:var(--copper)'>這就是那個坑。</b>LED1 亮了，但 LED2 熄了——<code>=</code> 把整個 ODR 換成只有 bit " + shift
             + " 的值，其他十五支腳全部被清成 0。在真機上，被清掉的那些腳可能正在驅動 LCD。";
      } else if (op === "|="){
        odr = (odr | bit) >>> 0;
        note = "<b style='color:var(--ok)'>正確。</b><code>|=</code> 只把 bit " + shift + " 設成 1，其他位元原樣保留，所以 LED2 還亮著。";
      } else {
        odr = (odr & ~bit) >>> 0;
        note = "<code>&amp;= ~</code> 只把 bit " + shift + " 清成 0，其他位元不動。";
      }
    }
    draw();
    msg.innerHTML = note + "<br><span style='color:var(--mute)'>ODR " + hex32(before)
      + " → " + hex32(odr) + "</span>";
  }
  bRun.onclick = run;
  bRst.onclick = () => { odr = (1 << 9) >>> 0; draw();
    msg.innerHTML = "已重設。LED2 亮著——它代表「別人正在用的腳位」。試著用 <code>=</code> 點亮 LED1，看 LED2 會怎麼樣。"; };
  selReg.onchange = draw; selOp.onchange = draw; inShift.oninput = draw;
  draw();
  msg.innerHTML = "LED2 亮著——它代表「別人正在用的腳位」。先用 <code>|=</code> 點亮 LED1，再換成 <code>=</code> 試一次。";
  host.appendChild(p.wrap);
}

/* ------------------------------------------------------------------
   3. 搖桿模擬 — 遲滯的兩個門檻
   ------------------------------------------------------------------ */
function makeJoySim(host){
  const p = panel("搖桿模擬 · 遲滯",
    "示意：12 位元 ADC，無雜訊。真機讀數會有數個計數的抖動");
  let centre = 2013, raw = 2013, on = 700, off = 450, was = 0, noise = 0;

  const ctl = el("div","row");
  const sRaw = el("input"); sRaw.type="range"; sRaw.min="0"; sRaw.max="4095"; sRaw.value="2013";
  const dRaw = el("div"); dRaw.style.flex="1 1 260px";
  dRaw.appendChild(el("label",null,"搖桿 Y 軸位置（拖動）")); dRaw.appendChild(sRaw);
  const bCal = el("button","btn","量中心 CENTRE");
  const bNoise = el("button","btn","加入雜訊 ±12");
  ctl.append(dRaw, bCal, bNoise);
  p.body.appendChild(ctl);

  const g = el("div","row"); p.body.appendChild(g);
  const dOn = el("div"); dOn.style.flex="1 1 200px";
  dOn.appendChild(el("label",null,"JOY_ON  進入門檻"));
  const sOn = el("input"); sOn.type="range"; sOn.min="100"; sOn.max="1500"; sOn.value="700";
  dOn.appendChild(sOn);
  const dOff = el("div"); dOff.style.flex="1 1 200px";
  dOff.appendChild(el("label",null,"JOY_OFF 離開門檻"));
  const sOff = el("input"); sOff.type="range"; sOff.min="50"; sOff.max="1500"; sOff.value="450";
  dOff.appendChild(sOff);
  g.append(dOn,dOff);

  const meter = el("div","meter");
  const fill = el("i"); const dz = el("div","dz"); const ctr = el("div","ctr");
  meter.append(fill,dz,ctr);
  p.body.appendChild(meter);

  const readout = el("div","row"); readout.style.marginTop="12px";
  const numBox = el("div"); numBox.style.flex="1 1 200px";
  numBox.appendChild(el("label",null,"ADC 讀數 / 偏移 / 電壓"));
  const numV = el("div","calcout"); numBox.appendChild(numV);
  const padBox = el("div");
  padBox.appendChild(el("label",null,"axis_bits() 輸出"));
  const pad = el("div","dirpad");
  const cells = {};
  [["",""],["u","↑"],["",""],["l","←"],["c","·"],["r","→"],["",""],["d","↓"],["",""]]
    .forEach(([k,t]) => { const s = el("span",null,t); pad.appendChild(s); if (k) cells[k]=s; });
  padBox.appendChild(pad);
  readout.append(numBox, padBox);
  p.body.appendChild(readout);
  const note = el("div","instnote"); p.body.appendChild(note);

  let noiseTimer = null;
  function axisBits(d, wasBits){
    let out = 0;
    if ((wasBits & 1) && d > off) out |= 1; else if (d > on) out |= 1;      /* UP  */
    if ((wasBits & 2) && d < -off) out |= 2; else if (d < -on) out |= 2;    /* DOWN */
    return out;
  }
  function draw(){
    const shown = Math.max(0, Math.min(4095, raw + noise));
    const d = shown - centre;
    was = axisBits(d, was);
    fill.style.width = (shown / 4095 * 100) + "%";
    ctr.style.left = (centre / 4095 * 100) + "%";
    const lo = Math.max(0, centre - on), hi = Math.min(4095, centre + on);
    dz.style.left = (lo / 4095 * 100) + "%";
    dz.style.width = ((hi - lo) / 4095 * 100) + "%";
    numV.innerHTML = "raw " + shown + "　偏移 " + (d > 0 ? "+" : "") + d
      + "<br>" + (shown * 3.3 / 4095).toFixed(3) + " V　中心 " + centre;
    cells.u.classList.toggle("lit", !!(was & 1));
    cells.d.classList.toggle("lit", !!(was & 2));
    cells.c.classList.toggle("lit", was === 0);
    cells.l.classList.remove("lit"); cells.r.classList.remove("lit");
    let t;
    if (off >= on) t = "<b style='color:var(--copper)'>JOY_OFF 已經不小於 JOY_ON，遲滯消失。</b>把搖桿停在門檻附近再按「加入雜訊」，方向燈就會開始抖——這正是專案用兩個門檻的理由。";
    else if (was && Math.abs(d) <= on) t = "<b style='color:var(--ok)'>正在遲滯區裡。</b>偏移已經小於 JOY_ON（" + on + "），但還沒回到 JOY_OFF（" + off + "）以內，所以方向仍然成立。這就是 <code>axis_bits()</code> 裡 <code>was &amp; posBit</code> 那個判斷在做的事。";
    else t = "橘色區域是「還沒推到」的範圍，寬度由 JOY_ON 決定。推出去之後要回到更窄的 JOY_OFF 以內才會放掉。";
    note.innerHTML = t;
  }
  sRaw.oninput = () => { raw = +sRaw.value; draw(); };
  sOn.oninput = () => { on = +sOn.value; dOn.firstChild.textContent = "JOY_ON  進入門檻 = " + on; draw(); };
  sOff.oninput = () => { off = +sOff.value; dOff.firstChild.textContent = "JOY_OFF 離開門檻 = " + off; draw(); };
  bCal.onclick = () => { centre = Math.max(0, Math.min(4095, raw + noise)); was = 0; draw(); };
  bNoise.onclick = () => {
    if (noiseTimer){ clearInterval(noiseTimer); noiseTimer = null; noise = 0;
      bNoise.classList.remove("on"); bNoise.textContent = "加入雜訊 ±12"; draw(); return; }
    bNoise.classList.add("on"); bNoise.textContent = "停止雜訊";
    noiseTimer = setInterval(() => { noise = Math.round((Math.random()-0.5) * 24); draw(); }, 90);
  };
  sOn.oninput(); sOff.oninput(); draw();
  host.appendChild(p.wrap);
}

const NOTES = [["C4",262],["D4",294],["E4",330],["F4",349],["G4",392],["A4",440],
  ["B4",494],["C5",523],["D5",587],["E5",659],["G5",784],["C6",1047],["E6",1319],["G6",1568]];

function makePwmCalc(host){
