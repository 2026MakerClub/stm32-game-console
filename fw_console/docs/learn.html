    const psc = Math.max(0, Math.min(65535, parseInt(inPsc.value,10) || 0));
    const arr = Math.max(0, Math.min(65535, parseInt(inArr.value,10) || 0));
    const f = clk / ((psc + 1) * (arr + 1));
    fV.textContent = f.toFixed(2) + " Hz";
    let best = NOTES[0], bd = 1e9;
    NOTES.forEach(n => { const d = Math.abs(1200 * Math.log2(f / n[1])); if (d < bd){ bd = d; best = n; } });
    nV.innerHTML = best[0] + "（" + best[1] + " Hz）<br>誤差 " + bd.toFixed(0) + " 音分";
    arrStrip.innerHTML = "";
    arrStrip.appendChild(stripEl(arr, 16));
    note.innerHTML = "公式是 <code style='color:var(--ch1)'>f = 時脈 / ((PSC+1) × (ARR+1))</code>。"
      + (bd > 50 ? "誤差超過 50 音分，人耳會覺得走音。" : "誤差在 50 音分以內，聽起來是對的音。")
      + (clk !== 84000000 ? " <b style='color:var(--copper)'>時脈選錯會讓整台機器的音高整體偏移——這是 timer_clock() 少乘 2 時真實發生的事。</b>" : "");
  }
  function doSolve(){
    const freq = +selNote.value;
    const total = Math.floor(clk / freq);
    let psc = Math.floor((total + 65535) / 65536); if (psc === 0) psc = 1;
    let arr = Math.floor(total / psc); if (arr === 0) arr = 1;
    if (arr > 65536) arr = 65536;
    const actual = clk / (psc * arr);
    steps.textContent =
      "total = " + clk + " / " + freq + " = " + total + "\n" +
      "psc   = (" + total + " + 65535) / 65536 = " + psc + "\n" +
      "arr   = " + total + " / " + psc + " = " + arr + "\n" +
      "\nTIM3->PSC  = " + (psc - 1) + "\n" +
      "TIM3->ARR  = " + (arr - 1) + "\n" +
      "TIM3->CCR1 = " + Math.floor(arr / 2) + "        /* 50% 工作週期 */\n" +
      "\n實際頻率 = " + actual.toFixed(2) + " Hz";
    inPsc.value = psc - 1; inArr.value = arr - 1;
    draw();
  }
  inClk.onchange = draw; inPsc.oninput = draw; inArr.oninput = draw;
  bSolve.onclick = doSolve;
  doSolve();
  host.appendChild(p.wrap);
}

const DINO_W = 31, DINO_H = 34, DINO_STRIDE = 4;
const DINO_BITS = [0,0,0,0,0,0,127,240,0,0,255,240,0,1,255,252,0,1,223,252,0,1,255,252,
0,1,255,252,0,1,255,252,0,1,255,252,0,1,255,248,0,1,254,0,0,1,255,224,96,3,253,128,
96,7,248,0,96,15,248,0,112,63,255,0,120,127,255,0,124,255,251,0,127,255,248,0,
127,255,248,0,127,255,248,0,63,255,248,0,31,255,240,0,15,255,240,0,7,255,192,0,
3,255,128,0,1,255,128,0,0,249,224,0,0,224,0,0,0,224,0,0,0,192,0,0,0,224,0,0,0,224,0,0,0,0,0,0];

function makeLcdSim(host){
  const p = panel("LCD 畫布 · 三種畫法的成本",
    "示意：時間是用「每次寫入約 60 ns」估算的相對值，不是量測結果");
  const SC = 2;
  const cv = el("canvas"); cv.width = 320 * SC; cv.height = 240 * SC;
  cv.style.width = "100%"; cv.style.maxWidth = "560px";
  const ctx = cv.getContext("2d");

  const ctl = el("div","row");
  const b1 = el("button","btn","逐像素畫恐龍");
  const b2 = el("button","btn","畫矩形（開視窗）");
  const b3 = el("button","btn amber","組圖再送出（專案做法）");
  const b0 = el("button","btn","清空");
  ctl.append(b1,b2,b3,b0);
  p.body.appendChild(ctl);
  p.body.appendChild(cv);
  const stat = el("div","calcout"); stat.style.marginTop="12px"; p.body.appendChild(stat);
  const note = el("div","instnote"); p.body.appendChild(note);

  function clear(){
    ctx.fillStyle = "#F7F7F5"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = "#528A"; ctx.fillStyle = "#535353";
    ctx.fillRect(0, 196*SC, 320*SC, 2*SC);
    stat.innerHTML = "&nbsp;";
  }
  function px(x,y,c){ ctx.fillStyle = c; ctx.fillRect(x*SC, y*SC, SC, SC); }
  function bit(x,y){ return (DINO_BITS[y*DINO_STRIDE + (x>>3)] & (0x80 >> (x&7))) ? 1 : 0; }

  function report(addr, data, label){
    const ns = (addr * 3 + data) * 60;
    stat.innerHTML = label + "<br>位址設定 <b style='color:var(--ch1)'>" + addr
      + "</b> 次　資料寫入 <b style='color:var(--ch1)'>" + data
      + "</b> 次　估計 <b style='color:var(--ch2)'>" + (ns/1000).toFixed(1) + " µs</b>";
  }
  b1.onclick = () => { clear();
    let n = 0;
    for (let y=0;y<DINO_H;y++) for (let x=0;x<DINO_W;x++)
      if (bit(x,y)){ px(30+x, 162+y, "#535353"); n++; }
    report(n, n, "逐像素：每一點都要先設行位址、再設列位址，才能寫一個顏色。");
    note.innerHTML = "這是最直覺也最慢的做法。每個像素付三次位址設定的代價，"
      + "而且恐龍身上的每一點都要單獨處理。";
  };
  b2.onclick = () => { clear();
    ctx.fillStyle = "#535353";
    ctx.fillRect(30*SC, 162*SC, DINO_W*SC, DINO_H*SC);
    report(1, DINO_W*DINO_H, "矩形：開一個視窗，然後連續寫 " + (DINO_W*DINO_H) + " 個顏色。");
    note.innerHTML = "位址只設一次，ILI9341 自己會換行，所以快得多——但你只能畫實心方塊。"
      + "本專案的 <code>LCD_FillRect()</code> 走的是這條路。";
  };
  b3.onclick = () => { clear();
    /* 在「RAM」裡組好整塊，再一次畫出來 */
    const W = DINO_W + 8, H = DINO_H;          /* 多 8 像素當橡皮擦 */
    const img = ctx.createImageData(W*SC, H*SC);
    for (let y=0;y<H*SC;y++) for (let x=0;x<W*SC;x++){
      const sx = (x/SC)|0, sy = (y/SC)|0;
      const on = sx < DINO_W && bit(sx, sy);
      const i = (y*W*SC + x)*4;
      img.data[i]   = on ? 0x53 : 0xF7;
      img.data[i+1] = on ? 0x53 : 0xF7;
      img.data[i+2] = on ? 0x53 : 0xF5;
      img.data[i+3] = 255;
    }
    ctx.putImageData(img, 30*SC, 162*SC);
    report(1, W*H, "組圖再送出：先在 RAM 填好 " + W + "×" + H
      + " 的區塊（含背景），再開一次視窗一口氣送出。");
    note.innerHTML = "寫入次數和矩形差不多，但畫出來的是有形狀的圖，"
      + "而且區塊比 sprite 寬 8 像素——多出來的背景色順手把上一幀的殘影擦掉。"
      + "面板上的像素從舊值直接跳到新值，中間沒有空白，所以<b style='color:var(--ok)'>不會閃爍</b>。"
      + "這就是 <code>Gfx_BandBegin/BandSprite/BandEnd</code> 在做的事。";
  };
  b0.onclick = () => { clear(); note.innerHTML = "按上面三顆按鈕比較同一張圖的三種畫法。"; };
  clear();
  note.innerHTML = "按上面三顆按鈕比較同一張圖的三種畫法。恐龍的點陣資料就是專案裡的 "
    + "<code>dino_run1_bits[]</code>，31×34、136 位元組。";
  host.appendChild(p.wrap);
}

      box.appendChild(opts);
      const b = el("button","btn","送出");
      b.style.background = "var(--ink)"; b.style.color = "var(--paper)";
      b.style.borderColor = "var(--ink)";
      b.onclick = () => {
        const sel = box.querySelector(`input[name="${e.id}"]:checked`);
        if (!sel){ fb.hidden = false; fb.className = "fb no";
          fb.innerHTML = "<b>先選一個</b>"; return; }
        const ok = (+sel.value === e.ans);
        opts.querySelectorAll(".opt").forEach((l, li) => {
          l.classList.remove("right","wrong");
          if (li === e.ans) l.classList.add("right");
          else if (li === +sel.value) l.classList.add("wrong");
        });
        fb.hidden = false;
        fb.className = "fb " + (ok ? "ok" : "no");
        fb.innerHTML = "<b>" + (ok ? "答對了" : "再想一次") + "</b>" + e.fb;
        SAVE.ex[e.id] = ok; save();
        box.dataset.state = ok ? "ok" : "no";
        refreshProgress();
      };
      box.appendChild(b);
    } else {
      const ta = e.type === "code" ? el("textarea","exin") : el("input","exin");
      if (e.type !== "code") ta.type = "text";
      ta.id = e.id + "-in";
      ta.placeholder = e.ph || "";
      box.appendChild(ta);
      const row = el("div","row"); row.style.marginTop = "10px";
      const b = el("button","btn","批改");
      b.style.background = "var(--ink)"; b.style.color = "var(--paper)";
      b.style.borderColor = "var(--ink)";
      const bs = el("button","btn","看答案");
      bs.style.background = "var(--raise)"; bs.style.color = "var(--ink)";
      bs.style.borderColor = "var(--line)";
      row.append(b, bs);
      box.appendChild(row);

      b.onclick = () => {
        const t = (ta.value || "").replace(/\s+/g," ").trim();
        if (!t){ fb.hidden = false; fb.className = "fb no";
          fb.innerHTML = "<b>還沒寫東西</b>"; return; }
        const hay = [t, t.toUpperCase(), t.toLowerCase()];
        let missing = null;
        for (const [re, hint] of e.need){
          if (!hay.some(x => re.test(x))){ missing = hint; break; }
        }
        const ok = !missing;
        fb.hidden = false;
        fb.className = "fb " + (ok ? "ok" : "no");
        fb.innerHTML = ok
          ? "<b>過了</b>" + e.fb
          : "<b>還差一點</b>" + missing;
        SAVE.ex[e.id] = ok; save();
        box.dataset.state = ok ? "ok" : "no";
        refreshProgress();
      };
      bs.onclick = () => {
        fb.hidden = false; fb.className = "fb";
        fb.innerHTML = "<b>參考答案</b><pre style=\"margin:.4em 0 0\">"
          + e.ans + "</pre><div style=\"margin-top:.6em\">" + e.fb + "</div>";
      };
    }
    box.appendChild(fb);
    host.appendChild(box);
  });
  const hint = el("p","hint",
    "批改是用關鍵字比對，寫法不同但意思對的答案可能被判不過——按「看答案」自己核對。作答紀錄存在這個瀏覽器裡。");
  host.appendChild(hint);
}

/* ---------------- 腳位圖 ---------------- */
function renderPins(sel){
  const h = document.getElementById("v-pins");
  h.innerHTML = `
  <div class="col">
    <div class="eyebrow">腳位圖</div>
    <h2>這塊板子的腳位預算</h2>
    <p class="lede">資料以 <code>PINMAP.md</code> 和驅動原始碼為準。點任何一支腳看它屬於誰、由哪一行設定。
    亮橘色是這個專案自己加的，青色是螢幕，褐色是觸控——那兩組一支都不能碰。</p>
  </div>
  <div class="legend">
    <span><i style="background:color-mix(in srgb,var(--ch1) 20%,var(--paper))"></i>本專案新增</span>
    <span><i style="background:color-mix(in srgb,var(--ch2) 14%,var(--paper))"></i>LCD（FSMC）</span>
    <span><i style="background:color-mix(in srgb,var(--copper) 13%,var(--paper))"></i>觸控（SPI）</span>
  </div>
  <div class="pingrid" id="pinGrid"></div>
  <div class="col" id="pinDetail" style="margin-top:22px"></div>`;

  const grid = h.querySelector("#pinGrid");
  const detail = h.querySelector("#pinDetail");
  function show(pin){
    const d = PINS.find(x => x.p === pin);
    grid.querySelectorAll(".pin").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.p === pin ? "true" : "false"));
    if (!d){ detail.innerHTML = ""; return; }
    const grp = d.g === "ours" ? "本專案新增" : d.g === "lcd" ? "LCD（FSMC）" : "觸控（SPI）";
    detail.innerHTML = `<div class="land">
      <h4>${d.p} · ${grp}</h4>
      <p style="margin:.3em 0 .5em;font-size:16px"><strong>${d.w}</strong></p>
      <p style="margin:0 0 .6em;color:var(--ink2)">${d.note}</p>
      <p style="margin:0">設定的位置：<a href="code.html#${d.src.split("/").pop().split(":")[0].replace(/\W/g,"")}">${d.src}</a>
      　·　<a href="code.html">到程式導覽 →</a></p></div>`;
  }
  PINS.forEach(d => {
    const b = el("button","pin " + d.g);
    b.dataset.p = d.p;
    b.setAttribute("aria-pressed","false");
    b.innerHTML = `<b>${d.p}</b><em>${d.g === "ours" ? "專案" : d.g === "lcd" ? "LCD" : "觸控"}</em>`;
    b.onclick = () => show(d.p);
    grid.appendChild(b);
  });
  show(sel || "PA6");
}

/* ---------------- 詞彙表 ---------------- */
function renderGlossary(focus){
  const h = document.getElementById("v-glossary");
  h.innerHTML = `<div class="col">
    <div class="eyebrow">詞彙表</div>
    <h2>${GLOSSARY.length} 個名詞</h2>
    <p class="lede">教學裡第一次出現時會標成虛線底線，點它就會跳到這裡。</p>
    <div id="glList"></div></div>`;
  const list = h.querySelector("#glList");
  GLOSSARY.forEach(g => {
    const d = el("div","gl");
    d.id = "gl-" + encodeURIComponent(g[0]);
    d.innerHTML = `<h4>${g[0]}<span>${g[1]}</span></h4><p>${g[2]}</p>`;
    if (focus === g[0]){
      d.style.background = "color-mix(in srgb,var(--ch1) 14%,var(--paper))";
      d.style.borderRadius = "8px"; d.style.padding = "14px 12px";
    }
    list.appendChild(d);
  });
  if (focus){
    const t = list.querySelector("#gl-" + encodeURIComponent(focus));
    if (t) setTimeout(() => t.scrollIntoView({block:"center", behavior:"smooth"}), 40);
  }
}

/* ---------------- 我的進度 ---------------- */
function renderProgress(){
  const h = document.getElementById("v-progress");
  const ex = allEx();
  const tried = ex.filter(e => SAVE.ex[e.id] !== undefined).length;
  const passed = ex.filter(e => SAVE.ex[e.id] === true).length;
  const stDone = STATIONS.filter(stationDone).length;
  const hunts = [0,1].filter(i => SAVE.ex["hunt"+i] === true).length;

  h.innerHTML = `<div class="col">
    <div class="eyebrow">我的進度</div>
    <h2>${stDone} / ${STATIONS.length} 站完成</h2>
    <div class="pbar"><i style="width:${stDone/STATIONS.length*100}%"></i></div>
    <p class="lede" style="margin-top:1.2em">練習答對 ${passed} 題，作答過 ${tried} 題，共 ${ex.length} 題。
    手冊尋寶 ${hunts} / 2 題。紀錄存在這個瀏覽器，換裝置或清掉網站資料就會消失。</p>
    <div style="overflow-x:auto"><table class="ptable" id="pTable"></table></div>
    <div class="row" style="margin-top:22px">
      <button class="btn" id="pReset" style="background:var(--raise);color:var(--ink);border-color:var(--line)">清除所有紀錄</button>
    </div>
  </div>`;

  const t = h.querySelector("#pTable");
  t.innerHTML = `<thead><tr><th>站</th><th>主題</th><th>練習</th><th>狀態</th></tr></thead>`;
  const tb = el("tbody");
  STATIONS.forEach((s, i) => {
    const se = s.ex || [];
    const sp = se.filter(e => SAVE.ex[e.id] === true).length;
    const tr = el("tr");
    tr.innerHTML = `<td class="n">${String(s.n).padStart(2,"0")}</td>
      <td><a href="#s${s.n}" style="text-decoration-color:var(--ch2)">${s.title}</a></td>
      <td class="n">${sp} / ${se.length}</td>
      <td><span class="chip${stationDone(s) ? " done" : ""}">${stationDone(s) ? "完成" : "未完成"}</span></td>`;
    tr.querySelector("a").onclick = ev => { ev.preventDefault(); go("station", i); };
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  h.querySelector("#pReset").onclick = () => {
    SAVE = {done:{}, ex:{}}; save(); renderMap(); renderProgress();
  };
}
function refreshProgress(){ renderMap(); if (!document.getElementById("v-progress").hidden) renderProgress(); }

/* ---------------- 切換與路由 ---------------- */
function go(view, arg){
  if (view === "code"){ location.href = "code.html"; return; }
  Object.keys(V).forEach(k => document.getElementById(V[k]).hidden = (k !== view));
  document.querySelectorAll("#nav button").forEach(b => {
    const on = (b.dataset.view === view) ||
               (view === "station" && b.dataset.view === "map");
    if (on) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if (view === "map") renderMap();
  if (view === "station") renderStation(arg || 0);
  if (view === "pins") renderPins(typeof arg === "string" ? arg : null);
  if (view === "glossary") renderGlossary(typeof arg === "string" ? arg : null);
  if (view === "progress") renderProgress();
  try {
    const tok = view === "station" ? ("s" + STATIONS[arg||0].n) : view;
    if (location.hash.slice(1) !== tok) history.replaceState(null,"","#"+tok);
  } catch(e){}
  window.scrollTo({top:0});
}
document.querySelectorAll("#nav button").forEach(b =>
  b.onclick = () => go(b.dataset.view));

/* ---------------- 主題 ---------------- */
const tBtn = document.getElementById("themeBtn");
function themeLabel(){
  const cur = document.documentElement.getAttribute("data-theme");
  tBtn.textContent = cur === "dark" ? "淺色" : "深色";
}
tBtn.onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("fwconsole.theme", dark ? "light" : "dark"); } catch(e){}
  themeLabel();
};
try {
  const th = localStorage.getItem("fwconsole.theme");
  if (th) document.documentElement.setAttribute("data-theme", th);
} catch(e){}
themeLabel();

/* ---------------- 啟動 ---------------- */
(function boot(){
  const tok = (location.hash || "").slice(1);
  const m = /^s(\d{1,2})$/.exec(tok);
  if (m){
    const idx = STATIONS.findIndex(s => s.n === +m[1]);
    if (idx >= 0){ go("station", idx); return; }
  }
  if (V[tok]) { go(tok); return; }
  go("map");
})();
</script>
