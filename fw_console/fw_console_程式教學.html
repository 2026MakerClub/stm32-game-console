<title>掌機韌體怎麼寫的</title>
<script>
/* ====================================================================
   想更深入的連結都放在這裡。把你那個 STM32 硬體教學站的網址填進來，
   頁面上對應的「想更深入」就會從灰色佔位變成可以點的連結。
   留空的項目不會變成死連結，只會顯示成「（待填）」。
   ==================================================================== */
const HW_SITE = {
  base:    "",   /* 網站首頁，目前沒有用到，留著備用 */
  gpio:    "",   /* GPIO 模式、上拉下拉、active low        → 第 4、11 章 */
  adc:     "",   /* ADC 取樣、解析度、通道設定              → 第 11 章   */
  tim:     "",   /* 計時器、PWM、PSC 與 ARR                → 第 6、11 章 */
  fsmc:    "",   /* FSMC 並列匯流排與 ILI9341              → 第 11 章   */
  systick: ""    /* SysTick 與中斷                         → 第 7、11 章 */
};
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F5F3; --bg2:#E9ECE8; --card:#FFFFFF;
  --tx:#141A17; --tx2:#44514A; --dim:#6E7C74; --ln:#D3D9D3;
  --ide:#12171A; --ide2:#1A2127; --idel:#242E35; --ideg:#5A6B76;
  --grn:#7FD98C; --grn2:#E7F8E9;
  --amb:#D98E1F; --cy:#1E9BA8; --red:#C0452B; --ok:#2C7A52;
  --sh:0 1px 2px rgba(20,26,23,.05),0 10px 28px rgba(20,26,23,.06);
  --sf:"Noto Serif TC",Georgia,serif;
  --ss:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --sm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1311; --bg2:#151B18; --card:#141A17;
  --tx:#E5EAE6; --tx2:#AEBBB3; --dim:#7E8C84; --ln:#252E29;
  --grn2:#17291B; --amb:#E8A93C; --cy:#3FC4D0; --red:#E06A4E; --ok:#4EBE81;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.32);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --bg2:#151B18; --card:#141A17;
  --tx:#E5EAE6; --tx2:#AEBBB3; --dim:#7E8C84; --ln:#252E29;
  --grn2:#17291B; --amb:#E8A93C; --cy:#3FC4D0; --red:#E06A4E; --ok:#4EBE81;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:var(--ss);font-size:16px;
  line-height:1.85;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--sf);font-weight:700;line-height:1.35;
  text-wrap:balance;margin:0}
code,pre{font-family:var(--sm)}
a{color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px;border-radius:3px}

/* ---------- top ---------- */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.barin{max-width:1500px;margin:0 auto;padding:9px 16px;display:flex;
  align-items:center;gap:12px}
.brand{font-family:var(--sf);font-weight:700;font-size:14.5px;white-space:nowrap}
.brand b{color:var(--amb)}
#chapnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
#chapnav::-webkit-scrollbar{display:none}
#chapnav button{font:inherit;font-size:12.5px;font-weight:500;color:var(--dim);
  background:none;border:0;padding:6px 9px;border-radius:6px;cursor:pointer;
  white-space:nowrap;font-family:var(--sm)}
#chapnav button:hover{background:var(--bg2);color:var(--tx)}
#chapnav button[aria-current="page"]{background:var(--tx);color:var(--bg)}
.tbtn{font:inherit;font-size:12px;background:none;border:1px solid var(--ln);
  color:var(--dim);padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}

main{max-width:1500px;margin:0 auto;padding-block:26px 90px;padding-inline:16px}
.col{max-width:70ch}
.lede{font-size:17px;color:var(--tx2)}
.eyebrow{font-family:var(--sm);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-bottom:9px}
p{margin:0 0 1em}
h2{font-size:27px;margin:0 0 .45em}
h3{font-size:19px;margin:2.3em 0 .6em}
h4{font-size:15.5px;font-family:var(--ss);font-weight:700;margin:1.7em 0 .4em}
ul,ol{margin:0 0 1em;padding-left:1.4em}
li{margin:.28em 0}

.problem{background:var(--card);border:1px solid var(--ln);
  border-left:3px solid var(--amb);border-radius:0 10px 10px 0;
  padding:15px 17px;margin:0 0 1.5em}
.problem h4{margin:0 0 .3em;font-family:var(--sm);font-size:11.5px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--amb)}
.problem p:last-child{margin-bottom:0}
.note{background:var(--bg2);border-radius:10px;padding:13px 15px;margin:1.3em 0;
  font-size:14.5px;color:var(--tx2)}
.note b{color:var(--tx)}
.warn{border:1px dashed color-mix(in srgb,var(--red) 50%,var(--ln));
  background:color-mix(in srgb,var(--red) 6%,var(--bg));border-radius:10px;
  padding:13px 15px;margin:1.3em 0;font-size:14.5px}
.warn h4{margin:0 0 .3em;font-size:14px;color:var(--red)}
.warn p:last-child,.warn ul:last-child{margin-bottom:0}

/* jump chip */
.jump{font-family:var(--sm);font-size:12px;background:var(--ide);color:#CFE0D6;
  border:0;border-radius:5px;padding:2px 7px;cursor:pointer;white-space:nowrap;
  transition:background .15s}
.jump:hover{background:var(--cy);color:#04231F}
.jump::before{content:"→ "}
:not(pre)>code{background:var(--bg2);border-radius:4px;padding:1px 5px;font-size:.9em}
.deep{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;
  font-family:var(--sm);color:var(--cy);border:1px solid color-mix(in srgb,var(--cy) 40%,var(--ln));
  border-radius:20px;padding:2px 10px;text-decoration:none;white-space:nowrap}
.deep.off{color:var(--dim);border-color:var(--ln);cursor:default}
.deep::before{content:"↗"}

/* ---------- workbench ---------- */
.wb{background:var(--card);border:1px solid var(--ln);border-radius:14px;
  box-shadow:var(--sh);overflow:hidden;margin:1.8em 0 2em}
.wbhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--bg2)}
.wbhead h4{font-family:var(--sm);font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin:0;font-weight:500}
.wbhead .hint{font-size:12px;color:var(--dim);margin-left:auto}
.split{display:flex;height:640px;min-height:320px}
@media (max-width:900px){.split{flex-direction:column;height:auto}}

/* code pane */
.cpane{flex:0 0 52%;min-width:0;display:flex;flex-direction:column;background:var(--ide)}
@media (max-width:900px){.cpane{flex:none;height:430px}}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--ide2);
  border-bottom:1px solid var(--idel);flex:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-family:var(--sm);font-size:11.5px;color:var(--ideg);
  background:none;border:0;border-right:1px solid var(--idel);padding:7px 11px;
  cursor:pointer;white-space:nowrap}
.tabs button:hover{color:#CFE0D6}
.tabs button.cur{background:var(--ide);color:#CFE0D6;
  box-shadow:inset 0 2px 0 var(--grn)}
.codewrap{flex:1;overflow:auto;position:relative}
.codewrap pre{margin:0;font-size:12.5px;line-height:1.62;color:#C8D6CD;
  tab-size:4;min-width:max-content}
.cl{display:flex;min-height:1.62em}
.cl>i{flex:none;width:52px;text-align:right;padding-right:12px;color:var(--ideg);
  font-style:normal;user-select:none;position:sticky;left:0;background:var(--ide);
  border-right:1px solid var(--idel);margin-right:12px;font-size:11.5px}
.cl>span{white-space:pre;padding-right:22px}
.cl.marked{background:rgba(127,217,140,.14)}
.cl.marked>i{background:rgba(127,217,140,.14);color:var(--grn)}
@keyframes fl{0%,100%{background:rgba(127,217,140,.14)}50%{background:rgba(127,217,140,.42)}}
.cl.flash{animation:fl .42s ease-in-out 2}
.tk-c{color:#5E7A6A;font-style:italic}
.tk-p{color:#C58AE0}
.tk-k{color:#7FC3F0}
.tk-t{color:#6FD3C0}
.tk-n{color:#E8A93C}
.tk-s{color:#9FE0A8}
.tk-f{color:#F0D48A}

/* divider */
.grip{flex:none;width:9px;cursor:col-resize;background:var(--ln);position:relative}
.grip:hover,.grip.on{background:var(--cy)}
.grip::after{content:"";position:absolute;top:50%;left:2px;width:5px;height:38px;
  transform:translateY(-50%);border-radius:3px;background:var(--dim);opacity:.5}
@media (max-width:900px){.grip{display:none}}

/* flow pane */
.fpane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
@media (max-width:900px){.fpane{height:520px}}
.fbar{flex:none;padding:8px 13px;border-bottom:1px solid var(--ln);
  font-family:var(--sm);font-size:11.5px;color:var(--dim);display:flex;
  gap:10px;align-items:center;flex-wrap:wrap}
.fscroll{flex:1;overflow:auto;padding:16px}
.canv{position:relative;transform-origin:0 0}
.canv svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.nd{position:absolute;background:var(--card);border:1.5px solid var(--ln);
  border-radius:9px;padding:7px 10px;font-size:12.5px;line-height:1.45;
  cursor:pointer;user-select:none;transition:border-color .13s,box-shadow .13s;
  display:flex;flex-direction:column;justify-content:center}
.nd:hover{border-color:var(--cy);box-shadow:0 0 0 3px color-mix(in srgb,var(--cy) 18%,transparent)}
.nd.sel{border-color:var(--amb);box-shadow:0 0 0 3px color-mix(in srgb,var(--amb) 22%,transparent)}
.nd b{font-family:var(--sm);font-size:11.5px;font-weight:600;display:block}
.nd em{font-style:normal;font-size:10.5px;color:var(--dim);display:block;margin-top:1px}
.nd.ev{background:var(--bg2);border-style:dashed}
.nd.dec{border-radius:9px;border-color:var(--amb);
  background:color-mix(in srgb,var(--amb) 10%,var(--card))}
.nd.io{border-radius:20px;background:color-mix(in srgb,var(--cy) 10%,var(--card));
  border-color:color-mix(in srgb,var(--cy) 45%,var(--ln))}
.nd.hw{background:color-mix(in srgb,var(--red) 9%,var(--card));
  border-color:color-mix(in srgb,var(--red) 40%,var(--ln))}
.edge{stroke:var(--ln);stroke-width:1.6;fill:none}
.edge.hi{stroke:var(--cy);stroke-width:2.2}
.elab{font-family:var(--sm);font-size:10px;fill:var(--dim)}
.fcap{flex:none;padding:10px 13px;border-top:1px solid var(--ln);font-size:13px;
  color:var(--tx2);min-height:62px;line-height:1.65}
.fcap b{color:var(--tx);font-family:var(--sm);font-size:12px}

/* ---------- demos ---------- */
.demo{background:var(--ide);color:#CFE0D6;border-radius:13px;margin:1.9em 0;
  overflow:hidden;box-shadow:var(--sh)}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px;
  border-bottom:1px solid var(--idel);background:var(--ide2)}
.dhead h4{font-family:var(--sm);font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--grn);margin:0;font-weight:500}
.dhead .sim{font-family:var(--sm);font-size:10.5px;color:var(--ideg);
  border:1px solid var(--idel);padding:2px 6px;border-radius:4px}
.dbody{padding:16px}
.dbody label{font-family:var(--sm);font-size:11px;color:#8FA398;display:block;
  margin-bottom:4px;letter-spacing:.05em}
.drow{display:flex;flex-wrap:wrap;gap:13px;align-items:flex-end}
.dnote{font-size:12.5px;color:#8FA398;line-height:1.7;margin:13px 0 0;
  padding-top:11px;border-top:1px solid var(--idel)}
.dout{font-family:var(--sm);font-size:13px;color:var(--grn);line-height:1.85;
  font-variant-numeric:tabular-nums;white-space:pre-wrap}
.b{font:inherit;font-family:var(--ss);font-size:13px;font-weight:500;cursor:pointer;
  background:var(--ide2);color:#CFE0D6;border:1px solid var(--idel);
  border-radius:7px;padding:7px 13px}
.b:hover{border-color:var(--grn);color:#fff}
.b.on{background:var(--grn);border-color:var(--grn);color:#08210C;font-weight:700}
.b.am{background:var(--amb);border-color:var(--amb);color:#241700;font-weight:700}
.demo canvas{display:block;max-width:100%;border-radius:8px;
  border:1px solid var(--idel);background:#0A0E0C}
.demo input[type=range]{width:100%;accent-color:var(--grn)}
.demo select{font-family:var(--sm);font-size:12.5px;background:var(--ide2);
  color:#CFE0D6;border:1px solid var(--idel);border-radius:6px;padding:6px 8px}

/* ---------- exercises ---------- */
.ex{border:1px solid var(--ln);border-radius:12px;padding:15px 17px;margin:1.2em 0;
  background:var(--card)}
.ex[data-s="ok"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--card))}
.ex[data-s="no"]{border-color:var(--red);background:color-mix(in srgb,var(--red) 6%,var(--card))}
.exn{font-family:var(--sm);font-size:10.5px;color:var(--dim);letter-spacing:.1em;
  text-transform:uppercase;display:block;margin-bottom:5px}
.exq{font-weight:500;margin:0 0 .7em}
.opts{display:flex;flex-direction:column;gap:6px;margin:0 0 .85em}
.opt{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;cursor:pointer;
  padding:8px 11px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);
  line-height:1.7}
.opt:hover{border-color:var(--tx2)}
.opt input{margin:5px 0 0;flex:none;accent-color:var(--amb)}
.opt.r{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.opt.w{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--bg))}
.exin{font-family:var(--sm);font-size:13px;width:100%;padding:9px 11px;
  border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea.exin{min-height:74px;line-height:1.75;resize:vertical}
.fb{font-size:14px;line-height:1.75;margin-top:.8em;padding-top:.8em;
  border-top:1px solid var(--ln)}
.fb.ok{color:var(--ok)} .fb.no{color:var(--red)}
.fb b{display:block;margin-bottom:.15em}
.fb pre{background:var(--ide);color:#C8D6CD;border-radius:8px;padding:11px 13px;
  font-size:12.5px;overflow-x:auto;margin:.5em 0 0}
.sortl{display:flex;flex-direction:column;gap:6px;margin:0 0 .85em}
.sortl li{list-style:none;display:flex;gap:10px;align-items:center;
  background:var(--bg);border:1px solid var(--ln);border-radius:8px;
  padding:9px 11px;font-family:var(--sm);font-size:12.5px;cursor:grab;margin:0}
.sortl li.drag{opacity:.4}
.sortl li span.h{color:var(--dim);flex:none}
.sortl li span.t{flex:1;min-width:0}
.pbar{height:8px;border-radius:5px;background:var(--bg2);overflow:hidden;margin:10px 0 3px}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.navfoot{display:flex;justify-content:space-between;gap:11px;flex-wrap:wrap;
  margin-top:2.6em;padding-top:1.3em;border-top:1px solid var(--ln)}
.navfoot .b{background:var(--card);color:var(--tx);border-color:var(--ln)}
.navfoot .b:hover{border-color:var(--tx)}
.navfoot .b.done{background:var(--ok);border-color:var(--ok);color:#fff}
.hint{font-size:12.5px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

<div id="bar"><div class="barin">
  <span class="brand">掌機韌體<b>怎麼寫的</b></span>
  <nav id="chapnav" aria-label="章節"></nav>
  <button id="themeBtn" class="tbtn" type="button">深色</button>
</div></div>

<main>
  <div class="pbar"><i id="pb" style="width:0%"></i></div>
  <div class="col" id="intro"></div>

  <div class="wb" id="wb">
    <div class="wbhead">
      <h4>程式 ↔ 流程對照</h4>
      <span class="hint">拖中間的把手可以調寬窄　·　<b>雙擊</b>右邊的節點會讓左邊跳到那一行</span>
    </div>
    <div class="split" id="split">
      <div class="cpane" id="cpane">
        <div class="tabs" id="tabs"></div>
        <div class="codewrap" id="codewrap"></div>
      </div>
      <div class="grip" id="grip" title="拖曳調整，雙擊還原"></div>
      <div class="fpane">
        <div class="fbar">
          <span id="flowname">流程</span>
          <span style="margin-left:auto"></span>
          <button class="tbtn" id="zout" type="button">−</button>
          <span id="zlab">100%</span>
          <button class="tbtn" id="zin" type="button">+</button>
          <button class="tbtn" id="zrst" type="button">重設</button>
        </div>
        <div class="fscroll"><div class="canv" id="canv"></div></div>
        <div class="fcap" id="fcap"></div>
      </div>
    </div>
  </div>

  <div class="col" id="prose"></div>
  <div id="demos"></div>
  <div class="col" id="exs"></div>
  <div class="col navfoot" id="navfoot"></div>
</main>

<script>
const SRC={"App/app_main.c":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * app_main.c - power on, show the menu, run the chosen game</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * BOOT ORDER MATTERS</span>","<span class=\"tk-c\"> *   1. stm32f4_Hardware_Init() sets the PLL, SysTick and the</span>","<span class=\"tk-c\"> *      PCLK globals.  Everything below depends on it.</span>","<span class=\"tk-c\"> *   2. LCD_Init() brings up the FSMC and the ILI9341, and is</span>","<span class=\"tk-c\"> *      what makes LCD_Pixel_Width() meaningful.</span>","<span class=\"tk-c\"> *   3. Default_Calibration() loads the touch coefficients, so it</span>","<span class=\"tk-c\"> *      must come after LCD_Init().</span>","<span class=\"tk-c\"> *   4. Driver_GPIO() configures the SPI touch pins and KEY1.</span>","<span class=\"tk-c\"> *   5. Input_Init() adds our buttons and the joystick ADC, and</span>","<span class=\"tk-c\"> *      measures where the sticks are resting - so do not touch</span>","<span class=\"tk-c\"> *      the sticks while the console boots.</span>","<span class=\"tk-c\"> *   6. Sound_Init() needs PCLK1_Freq from step 1.</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"console.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"input.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"sound.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"gfx.h\"</span>","<span class=\"tk-p\">#include</span> &lt;stdio.h&gt;","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">stm32f4_Hardware_Init</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Default_Calibration</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Driver_GPIO</span>(<span class=\"tk-t\">void</span>);","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">SPLASH_BG</span>  <span class=\"tk-n\">0x18E3</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">SPLASH_FG</span>  <span class=\"tk-n\">0x07FF</span>","","<span class=\"tk-c\">/* How long the opening screen stays up, in ms.  Any button press</span>","<span class=\"tk-c\"> * after the first second skips it, so it does not get in the way</span>","<span class=\"tk-c\"> * while you are reflashing. */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">SPLASH_MS</span>  <span class=\"tk-n\">4500</span>","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">splash</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">char</span>     buf[<span class=\"tk-n\">36</span>];","    <span class=\"tk-t\">uint32_t</span> t0;","    <span class=\"tk-t\">uint16_t</span> lastW = <span class=\"tk-n\">0</span>;","","    <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">SPLASH_BG</span>);","    <span class=\"tk-f\">LCD_FillRect</span>(<span class=\"tk-n\">0</span>, <span class=\"tk-n\">0</span>, <span class=\"tk-n\">SCR_W</span>, <span class=\"tk-n\">SCR_H</span>);","","    <span class=\"tk-f\">Gfx_Sprite</span>((<span class=\"tk-n\">SCR_W</span> - <span class=\"tk-n\">SPR_DINO_IDLE</span>.w) / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">76</span>, &amp;<span class=\"tk-n\">SPR_DINO_IDLE</span>,","               <span class=\"tk-n\">SPLASH_FG</span>, <span class=\"tk-n\">SPLASH_BG</span>);","","    <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">26</span>, <span class=\"tk-s\">\"STM32 ARCADE\"</span>, <span class=\"tk-n\">SPLASH_FG</span>, <span class=\"tk-n\">SPLASH_BG</span>, &amp;Font16);","    <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">SPLASH_FG</span>);","    <span class=\"tk-f\">LCD_FillRect</span>(<span class=\"tk-n\">96</span>, <span class=\"tk-n\">48</span>, <span class=\"tk-n\">128</span>, <span class=\"tk-n\">2</span>);","    <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">126</span>, <span class=\"tk-s\">\"NYCU Maker Club\"</span>, <span class=\"tk-n\">0x8410</span>, <span class=\"tk-n\">SPLASH_BG</span>, &amp;Font12);","","    <span class=\"tk-c\">/* progress bar track */</span>","    <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">0x2124</span>);","    <span class=\"tk-f\">LCD_FillRect</span>(<span class=\"tk-n\">60</span>, <span class=\"tk-n\">160</span>, <span class=\"tk-n\">200</span>, <span class=\"tk-n\">6</span>);","","    <span class=\"tk-c\">/* Two polls then a flush, so a button that is stuck LOW</span>","<span class=\"tk-c\">     * because of a wiring fault cannot look like a fresh press</span>","<span class=\"tk-c\">     * and skip the screen instantly. */</span>","    <span class=\"tk-f\">Input_Poll</span>();","    <span class=\"tk-f\">Input_Poll</span>();","    <span class=\"tk-f\">Input_Flush</span>();","","    t0 = msTick;","    <span class=\"tk-k\">while</span> (msTick - t0 &lt; <span class=\"tk-n\">SPLASH_MS</span>) {","        <span class=\"tk-t\">uint32_t</span> e = msTick - t0;","        <span class=\"tk-t\">uint16_t</span> w = (<span class=\"tk-t\">uint16_t</span>)((e * <span class=\"tk-n\">200u</span>) / <span class=\"tk-n\">SPLASH_MS</span>);","","        <span class=\"tk-f\">Input_Poll</span>();","","        <span class=\"tk-k\">if</span> (w &gt; lastW) {","            <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">SPLASH_FG</span>);","            <span class=\"tk-f\">LCD_FillRect</span>((<span class=\"tk-t\">uint16_t</span>)(<span class=\"tk-n\">60</span> + lastW), <span class=\"tk-n\">160</span>, (<span class=\"tk-t\">uint16_t</span>)(w - lastW), <span class=\"tk-n\">6</span>);","            lastW = w;","        }","","        <span class=\"tk-c\">/* Live joystick readings, so a dead axis is visible before</span>","<span class=\"tk-c\">         * you even reach the menu.  A stick that is wired and</span>","<span class=\"tk-c\">         * powered rests somewhere near 2000; a reading pinned at 0</span>","<span class=\"tk-c\">         * means that axis has no supply or no wire.            */</span>","        <span class=\"tk-f\">sprintf</span>(buf, <span class=\"tk-s\">\"JOY %4u %4u %4u %4u\"</span>,","                <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-n\">10</span>), <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-n\">11</span>),","                <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-n\">12</span>), <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-n\">13</span>));","        <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">186</span>, buf, <span class=\"tk-n\">0x6B4D</span>, <span class=\"tk-n\">SPLASH_BG</span>, &amp;Font12);","","        <span class=\"tk-k\">if</span> (<span class=\"tk-f\">Input_AdcFaults</span>())","            <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">206</span>, <span class=\"tk-s\">\"ADC FAULT\"</span>, <span class=\"tk-n\">0xF800</span>, <span class=\"tk-n\">SPLASH_BG</span>, &amp;Font12);","","        <span class=\"tk-k\">if</span> (e &gt; <span class=\"tk-n\">1000u</span> &amp;&amp; <span class=\"tk-f\">Input_Pressed</span>()) <span class=\"tk-k\">break</span>;","","        <span class=\"tk-f\">delay_ms</span>(<span class=\"tk-n\">40</span>);","    }","}","","<span class=\"tk-t\">int</span> <span class=\"tk-f\">main</span>(<span class=\"tk-t\">void</span>)","{","    AppScreen screen;","","    <span class=\"tk-f\">stm32f4_Hardware_Init</span>();","","    <span class=\"tk-f\">LCD_Init</span>();","    <span class=\"tk-f\">LCD_DisplayOn</span>();","    <span class=\"tk-f\">Default_Calibration</span>();","    <span class=\"tk-f\">Driver_GPIO</span>();","","    <span class=\"tk-f\">Input_Init</span>();","    <span class=\"tk-f\">Sound_Init</span>();","","    <span class=\"tk-f\">splash</span>();","","    <span class=\"tk-k\">for</span> (;;) {","        screen = <span class=\"tk-f\">Menu_Run</span>();","","        <span class=\"tk-k\">switch</span> (screen) {","        <span class=\"tk-k\">case</span> <span class=\"tk-n\">APP_DINO</span>: <span class=\"tk-f\">Dino_Run</span>();     <span class=\"tk-k\">break</span>;","        <span class=\"tk-k\">case</span> <span class=\"tk-n\">APP_2048</span>: <span class=\"tk-f\">Game2048_Run</span>(); <span class=\"tk-k\">break</span>;","        <span class=\"tk-k\">case</span> <span class=\"tk-n\">APP_GATE</span>: <span class=\"tk-f\">Gate_Run</span>();     <span class=\"tk-k\">break</span>;","        <span class=\"tk-k\">case</span> <span class=\"tk-n\">APP_IOTEST</span>: <span class=\"tk-f\">IoTest_Run</span>(); <span class=\"tk-k\">break</span>;","        <span class=\"tk-k\">default</span>:                       <span class=\"tk-k\">break</span>;","        }","","        <span class=\"tk-f\">Sound_Stop</span>();","    }","}"],"App/console.h":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * console.h - shared declarations for the STM32 handheld console</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Board  : STM32F407ZGT6 course board</span>","<span class=\"tk-c\"> * Display: on-board ILI9341 via FSMC, 320 x 240 landscape</span>","<span class=\"tk-c\"> * Input  : 4 tactile buttons, 2 analog joysticks, resistive touch</span>","<span class=\"tk-c\"> * Audio  : 4 ohm speaker on TIM3_CH1 (PA6) through a 220 ohm resistor</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#ifndef</span> __CONSOLE_H","<span class=\"tk-p\">#define</span> __CONSOLE_H","","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"stm32f4xx.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"stm324xg_lcd_sklin.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"user_defined.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"touch_module.h\"</span>","<span class=\"tk-p\">#include</span> &lt;stdint.h&gt;","","<span class=\"tk-c\">/* ---- screen geometry ------------------------------------- */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">SCR_W</span>   <span class=\"tk-n\">320</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">SCR_H</span>   <span class=\"tk-n\">240</span>","","<span class=\"tk-c\">/* ---- which screen the console is currently showing -------- */</span>","<span class=\"tk-k\">typedef</span> <span class=\"tk-k\">enum</span> {","    <span class=\"tk-n\">APP_MENU</span> = <span class=\"tk-n\">0</span>,","    <span class=\"tk-n\">APP_DINO</span>,","    <span class=\"tk-n\">APP_2048</span>,","    <span class=\"tk-n\">APP_GATE</span>,","    <span class=\"tk-n\">APP_IOTEST</span>","} AppScreen;","","<span class=\"tk-c\">/* Each of these runs until the player backs out, then returns. */</span>","AppScreen <span class=\"tk-f\">Menu_Run</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span>      <span class=\"tk-f\">Dino_Run</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span>      <span class=\"tk-f\">Game2048_Run</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span>      <span class=\"tk-f\">Gate_Run</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span>      <span class=\"tk-f\">IoTest_Run</span>(<span class=\"tk-t\">void</span>);","","<span class=\"tk-c\">/* ---- small shared helpers (ui.c) -------------------------- */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-t\">uint16_t</span> x, <span class=\"tk-t\">uint16_t</span> y, <span class=\"tk-t\">uint16_t</span> w, <span class=\"tk-t\">uint16_t</span> h,","               <span class=\"tk-k\">const</span> <span class=\"tk-t\">char</span> *label, <span class=\"tk-t\">uint16_t</span> bg, <span class=\"tk-t\">uint16_t</span> fg, sFONT *font);","<span class=\"tk-t\">uint8_t</span> <span class=\"tk-f\">UI_HitBox</span>(<span class=\"tk-t\">uint16_t</span> tx, <span class=\"tk-t\">uint16_t</span> ty,","                  <span class=\"tk-t\">uint16_t</span> x, <span class=\"tk-t\">uint16_t</span> y, <span class=\"tk-t\">uint16_t</span> w, <span class=\"tk-t\">uint16_t</span> h);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-t\">uint16_t</span> cx, <span class=\"tk-t\">uint16_t</span> y, <span class=\"tk-k\">const</span> <span class=\"tk-t\">char</span> *s,","                    <span class=\"tk-t\">uint16_t</span> fg, <span class=\"tk-t\">uint16_t</span> bg, sFONT *font);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">UI_Banner</span>(<span class=\"tk-k\">const</span> <span class=\"tk-t\">char</span> *line1, <span class=\"tk-k\">const</span> <span class=\"tk-t\">char</span> *line2,","               <span class=\"tk-t\">uint16_t</span> bg, <span class=\"tk-t\">uint16_t</span> fg);","","<span class=\"tk-c\">/* Blocking wait that keeps the sound engine ticking.  Always use</span>","<span class=\"tk-c\"> * this instead of delay_ms() inside a game, otherwise a note that</span>","<span class=\"tk-c\"> * should have ended keeps ringing for the whole delay.          */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">App_Wait</span>(<span class=\"tk-t\">uint32_t</span> ms);","","<span class=\"tk-p\">#endif</span> <span class=\"tk-c\">/* __CONSOLE_H */</span>"],"App/menu.c":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * menu.c - the console's home screen</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Two ways to choose a game, on purpose:</span>","<span class=\"tk-c\"> *   - tap it on the touch panel</span>","<span class=\"tk-c\"> *   - or move with UP/DOWN (button or either stick) and confirm</span>","<span class=\"tk-c\"> *     with a joystick push-switch or the RIGHT button</span>","<span class=\"tk-c\"> * The second path is what saves you when the touch calibration</span>","<span class=\"tk-c\"> * is off, which is the single most common demo-day failure.</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"console.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"input.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"sound.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"gfx.h\"</span>","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BG</span>        <span class=\"tk-n\">0x18E3</span>      <span class=\"tk-c\">/* near-black slate          */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PANEL</span>     <span class=\"tk-n\">0x2965</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">ACCENT</span>    <span class=\"tk-n\">0x07FF</span>      <span class=\"tk-c\">/* cyan                      */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">DIM</span>       <span class=\"tk-n\">0x6B4D</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">INK</span>       <span class=\"tk-n\">0xFFFF</span>","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">ITEM_X</span>     <span class=\"tk-n\">26</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">ITEM_W</span>    <span class=\"tk-n\">268</span>","<span class=\"tk-p\">#define</span> <s id</span> <span class=\"tk-f\">Gfx_BandHLine</span>(<span class=\"tk-t\">int16_t</span> y, <span class=\"tk-t\">uint16_t</span> colour, <span class=\"tk-t\">uint8_t</span> thickness)","{","    <span class=\"tk-f\">Gfx_BandRect</span>(<span class=\"tk-n\">0</span>, y, (<span class=\"tk-t\">int16_t</span>)s_w, (<span class=\"tk-t\">int16_t</span>)thickness, colour);","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gfx_BandSprite</span>(<span class=\"tk-k\">const</span> Sprite *s, <span class=\"tk-t\">int16_t</span> x, <span class=\"tk-t\">int16_t</span> y, <span class=\"tk-t\">uint16_t</span> ink)","{","    <span class=\"tk-t\">uint16_t</span> stride;","    <span class=\"tk-t\">int16_t</span>  sx, sy;","","    <span class=\"tk-k\">if</span> (s_w == <span class=\"tk-n\">0</span> || s == <span class=\"tk-n\">0</span>) <span class=\"tk-k\">return</span>;","","    stride = (<span class=\"tk-t\">uint16_t</span>)((s-&gt;w + <span class=\"tk-n\">7</span>) / <span class=\"tk-n\">8</span>);","","    <span class=\"tk-k\">for</span> (sy = <span class=\"tk-n\">0</span>; sy &lt; (<span class=\"tk-t\">int16_t</span>)s-&gt;h; sy++) {","        <span class=\"tk-t\">int16_t</span> dy = y + sy;","        <span class=\"tk-k\">const</span> <span class=\"tk-t\">uint8_t</span> *row;","","        <span class=\"tk-k\">if</span> (dy &lt; <span class=\"tk-n\">0</span> || dy &gt;= (<span class=\"tk-t\">int16_t</span>)s_h) <span class=\"tk-k\">continue</span>;","        row = s-&gt;bits + (<span class=\"tk-t\">uint32_t</span>)sy * stride;","","        <span class=\"tk-k\">for</span> (sx = <span class=\"tk-n\">0</span>; sx &lt; (<span class=\"tk-t\">int16_t</span>)s-&gt;w; sx++) {","            <span class=\"tk-t\">int16_t</span> dx = x + sx;","            <span class=\"tk-k\">if</span> (dx &lt; <span class=\"tk-n\">0</span> || dx &gt;= (<span class=\"tk-t\">int16_t</span>)s_w) <span class=\"tk-k\">continue</span>;","            <span class=\"tk-k\">if</span> (row[sx &gt;&gt; <span class=\"tk-n\">3</span>] &amp; (<span class=\"tk-n\">0x80u</span> &gt;&gt; (sx &amp; <span class=\"tk-n\">7</span>)))","                s_buf[(<span class=\"tk-t\">uint32_t</span>)dy * s_w + dx] = ink;","        }","    }","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gfx_BandEnd</span>(<span class=\"tk-t\">int16_t</span> screenX, <span class=\"tk-t\">int16_t</span> screenY)","{","    <span class=\"tk-k\">if</span> (s_w == <span class=\"tk-n\">0</span>) <span class=\"tk-k\">return</span>;","    <span class=\"tk-c\">/* The caller is responsible for keeping the band on screen;</span>","<span class=\"tk-c\">     * LCD_DrawRGBImage clips the window but not the source</span>","<span class=\"tk-c\">     * pointer, so a partly off-screen band would shear.        */</span>","    <span class=\"tk-f\">LCD_DrawRGBImage</span>((<span class=\"tk-t\">uint16_t</span>)screenX, (<span class=\"tk-t\">uint16_t</span>)screenY,","                     s_w, s_h, (<span class=\"tk-t\">uint8_t</span> *)s_buf);","    s_w = s_h = <span class=\"tk-n\">0</span>;","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gfx_Sprite</span>(<span class=\"tk-t\">int16_t</span> x, <span class=\"tk-t\">int16_t</span> y, <span class=\"tk-k\">const</span> Sprite *s,","                <span class=\"tk-t\">uint16_t</span> ink, <span class=\"tk-t\">uint16_t</span> bg)","{","    <span class=\"tk-k\">if</span> (!s) <span class=\"tk-k\">return</span>;","    <span class=\"tk-f\">Gfx_BandBegin</span>(s-&gt;w, s-&gt;h, bg);","    <span class=\"tk-f\">Gfx_BandSprite</span>(s, <span class=\"tk-n\">0</span>, <span class=\"tk-n\">0</span>, ink);","    <span class=\"tk-f\">Gfx_BandEnd</span>(x, y);","}"],"App/gfx.h":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * gfx.h - flicker-free sprite drawing</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * THE PROBLEM</span>","<span class=\"tk-c\"> *   The obvious way to animate is \"fill the old rectangle with</span>","<span class=\"tk-c\"> *   the background colour, then draw the sprite at its new</span>","<span class=\"tk-c\"> *   position\".  On an LCD that is two visible writes, and the</span>","<span class=\"tk-c\"> *   eye catches the gap between them as flicker.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * THE FIX (the course calls it \"only redraw the changed area\")</span>","<span class=\"tk-c\"> *   Compose one rectangle - background, ground line, sprite, all</span>","<span class=\"tk-c\"> *   of it - in a small RAM buffer, then push that rectangle to</span>","<span class=\"tk-c\"> *   the panel in a single windowed write.  The pixel is never</span>","<span class=\"tk-c\"> *   shown in an intermediate state, so there is nothing to</span>","<span class=\"tk-c\"> *   flicker.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * USAGE</span>","<span class=\"tk-c\"> *   Gfx_BandBegin(w, h, skyColour);</span>","<span class=\"tk-c\"> *   Gfx_BandHLine(yInBand, groundColour, thickness);</span>","<span class=\"tk-c\"> *   Gfx_BandSprite(&amp;SPR_dino_run1, xInBand, yInBand, inkColour);</span>","<span class=\"tk-c\"> *   Gfx_BandEnd(screenX, screenY);</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#ifndef</span> __GFX_H","<span class=\"tk-p\">#define</span> __GFX_H","","<span class=\"tk-p\">#include</span> &lt;stdint.h&gt;","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"dino_sprites.h\"</span>","","<span class=\"tk-c\">/* Largest rectangle we can compose at once, in pixels.</span>","<span class=\"tk-c\"> * The widest user is the dino band: 44 px wide x 100 px tall. */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">GFX_BUF_PIX</span>  <span class=\"tk-n\">4800</span>","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gfx_BandBegin</span>(<span class=\"tk-t\">uint16_t</span> w, <span class=\"tk-t\">uint16_t</span> h, <span class=\"tk-t\">uint16_t</span> bg);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gfx_BandHLine</span>(<span class=\"tk-t\">int16_t</span> y, <span class=\"tk-t\">uint16_t</span> colour, <span class=\"tk-t\">uint8_t</span> thickness);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gfx_BandRect</span>(<span class=\"tk-t\">int16_t</span> x, <span class=\"tk-t\">int16_t</span> y, <span class=\"tk-t\">int16_t</span> w, <span class=\"tk-t\">int16_t</span> h, <span class=\"tk-t\">uint16_t</span> colour);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gfx_BandSprite</span>(<span class=\"tk-k\">const</span> Sprite *s, <span class=\"tk-t\">int16_t</span> x, <span class=\"tk-t\">int16_t</span> y, <span class=\"tk-t\">uint16_t</span> ink);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gfx_BandEnd</span>(<span class=\"tk-t\">int16_t</span> screenX, <span class=\"tk-t\">int16_t</span> screenY);","","<span class=\"tk-c\">/* One-shot sprite on a flat background, for static screens. */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gfx_Sprite</span>(<span class=\"tk-t\">int16_t</span> x, <span class=\"tk-t\">int16_t</span> y, <span class=\"tk-k\">const</span> Sprite *s,","                <span class=\"tk-t\">uint16_t</span> ink, <span class=\"tk-t\">uint16_t</span> bg);","","<span class=\"tk-p\">#endif</span> <span class=\"tk-c\">/* __GFX_H */</span>"],"App/input.c":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * input.c - register-level buttons + joystick ADC</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Everything here is deliberately written with raw register</span>","<span class=\"tk-c\"> * access (no HAL), to match the course style.  See the TA notes</span>","<span class=\"tk-c\"> * Unit 01 (GPIO/RCC) and Unit 05 (ADC) for the theory.</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"stm32f4xx.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"input.h\"</span>","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * 1. Pin numbers</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PIN_BTN_UP</span>      <span class=\"tk-n\">1</span>   <span class=\"tk-c\">/* PE1 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PIN_BTN_DOWN</span>    <span class=\"tk-n\">2</span>   <span class=\"tk-c\">/* PE2 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PIN_BTN_LEFT</span>    <span class=\"tk-n\">3</span>   <span class=\"tk-c\">/* PE3 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PIN_BTN_RIGHT</span>   <span class=\"tk-n\">4</span>   <span class=\"tk-c\">/* PE4 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PIN_J1_SW</span>       <span class=\"tk-n\">4</span>   <span class=\"tk-c\">/* PC4 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PIN_J2_SW</span>       <span class=\"tk-n\">5</span>   <span class=\"tk-c\">/* PC5 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PIN_BACK</span>        <span class=\"tk-n\">8</span>   <span class=\"tk-c\">/* PB8, on-board KEY1 */</span>","","<span class=\"tk-c\">/* ADC1 regular channels used by the two sticks */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CH_J1X</span>         <span class=\"tk-n\">10</span>   <span class=\"tk-c\">/* PC0 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CH_J1Y</span>         <span class=\"tk-n\">11</span>   <span class=\"tk-c\">/* PC1 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CH_J2X</span>         <span class=\"tk-n\">12</span>   <span class=\"tk-c\">/* PC2 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CH_J2Y</span>         <span class=\"tk-n\">13</span>   <span class=\"tk-c\">/* PC3 */</span>","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * 2. Joystick thresholds</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * The ADC is 12-bit, so a centred stick reads near 2048 - but</span>","<span class=\"tk-c\"> * never exactly, which is why we measure the real centre at</span>","<span class=\"tk-c\"> * boot instead of trusting the theoretical value.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Two thresholds (not one) give hysteresis: once a direction is</span>","<span class=\"tk-c\"> * active it stays active until the stick comes well back, so a</span>","<span class=\"tk-c\"> * stick resting right on the edge cannot chatter.</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">JOY_ON</span>     <span class=\"tk-n\">700</span>      <span class=\"tk-c\">/* counts away from centre to activate    */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">JOY_OFF</span>    <span class=\"tk-n\">450</span>      <span class=\"tk-c\">/* counts to fall back to before release  */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">JOY_DEAD</span>   <span class=\"tk-n\">250</span>      <span class=\"tk-c\">/* analog dead zone, see Input_JoyAxis()   */</span>","","<span class=\"tk-c\">/* If an axis feels upside-down in game, flip the matching flag. */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">JOY_INVERT_Y</span>  <span class=\"tk-n\">0</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">JOY_INVERT_X</span>  <span class=\"tk-n\">0</span>","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * 3. Module state</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint16_t</span> s_held;         <span class=\"tk-c\">/* debounced level                 */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint16_t</span> s_prev;         <span class=\"tk-c\">/* previous level, for edges       */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint16_t</span> s_edge;         <span class=\"tk-c\">/* latched press edges             */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint16_t</span> s_lastRaw;      <span class=\"tk-c\">/* previous raw sample             */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint16_t</span> s_centre[<span class=\"tk-n\">4</span>];    <span class=\"tk-c\">/* measured centre of each axis    */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint16_t</span> s_raw[<span class=\"tk-n\">4</span>];       <span class=\"tk-c\">/* last sample of each axis        */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint32_t</span> s_adcFaults;    <span class=\"tk-c\">/* conversions that never finished */</span>","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * 4. Low-level ADC</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-t\">uint16_t</span> <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-t\">uint8_t</span> ch)","{","    <span class=\"tk-c\">/* A conversion takes (112 + 12) ADC cycles at 21 MHz, about 6 us,</span>","<span class=\"tk-c\">     * i.e. a few hundred CPU cycles.  The bounded wait is not there</span>","<span class=\"tk-c\">     * for timing - it is there so that a mis-configured ADC makes the</span>","<span class=\"tk-c\">     * joystick read 0 instead of freezing the whole console.        */</span>","    <span class=\"tk-t\">uint32_t</span> guard = <span class=\"tk-n\">200000</span>;","","    <span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">SQR3</span> = ch;                 <span class=\"tk-c\">/* 1st (and only) conversion = ch  */</span>","    <span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">SR</span>  &amp;= ~(<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">1</span>);        <span class=\"tk-c\">/* clear EOC                       */</span>","    <span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">CR2</span> |=  (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">30</span>);       <span class=\"tk-c\">/* SWSTART: begin conversion       */</span>","","    <span class=\"tk-k\">while</span> ((<span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">SR</span> &amp; (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">1</span>)) == <span class=\"tk-n\">0</span>) {","        <span class=\"tk-k\">if</span> (--guard == <span class=\"tk-n\">0</span>) { s_adcFaults++; <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>; }","    }","    <span class=\"tk-k\">return</span> (<span class=\"tk-t\">uint16_t</span>)(<span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">DR</span> &amp; <span class=\"tk-n\">0x0FFF</span>);","}","","<span class=\"tk-c\">/* Average several samples - a single reading of a 10k pot is noisy. */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint16_t</span> <span class=\"tk-f\">adc_avg</span>(<span class=\"tk-t\">uint8_t</span> ch, <span class=\"tk-t\">uint8_t</span> n)","{","    <span class=\"tk-t\">uint32_t</span> sum = <span class=\"tk-n\">0</span>;","    <span class=\"tk-t\">uint8_t</span>  i;","    <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; n; i++) sum += <span class=\"tk-f\">Input_AdcRaw</span>(ch);","    <span class=\"tk-k\">return</span> (<span class=\"tk-t\">uint16_t</span>)(sum / n);","}","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * 5. Initialisation</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">gpio_input_pullup</span>(GPIO_TypeDef *port, <span class=\"tk-t\">uint8_t</span> pin)","{","    port-&gt;<span class=\"tk-n\">MODER</span> &amp;= ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (pin * <span class=\"tk-n\">2</span>));                  <span class=\"tk-c\">/* 00 = input   */</span>","    port-&gt;<span class=\"tk-n\">PUPDR</span>  = (port-&gt;<span class=\"tk-n\">PUPDR</span> &amp; ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (pin * <span class=\"tk-n\">2</span>)))","                 | (<span class=\"tk-n\">1UL</span> &lt;&lt; (pin * <span class=\"tk-n\">2</span>));                   <span class=\"tk-c\">/* 01 = pull-up */</span>","}","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">gpio_analog</span>(GPIO_TypeDef *port, <span class=\"tk-t\">uint8_t</span> pin)","{","    port-&gt;<span class=\"tk-n\">MODER</span> |=  (<span class=\"tk-n\">3UL</span> &lt;&lt; (pin * <span class=\"tk-n\">2</span>));                  <span class=\"tk-c\">/* 11 = analog  */</span>","    port-&gt;<span class=\"tk-n\">PUPDR</span> &amp;= ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (pin * <span class=\"tk-n\">2</span>));                  <span class=\"tk-c\">/* 00 = no pull */</span>","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Input_Init</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-c\">/* --- clocks: GPIOB(1), GPIOC(2), GPIOE(4) on AHB1 ------------- */</span>","    <span class=\"tk-n\">RCC</span>-&gt;<span class=\"tk-n\">AHB1ENR</span> |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">1</span>) | (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">2</span>) | (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">4</span>);","","    <span class=\"tk-c\">/* --- four direction buttons on port E ------------------------- */</span>","    <span class=\"tk-f\">gpio_input_pullup</span>(<span class=\"tk-n\">GPIOE</span>, <span class=\"tk-n\">PIN_BTN_UP</span>);","    <span class=\"tk-f\">gpio_input_pullup</span>(<span class=\"tk-n\">GPIOE</span>, <span class=\"tk-n\">PIN_BTN_DOWN</span>);","    <span class=\"tk-f\">gpio_input_pullup</span>(<span class=\"tk-n\">GPIOE</span>, <span class=\"tk-n\">PIN_BTN_LEFT</span>);","    <span class=\"tk-f\">gpio_input_pullup</span>(<span class=\"tk-n\">GPIOE</span>, <span class=\"tk-n\">PIN_BTN_RIGHT</span>);","","    <span class=\"tk-c\">/* --- joystick push-switches ----------------------------------- */</span>","    <span class=\"tk-f\">gpio_input_pullup</span>(<span class=\"tk-n\">GPIOC</span>, <span class=\"tk-n\">PIN_J1_SW</span>);","    <span class=\"tk-f\">gpio_input_pullup</span>(<span class=\"tk-n\">GPIOC</span>, <span class=\"tk-n\">PIN_J2_SW</span>);","","    <span class=\"tk-c\">/* --- on-board KEY1 (also done by Driver_GPIO, harmless) ------- */</span>","    <span class=\"tk-f\">gpio_input_pullup</span>(<span class=\"tk-n\">GPIOB</span>, <span class=\"tk-n\">PIN_BACK</span>);","","    <span class=\"tk-c\">/* --- joystick axes as analog inputs --------------------------- */</span>","    <span class=\"tk-f\">gpio_analog</span>(<span class=\"tk-n\">GPIOC</span>, <span class=\"tk-n\">0</span>);","    <span class=\"tk-f\">gpio_analog</span>(<span class=\"tk-n\">GPIOC</span>, <span class=\"tk-n\">1</span>);","    <span class=\"tk-f\">gpio_analog</span>(<span class=\"tk-n\">GPIOC</span>, <span class=\"tk-n\">2</span>);","    <span class=\"tk-f\">gpio_analog</span>(<span class=\"tk-n\">GPIOC</span>, <span class=\"tk-n\">3</span>);","","    <span class=\"tk-c\">/* --- ADC1 ------------------------------------------------------</span>","<span class=\"tk-c\">     * APB2 runs at 84 MHz; the ADC must not exceed 36 MHz, so the</span>","<span class=\"tk-c\">     * common prescaler divides by 4 -&gt; 21 MHz.</span>","<span class=\"tk-c\">     * A 10k potentiometer is a high-impedance source, so we also</span>","<span class=\"tk-c\">     * pick a long sample time (112 cycles) to let the internal</span>","<span class=\"tk-c\">     * sample-and-hold capacitor charge fully.</span>","<span class=\"tk-c\">     * -------------------------------------------------------------- */</span>","    <span class=\"tk-n\">RCC</span>-&gt;<span class=\"tk-n\">APB2ENR</span> |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">8</span>);            <span class=\"tk-c\">/* ADC1EN                    */</span>","","    <span class=\"tk-n\">ADC</span>-&gt;<span class=\"tk-n\">CCR</span> = (<span class=\"tk-n\">ADC</span>-&gt;<span class=\"tk-n\">CCR</span> &amp; ~(<span class=\"tk-n\">3UL</span> &lt;&lt; <span class=\"tk-n\">16</span>))","             | (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">16</span>);                <span class=\"tk-c\">/* ADCPRE = 01 -&gt; PCLK2 / 4  */</span>","","    <span class=\"tk-c\">/* SMPR1 holds channels 10..18, 3 bits each.</span>","<span class=\"tk-c\">     * ch10 -&gt; bits [2:0], ch11 -&gt; [5:3], ch12 -&gt; [8:6], ch13 -&gt; [11:9]</span>","<span class=\"tk-c\">     * value 101b = 112 cycles                                          */</span>","    <span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">SMPR1</span> = (<span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">SMPR1</span> &amp; ~<span class=\"tk-n\">0x00000FFFUL</span>)","                | (<span class=\"tk-n\">5UL</span> &lt;&lt; <span class=\"tk-n\">0</span>) | (<span class=\"tk-n\">5UL</span> &lt;&lt; <span class=\"tk-n\">3</span>) | (<span class=\"tk-n\">5UL</span> &lt;&lt; <span class=\"tk-n\">6</span>) | (<span class=\"tk-n\">5UL</span> &lt;&lt; <span class=\"tk-n\">9</span>);","","    <span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">SQR1</span> = <span class=\"tk-n\">0</span>;          <span class=\"tk-c\">/* L = 0000 -&gt; sequence length of 1        */</span>","    <span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">CR1</span>  = <span class=\"tk-n\">0</span>;          <span class=\"tk-c\">/* 12-bit, no scan, no interrupts          */</span>","    <span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">CR2</span>  = <span class=\"tk-n\">0</span>;","    <span class=\"tk-n\">ADC1</span>-&gt;<span class=\"tk-n\">CR2</span> |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">0</span>); <span class=\"tk-c\">/* ADON: wake the ADC up                   */</span>","","    <span class=\"tk-c\">/* the analog block needs a moment to stabilise after ADON */</span>","    { <span class=\"tk-k\">volatile</span> <span class=\"tk-t\">uint32_t</span> d = <span class=\"tk-n\">20000</span>; <span class=\"tk-k\">while</span> (d--) { } }","","    <span class=\"tk-f\">Input_Recalibrate</span>();","","    s_held = s_prev = s_edge = s_lastRaw = <span class=\"tk-n\">0</span>;","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Input_Recalibrate</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-c\">/* Whatever the sticks read right now is defined as \"centre\".</span>","<span class=\"tk-c\">     * Do not touch the sticks while the console boots.               */</span>","    s_centre[<span class=\"tk-n\">0</span>] = <span class=\"tk-f\">adc_avg</span>(<span class=\"tk-n\">CH_J1X</span>, <span class=\"tk-n\">16</span>);","    s_centre[<span class=\"tk-n\">1</span>] = <span class=\"tk-f\">adc_avg</span>(<span class=\"tk-n\">CH_J1Y</span>, <span class=\"tk-n\">16</span>);","    s_centre[<span class=\"tk-n\">2</span>] = <span class=\"tk-f\">adc_avg</span>(<span class=\"tk-n\">CH_J2X</span>, <span class=\"tk-n\">16</span>);","    s_centre[<span class=\"tk-n\">3</span>] = <span class=\"tk-f\">adc_avg</span>(<span class=\"tk-n\">CH_J2Y</span>, <span class=\"tk-n\">16</span>);","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Input_JoyCentre</span>(<span class=\"tk-t\">uint16_t</span> *c0, <span class=\"tk-t\">uint16_t</span> *c1, <span class=\"tk-t\">uint16_t</span> *c2, <span class=\"tk-t\">uint16_t</span> *c3)","{","    <span class=\"tk-k\">if</span> (c0) *c0 = s_centre[<span class=\"tk-n\">0</span>];","    <span class=\"tk-k\">if</span> (c1) *c1 = s_centre[<span class=\"tk-n\">1</span>];","    <span class=\"tk-k\">if</span> (c2) *c2 = s_centre[<span class=\"tk-n\">2</span>];","    <span class=\"tk-k\">if</span> (c3) *c3 = s_centre[<span class=\"tk-n\">3</span>];","}","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * 6. Per-axis decode with hysteresis</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * was = the direction bits that were active last tick, so an</span>","<span class=\"tk-c\"> * axis that is already deflected uses the lower release</span>","<span class=\"tk-c\"> * threshold instead of the higher activate threshold.</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint16_t</span> <span class=\"tk-f\">axis_bits</span>(<span class=\"tk-t\">uint16_t</span> raw, <span class=\"tk-t\">uint16_t</span> centre,","                          <span class=\"tk-t\">uint16_t</span> negBit, <span class=\"tk-t\">uint16_t</span> posBit,","                          <span class=\"tk-t\">uint16_t</span> was, <span class=\"tk-t\">uint8_t</span> invert)","{","    <span class=\"tk-t\">int32_t</span>  d   = (<span class=\"tk-t\">int32_t</span>)raw - (<span class=\"tk-t\">int32_t</span>)centre;","    <span class=\"tk-t\">uint16_t</span> out = <span class=\"tk-n\">0</span>;","","    <span class=\"tk-k\">if</span> (invert) d = -d;","","    <span class=\"tk-k\">if</span> ((was &amp; posBit) &amp;&amp; d &gt;  <span class=\"tk-n\">JOY_OFF</span>) out |= posBit;","    <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> (d &gt;  <span class=\"tk-n\">JOY_ON</span>)               out |= posBit;","","    <span class=\"tk-k\">if</span> ((was &amp; negBit) &amp;&amp; d &lt; -<span class=\"tk-n\">JOY_OFF</span>) out |= negBit;","    <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> (d &lt; -<span class=\"tk-n\">JOY_ON</span>)               out |= negBit;","","    <span class=\"tk-k\">return</span> out;","}","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * 7. Poll</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Input_Poll</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">uint16_t</span> raw = <span class=\"tk-n\">0</span>;","    <span class=\"tk-t\">uint16_t</span> agree;","    <span class=\"tk-t\">uint32_t</span> e = <span class=\"tk-n\">GPIOE</span>-&gt;<span class=\"tk-n\">IDR</span>;","    <span class=\"tk-t\">uint32_t</span> c = <span class=\"tk-n\">GPIOC</span>-&gt;<span class=\"tk-n\">IDR</span>;","    <span class=\"tk-t\">uint32_t</span> b = <span class=\"tk-n\">GPIOB</span>-&gt;<span class=\"tk-n\">IDR</span>;","","    <span class=\"tk-c\">/* buttons are wired to ground, so a pressed button reads 0 */</span>","    <span class=\"tk-k\">if</span> (!(e &amp; (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">PIN_BTN_UP</span>)))    raw |= <span class=\"tk-n\">BTN_UP</span>;","    <span class=\"tk-k\">if</span> (!(e &amp; (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">PIN_BTN_DOWN</span>)))  raw |= <span class=\"tk-n\">BTN_DOWN</span>;","    <span class=\"tk-k\">if</span> (!(e &amp; (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">PIN_BTN_LEFT</span>)))  raw |= <span class=\"tk-n\">BTN_LEFT</span>;","    <span class=\"tk-k\">if</span> (!(e &amp; (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">PIN_BTN_RIGHT</span>))) raw |= <span class=\"tk-n\">BTN_RIGHT</span>;","    <span class=\"tk-k\">if</span> (!(c &amp; (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">PIN_J1_SW</span>)))     raw |= <span class=\"tk-n\">BTN_J1SW</span>;","    <span class=\"tk-k\">if</span> (!(c &amp; (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">PIN_J2_SW</span>)))     raw |= <span class=\"tk-n\">BTN_J2SW</span>;","    <span class=\"tk-k\">if</span> (!(b &amp; (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">PIN_BACK</span>)))      raw |= <span class=\"tk-n\">BTN_BACK</span>;","","    <span class=\"tk-c\">/* --- sticks ------------------------------------------------- */</span>","    s_raw[<span class=\"tk-n\">0</span>] = <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-n\">CH_J1X</span>);","    s_raw[<span class=\"tk-n\">1</span>] = <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-n\">CH_J1Y</span>);","    s_raw[<span class=\"tk-n\">2</span>] = <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-n\">CH_J2X</span>);","    s_raw[<span class=\"tk-n\">3</span>] = <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-n\">CH_J2Y</span>);","","    raw |= <span class=\"tk-f\">axis_bits</span>(s_raw[<span class=\"tk-n\">0</span>], s_centre[<span class=\"tk-n\">0</span>], <span class=\"tk-n\">J1_LEFT</span>, <span class=\"tk-n\">J1_RIGHT</span>, s_held, <span class=\"tk-n\">JOY_INVERT_X</span>);","    raw |= <span class=\"tk-f\">axis_bits</span>(s_raw[<span class=\"tk-n\">1</span>], s_centre[<span class=\"tk-n\">1</span>], <span class=\"tk-n\">J1_DOWN</span>, <span class=\"tk-n\">J1_UP</span>,    s_held, <span class=\"tk-n\">JOY_INVERT_Y</span>);","    raw |= <span class=\"tk-f\">axis_bits</span>(s_raw[<span class=\"tk-n\">2</span>], s_centre[<span class=\"tk-n\">2</span>], <span class=\"tk-n\">J2_LEFT</span>, <span class=\"tk-n\">J2_RIGHT</span>, s_held, <span class=\"tk-n\">JOY_INVERT_X</span>);","    raw |= <span class=\"tk-f\">axis_bits</span>(s_raw[<span class=\"tk-n\">3</span>], s_centre[<span class=\"tk-n\">3</span>], <span class=\"tk-n\">J2_DOWN</span>, <span class=\"tk-n\">J2_UP</span>,    s_held, <span class=\"tk-n\">JOY_INVERT_Y</span>);","","    <span class=\"tk-c\">/* --- debounce -----------------------------------------------</span>","<span class=\"tk-c\">     * A bit may only change s_held if two consecutive samples</span>","<span class=\"tk-c\">     * agreed about it.  At a 10 ms tick that is a 20 ms filter,</span>","<span class=\"tk-c\">     * which is longer than tactile-switch bounce.</span>","<span class=\"tk-c\">     * ------------------------------------------------------------ */</span>","    agree     = (<span class=\"tk-t\">uint16_t</span>)~(raw ^ s_lastRaw);","    s_held    = (<span class=\"tk-t\">uint16_t</span>)((s_held &amp; ~agree) | (raw &amp; agree));","    s_lastRaw = raw;","","    s_edge |= (<span class=\"tk-t\">uint16_t</span>)(s_held &amp; ~s_prev);","    s_prev  = s_held;","}","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * Analog axis</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Subtract the dead zone rather than just zeroing inside it,</span>","<span class=\"tk-c\"> * otherwise the stick would jump from 0 to a large value the</span>","<span class=\"tk-c\"> * instant it leaves the dead zone.  This way the output starts</span>","<span class=\"tk-c\"> * from 0 at the edge of the dead zone and rises smoothly.</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-t\">int16_t</span> <span class=\"tk-f\">Input_JoyAxis</span>(<span class=\"tk-t\">uint8_t</span> idx)","{","    <span class=\"tk-t\">int32_t</span> d;","","    <span class=\"tk-k\">if</span> (idx &gt; <span class=\"tk-n\">3</span>) <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>;","","    d = (<span class=\"tk-t\">int32_t</span>)s_raw[idx] - (<span class=\"tk-t\">int32_t</span>)s_centre[idx];","    <span class=\"tk-k\">if</span> (idx &amp; <span class=\"tk-n\">1</span>) { <span class=\"tk-k\">if</span> (<span class=\"tk-n\">JOY_INVERT_Y</span>) d = -d; }","    <span class=\"tk-k\">else</span>         { <span class=\"tk-k\">if</span> (<span class=\"tk-n\">JOY_INVERT_X</span>) d = -d; }","","    <span class=\"tk-k\">if</span> (d &gt; -<span class=\"tk-n\">JOY_DEAD</span> &amp;&amp; d &lt; <span class=\"tk-n\">JOY_DEAD</span>) <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>;","    d = (d &gt; <span class=\"tk-n\">0</span>) ? (d - <span class=\"tk-n\">JOY_DEAD</span>) : (d + <span class=\"tk-n\">JOY_DEAD</span>);","","    d = (d * <span class=\"tk-n\">512</span>) / (<span class=\"tk-n\">2048</span> - <span class=\"tk-n\">JOY_DEAD</span>);","    <span class=\"tk-k\">if</span> (d &gt;  <span class=\"tk-n\">511</span>) d =  <span class=\"tk-n\">511</span>;","    <span class=\"tk-k\">if</span> (d &lt; -<span class=\"tk-n\">512</span>) d = -<span class=\"tk-n\">512</span>;","    <span class=\"tk-k\">return</span> (<span class=\"tk-t\">int16_t</span>)d;","}","","<span class=\"tk-t\">uint16_t</span> <span class=\"tk-f\">Input_Held</span>(<span class=\"tk-t\">void</span>) { <span class=\"tk-k\">return</span> s_held; }","","<span class=\"tk-t\">uint16_t</span> <span class=\"tk-f\">Input_Pressed</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">uint16_t</span> e = s_edge;","    s_edge = <span class=\"tk-n\">0</span>;","    <span class=\"tk-k\">return</span> e;","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Input_Flush</span>(<span class=\"tk-t\">void</span>)","{","    s_edge = <span class=\"tk-n\">0</span>;","}","","<span class=\"tk-t\">uint32_t</span> <span class=\"tk-f\">Input_AdcFaults</span>(<span class=\"tk-t\">void</span>) { <span class=\"tk-k\">return</span> s_adcFaults; }","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * Bring-up diagnostics</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">pullup_if_input</span>(GPIO_TypeDef *port, <span class=\"tk-t\">uint8_t</span> pin)","{","    <span class=\"tk-k\">if</span> (((port-&gt;<span class=\"tk-n\">MODER</span> &gt;&gt; (pin * <span class=\"tk-n\">2</span>)) &amp; <span class=\"tk-n\">3UL</span>) != <span class=\"tk-n\">0</span>) <span class=\"tk-k\">return</span>;   <span class=\"tk-c\">/* not a plain input */</span>","    port-&gt;<span class=\"tk-n\">PUPDR</span> = (port-&gt;<span class=\"tk-n\">PUPDR</span> &amp; ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (pin * <span class=\"tk-n\">2</span>))) | (<span class=\"tk-n\">1UL</span> &lt;&lt; (pin * <span class=\"tk-n\">2</span>));","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Input_DiagInit</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">uint8_t</span> i;","","    <span class=\"tk-n\">RCC</span>-&gt;<span class=\"tk-n\">AHB1ENR</span> |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">2</span>) | (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">4</span>);      <span class=\"tk-c\">/* GPIOC, GPIOE */</span>","","    <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt;= <span class=\"tk-n\">6</span>;  i++) <span class=\"tk-f\">pullup_if_input</span>(<span class=\"tk-n\">GPIOE</span>, i);","    <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">4</span>; i &lt;= <span class=\"tk-n\">12</span>; i++) <span class=\"tk-f\">pullup_if_input</span>(<span class=\"tk-n\">GPIOC</span>, i);","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Input_ScanLow</span>(<span class=\"tk-t\">uint16_t</span> *portE, <span class=\"tk-t\">uint16_t</span> *portC)","{","    <span class=\"tk-t\">uint32_t</span> e = <span class=\"tk-n\">GPIOE</span>-&gt;<span class=\"tk-n\">IDR</span>, c = <span class=\"tk-n\">GPIOC</span>-&gt;<span class=\"tk-n\">IDR</span>;","","    <span class=\"tk-c\">/* a bit set here means \"this pin is being pulled LOW\" */</span>","    <span class=\"tk-k\">if</span> (portE) *portE = (<span class=\"tk-t\">uint16_t</span>)((~e) &amp; <span class=\"tk-n\">0x007Fu</span>);            <span class=\"tk-c\">/* PE0..PE6   */</span>","    <span class=\"tk-k\">if</span> (portC) *portC = (<span class=\"tk-t\">uint16_t</span>)((~c) &amp; <span class=\"tk-n\">0x1FF0u</span>);            <span class=\"tk-c\">/* PC4..PC12  */</span>","}"],"App/input.h":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * input.h - buttons + analog joysticks</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * PIN MAP  (verified free: not used by the FSMC LCD, the SPI</span>","<span class=\"tk-c\"> *           touch panel, or the LCD backlight - see PINMAP.md)</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> *   UP     button    PE1   input, internal pull-up, active LOW</span>","<span class=\"tk-c\"> *   DOWN   button    PE2</span>","<span class=\"tk-c\"> *   LEFT   button    PE3</span>","<span class=\"tk-c\"> *   RIGHT  button    PE4</span>","<span class=\"tk-c\"> *   BACK             PB8   on-board KEY1 (already pulled up by Driver_GPIO)</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> *   Joystick 1  VRx  PC0   ADC1_IN10</span>","<span class=\"tk-c\"> *               VRy  PC1   ADC1_IN11</span>","<span class=\"tk-c\"> *               SW   PC4   input, internal pull-up, active LOW</span>","<span class=\"tk-c\"> *   Joystick 2  VRx  PC2   ADC1_IN12</span>","<span class=\"tk-c\"> *               VRy  PC3   ADC1_IN13</span>","<span class=\"tk-c\"> *               SW   PC5   input, internal pull-up, active LOW</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> *   &gt;&gt;&gt; Power the joystick modules from 3.3V, NOT 5V. &lt;&lt;&lt;</span>","<span class=\"tk-c\"> *   They are potentiometer dividers; on 5V the wiper would drive</span>","<span class=\"tk-c\"> *   5V into an ADC pin whose absolute maximum is VDDA (3.3V).</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#ifndef</span> __INPUT_H","<span class=\"tk-p\">#define</span> __INPUT_H","","<span class=\"tk-p\">#include</span> &lt;stdint.h&gt;","","<span class=\"tk-c\">/* ---- bit mask returned by Input_Held() / Input_Pressed() ---- */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_UP</span>        <span class=\"tk-n\">0x0001u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_DOWN</span>      <span class=\"tk-n\">0x0002u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_LEFT</span>      <span class=\"tk-n\">0x0004u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_RIGHT</span>     <span class=\"tk-n\">0x0008u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_J1SW</span>      <span class=\"tk-n\">0x0010u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_J2SW</span>      <span class=\"tk-n\">0x0020u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_BACK</span>      <span class=\"tk-n\">0x0040u</span>   <span class=\"tk-c\">/* on-board KEY1, PB8 */</span>","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">J1_UP</span>         <span class=\"tk-n\">0x0100u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">J1_DOWN</span>       <span class=\"tk-n\">0x0200u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">J1_LEFT</span>       <span class=\"tk-n\">0x0400u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">J1_RIGHT</span>      <span class=\"tk-n\">0x0800u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">J2_UP</span>         <span class=\"tk-n\">0x1000u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">J2_DOWN</span>       <span class=\"tk-n\">0x2000u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">J2_LEFT</span>       <span class=\"tk-n\">0x4000u</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">J2_RIGHT</span>      <span class=\"tk-n\">0x8000u</span>","","<span class=\"tk-c\">/* convenience groups */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">ANY_UP</span>        (<span class=\"tk-n\">BTN_UP</span>    | <span class=\"tk-n\">J1_UP</span>    | <span class=\"tk-n\">J2_UP</span>)","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">ANY_DOWN</span>      (<span class=\"tk-n\">BTN_DOWN</span>  | <span class=\"tk-n\">J1_DOWN</span>  | <span class=\"tk-n\">J2_DOWN</span>)","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">ANY_LEFT</span>      (<span class=\"tk-n\">BTN_LEFT</span>  | <span class=\"tk-n\">J1_LEFT</span>  | <span class=\"tk-n\">J2_LEFT</span>)","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">ANY_RIGHT</span>     (<span class=\"tk-n\">BTN_RIGHT</span> | <span class=\"tk-n\">J1_RIGHT</span> | <span class=\"tk-n\">J2_RIGHT</span>)","","<span class=\"tk-t\">void</span>     <span class=\"tk-f\">Input_Init</span>(<span class=\"tk-t\">void</span>);      <span class=\"tk-c\">/* GPIO + ADC + centre calibration      */</span>","<span class=\"tk-t\">void</span>     <span class=\"tk-f\">Input_Poll</span>(<span class=\"tk-t\">void</span>);      <span class=\"tk-c\">/* call once per ~10 ms game tick       */</span>","<span class=\"tk-t\">uint16_t</span> <span class=\"tk-f\">Input_Held</span>(<span class=\"tk-t\">void</span>);      <span class=\"tk-c\">/* level:  1 = currently down           */</span>","<span class=\"tk-t\">uint16_t</span> <span class=\"tk-f\">Input_Pressed</span>(<span class=\"tk-t\">void</span>);   <span class=\"tk-c\">/* edge:   1 = went down since last read*/</span>","<span class=\"tk-t\">void</span>     <span class=\"tk-f\">Input_Flush</span>(<span class=\"tk-t\">void</span>);     <span class=\"tk-c\">/* discard any pending edges            */</span>","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * Analog read, for games that want more than four directions.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> *   idx 0 = J1 X, 1 = J1 Y, 2 = J2 X, 3 = J2 Y</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Returns the deflection from the measured centre, scaled to</span>","<span class=\"tk-c\"> * -512 .. +511, and exactly 0 inside the dead zone.  Sign follows</span>","<span class=\"tk-c\"> * the direction bits: positive X is J*_RIGHT, positive Y is</span>","<span class=\"tk-c\"> * J*_UP - so screen movement is  vx = +axis,  vy = -axis.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Uses the sample taken by the last Input_Poll(), so it costs</span>","<span class=\"tk-c\"> * nothing to call it several times per frame.</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-t\">int16_t</span> <span class=\"tk-f\">Input_JoyAxis</span>(<span class=\"tk-t\">uint8_t</span> idx);","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * Bring-up diagnostics (used by the I/O TEST screen)</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Input_DiagInit() switches on the internal pull-up of every</span>","<span class=\"tk-c\"> * candidate button pin that is still a plain input, so a pin</span>","<span class=\"tk-c\"> * with nothing attached reads HIGH instead of floating randomly.</span>","<span class=\"tk-c\"> * After that, Input_ScanLow() reports which pins are being held</span>","<span class=\"tk-c\"> * LOW - i.e. which pin your button is really on.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * It only ever touches PUPDR, never MODER, and skips any pin</span>","<span class=\"tk-c\"> * something else has already claimed as an output or an</span>","<span class=\"tk-c\"> * alternate function.  So it cannot fight the LCD or the touch</span>","<span class=\"tk-c\"> * panel.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Scanned: PE0..PE6 and PC4..PC12.  PE7+ is the FSMC LCD,</span>","<span class=\"tk-c\"> * PC13 is the touch chip select, PC0..PC3 are the analog axes.</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Input_DiagInit</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Input_ScanLow</span>(<span class=\"tk-t\">uint16_t</span> *portE, <span class=\"tk-t\">uint16_t</span> *portC);","","<span class=\"tk-c\">/* Number of ADC conversions that never raised EOC.  Anything</span>","<span class=\"tk-c\"> * other than 0 means the ADC itself is misconfigured, as opposed</span>","<span class=\"tk-c\"> * to the joystick simply not being wired up. */</span>","<span class=\"tk-t\">uint32_t</span> <span class=\"tk-f\">Input_AdcFaults</span>(<span class=\"tk-t\">void</span>);","","<span class=\"tk-c\">/* raw helpers, handy while debugging the wiring */</span>","<span class=\"tk-t\">uint16_t</span> <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-t\">uint8_t</span> ch);          <span class=\"tk-c\">/* ch = 10..13               */</span>","<span class=\"tk-t\">void</span>     <span class=\"tk-f\">Input_JoyCentre</span>(<span class=\"tk-t\">uint16_t</span> *c0, <span class=\"tk-t\">uint16_t</span> *c1,","                         <span class=\"tk-t\">uint16_t</span> *c2, <span class=\"tk-t\">uint16_t</span> *c3);","<span class=\"tk-t\">void</span>     <span class=\"tk-f\">Input_Recalibrate</span>(<span class=\"tk-t\">void</span>);","","<span class=\"tk-p\">#endif</span> <span class=\"tk-c\">/* __INPUT_H */</span>"],"App/sound.c":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * sound.c - TIM3_CH1 (PA6) PWM square-wave generator</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"stm32f4xx.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"user_defined.h\"</span>      <span class=\"tk-c\">/* msTick */</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"sound.h\"</span>","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PIN_SPK</span>   <span class=\"tk-n\">6</span>            <span class=\"tk-c\">/* PA6 = TIM3_CH1, alternate function 2 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">AF_TIM3</span>   <span class=\"tk-n\">2</span>","","<span class=\"tk-c\">/* computed by stm32f4_Hardware_Init() in HardwareSystem_Ini.c */</span>","<span class=\"tk-k\">extern</span> <span class=\"tk-t\">uint32_t</span> PCLK1_Freq;","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint32_t</span> s_timClk;          <span class=\"tk-c\">/* TIM3 counter clock, Hz            */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span>  s_muted;","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint32_t</span> s_noteEnd;         <span class=\"tk-c\">/* msTick value when the note stops  */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Note *s_seq;          <span class=\"tk-c\">/* melody being played, or 0         */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span>  s_seq
