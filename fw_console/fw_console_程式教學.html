點過的情況真的算過。",tgt:{f:"App/game_dino.c",l:145}},{id:"scr",x:205,y:542,w:220,h:50,t:"分數 = 距離 / 8",cls:"io",sub:"每 100 分一個音",cap:"高分存在 RAM，關機就沒了。",tgt:{f:"App/game_dino.c",l:585}}],edges:[{a:"st",b:"gr"},{a:"st",b:"ai",side:"r"},{a:"gr",b:"sc"},{a:"ai",b:"sc",side:"l"},{a:"sc",b:"sp"},{a:"sp",b:"cl"},{a:"sp",b:"gd"},{a:"sp",b:"dd"},{a:"gd",b:"mv"},{a:"mv",b:"hit"},{a:"hit",b:"scr"}]},html:"\n<h3>跳躍弧線：四個整數決定手感</h3>\n<p><button class=\"jump\" data-f=\"App/game_dino.c\" data-l=\"57\">四個常數</button>把整個物理定完了：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">#define GRAVITY16      5        /* 每幀速度加 5/16 像素   */\n#define JUMP_V16    (-102)      /* 起跳 −102/16 像素/幀   */\n#define SPEED_MIN16   48        /* 3.0 像素/幀            */\n#define SPEED_MAX16  128        /* 8.0 像素/幀            */</pre>\n<p>單位是 1/16 像素。變數名稱結尾的 <code>16</code> 就是提醒。要換成真正的像素就除以 16，而 16 是 2 的次方，編譯器用一個位移指令解決。</p>\n<p>算一下這組數字給出什麼：起跳速度 −102、每幀加 5，20 幀後速度歸零。上升的總距離是 102+97+…+2 除以 16，約 62 像素。再 20 幀落地，所以滯空 40 幀 = 0.8 秒。恐龍高 34 像素，最高的仙人掌 34 像素——跳躍高度大約是障礙物高度的兩倍，時機有容錯空間但不會太寬鬆。</p>\n<p><button class=\"jump\" data-f=\"App/game_dino.c\" data-l=\"291\">物理更新</button>是兩行整數加法。另外還有一個細節：在空中按下時會額外多加一次重力，讓玩家可以「快速下墜」，這在原版 Chrome Dino 裡也有。</p>\n\n<h3>捲動用餘數累加</h3>\n<p>速度是 1/16 像素，但螢幕只能整數像素。<button class=\"jump\" data-f=\"App/game_dino.c\" data-l=\"553\">做法</button>是把速度累加進一個餘數，每幀取出整數部分，餘數留給下一幀：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">s_scrollRem += s_speed16;\nstep = (uint8_t)(s_scrollRem / 16);\ns_scrollRem %= 16;</pre>\n<p>於是 3.0 像素／幀真的是平均 3.0，而不是被截成 3 或 4。這是定點數最實用的地方。</p>\n\n<h3>生成規則：間距要跟著速度長大</h3>\n<p><button class=\"jump\" data-f=\"App/game_dino.c\" data-l=\"340\">obst_maybe_spawn()</button> 的第一件事是算出這次需要的間距，而間距和速度成正比：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">int16_t gapMin = (int16_t)(110 + (s_speed16 * 12) / 16);\nint16_t gap    = (int16_t)(gapMin + (int16_t)(rnd() % 120));\n\nif (rightmost_obst() &gt; (int16_t)(SCR_W - gap)) return;</pre>\n<p>如果間距固定，速度從 150 爬到 400 像素／秒之後，反應時間就只剩三分之一，遊戲會從「難」變成「不可能」。把間距綁上速度，反應時間大致守住。</p>\n<p><button class=\"jump\" data-f=\"App/game_dino.c\" data-l=\"315\">rightmost_obst()</button> 回傳最右側障礙物的右緣，沒有障礙物時回傳 −1000。這個哨兵值讓「畫面上沒東西就一定生成」不需要特別寫成一個分支。</p>\n<p>障礙物用固定大小的陣列加 <code>active</code> 旗標，最多三個同時存在。沒有動態配置——理由在第 10 章會講。</p>\n\n<h3>碰撞：反過來想比較好寫</h3>\n<p><button class=\"jump\" data-f=\"App/game_dino.c\" data-l=\"145\">dino_hits()</button> 呼叫一個通用的矩形重疊判斷，而它的寫法是<b>找分離軸</b>：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">if (ax + aw &lt;= bx || bx + bw &lt;= ax) return 0;   /* X 上分開 */\nif (ay + ah &lt;= by || by + bh &lt;= ay) return 0;   /* Y 上分開 */\nreturn 1;</pre>\n<p>直接證明「重疊」要考慮好幾種相對位置；證明「分開」只要找到一條軸。下面可以拖動兩個框，看四個比較分別成立不成立。</p>\n<p>另外框比 sprite 內縮幾個像素（站立時 22×28，而 sprite 是 31×34）。這讓視覺上「差一點擦過去」真的算過去。純幾何正確的碰撞框在遊戲裡通常感覺很爛。</p>\n\n<h3>教學關：共用同一段物理，所以恐龍是活的</h3>\n<p><button class=\"jump\" data-f=\"App/game_dino.c\" data-l=\"384\">dino_tutorial()</button> 不是一串靜態說明。它有自己的主迴圈，而且呼叫的是<b>同一個</b> <code>dino_step()</code>。所以教學進行中恐龍完全可以操作——玩家在被教的同時已經在練。</p>\n<p><button class=\"jump\" data-f=\"App/game_dino.c\" data-l=\"374\">步驟表</button>是一個陣列，每一項有兩行文字和一個「要等什麼輸入」的遮罩：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">{ \"PRESS  UP\",         \"the dino jumps\",         BTN_UP,            0 },\n{ \"HOLD  DOWN\",        \"the dino ducks\",         BTN_DOWN,          0 },\n{ \"PUSH A STICK UP\",   \"either stick jumps too\", J1_UP | J2_UP,     0 },\n{ \"PULL A STICK DOWN\", \"either stick ducks too\", J1_DOWN | J2_DOWN, 0 },\n{ \"JUMP THE CACTUS\",   \"wait for it, then press UP\", 0,             1 },</pre>\n<p>前四步只要對應的位元出現在 <code>pressed</code> 裡就過關。第五步的 <code>cactus</code> 旗標是 1，改成等「障礙物通過」這個事件。</p>\n<p>這裡有一個曾經寫錯的地方值得看：一開始「通過」和「跳躍」共用同一個回傳位元，結果第五步在玩家<b>按下跳躍鍵的那一刻</b>就過關了，仙人掌還沒到。修法是把「清掉了」用一個獨立的區域變數 <code>cleared</code> 記，和「玩家做了什麼」分開。<b>兩個語意不同的事件不要擠進同一個旗標</b>。</p>\n",demos:["collide"],ex:[{id:"c8a",type:"fill",q:"補完矩形重疊判斷裡「X 軸上分開」那一行的條件（a 和 b 兩個框，欄位是 x/y/w/h）。",ph:"if ( ... ) return 0;",need:[[/ax\s*\+\s*aw/,"一邊是 ax + aw"],[/bx\s*\+\s*bw/,"另一邊是 bx + bw"],[/\|\|/,"兩種情況要用 || 串起來"],[/<=/,"用 &lt;= 而不是 &lt;：剛好貼齊不算撞到"]],ans:"if (ax + aw &lt;= bx || bx + bw &lt;= ax) return 0;",fb:"兩種分開的情況：a 整個在 b 左邊，或 b 整個在 a 左邊。用 <code>&lt;=</code> 讓剛好貼齊算成沒撞到。上面的示範可以把兩個框推到剛好相鄰驗證。"},{id:"c8b",type:"mc",q:"如果障礙物間距寫成固定值而不是跟著速度長大，會發生什麼？",opts:["障礙物會重疊","速度爬到最高之後反應時間只剩三分之一，遊戲變成不可能","分數會算錯","雲會停止移動"],ans:1,fb:"速度從 150 爬到 400 像素／秒，間距不變的話，兩個障礙物之間的<b>時間</b>就縮成不到三分之一。把間距綁上 <code>s_speed16</code> 讓反應時間大致守住，遊戲才是「越來越難」而不是「突然不可能」。"},{id:"c8c",type:"mc",q:"教學第五步原本在玩家按下跳躍鍵的瞬間就過關，而不是等仙人掌通過。根本原因是？",opts:["按鍵去彈跳沒做","「玩家跳了」和「障礙物清掉了」共用同一個回傳位元","TICK_MS 太小","仙人掌生成得太慢"],ans:1,fb:"<code>dino_step()</code> 的回傳值用 bit 0 表示「這一幀起跳了」，而通過檢查也往同一個變數塞 bit 0。兩個語意不同的事件擠在一個旗標裡，就分不出來了。修法是用一個獨立的 <code>cleared</code> 變數。"}]},{n:9,title:"2048",problem:"盤面邏輯是這台機器唯一「純演算法」的部分，沒有時間、沒有硬體，只有一個 4×4 陣列和一次移動要怎麼變換它。這一章把那個三段式拆開，並解釋為什麼四個方向各寫一份反而是對的選擇。",files:["App/game_2048.c"],focus:{f:"App/game_2048.c",l:119},flowName:"一次滑動的完整路徑",flowHint:"注意 moved 這個回傳值控制了後面所有事。",flow:{w:620,h:620,nodes:[{id:"tp",x:200,y:10,w:220,h:46,t:"poll_touch()",cls:"io",sub:"按下 → 追蹤 → 放開",cap:"放開也要去彈跳：連續三次沒摸到才算真的放手。",tgt:{f:"App/game_2048.c",l:386}},{id:"sd",x:200,y:82,w:220,h:50,t:"swipe_dir(dx, dy)",cls:"dec",sub:"主軸決定方向，太短就忽略",cap:"位移不足 SWIPE_MIN（28 像素）回傳 SW_NONE，避免點一下被當成滑動。",tgt:{f:"App/game_2048.c",l:361}},{id:"ml",x:200,y:158,w:220,h:46,t:"Move_Left() 等四個",sub:"回傳 moved",cap:"四個方向各一份，各自只有一層索引。",tgt:{f:"App/game_2048.c",l:119}},{id:"s1",x:25,y:232,w:175,h:50,t:"① 壓縮",sub:"非零的往左靠",cap:"先擠掉空格，合併才看得出相鄰。"},{id:"s2",x:222,y:232,w:175,h:50,t:"② 合併",cls:"dec",sub:"相鄰相等就加倍",cap:"從左到右不回頭，所以一顆磁磚一次只合一次。"},{id:"s3",x:419,y:232,w:175,h:50,t:"③ 再壓縮",sub:"填掉合併留下的洞",cap:"② 把右邊那格清成 0，中間會破洞。"},{id:"mv",x:200,y:310,w:220,h:50,t:"moved？",cls:"dec",sub:"盤面真的變了嗎",cap:"<b>只有真的動過才繼續</b>。否則玩家亂滑無效方向也會被塞磁磚。"},{id:"ar",x:200,y:388,w:220,h:46,t:"Add_RandomTile()",sub:"隨機空格放 2 或 4",cap:"先收集所有空格再抽一個，避免「一直抽到滿格」的迴圈。",tgt:{f:"App/game_2048.c",l:99}},{id:"dr",x:200,y:460,w:220,h:46,t:"Draw_Board()",sub:"顏色用 log2 當索引",cap:"字型大小也跟著位數選，1024 才不會撐破格子。",tgt:{f:"App/game_2048.c",l:227}},{id:"ck",x:200,y:532,w:220,h:54,t:"Check_Win / Check_GameOver",cls:"dec",sub:"贏了？還是沒路了？",cap:"「沒路」= 沒有空格<b>而且</b>沒有相鄰同值。",tgt:{f:"App/game_2048.c",l:203}}],edges:[{a:"tp",b:"sd"},{a:"sd",b:"ml"},{a:"ml",b:"s1"},{a:"s1",b:"s2",side:"r"},{a:"s2",b:"s3",side:"r"},{a:"s2",b:"mv"},{a:"mv",b:"ar",lab:"是"},{a:"ar",b:"dr"},{a:"dr",b:"ck"},{a:"mv",b:"tp",side:"back",lab:"沒動：什麼都不做"}]},html:"\n<h3>三段式：壓縮、合併、再壓縮</h3>\n<p><button class=\"jump\" data-f=\"App/game_2048.c\" data-l=\"119\">Move_Left()</button> 對每一列做三件事。順序有嚴格的理由，下面的示範可以單步跑一遍。</p>\n<p><b>① 壓縮。</b>把非零的磁磚依序搬到最左邊。這一步只搬不合。理由是合併只檢查「相鄰」兩格，而 <code>[2, 0, 2, 0]</code> 中間夾著空格，不先壓縮就看不出可以合。</p>\n<p><b>② 合併。</b>從左往右掃，相鄰相等就把左邊加倍、右邊清零、加分。迴圈上限是 <code>c &lt; BOARD_N - 1</code>，而且<b>不回頭</b>。這讓 <code>[4,4,4,4]</code> 變成 <code>[8,0,8,0]</code> 而不是 <code>[16,0,0,0]</code>——一顆磁磚在同一次移動裡只能合一次，這是 2048 的規則。</p>\n<p><b>③ 再壓縮。</b>② 在中間留下了 0，要再擠一次。<code>[2,2,4,0]</code> 合併後是 <code>[4,0,4,0]</code>，第三步才變成 <code>[4,4,0,0]</code>。</p>\n\n<h3>moved 這個回傳值撐住了整個遊戲規則</h3>\n<p>三段做完之後，函式比對前後盤面，回傳「有沒有真的變化」。這個值決定後面所有事：<b>只有 moved 是 1 才生成新磁磚</b>。</p>\n<p>少了它，玩家往一個已經靠底的方向亂滑也會被塞磁磚，盤面很快填滿，遊戲壞掉。一個 <code>uint8_t</code> 回傳值就是規則本身。</p>\n\n<h3>為什麼四個方向各寫一份</h3>\n<p>「聰明」的寫法是只寫 <code>Move_Left()</code>，其他三個方向先把陣列轉置或翻轉、呼叫它、再轉回來。程式碼少四分之三。</p>\n<p>這個專案沒有這樣做，四個方向各一份完整實作。理由是可讀性和可除錯性：</p>\n<ul>\n<li>每一份都只有一層索引，沒有座標轉換。<code>Move_Up()</code> 就是外圈跑 <code>c</code>、內圈跑 <code>r</code>，一眼看得出在做什麼。</li>\n<li>轉置版本一旦有 bug，你要同時懷疑「演算法錯了」和「座標轉錯了」。在沒有除錯器、只能靠 LCD 印字的環境裡，這個差別很大。</li>\n<li>多出來的程式碼不到 100 行，而這台機器的瓶頸是 32 KB 的<b>整體</b>，不是這一個函式。</li>\n</ul>\n<p>值得注意的是 <code>Move_Right()</code> 和 <code>Move_Down()</code> 的迴圈用了 <code>for (c = BOARD_N; c-- &gt; 0; )</code> 這種倒數寫法，因為索引是無號數，寫 <code>c &gt;= 0</code> 會永遠成立。</p>\n\n<h3>顏色用 log2 當索引</h3>\n<p>磁磚的值是 2 的次方，所以 <button class=\"jump\" data-f=\"App/game_2048.c\" data-l=\"86\">Log2Idx()</button> 用一個 while 迴圈數出它是 2 的幾次方，直接當顏色表的索引：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">while (v &gt; 1) { v &gt;&gt;= 1; idx++; }      /* 2→1, 4→2, 2048→11 */</pre>\n<p>13 個顏色 26 位元組，換到的是「顏色可以任意挑」和「每次只要一次陣列索引」。沒有用公式算色相，因為 2048 的配色本來就是設計出來的，不是算出來的。</p>\n<p><button class=\"jump\" data-f=\"App/game_2048.c\" data-l=\"227\">Draw_Tile()</button> 還做了一件小事：依位數選字型。四位數用 Font16（4 × 11 = 44，剛好塞滿 44 像素的格子），五位數就換 Font12。原本的課程版本全部用 Font20，於是 <code>1024</code> 是 4 × 14 = 56 像素，撐破格子。</p>\n\n<h3>滑動：主軸決定方向</h3>\n<p><button class=\"jump\" data-f=\"App/game_2048.c\" data-l=\"361\">swipe_dir()</button> 比較 dx 和 dy 的絕對值，大的那個決定方向。低於 <code>SWIPE_MIN</code>（28 像素）就回傳「沒有滑動」，避免點一下被誤判。</p>\n<p>「放開」也需要去彈跳，理由和按鍵一樣：面板讀數偶爾會有一兩次假的「沒人摸」。<button class=\"jump\" data-f=\"App/game_2048.c\" data-l=\"386\">poll_touch()</button> 要求連續三次取樣都沒摸到才承認放手，在 10 毫秒的迴圈上是 30 毫秒。少了這個，一次滑動會被切成兩次，方向還可能相反。</p>\n",demos:["move2048"],ex:[{id:"c9a",type:"fill",q:"補完 <code>Move_Left()</code> 合併階段的條件：<code>tmp[]</code> 是壓縮後的一列，要判斷第 c 格能不能和右邊合併。",ph:"if ( ... ) { tmp[c] <<= 1; ... }",need:[[/tmp\[c\]/,"要先確認 tmp[c] 不是 0"],[/tmp\[c\s*\+\s*1\]/,"要和 tmp[c+1] 比較"],[/==/,"相等判斷用 =="],[/&&/,"兩個條件用 && 串起來"]],ans:"if (tmp[c] &amp;&amp; tmp[c] == tmp[c + 1]) { tmp[c] &lt;&lt;= 1; g_score += tmp[c]; tmp[c + 1] = 0; }",fb:"<code>tmp[c]</code> 必須先判非零，否則兩個空格 <code>0 == 0</code> 也會「合併」成 0 並加 0 分。這是這個演算法最容易漏的一個條件。"},{id:"c9b",type:"mc",q:"為什麼合併之後還要再壓縮一次？",opts:["為了重新計算分數","合併把右邊那格清成 0，中間會出現空格","為了偵測遊戲結束","為了讓動畫比較順"],ans:1,fb:"<code>[2,2,4,0]</code> 壓縮後是 <code>[2,2,4,0]</code>，合併後是 <code>[4,0,4,0]</code> —— 中間破了一個洞。第三步把它擠成 <code>[4,4,0,0]</code>。上面的示範可以單步看這三個階段。"},{id:"c9c",type:"mc",q:"<code>Move_Left()</code> 回傳的 <code>moved</code> 如果永遠回傳 1，遊戲會怎麼壞？",opts:["分數會算錯","玩家往已經靠底的方向亂滑也會生成新磁磚，盤面很快被填滿","顏色會錯","觸控會失效"],ans:1,fb:"生成新磁磚的前提是「這次移動真的改變了盤面」。少了這個判斷，無效的滑動也會被獎勵一顆新磁磚，遊戲的節奏整個壞掉。一個回傳值撐住了規則。"}]},{n:10,title:"Gate Keeper",problem:"四條通道、四顆按鍵、一支搖桿要同時顧。這一章講那組看起來很怪的通道座標表為什麼要這樣寫、冷卻時間怎麼把遊戲從比手速變成比時機，以及為什麼所有實體都用固定陣列而不是動態配置。",files:["App/game_gate.c"],focus:{f:"App/game_gate.c",l:74},flowName:"一幀的 Gate Keeper",flowHint:"注意 render() 裡「先擦後畫」的順序。",flow:{w:640,h:640,nodes:[{id:"fi",x:195,y:10,w:240,h:50,t:"四顆按鍵 → fire(lane)",cls:"dec",sub:"冷卻中就直接 return",cap:"一行判斷決定了這個遊戲考時機而不是手速。",tgt:{f:"App/game_gate.c",l:376}},{id:"wv",x:195,y:82,w:240,h:50,t:"波次控制",sub:"清空了才進下一波",cap:"波次越高，數量越多、間隔越短、速度越快。",tgt:{f:"App/game_gate.c",l:584}},{id:"se",x:195,y:154,w:240,h:50,t:"spawn_enemy()",sub:"隨機通道，檢查入口沒塞住",cap:"同一條通道入口附近已經有敵人就放棄這次生成。",tgt:{f:"App/game_gate.c",l:387}},{id:"mc",x:30,y:232,w:200,h:50,t:"move_collector()",cls:"io",sub:"搖桿類比值 → 位置",cap:"用 Input_JoyAxis() 除以 110，最高約 4.6 像素/幀。",tgt:{f:"App/game_gate.c",l:499}},{id:"sw",x:400,y:232,w:210,h:50,t:"step_world()",cls:"dec",sub:"脈衝外推 · 敵人內推 · 判定",cap:"一個函式做完所有世界更新，完全不碰畫面。",tgt:{f:"App/game_gate.c",l:463}},{id:"ki",x:400,y:306,w:210,h:46,t:"距離差 ≤ 9 就擊殺",sub:"同一條通道才比",cap:"脈衝和敵人都用「離核心多遠」表示，判定變成一維。"},{id:"wi",x:30,y:306,w:200,h:46,t:"撿到掉落物",sub:"分數 / 補血 / 清場",cap:"兩軸距離都小於半徑加 6 就算撿到。"},{id:"rd",x:195,y:382,w:240,h:46,t:"render()",cls:"dec",sub:"順序 = 圖層",cap:"先擦收集器舊位置，再畫車道、核心、掉落物，最後畫收集器。",tgt:{f:"App/game_gate.c",l:546}},{id:"e1",x:25,y:454,w:180,h:44,t:"① 擦舊收集器",sub:"下面的重畫會補回來",cap:"先擦的理由：擦出來的洞會被後面的車道重繪填掉。"},{id:"e2",x:222,y:454,w:180,h:44,t:"② 四條車道",sub:"各自一個 band",cap:"每條車道的 band 都停在核心外面，所以不會互相覆蓋。",tgt:{f:"App/game_gate.c",l:179}},{id:"e3",x:419,y:454,w:190,h:44,t:"③ 核心 ④ 掉落物 ⑤ 收集器",sub:"最後畫的在最上層",cap:"收集器是開口的方框，遮住的畫面最少。"},{id:"hu",x:195,y:528,w:240,h:50,t:"hud_update()",cls:"io",sub:"只有值變了才重畫",cap:"記住目前顯示的數字，一樣就跳過。",tgt:{f:"App/game_gate.c",l:311}},{id:"hp",x:195,y:598,w:240,h:38,t:"HP 歸零 → 結束",cls:"dec",cap:"被突破一次扣一血，連段歸零。"}],edges:[{a:"fi",b:"wv"},{a:"wv",b:"se"},{a:"se",b:"mc"},{a:"se",b:"sw"},{a:"sw",b:"ki"},{a:"mc",b:"wi"},{a:"ki",b:"rd"},{a:"wi",b:"rd"},{a:"rd",b:"e1"},{a:"e1",b:"e2",side:"r"},{a:"e2",b:"e3",side:"r"},{a:"e2",b:"hu"},{a:"hu",b:"hp"}]},html:"\n<h3>那組看起來很怪的通道座標</h3>\n<p>README 特別註明這一段會讓人困惑，值得拆開。問題出在螢幕是 320 × 240 而不是正方形：<b>左右通道 148 像素，上下只有 92</b>。</p>\n<p>如果所有敵人都用同樣的像素速度，上下通道的敵人只給你 62% 的反應時間。玩家不會知道為什麼，只會覺得這遊戲怪。</p>\n<p>解法是 <button class=\"jump\" data-f=\"App/game_gate.c\" data-l=\"84\">lane_scale()</button>：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">static int16_t lane_scale(uint8_t l, int16_t v)\n{\n    return (l &lt; LN_LEFT) ? (int16_t)((int32_t)v * LANE_V / LANE_H) : v;\n}</pre>\n<p>所有速度——敵人、脈衝——在生成時都先過這個函式。於是每個敵人走進來的<b>時間</b>相同，而像素速度不同。玩家完全察覺不到，但少了它遊戲就不公平。</p>\n<p>另一半是 <button class=\"jump\" data-f=\"App/game_gate.c\" data-l=\"74\">LB[] 這張表</button>。四條通道各有一個矩形，用同一組參數算出來：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">{ CX - LANE_W/2,        CY - LANE_V - LANE_PAD, LANE_W, LANE_V - CORE_R + LANE_PAD },\n{ CX - LANE_W/2,        CY + CORE_R + 1,        LANE_W, LANE_V - CORE_R + LANE_PAD },\n{ CX - LANE_H - LANE_PAD, CY - LANE_W/2,       LANE_H - CORE_R + LANE_PAD, LANE_W },\n{ CX + CORE_R + 1,        CY - LANE_W/2,       LANE_H - CORE_R + LANE_PAD, LANE_W },</pre>\n<p>看懂的關鍵是三件事：每個矩形都<b>停在核心外面</b>（所以重畫車道永遠不會擦到核心，兩者不會搶同一個像素）；<code>LANE_PAD</code> 是往外多留的餘裕，讓剛生成的敵人整個菱形都在矩形內，不會被切一半；而實體位置一律用「離核心多遠」這個一維距離表示，畫的時候才換成螢幕座標。</p>\n<p>一維距離帶來一個很大的好處：擊殺判定變成 <code>|敵人距離 − 脈衝距離| ≤ 9</code>，一條通道一個減法。不需要二維碰撞。</p>\n\n<h3>260 毫秒的冷卻</h3>\n<p><button class=\"jump\" data-f=\"App/game_gate.c\" data-l=\"376\">fire()</button> 的第一行就是全部：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">if (s_pulse[lane].readyAt &gt; msTick) return;      /* 還在充能 */</pre>\n<p>沒有冷卻的話，玩家只要四顆鍵一起亂打就能通關，反應時機完全不重要，遊戲就沒有內容了。四條通道<b>各有自己的冷卻</b>，所以同時照顧四邊是可行的——難的是分配注意力，而那正是這個遊戲想考的東西。下面可以試著連打。</p>\n\n<h3>固定陣列加 active 旗標</h3>\n<p>敵人最多 14 個、掉落物最多 2 個，都是固定大小的陣列加一個 <code>active</code> 旗標。沒有 <code>malloc</code>。</p>\n<p>理由有三層。最實際的是<b>沒有堆積可以碎裂</b>：這支韌體要連續跑幾小時，動態配置在沒有作業系統的環境裡遲早會碎成一堆無法使用的空隙，而那個故障會在展示的第二十分鐘才出現。其次是<b>記憶體用量在編譯時就確定</b>，不會有「玩到某個波次突然配置失敗」這種事。第三是<b>生成變成一次線性掃描</b>：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">for (i = 0; i &lt; MAX_EN; i++) {\n    if (s_en[i].active) continue;\n    ... 填好這一格 ...\n    return;\n}\n/* 掃完沒有空位就放棄這次生成 */</pre>\n<p>「陣列滿了」變成「這一幀不生成」，一個很自然的降級，不需要錯誤處理。<code>MAX_EN</code> 設 14 是因為四條通道各三四個就已經很難了，滿了本身就代表玩家快死。</p>\n\n<h3>世界更新一步做了哪些事</h3>\n<p><button class=\"jump\" data-f=\"App/game_gate.c\" data-l=\"463\">step_world()</button> 依序做三件事：脈衝往外推、敵人往內推並檢查是否碰到核心、以及檢查脈衝和敵人的距離差。掉落物的逾時也在這裡。</p>\n<p>整個函式<b>完全不碰畫面</b>。這讓「畫面是世界狀態的函數」成立，也讓 <code>render()</code> 可以自由決定重畫哪些區塊而不影響邏輯。</p>\n\n<h3>難度曲線只有兩個函式</h3>\n<p>波次大小是 <code>6 + 2 × 波次</code>，生成間隔是 <button class=\"jump\" data-f=\"App/game_gate.c\" data-l=\"584\">spawn_gap()</button> 的 <code>1150 − 60 × 波次</code>（下限 340 毫秒），敵人速度是 <code>17 + 2 × (波次−1)</code>（上限 45）。三條直線，各有一個下限或上限。</p>\n<p>沒有難度表、沒有曲線擬合。要調整手感就改這幾個係數，而且每個係數的意義都很明確——這比一張二十筆的表好調得多。</p>\n\n<h3>HUD 只擦變動的那一小塊</h3>\n<p><button class=\"jump\" data-f=\"App/game_gate.c\" data-l=\"311\">hud_update()</button> 為每個欄位記住「目前畫上去的值」，一樣就跳過：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">if (s_hudScore != s_score) {\n    s_hudScore = s_score;\n    ... 只畫分數那一小塊 ...\n}</pre>\n<p>分數每幀都重畫會閃（文字繪製是先填背景再畫字），而且浪費時間。血條同理：只有扣血那一幀才重畫五個方塊。這是第 5 章那個原則在文字上的版本。</p>\n",demos:["lanes"],ex:[{id:"c10a",type:"fill",q:"補完「這條通道的冷卻時間到了沒有」的判斷（<code>s_pulse[lane].readyAt</code> 是可以再開火的時刻）。",ph:"if ( ... ) return;   /* 還在冷卻 */",need:[[/readyAt/,"要看 readyAt"],[/msTick/,"要和 msTick 比較"],[/>|</,"需要一個大小比較"]],ans:"if (s_pulse[lane].readyAt &gt; msTick) return;",fb:"開火成功時設 <code>readyAt = msTick + COOLDOWN_MS</code>，所以「還沒到」就是 <code>readyAt &gt; msTick</code>。更耐溢位的寫法是 <code>(int32_t)(msTick - readyAt) &lt; 0</code>，兩者在 49.7 天內等價。"},{id:"c10b",type:"mc",q:"<code>lane_scale()</code> 把上下通道的速度乘上 92/148。為什麼不乾脆把四條通道畫成一樣長？",opts:["因為那樣程式比較難寫","螢幕是 320×240，上下方向的空間本來就比左右少，畫成一樣長會浪費兩側的畫面","因為 ADC 的取樣時間不同","因為 band 緩衝區不夠大"],ans:1,fb:"要讓四條一樣長，就得把長度都縮到 92，左右兩側各空出 56 像素。與其浪費畫面，不如讓長度不同而把<b>時間</b>對齊——玩家感受到的是時間，不是像素。"},{id:"c10c",type:"mc",q:"敵人用固定 14 格的陣列加 active 旗標，而不是動態配置。在這個環境裡最實際的理由是？",opts:["固定陣列比較快","沒有作業系統的長時間執行下，堆積碎裂會在展示中途才發作，而且很難重現","malloc 在 Keil 裡不能用","這樣才能用 for 迴圈"],ans:1,fb:"速度差異其實不大。真正的理由是可預測性：記憶體用量在編譯時就確定，不會有「玩到第二十分鐘突然配置失敗」這種只在展示時出現的故障。附帶好處是「陣列滿了」變成「這一幀不生成」，一個不需要錯誤處理的自然降級。"}]},{n:11,title:"I/O TEST 與硬體補課",problem:"前面十章都把硬體擋在下面。這一章是唯一要打開那層蓋子的地方，而且只講讀懂這支程式所需要的最小集合。I/O TEST 剛好是最好的教材：它存在的目的就是把硬體的狀態攤出來給人看。",files:["App/iotest.c","App/input.c","App/sound.c","User_common/user_defined.c"],focus:{f:"App/iotest.c",l:279},flowName:"I/O TEST 一輪顯示",flowHint:"紅色邊框的節點是直接碰硬體的地方。",flow:{w:640,h:600,nodes:[{id:"lp",x:215,y:10,w:210,h:40,t:"50 ms 一輪",cls:"ev",sub:"不需要遊戲的幀率",cap:"診斷畫面只要人眼跟得上。",tgt:{f:"App/iotest.c",l:279}},{id:"ip",x:215,y:74,w:210,h:44,t:"Input_Poll()",cls:"io",sub:"和遊戲用同一套",cap:"刻意共用，這樣測到的就是遊戲會看到的。",tgt:{f:"App/input.c",l:205}},{id:"ad",x:20,y:142,w:200,h:54,t:"四軸長條圖",cls:"hw",sub:"12 位元 → 0..4095",cap:"橘色刻度是開機量到的中心。長條停在刻度上才正常。",tgt:{f:"App/iotest.c",l:147}},{id:"bt",x:420,y:142,w:200,h:54,t:"按鍵方格",cls:"hw",sub:"按著就變綠",cap:"用 Held 而不是 Pressed，因為要看的是持續狀態。",tgt:{f:"App/iotest.c",l:171}},{id:"sn",x:215,y:218,w:210,h:54,t:"LOW 掃腳位",cls:"hw",sub:"哪一支腳正被拉低",cap:"回答「我的按鍵到底接在哪支腳」。只動上拉設定，不動方向。",tgt:{f:"App/input.c",l:308}},{id:"df",x:215,y:296,w:210,h:50,t:"ADC OK / FAIL",cls:"hw",sub:"轉換有沒有完成過",cap:"把「韌體壞了」和「線沒接」分開的關鍵。",tgt:{f:"App/input.c",l:287}},{id:"sp",x:215,y:372,w:210,h:54,t:"SPK 那一行",cls:"hw",sub:"時脈 · ARR · 頻率",cap:"84000k 代表時脈算對了。這一行救過一次真實的故障。",tgt:{f:"App/iotest.c",l:199}},{id:"dc",x:20,y:452,w:200,h:54,t:"DC 階段",sub:"純拉高，有源蜂鳴器會叫",cap:"完全不經過計時器，是「腳位能不能驅動東西」最簡單的證明。",tgt:{f:"App/sound.c",l:113}},{id:"sw",x:420,y:452,w:200,h:54,t:"SWEEP 階段",sub:"400 Hz → 4 kHz",cap:"掃頻一定會經過蜂鳴器的共振點，比單一頻率好聽得出來。",tgt:{f:"App/iotest.c",l:30}},{id:"fp",x:215,y:532,w:210,h:54,t:"FIND：逐腳測試",sub:"自己翻腳位，不用 TIM3",cap:"PA1 到 PA8 各叫 600 毫秒，聽到哪一支就是接在哪一支。",tgt:{f:"App/iotest.c",l:238}}],edges:[{a:"lp",b:"ip"},{a:"ip",b:"ad"},{a:"ip",b:"bt"},{a:"ad",b:"sn"},{a:"bt",b:"sn"},{a:"sn",b:"df"},{a:"df",b:"sp"},{a:"sp",b:"dc"},{a:"sp",b:"sw"},{a:"dc",b:"fp"},{a:"sw",b:"fp"}]},html:"\n<div class=\"note\">這一章是全站唯一講硬體的地方，而且只講「不懂就看不懂這支程式」的部分。每個概念旁邊的連結會帶到另一個專門教 STM32 的網站。</div>\n\n<h3>按鍵：上拉與 active low</h3>\n<p>一支設成輸入的腳如果什麼都沒接，電位由周圍雜訊決定，讀回來是隨機的。解法是打開晶片內部的上拉電阻把它輕輕拉到 3.3 V，按鈕的另一端接地——按下就把它硬拉到 0 V。</p>\n<p>所以<b>按下讀 0、放開讀 1</b>，判斷式要取反。<button class=\"jump\" data-f=\"App/input.c\" data-l=\"214\">input.c 讀按鍵那幾行</button>都是 <code>if (!(e &amp; bit))</code> 的形狀，那個驚嘆號就是 active low。</p>\n<p>設定一支這樣的腳只要兩件事：方向設成輸入、上拉打開。<button class=\"jump\" data-f=\"App/input.c\" data-l=\"91\">gpio_input_pullup()</button> 就是這兩行。附帶好處是按鍵<b>不需要外接電阻</b>。\n<span class=\"deepslot\" data-k=\"gpio\" data-l=\"GPIO 模式與上拉的完整說明\"></span></p>\n\n<h3>ADC：12 位元的數字是什麼意思</h3>\n<p>搖桿是兩個電位器分壓。ADC 把那個電壓換成整數，本專案用 12 位元，所以<b>0 V 對到 0、3.3 V 對到 4095</b>，一個計數約 0.806 mV。</p>\n<p><button class=\"jump\" data-f=\"App/input.c\" data-l=\"61\">Input_AdcRaw()</button> 的流程是：指定要量哪個通道、清掉上次的完成旗標、按下開始、等完成旗標、讀結果。四步，六微秒。</p>\n<p>值得看的是那個 <code>guard</code> 計數器。一次轉換只要幾百個 CPU 週期，正常永遠用不到它。它的作用是：<b>如果 ADC 設定錯了導致完成旗標永遠不來，整台機器不要當掉</b>，而是讓搖桿讀 0 並把錯誤記下來。</p>\n<p><button class=\"jump\" data-f=\"App/input.c\" data-l=\"287\">那個計數器</button>被顯示在 I/O TEST 的 <code>ADC OK</code> / <code>ADC FAIL</code>。這一個設計把「韌體錯了」和「線沒接」切開：<code>ADC OK</code> 但長條停在 0，就一定是硬體那邊的事。<b>讓故障變成可見的資訊，而不是一片死寂。</b>\n<span class=\"deepslot\" data-k=\"adc\" data-l=\"ADC 取樣與設定的完整說明\"></span></p>\n\n<h3>TIM3 的 PWM 怎麼變成聲音</h3>\n<p>計時器有一個計數器，每個時脈加一，數到 <code>ARR</code> 就歸零重來。<code>PSC</code> 先把時脈除慢。所以一個週期是：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">f = 計時器時脈 / ((PSC + 1) × (ARR + 1))</pre>\n<p>把這個週期性的輸出接到腳位，就是方波；方波送進蜂鳴器就是聲音。工作週期固定在一半，因為<b>音高只由週期決定</b>——PWM 在這裡不是用來調音量。</p>\n<p><button class=\"jump\" data-f=\"App/sound.c\" data-l=\"72\">tone_on()</button> 從頻率反算兩個數字。<code>ARR</code> 只有 16 位元，所以要先用 <code>PSC</code> 把總計數壓進 65536 以內：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">total = s_timClk / freq;\npsc   = (total + 65535UL) / 65536UL;   /* 最小的 PSC+1 使 ARR 放得下 */\narr   = total / psc;</pre>\n<p>計時器時脈要從 <button class=\"jump\" data-f=\"App/sound.c\" data-l=\"28\">timer_clock()</button> 問，因為 APB1 上的計時器有一個容易踩的規則：<b>除頻器不是 1 的時候，計時器拿到的是匯流排時脈的兩倍</b>。課程板是 84 MHz，也就是 I/O TEST 上顯示的 <code>84000k</code>。</p>\n<p>這一行顯示救過一次真實故障：蜂鳴器完全沒聲音，但 <code>84000k</code> 正確、<code>ARR</code> 正確、頻率也在跳——於是可以確定韌體沒問題，最後查出是杜邦線整排錯一格。<b>把計算結果顯示出來，就把問題切成兩半。</b>\n<span class=\"deepslot\" data-k=\"tim\" data-l=\"計時器與 PWM 的完整說明\"></span></p>\n\n<h3>兩個測試階段對應兩種蜂鳴器</h3>\n<p>按一次 BEEP 會跑兩段：先純 DC 拉高 1.5 秒，再掃頻 2.5 秒。這不是多餘——它同時測兩種零件。</p>\n<p><b>有源蜂鳴器</b>內建振盪器，給它電壓就叫，波形無所謂。所以它在 DC 階段會響、掃頻階段安靜。<button class=\"jump\" data-f=\"App/sound.c\" data-l=\"113\">Sound_DC()</button> 把腳位從計時器收回來當普通輸出，直接拉高——<b>完全不經過計時器</b>，是「這支腳能不能驅動任何東西」最簡單的證明。</p>\n<p><b>無源蜂鳴器</b>沒有振盪器，要餵方波才會叫，所以它剛好相反。掃頻而不是單一頻率的理由是：蜂鳴器在共振頻率附近大聲得多，掃過去一定會經過。</p>\n<p>哪一段有聲音，就知道插的是哪一種零件；兩段都沒聲音，問題在接線。</p>\n\n<h3>FIND：讓板子自己說出腳位</h3>\n<p><button class=\"jump\" data-f=\"App/iotest.c\" data-l=\"238\">pin_warble()</button> 自己用迴圈翻腳位，<b>不用 TIM3</b>。這樣它可以測任何一支腳，不管那支腳屬於哪個計時器。</p>\n<p><button class=\"jump\" data-f=\"App/iotest.c\" data-l=\"250\">find_pin()</button> 依序把 PA1 到 PA8 各叫 600 毫秒並在畫面上印出腳位名稱。蜂鳴器夾在你焊的那條線上，聽到哪一支就知道實際接在哪一支。它會存下每支腳原本的設定再還原，並刻意跳過 PA13／PA14——那是除錯器的線，動了會讓 ST-Link 斷線。</p>\n<p>同樣的想法也用在按鍵上：<button class=\"jump\" data-f=\"App/input.c\" data-l=\"298\">Input_DiagInit()</button> 把所有候選腳的上拉打開（只動上拉，不動方向，而且跳過已經被別人設成輸出的腳），然後 <code>Input_ScanLow()</code> 回報哪幾支正被拉低。按一顆鍵，畫面就告訴你它在哪支腳。這兩個功能各抓到一次真實的接線錯誤。</p>\n\n<h3>msTick 從哪裡來</h3>\n<p><button class=\"jump\" data-f=\"User_common/user_defined.c\" data-l=\"18\">SysTick_Handler()</button> 是一個每毫秒被硬體呼叫一次的函式，它只做一件事：把 <code>msTick</code> 加一。全機所有計時都建立在這個變數上。</p>\n<p>它宣告成 <code>volatile</code>，這一點不能省：告訴編譯器「這個變數會被你看不到的程式改動」，否則 <code>while (msTick - t0 &lt; 20)</code> 裡的讀取會被最佳化成只讀一次，迴圈變成永遠成立。\n<span class=\"deepslot\" data-k=\"systick\" data-l=\"SysTick 的設定與中斷\"></span></p>\n\n<h3>FSMC：為什麼 LCD 看起來像一塊記憶體</h3>\n<p>這塊板子的螢幕不走 SPI，而是接在 FSMC 上——一個本來用來外接 SRAM 的並列匯流排。ILI9341 的並列介面長得很像 SRAM：一組資料線、一支寫入腳、一支「這次寫的是指令還是資料」的腳。</p>\n<p>訣竅是把那支腳<b>接到一條位址線</b>（本專案用 A6）。於是驅動可以宣告一個兩欄的結構，兩欄的位址剛好差那一條線：寫第一欄就是送指令，寫第二欄就是送資料。「傳一個像素給螢幕」在 C 裡變成一次結構欄位賦值。</p>\n<p>這就是 <code>GLCD/stm324xg_lcd_ILI9341_Pro.c</code> 第 5 到 7 行那個 <code>LCD_BASE</code> 被算成 <code>0x6C00007E</code> 的由來，也是第 5 章「一次寫入一整塊」之所以便宜的原因——連續寫入同一個位址，硬體自己把像素排進面板。\n<span class=\"deepslot\" data-k=\"fsmc\" data-l=\"FSMC 與 ILI9341 的完整說明\"></span></p>\n",demos:[],ex:[{id:"c11a",type:"mc",q:"I/O TEST 顯示 <code>ADC OK</code>，但四條長條全部停在 0。最可能的原因是？",opts:["ADC 設定錯了","搖桿模組的 3.3 V 沒接上，或 VRx/VRy 沒接到對應的腳","取樣時間太短","msTick 沒有在跑"],ans:1,fb:"<code>ADC OK</code> 表示轉換確實完成了，讀到 0 就是輸入電壓真的是 0。搖桿的兩軸是分壓電路，沒有電源就沒有輸出——而搖桿上的按鍵只是對地開關，沒電源也照樣能按。「按得到但推不動」幾乎就是電源線沒接。"},{id:"c11b",type:"mc",q:"按 BEEP 之後，DC 階段有聲音、掃頻階段安靜。插的是哪一種蜂鳴器？",opts:["無源蜂鳴器","有源蜂鳴器","兩種都可能","蜂鳴器壞了"],ans:1,fb:"有源蜂鳴器內建振盪器，有電壓就叫，方波對它沒有額外意義（掃頻時腳位有一半時間是低的，反而變小聲或不叫）。無源的剛好相反：DC 只會「咔」一聲然後安靜，要方波才會發聲。所以哪一段有聲音就知道插的是哪一種。"},{id:"c11c",type:"mc",q:"<code>Input_AdcRaw()</code> 裡的 <code>guard</code> 計數器，真正的用途是什麼？",opts:["控制取樣時間","限制 ADC 的轉換速度","讓設定錯誤的 ADC 造成「搖桿讀 0」而不是整台機器卡死","校正中心值"],ans:2,fb:"正常情況下永遠用不到它。它是一個失效模式的設計：把「無限迴圈等一個不會來的旗標」換成「回傳 0 並把錯誤記下來」。那個計數器再被顯示成 <code>ADC OK</code> / <code>ADC FAIL</code>，於是故障變成可以讀的資訊。"}]},{n:12,title:"收尾",problem:"32 KB 的連結上限逼出了這支韌體很多寫法。這一章把那些取捨整理出來，並列出「如果要加第四款遊戲」要動哪幾個檔案。",files:["App/gfx.h","App/game_dino.c","App/app_main.c","App/console.h"],focus:{f:"App/gfx.h",l:31},flowName:"加一款新遊戲要改哪裡",flowHint:"五個落點。雙擊節點跳到要改的位置。",flow:{w:600,h:520,nodes:[{id:"n",x:190,y:10,w:220,h:44,t:"新檔案 game_xxx.c",cls:"ev",sub:"提供 void Xxx_Run(void)",cap:"照第 7 章的骨架寫主迴圈就好。遊戲之間不共用狀態。"},{id:"e",x:190,y:80,w:220,h:48,t:"① console.h 的 AppScreen",sub:"加一個列舉值",cap:"順序要和選單項目表一致，因為選單用 APP_DINO + i 回傳。",tgt:{f:"App/console.h",l:29}},{id:"d",x:190,y:154,w:220,h:48,t:"② console.h 加宣告",sub:"void Xxx_Run(void);",cap:"讓 app_main.c 看得到。",tgt:{f:"App/console.h",l:35}},{id:"s",x:190,y:228,w:220,h:48,t:"③ app_main.c 的 switch",sub:"加一個 case",cap:"狀態機本體。",tgt:{f:"App/app_main.c",l:116}},{id:"m",x:190,y:302,w:220,h:54,t:"④ menu.c 的項目表",sub:"名稱 · 副標 · ITEM_N",cap:"三個陣列都要加，<code>ITEM_N</code> 也要加一。順序必須和列舉一致。",tgt:{f:"App/menu.c",l:29}},{id:"p",x:190,y:382,w:220,h:48,t:"⑤ 專案檔加入編譯",cls:"dec",sub:"Keil 的 App 群組",cap:"用 Keil 介面加，或直接改 .uvprojx 的 App 群組。"},{id:"b",x:190,y:456,w:220,h:48,t:"檢查還剩多少空間",cls:"hw",sub:"目前剩 3020 bytes",cap:"Code + RO-data + RW-data 要小於 32768。超過連結器會報 L6047U。"}],edges:[{a:"n",b:"e"},{a:"e",b:"d"},{a:"d",b:"s"},{a:"s",b:"m"},{a:"m",b:"p"},{a:"p",b:"b"}]},html:"\n<h3>目前的預算</h3>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">Code      21428 bytes   程式碼\nRO-data    8280 bytes   常數：字型表、sprite、文字\nRW-data      40 bytes\n                        ----------\n影像合計   29748 bytes   上限 32768，剩 3020\n\nZI-data   11752 bytes   RAM，其中 9600 是 gfx 的組圖緩衝區</pre>\n\n<h3>32 KB 逼出來的五個決定</h3>\n<p><b>一、不用浮點數。</b>F407 其實有硬體浮點單元，但一旦用了 <code>float</code>，連結器會拉進浮點的格式化與函式庫程式碼。改用 <button class=\"jump\" data-f=\"App/game_dino.c\" data-l=\"57\">1/16 像素的定點數</button>，運算全是整數，而除以 16 只是一個位移指令。</p>\n<p><b>二、sprite 用 1 位元一像素。</b>16 張圖共 2050 位元組。存成 RGB565 的話，光恐龍六個姿勢就超過 12 KB。代價是一張圖只能一個顏色，而 Chrome Dino 本來就是單色的。</p>\n<p><b>三、砍掉兩個字型。</b>這是最大的一刀。點陣字型是純資料，一個字元佔「寬度位元組 × 高度」：Font24 是 6840 位元組、Font20 是 3800。第一次加完 Gate Keeper 時影像是 32488，只剩 280 位元組可用。試過的便宜手段都沒效——<code>-ffunction-sections</code> 沒有變化（編譯器預設就做了），移掉沒用到的檔案只省 208 位元組。最後改驅動裡兩行字型選擇，換來 10.6 KB。代價是標題變小，而且所有依賴 14 像素字寬的版面都要重算。<b>四款遊戲，或是大字型，選一個。</b></p>\n<p><b>四、查表，但不是每次都查。</b>2048 的 13 個顏色用表（26 位元組），Gate Keeper 的車道幾何用表。但音高<b>沒有</b>用表——<code>tone_on()</code> 每次現算，因為要支援 400 Hz 到 4 kHz 的連續掃頻，一張涵蓋所有頻率的表會比那幾行除法大得多。判斷標準一直是「表的大小 vs 它省下的東西」。</p>\n<p><b>五、組圖緩衝區的大小由最大的使用者決定。</b><button class=\"jump\" data-f=\"App/gfx.h\" data-l=\"31\">GFX_BUF_PIX</button> 是 4800 個像素、9600 位元組，占了 RAM 用量的八成。它不是隨便取的：Dino 的恐龍區塊要 44 × 100 = 4400，取 4800 留餘裕。這是 RAM 和「一次能畫多大一塊」之間的直接交換。</p>\n\n<h3>如果要加第四款遊戲</h3>\n<p>右邊的流程圖是完整清單，五個地方：</p>\n<ol>\n<li>寫一個新的 <code>.c</code>，提供一個 <code>void Xxx_Run(void)</code>，內部照第 7 章的骨架跑主迴圈，看到 KEY1 就 <code>return</code>。</li>\n<li><code>console.h</code> 的 <code>AppScreen</code> 加一個列舉值，並加上函式宣告。</li>\n<li><code>app_main.c</code> 的 switch 加一個 case。</li>\n<li><code>menu.c</code> 的三個項目陣列各加一行，<code>ITEM_N</code> 加一。</li>\n<li>把新檔案加進 Keil 專案的 App 群組。</li>\n</ol>\n<div class=\"warn\"><h4>兩個容易忘的地方</h4>\n<ul>\n<li><b>列舉順序要和選單項目表一致</b>，因為選單是用 <code>APP_DINO + i</code> 回傳的。只改一邊會進錯遊戲。</li>\n<li><b>主迴圈裡要呼叫 <code>Sound_Update()</code></b>，否則第一個音效會一直響。</li>\n</ul></div>\n<p>空間只剩 3020 位元組，所以第四款遊戲得很省，或者先砍掉一些東西。下一刀的候選：<code>gameover</code> 那張 sprite（238 位元組，可以用文字代替）、Font16（3040 位元組，但整站版面要重算）、或在 <code>tools/gen_sprites.py</code> 裡把 sprite 改小。</p>\n\n<h3>刻意沒做的事</h3>\n<ul>\n<li><b>按鍵用輪詢而不是中斷。</b>50 到 100 Hz 的輪詢配兩次取樣去彈跳，對遊戲迴圈來說是更穩的選擇，而且不會和既有的中斷處理衝突。</li>\n<li><b>高分只存在 RAM</b>，關機就沒了。寫進內部 Flash 的函式在 <code>user_defined.c</code> 裡已經有了，是一個明確的下一步。</li>\n<li><b>第二支搖桿只有被讀取，沒有遊戲用它。</b>它是雙人模式最明顯的掛勾。</li>\n</ul>\n",demos:[],ex:[{id:"c12a",type:"mc",q:"你加了第四款遊戲，列舉加在 <code>APP_GATE</code> 和 <code>APP_IOTEST</code> 之間，但選單項目表把新項目加在最後。結果是？",opts:["編譯失敗","選單顯示正常，但選新遊戲會進 I/O TEST，選 I/O TEST 會進新遊戲","新遊戲永遠進不去","選單只會顯示三個項目"],ans:1,fb:"選單回傳的是 <code>APP_DINO + i</code>，也就是用「第幾個項目」直接當列舉的偏移。兩邊順序一旦不一致，對應就錯位。這是一個為了省掉對應表而付出的代價，加東西時要特別注意。"},{id:"c12b",type:"mc",q:"為什麼 <code>GFX_BUF_PIX</code> 是 4800 而不是更大或更小？",opts:["因為 4800 是 2 的次方","因為最大的使用者是 Dino 的恐龍區塊 44×100 = 4400，取 4800 留餘裕","因為 ILI9341 一次最多接受 4800 個像素","因為 RAM 只有 9600 位元組"],ans:1,fb:"它由需求反推：恐龍區塊要蓋住從最高跳躍點到地面的整條垂直帶，寬度要容納最寬的蹲下姿勢。橫向車道是 139×26 = 3614。取 4800 同時滿足兩者。這個數字是 RAM 和「一次能畫多大一塊」的直接交換。"}]}];
/* =====================================================================
   互動示範。重現的是邏輯，不是畫面；行為以真實硬體為準。
   ===================================================================== */
function dshell(title, note){
  const w = el("div","demo");
  const h = el("div","dhead");
  h.appendChild(el("h4", null, title));
  h.appendChild(el("span","sim", note || "瀏覽器示意"));
  w.appendChild(h);
  const b = el("div","dbody");
  w.appendChild(b);
  return {w:w, b:b};
}

const DEMOS = {};

/* ---------------------------------------------------------------
   1. 碰撞框視覺化
   --------------------------------------------------------------- */
DEMOS.collide = function(host){
  const d = dshell("碰撞框視覺化 · dino_hits()", "示意：可拖動，判定式與真實程式相同");
  const W = 520, H = 190;
  const cv = el("canvas"); cv.width = W; cv.height = H;
  cv.style.width = "100%"; cv.style.cursor = "grab";
  d.b.appendChild(cv);
  const out = el("div","dout"); out.style.marginTop = "12px"; d.b.appendChild(out);
  const note = el("div","dnote"); d.b.appendChild(note);
  const ctx = cv.getContext("2d");

  /* 數字取自 game_dino.c：站立的恐龍框 22×28，仙人掌框比 sprite 內縮 3 px */
  const A = {x:40, y:96, w:22, h:28, n:"恐龍"};
  const B = {x:250, y:100, w:9, h:20, n:"仙人掌"};
  let drag = null, off = [0,0];

  function overlap(){
    const c1 = (A.x + A.w <= B.x), c2 = (B.x + B.w <= A.x);
    const c3 = (A.y + A.h <= B.y), c4 = (B.y + B.h <= A.y);
    return {hit: !(c1 || c2 || c3 || c4), c1, c2, c3, c4};
  }
  function draw(){
    const r = overlap();
    ctx.fillStyle = "#0A0E0C"; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = "#1E2A24"; ctx.beginPath();
    ctx.moveTo(0, 124.5); ctx.lineTo(W, 124.5); ctx.stroke();
    ctx.fillStyle = "#5A6B76"; ctx.font = "11px monospace";
    ctx.fillText("GROUND_Y", 6, 138);

    [[A, r.hit ? "#E0553A" : "#7FD98C"], [B, r.hit ? "#E0553A" : "#3FC4D0"]].forEach(([o,c]) => {
      ctx.fillStyle = c + "33"; ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.strokeStyle = c; ctx.lineWidth = 1.5;
      ctx.strokeRect(o.x + .5, o.y + .5, o.w - 1, o.h - 1);
      ctx.fillStyle = c; ctx.font = "11px sans-serif";
      ctx.fillText(o.n, o.x, o.y - 5);
      ctx.fillStyle = "#5A6B76"; ctx.font = "10px monospace";
      ctx.fillText(o.x + "," + o.y + " " + o.w + "×" + o.h, o.x, o.y + o.h + 13);
    });
    const T = v => v ? '<span style="color:#7FD98C">true </span>' : '<span style="color:#5A6B76">false</span>';
    out.innerHTML =
      "ax+aw &lt;= bx  → " + T(r.c1) + "　|　bx+bw &lt;= ax  → " + T(r.c2) + "\n" +
      "ay+ah &lt;= by  → " + T(r.c3) + "　|　by+bh &lt;= ay  → " + T(r.c4) + "\n" +
      '<span style="color:' + (r.hit ? "#E0553A" : "#7FD98C") + '">→ ' +
      (r.hit ? "重疊，撞到了（return 1）" : "沒有重疊（return 0）") + "</span>";
    note.innerHTML = r.hit
      ? "四個條件都不成立，表示兩個矩形在 X 和 Y 上都有交集。程式的寫法是<b>反過來想</b>：只要找到一條分離的軸就立刻回傳沒撞到，比直接證明重疊好寫得多。"
      : "只要<b>任何一個</b>條件成立，就代表存在一條軸讓兩個矩形分開，可以馬上回傳 0。" +
        "注意用的是 <code>&lt;=</code> 而不是 <code>&lt;</code>：剛好貼齊不算撞到。";
  }
  function pos(ev){
    const r = cv.getBoundingClientRect();
    const s = W / r.width;
    const p = ev.touches ? ev.touches[0] : ev;
    return [(p.clientX - r.left) * s, (p.clientY - r.top) * s];
  }
  function hitTest(x, y){
    if (x >= B.x-4 && x <= B.x+B.w+4 && y >= B.y-4 && y <= B.y+B.h+4) return B;
    if (x >= A.x-4 && x <= A.x+A.w+4 && y >= A.y-4 && y <= A.y+A.h+4) return A;
    return null;
  }
  cv.onmousedown = cv.ontouchstart = ev => {
    const [x,y] = pos(ev); const o = hitTest(x,y);
    if (o){ drag = o; off = [x - o.x, y - o.y]; cv.style.cursor = "grabbing"; ev.preventDefault(); }
  };
  window.addEventListener("mousemove", ev => {
    if (!drag) return;
    const [x,y] = pos(ev);
    drag.x = Math.max(0, Math.min(W - drag.w, x - off[0]));
    drag.y = Math.max(0, Math.min(H - drag.h - 18, y - off[1]));
    draw();
  });
  cv.addEventListener("touchmove", ev => {
    if (!drag) return;
    const [x,y] = pos(ev);
    drag.x = Math.max(0, Math.min(W - drag.w, x - off[0]));
    drag.y = Math.max(0, Math.min(H - drag.h - 18, y - off[1]));
    draw(); ev.preventDefault();
  }, {passive:false});
  const up = () => { drag = null; cv.style.cursor = "grab"; };
  window.addEventListener("mouseup", up); window.addEventListener("touchend", up);
  draw();
  host.appendChild(d.w);
};

/* ---------------------------------------------------------------
   2. 2048 的一次移動，單步執行
   --------------------------------------------------------------- */
DEMOS.move2048 = function(host){
  const d = dshell("Move_Left 單步執行", "示意：演算法與 game_2048.c 相同");
  const presets = [
    [2,2,4,0], [0,2,0,2], [4,4,4,4], [2,0,2,4], [0,0,0,8], [2,4,2,4]
  ];
  let row = presets[0].slice(), stage = 0, tmp = [], res = [], gained = 0;

  const ctl = el("div","drow");
  const sel = el("select");
  presets.forEach((p,i) => sel.appendChild(el("option", null, "[ " + p.join(", ") + " ]")));
  const bStep = el("button","b am","下一步");
  const bRst = el("button","b","重來");
  const dd = el("div"); dd.appendChild(el("label",null,"起始的一列")); dd.appendChild(sel);
  ctl.append(dd, bStep, bRst);
  d.b.appendChild(ctl);

  const W = 520, H = 210;
  const cv = el("canvas"); cv.width = W; cv.height = H; cv.style.width = "100%";
  cv.style.marginTop = "13px";
  d.b.appendChild(cv);
  const out = el("div","dout"); out.style.marginTop = "11px"; d.b.appendChild(out);
  const note = el("div","dnote"); d.b.appendChild(note);
  const ctx = cv.getContext("2d");

  const COL = {0:"#141A17",2:"#2A3730",4:"#3A4A3E",8:"#8A5A22",16:"#95521E",
    32:"#A83A2A",64:"#B04030",128:"#A88A28",256:"#A88A28",512:"#4A8A40",
    1024:"#3A8A50",2048:"#2A6AA8"};
  function tiles(arr, y, lab){
    ctx.fillStyle = "#5A6B76"; ctx.font = "11px monospace";
    ctx.fillText(lab, 8, y + 26);
    arr.forEach((v, i) => {
      const x = 118 + i * 92;
      ctx.fillStyle = COL[v] || "#2A6AA8";
      ctx.fillRect(x, y, 80, 42);
      ctx.strokeStyle = "#1E2A24"; ctx.strokeRect(x+.5, y+.5, 79, 41);
      if (v){ ctx.fillStyle = v <= 4 ? "#A8B8AE" : "#FFFFFF";
        ctx.font = "600 17px monospace"; ctx.textAlign = "center";
        ctx.fillText(String(v), x + 40, y + 27); ctx.textAlign = "left"; }
    });
  }
  function draw(){
    ctx.fillStyle = "#0A0E0C"; ctx.fillRect(0,0,W,H);
    tiles(row, 12, "原始");
    if (stage >= 1) tiles(tmp, 68, "① 壓縮");
    if (stage >= 2) tiles(tmp, 124, "② 合併");
    if (stage >= 3) tiles(res, 180 - 12, "③ 再壓縮");
  }
  function step(){
    if (stage === 0){
      tmp = []; row.forEach(v => { if (v) tmp.push(v); });
      while (tmp.length < 4) tmp.push(0);
      stage = 1;
      out.innerHTML = "① <b>壓縮</b>：把非零的磁磚依序搬到最左邊，中間的空格被擠掉。\n"
        + "for (c = 0; c &lt; 4; c++) if (g_board[r][c]) tmp[k++] = g_board[r][c];";
      note.innerHTML = "這一步只搬動、不合併。先壓縮的理由是：合併只看「相鄰」的兩格，"
        + "中間夾著空格的 <code>[2,0,2,0]</code> 必須先變成 <code>[2,2,0,0]</code> 才看得出可以合。";
    } else if (stage === 1){
      gained = 0;
      for (let c = 0; c < 3; c++){
        if (tmp[c] && tmp[c] === tmp[c+1]){ tmp[c] *= 2; gained += tmp[c]; tmp[c+1] = 0; }
      }
      stage = 2;
      out.innerHTML = "② <b>合併</b>：從左往右掃，相鄰相等就把左邊那格加倍、右邊清零。得分 +"
        + gained + "\n"
        + "if (tmp[c] &amp;&amp; tmp[c] == tmp[c+1]) { tmp[c] &lt;&lt;= 1; score += tmp[c]; tmp[c+1] = 0; }";
      note.innerHTML = "迴圈從左往右且<b>不回頭</b>，所以 <code>[4,4,4,4]</code> 會變成 "
        + "<code>[8,0,8,0]</code> 而不是 <code>[16,0,0,0]</code>——一顆磁磚在同一次移動裡只能合一次，"
        + "這是 2048 的規則，也是迴圈上限寫 <code>c &lt; BOARD_N - 1</code> 而不是巢狀迴圈的原因。";
    } else if (stage === 2){
      res = []; tmp.forEach(v => { if (v) res.push(v); });
      while (res.length < 4) res.push(0);
      stage = 3;
      const moved = res.some((v,i) => v !== row[i]);
      out.innerHTML = "③ <b>再壓縮</b>：合併在中間留下了空格，再擠一次。\n"
        + "最後比對前後是否不同 → moved = " + (moved ? "1（算一次有效移動）" : "0（盤面沒變，不算）");
      note.innerHTML = "為什麼要第三步：② 把 <code>tmp[c+1]</code> 清成 0，"
        + "於是 <code>[2,2,4,0]</code> 在合併後是 <code>[4,0,4,0]</code>，中間破了一個洞。"
        + "<b>moved 這個回傳值很重要</b>：只有真的動過才會生出新磁磚，"
        + "否則玩家亂滑一個沒有效果的方向也會被塞磁磚。";
    } else {
      stage = 0; tmp = []; res = [];
      out.innerHTML = "回到起點，再按一次「下一步」。";
      note.innerHTML = "四個方向各寫一份函式，而不是轉置陣列再呼叫 Move_Left。"
        + "程式碼是多了三倍，但每一份都只有一層索引、沒有座標轉換，"
        + "在沒有除錯器的環境裡遠比「聰明」的寫法好查。";
    }
    draw();
  }
  sel.onchange = () => { row = presets[sel.selectedIndex].slice(); stage = 0;
    tmp = []; res = []; draw();
    out.innerHTML = "按「下一步」開始。"; note.innerHTML = "&nbsp;"; };
  bStep.onclick = step;
  bRst.onclick = () => { stage = 0; tmp = []; res = []; draw();
    out.innerHTML = "按「下一步」開始。"; note.innerHTML = "&nbsp;"; };
  draw();
  out.innerHTML = "按「下一步」開始，會依序跑壓縮、合併、再壓縮三個階段。";
  note.innerHTML = "&nbsp;";
  host.appendChild(d.w);
};

/* ---------------------------------------------------------------
   3. 四通道開火與冷卻
   --------------------------------------------------------------- */
DEMOS.lanes = function(host){
  const d = dshell("四通道開火 · 260 ms 冷卻", "示意：冷卻邏輯與 game_gate.c 相同");
  const NAMES = ["UP","DOWN","LEFT","RIGHT"];
  const COOL = 260;
  const ready = [0,0,0,0];
  let now = 0, fired = 0, wasted = 0, t0 = performance.now();

  const ctl = el("div","drow");
  NAMES.forEach((n, i) => {
    const b = el("button","b", n);
    b.onclick = () => fire(i);
    ctl.appendChild(b);
  });
  const bRst = el("button","b","歸零");
  bRst.onclick = () => { fired = wasted = 0; ready.fill(0); };
  ctl.appendChild(bRst);
  d.b.appendChild(ctl);

  const W = 520, H = 170;
  const cv = el("canvas"); cv.width = W; cv.height = H; cv.style.width = "100%";
  cv.style.marginTop = "13px"; d.b.appendChild(cv);
  const out = el("div","dout"); out.style.marginTop = "11px"; d.b.appendChild(out);
  const note = el("div","dnote"); d.b.appendChild(note);
  const ctx = cv.getContext("2d");

  function fire(i){
    if (ready[i] > now){ wasted++; return; }   /* 冷卻中，這次按鍵沒有作用 */
    ready[i] = now + COOL;
    fired++;
  }
  function loop(){
    now = performance.now() - t0;
    ctx.fillStyle = "#0A0E0C"; ctx.fillRect(0,0,W,H);
    NAMES.forEach((n, i) => {
      const y = 14 + i * 38, rem = Math.max(0, ready[i] - now);
      const pct = rem / COOL;
      ctx.fillStyle = "#5A6B76"; ctx.font = "11px monospace";
      ctx.fillText(n, 8, y + 18);
      ctx.fillStyle = "#141A17"; ctx.fillRect(62, y, 400, 24);
      ctx.fillStyle = pct > 0 ? "#3A2A14" : "#17291B";
      ctx.fillRect(62, y, 400, 24);
      if (pct > 0){
        ctx.fillStyle = "#E8A93C"; ctx.fillRect(62, y, 400 * pct, 24);
        ctx.fillStyle = "#241700"; ctx.font = "600 11px monospace";
        ctx.fillText("冷卻 " + Math.ceil(rem) + " ms", 70, y + 16);
      } else {
        ctx.fillStyle = "#7FD98C"; ctx.font = "600 11px monospace";
        ctx.fillText("READY", 70, y + 16);
      }
      ctx.strokeStyle = "#1E2A24"; ctx.strokeRect(62.5, y+.5, 399, 23);
    });
    out.innerHTML = "成功開火 " + fired + " 次　|　冷卻中被吃掉 " + wasted + " 次"
      + (wasted > 0 ? '\n<span style="color:#E8A93C">按太快的那幾下完全沒有效果</span>' : "");
    requestAnimationFrame(loop);
  }
  note.innerHTML = "試著瘋狂連打同一顆：成功次數不會變多，只是「被吃掉」的計數往上跳。"
    + "判斷只有一行 <code>if (s_pulse[lane].readyAt &gt; msTick) return;</code>，"
    + "但它決定了這個遊戲考的是<b>時機</b>而不是手速。"
    + "四條通道各有自己的冷卻，所以同時照顧四邊是可行的——難的是分配注意力。";
  loop();
  host.appendChild(d.w);
};

/* ---------------------------------------------------------------
   4. 固定步長迴圈怎麼補時間
   --------------------------------------------------------------- */
DEMOS.frame = function(host){
  const d = dshell("固定步長迴圈 · 補時間", "示意：時間軸是畫出來的，不是量測結果");
  let workMs = 6, tick = 20;

  const ctl = el("div","drow");
  const dw = el("div"); dw.style.flex = "1 1 240px";
  dw.appendChild(el("label",null,"這一幀的工作花了 6 ms"));
  const sw = el("input"); sw.type = "range"; sw.min = "1"; sw.max = "40"; sw.value = "6";
  dw.appendChild(sw);
  const dt = el("div");
  dt.appendChild(el("label",null,"TICK_MS"));
  const st = el("select");
  [["20","20　Dino"],["25","25　Gate Keeper"],["10","10　2048 與選單"]].forEach(([v,t]) => {
    const o = el("option", null, t); o.value = v; st.appendChild(o); });
  dt.appendChild(st);
  ctl.append(dw, dt);
  d.b.appendChild(ctl);

  const W = 520, H = 180;
  const cv = el("canvas"); cv.width = W; cv.height = H; cv.style.width = "100%";
  cv.style.marginTop = "13px"; d.b.appendChild(cv);
  const out = el("div","dout"); out.style.marginTop = "11px"; d.b.appendChild(out);
  const note = el("div","dnote"); d.b.appendChild(note);
  const ctx = cv.getContext("2d");

  function draw(){
    const px = 9;                                    /* 1 ms = 9 px */
    ctx.fillStyle = "#0A0E0C"; ctx.fillRect(0,0,W,H);
    const over = workMs > tick;

    for (let f = 0; f < 3; f++){
      const y = 22 + f * 48;
      const x0 = 46 + f * (Math.max(workMs, tick) * px + 6);
      ctx.fillStyle = "#5A6B76"; ctx.font = "11px monospace";
      if (f === 0) ctx.fillText("幀", 8, y + 16);
      ctx.fillText("#" + (f+1), 8, y + 16);
      /* 工作 */
      ctx.fillStyle = over ? "#7A2A1E" : "#1E6A8A";
      ctx.fillRect(x0, y, workMs * px, 22);
      ctx.fillStyle = "#CFE0D6"; ctx.font = "600 10px monospace";
      if (workMs * px > 34) ctx.fillText(workMs + "ms 工作", x0 + 4, y + 15);
      /* 補時間 */
      if (!over){
        ctx.fillStyle = "#17291B";
        ctx.fillRect(x0 + workMs * px, y, (tick - workMs) * px, 22);
        ctx.strokeStyle = "#2C4A33";
        ctx.strokeRect(x0 + workMs*px + .5, y + .5, (tick-workMs)*px - 1, 21);
        ctx.fillStyle = "#7FD98C"; ctx.font = "10px monospace";
        if ((tick-workMs)*px > 30) ctx.fillText("等 " + (tick-workMs) + "ms", x0 + workMs*px + 4, y + 15);
      }
      /* 幀界線 */
      const end = x0 + Math.max(workMs, tick) * px;
      ctx.strokeStyle = over ? "#E0553A" : "#3FC4D0";
      ctx.setLineDash([3,3]); ctx.beginPath();
      ctx.moveTo(end + .5, y - 6); ctx.lineTo(end + .5, y + 30); ctx.stroke();
      ctx.setLineDash([]);
    }
    out.innerHTML = over
      ? 'TICK_MS = ' + tick + '　工作 = ' + workMs + ' ms\n'
        + '<span style="color:#E0553A">工作超過一幀的預算，while 迴圈的條件一開始就不成立，'
        + '完全不等 → 這一幀變成 ' + workMs + ' ms，遊戲會變慢</span>'
      : 'TICK_MS = ' + tick + '　工作 = ' + workMs + ' ms　補 ' + (tick - workMs) + ' ms\n'
        + '<span style="color:#7FD98C">每一幀都剛好 ' + tick + ' ms，速度穩定</span>';
    note.innerHTML = over
      ? "這就是「畫面越複雜遊戲越慢」的來源。修法不是把 TICK_MS 加大，而是讓繪製變便宜——"
        + "第 5 章的只重畫變動區塊就是在做這件事。"
      : "工作發生在等待<b>之前</b>，所以某一幀畫得久一點，等待就自動變短，總長不變。"
        + "換成 <code>delay_ms(20)</code> 的話總長會變成「工作 + 20」，速度就跟著畫面複雜度飄。";
    draw2();
  }
  function draw2(){
    dw.firstChild.textContent = "這一幀的工作花了 " + workMs + " ms";
  }
  sw.oninput = () => { workMs = +sw.value; draw(); };
  st.onchange = () => { tick = +st.value; draw(); };
  draw();
  host.appendChild(d.w);
};

/* =====================================================================
   互動式程式架構導覽 —— 邏輯層
   SRC / CHAPTERS 由 build_teach.py 在上方注入
   ===================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t);
  if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };

const KEY = "fwconsole.teach.v1";
let SAVE = {done:{}, ex:{}};
try { const r = localStorage.getItem(KEY); if (r) SAVE = Object.assign(SAVE, JSON.parse(r)); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch(e){} };

let cur = 0, curFile = null;

/* ---------------------------------------------------------------
   深入連結。HW_SITE 任一項留空就渲染成灰色的佔位，不會變成死連結。
   --------------------------------------------------------------- */
function deepLink(key, label){
  const u = (HW_SITE && HW_SITE[key]) ? String(HW_SITE[key]).trim() : "";
  const txt = label || "想更深入";
  if (!u) return `<span class="deep off" title="在檔案開頭的 HW_SITE 填上網址就會變成連結">${txt}（待填）</span>`;
  return `<a class="deep" href="${u}" target="_blank" rel="noopener">${txt}</a>`;
}

/* ===============================================================
   程式碼面板
   =============================================================== */
function renderTabs(ch){
  const t = $("#tabs"); t.innerHTML = "";
  ch.files.forEach(f => {
    const b = el("button", f === curFile ? "cur" : "", f.split("/").pop());
    b.title = f;
    b.onclick = () => showFile(f);
    t.appendChild(b);
  });
}
function showFile(f, line){
  curFile = f;
  const src = SRC[f];
  const wrap = $("#codewrap");
  if (!src){ wrap.innerHTML = '<pre style="padding:16px">找不到 ' + f + '</pre>'; return; }
  const pre = el("pre");
  let html = "";
  for (let i = 0; i < src.length; i++){
    html += '<div class="cl" id="L' + (i+1) + '"><i>' + (i+1) + '</i><span>' + src[i] + '</span></div>';
  }
  pre.innerHTML = html;
  wrap.innerHTML = "";
  wrap.appendChild(pre);
  $$("#tabs button").forEach(b => b.classList.toggle("cur", b.title === f));
  if (line) markLine(line);
}
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function markLine(line){
  const wrap = $("#codewrap");
  $$(".cl.marked", wrap).forEach(n => n.classList.remove("marked","flash"));
  const n = $("#L" + line, wrap);
  if (!n) return;
  /* 先閃兩下，動畫結束後留下固定的標示 */
  n.classList.add("flash");
  n.addEventListener("animationend", () => {
    n.classList.remove("flash"); n.classList.add("marked");
  }, {once:true});
  n.classList.add("marked");
  const top = n.offsetTop - wrap.clientHeight / 2 + n.offsetHeight / 2;
  wrap.scrollTo({top: Math.max(0, top), behavior:"smooth"});
}
function jumpTo(f, line, why){
  const ch = CHAPTERS[cur];
  if (!ch.files.includes(f)) ch.files = ch.files.concat([f]);
  renderTabs(ch);
  if (f !== curFile) showFile(f, line); else markLine(line);
  if (why) $("#fcap").innerHTML = why;
  const wb = $("#wb");
  const r = wb.getBoundingClientRect();
  if (r.top < 0 || r.top > window.innerHeight * 0.6)
    wb.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ===============================================================
   流程圖：絕對定位的節點 + SVG 連線
   =============================================================== */
function renderFlow(ch){
  const host = $("#canv");
  host.innerHTML = "";
  const fl = ch.flow;
  host.style.width = fl.w + "px";
  host.style.height = fl.h + "px";

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("width", fl.w); svg.setAttribute("height", fl.h);
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" ' +
    'markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
    '<path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>';
  svg.appendChild(defs);
  host.appendChild(svg);

  const byId = {};
  fl.nodes.forEach(n => {
    byId[n.id] = n;
    const d = el("div", "nd" + (n.cls ? " " + n.cls : ""));
    d.style.left = n.x + "px"; d.style.top = n.y + "px";
    d.style.width = n.w + "px"; d.style.height = n.h + "px";
    d.innerHTML = "<b>" + n.t + "</b>" + (n.sub ? "<em>" + n.sub + "</em>" : "");
    d.tabIndex = 0;
    d.dataset.id = n.id;
    const pick = () => {
      $$(".nd", host).forEach(x => x.classList.remove("sel"));
      d.classList.add("sel");
      $$(".edge", svg).forEach(e => e.classList.toggle("hi",
        e.dataset.a === n.id || e.dataset.b === n.id));
      $("#fcap").innerHTML = (n.cap || "") +
        (n.tgt ? ' <button class="jump" data-f="' + n.tgt.f + '" data-l="' + n.tgt.l +
          '">' + n.tgt.f.split("/").pop() + ":" + n.tgt.l + '</button>' +
          ' <span class="hint">（雙擊節點也可以）</span>' : "");
      bindJumps($("#fcap"));
    };
    d.onclick = pick;
    d.ondblclick = () => { pick(); if (n.tgt) jumpTo(n.tgt.f, n.tgt.l, n.cap || ""); };
    d.onkeydown = ev => {
      if (ev.key === "Enter"){ pick(); if (n.tgt) jumpTo(n.tgt.f, n.tgt.l, n.cap || ""); }
    };
    host.appendChild(d);
  });

  /* 連線 */
  fl.edges.forEach(e => {
    const a = byId[e.a], b = byId[e.b];
    if (!a || !b) return;
    const p = document.createElementNS(NS, "path");
    p.setAttribute("class", "edge");
    p.dataset.a = e.a; p.dataset.b = e.b;
    p.setAttribute("marker-end", "url(#ah)");
    p.setAttribute("d", route(a, b, e.side));
    svg.appendChild(p);
    if (e.lab){
      const tx = document.createElementNS(NS, "text");
      const m = midOf(a, b, e.side);
      tx.setAttribute("class","elab");
      tx.setAttribute("x", m[0]); tx.setAttribute("y", m[1]);
      tx.textContent = e.lab;
      svg.appendChild(tx);
    }
  });
}
function cx(n){ return n.x + n.w/2; }
function cy(n){ return n.y + n.h/2; }
function route(a, b, side){
  if (side === "r"){                                   /* a 右 → b 左 */
    const x1 = a.x + a.w, y1 = cy(a), x2 = b.x, y2 = cy(b);
    const mx = (x1 + x2) / 2;
    return `M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`;
  }
  if (side === "l"){                                   /* a 左 → b 右 */
    const x1 = a.x, y1 = cy(a), x2 = b.x + b.w, y2 = cy(b);
    const mx = (x1 + x2) / 2;
    return `M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`;
  }
  if (side === "back"){                                /* 迴圈：繞左邊回去 */
    const x1 = a.x, y1 = cy(a), x2 = b.x, y2 = cy(b);
    const off = Math.min(a.x, b.x) - 26;
    return `M${x1},${y1} L${off},${y1} L${off},${y2} L${x2},${y2}`;
  }
  if (side === "backr"){                               /* 迴圈：繞右邊回去 */
    const x1 = a.x + a.w, y1 = cy(a), x2 = b.x + b.w, y2 = cy(b);
    const off = Math.max(a.x + a.w, b.x + b.w) + 26;
    return `M${x1},${y1} L${off},${y1} L${off},${y2} L${x2},${y2}`;
  }
  /* 預設：a 下 → b 上 */
  const x1 = cx(a), y1 = a.y + a.h, x2 = cx(b), y2 = b.y;
  if (Math.abs(x1 - x2) < 2) return `M${x1},${y1} L${x2},${y2}`;
  const my = (y1 + y2) / 2;
  return `M${x1},${y1} L${x1},${my} L${x2},${my} L${x2},${y2}`;
}
function midOf(a, b, side){
  if (side === "r") return [(a.x + a.w + b.x)/2 + 4, (cy(a) + cy(b))/2 - 5];
  if (side === "l") return [(a.x + b.x + b.w)/2 + 4, (cy(a) + cy(b))/2 - 5];
  if (side === "back" || side === "backr") return [Math.min(a.x, b.x) - 22, (cy(a)+cy(b))/2];
  return [cx(a) + 7, (a.y + a.h + b.y)/2 + 3];
}

/* 縮放 */
let zoom = 1;
function setZoom(z){
  zoom = Math.max(0.5, Math.min(1.4, z));
  $("#canv").style.transform = "scale(" + zoom + ")";
  $("#zlab").textContent = Math.round(zoom * 100) + "%";
}

/* ===============================================================
   拖曳分隔線
   =============================================================== */
function initGrip(){
  const grip = $("#grip"), pane = $("#cpane"), split = $("#split");
  let on = false;
  const move = ev => {
    if (!on) return;
    const r = split.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const pct = Math.max(22, Math.min(78, x / r.width * 100));
    pane.style.flex = "0 0 " + pct + "%";
    ev.preventDefault();
  };
  const up = () => { on = false; grip.classList.remove("on");
    document.body.style.userSelect = ""; };
  grip.onmousedown = grip.ontouchstart = ev => {
    on = true; grip.classList.add("on");
    document.body.style.userSelect = "none"; ev.preventDefault();
  };
  window.addEventListener("mousemove", move, {passive:false});
  window.addEventListener("touchmove", move, {passive:false});
  window.addEventListener("mouseup", up);
  window.addEventListener("touchend", up);
  grip.ondblclick = () => { pane.style.flex = "0 0 52%"; };
}

/* ===============================================================
   章節
   =============================================================== */
function bindJumps(root){
  $$(".jump", root).forEach(b => {
    if (b.dataset.bound) return;
    b.dataset.bound = "1";
    b.onclick = () => jumpTo(b.dataset.f, +b.dataset.l, b.dataset.why || "");
  });
}
function chapterDone(ch){
  if (SAVE.done[ch.n]) return true;
  const ex = ch.ex || [];
  return ex.length > 0 && ex.every(e => SAVE.ex[e.id] === true);
}
function showChapter(i){
  cur = i;
  const ch = CHAPTERS[i];
  const done = CHAPTERS.filter(chapterDone).length;

  $$("#chapnav button").forEach((b, k) => {
    if (k === i) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });

  $("#intro").innerHTML =
    '<div class="eyebrow">第 ' + ch.n + ' 章 / ' + CHAPTERS.length + '　·　已完成 ' +
    done + ' / ' + CHAPTERS.length + '</div>' +
    '<h2>' + ch.title + '</h2>' +
    '<div class="problem"><h4>這一章在解決什麼問題</h4><p>' + ch.problem + '</p></div>';

  $("#flowname").textContent = ch.flowName || "流程";
  curFile = ch.files[0];
  renderTabs(ch);
  renderFlow(ch);
  showFile(ch.focus.f, ch.focus.l);
  $("#fcap").innerHTML = ch.flowHint ||
    "點節點看說明，<b>雙擊</b>節點會讓左邊跳到對應的程式行並標示起來。";

  $("#prose").innerHTML = ch.html;
  bindJumps($("#prose"));
  $$(".deepslot", $("#prose")).forEach(s => { s.outerHTML = deepLink(s.dataset.k, s.dataset.l); });

  const dh = $("#demos"); dh.innerHTML = "";
  (ch.demos || []).forEach(d => { if (DEMOS[d]) DEMOS[d](dh); });

  const eh = $("#exs"); eh.innerHTML = "";
  renderEx(ch, eh);

  const nf = $("#navfoot"); nf.innerHTML = "";
  const prev = el("button","b", i > 0 ? "← 第 " + CHAPTERS[i-1].n + " 章　" + CHAPTERS[i-1].title : "← 第一章");
  prev.onclick = () => showChapter(Math.max(0, i-1));
  const mid = el("button","b" + (chapterDone(ch) ? " done" : ""),
    chapterDone(ch) ? "✓ 已完成這一章" : "標記這一章完成");
  mid.onclick = () => { SAVE.done[ch.n] = !SAVE.done[ch.n]; save(); showChapter(i); };
  const next = el("button","b", i < CHAPTERS.length-1
    ? "第 " + CHAPTERS[i+1].n + " 章　" + CHAPTERS[i+1].title + " →" : "最後一章");
  next.onclick = () => showChapter(Math.min(CHAPTERS.length-1, i+1));
  nf.append(prev, mid, next);

  $("#pb").style.width = (done / CHAPTERS.length * 100) + "%";
  try { history.replaceState(null,"","#c" + ch.n); } catch(e){}
  window.scrollTo({top:0});
}

/* ===============================================================
   練習
   =============================================================== */
function renderEx(ch, host){
  const ex = ch.ex || [];
  if (!ex.length) return;
  host.appendChild(el("h3", null, "練習"));
  ex.forEach(e => {
    const box = el("div","ex");
    if (SAVE.ex[e.id] === true) box.dataset.s = "ok";
    else if (SAVE.ex[e.id] === false) box.dataset.s = "no";
    box.appendChild(el("span","exn",
      (e.type === "mc" ? "問答" : e.type === "fill" ? "填空" : "排序") + " · " + e.id));
    box.appendChild(el("p","exq", e.q));
    const fb = el("div","fb"); fb.hidden = true;
    const done = ok => { SAVE.ex[e.id] = ok; save(); box.dataset.s = ok ? "ok" : "no";
      $("#pb").style.width = (CHAPTERS.filter(chapterDone).length / CHAPTERS.length * 100) + "%"; };

    if (e.type === "mc"){
      const opts = el("div","opts");
      e.opts.forEach((o, oi) => {
        const l = el("label","opt");
        l.innerHTML = '<input type="radio" name="' + e.id + '" value="' + oi + '"><span>' + o + '</span>';
        opts.appendChild(l);
      });
      box.appendChild(opts);
      const b = el("button","b","送出");
      b.style.background = "var(--tx)"; b.style.color = "var(--bg)"; b.style.borderColor = "var(--tx)";
      b.onclick = () => {
        const s = box.querySelector('input[name="' + e.id + '"]:checked');
        if (!s){ fb.hidden = false; fb.className = "fb no"; fb.innerHTML = "<b>先選一個</b>"; return; }
        const ok = +s.value === e.ans;
        $$(".opt", opts).forEach((l, li) => {
          l.classList.remove("r","w");
          if (li === e.ans) l.classList.add("r"); else if (li === +s.value) l.classList.add("w");
        });
        fb.hidden = false; fb.className = "fb " + (ok ? "ok" : "no");
        fb.innerHTML = "<b>" + (ok ? "對" : "再想一次") + "</b>" + e.fb;
        bindJumps(fb); done(ok);
      };
      box.appendChild(b);
    } else if (e.type === "fill"){
      const ta = e.multi ? el("textarea","exin") : el("input","exin");
      if (!e.multi) ta.type = "text";
      ta.placeholder = e.ph || ""; box.appendChild(ta);
      const row = el("div","drow"); row.style.marginTop = "10px";
      const b = el("button","b","批改");
      b.style.background = "var(--tx)"; b.style.color = "var(--bg)"; b.style.borderColor = "var(--tx)";
      const bs = el("button","b","看答案");
      bs.style.background = "var(--card)"; bs.style.color = "var(--tx)"; bs.style.borderColor = "var(--ln)";
      row.append(b, bs); box.appendChild(row);
      b.onclick = () => {
        const t = (ta.value || "").replace(/\s+/g," ").trim();
        if (!t){ fb.hidden = false; fb.className = "fb no"; fb.innerHTML = "<b>還沒寫</b>"; return; }
        const hay = [t, t.toUpperCase(), t.toLowerCase()];
        let miss = null;
        for (const [re, hint] of e.need){ if (!hay.some(x => re.test(x))){ miss = hint; break; } }
        const ok = !miss;
        fb.hidden = false; fb.className = "fb " + (ok ? "ok" : "no");
        fb.innerHTML = ok ? "<b>過了</b>" + e.fb : "<b>還差一點</b>" + miss;
        bindJumps(fb); done(ok);
      };
      bs.onclick = () => { fb.hidden = false; fb.className = "fb";
        fb.innerHTML = "<b>參考答案</b><pre>" + e.ans + "</pre><div style='margin-top:.6em'>" + e.fb + "</div>";
        bindJumps(fb); };
    } else { /* sort */
      const ul = el("ul","sortl");
      const order = e.items.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--){
        const j = (i * 7 + 3) % (i + 1);           /* 固定打亂，重載後一樣 */
        [order[i], order[j]] = [order[j], order[i]];
      }
      order.forEach(ix => {
        const li = el("li"); li.draggable = true; li.dataset.ix = ix;
        li.innerHTML = '<span class="h">≡</span><span class="t">' + e.items[ix] + '</span>';
        li.ondragstart = ev => { li.classList.add("drag");
          ev.dataTransfer.setData("text/plain", ix); };
        li.ondragend = () => li.classList.remove("drag");
        li.ondragover = ev => {
          ev.preventDefault();
          const d = $(".drag", ul); if (!d || d === li) return;
          const r = li.getBoundingClientRect();
          ul.insertBefore(d, (ev.clientY - r.top) / r.height > .5 ? li.nextSibling : li);
        };
        ul.appendChild(li);
      });
      ul.ondragover = ev => ev.preventDefault();
      box.appendChild(ul);
      const b = el("button","b","檢查順序");
      b.style.background = "var(--tx)"; b.style.color = "var(--bg)"; b.style.borderColor = "var(--tx)";
      b.onclick = () => {
        const got = $$("li", ul).map(li => +li.dataset.ix);
        const ok = got.every((v, i) => v === i);
        fb.hidden = false; fb.className = "fb " + (ok ? "ok" : "no");
        fb.innerHTML = ok ? "<b>順序正確</b>" + e.fb
          : "<b>順序還不對</b>" + (e.wrongFb || "") + "<br>目前第一個是「"
            + e.items[got[0]].replace(/<[^>]+>/g,"") + "」。" + e.hintFirst;
        bindJumps(fb); done(ok);
      };
      box.appendChild(b);
    }
    box.appendChild(fb);
    host.appendChild(box);
  });
  host.appendChild(el("p","hint",
    "批改是關鍵字比對，寫法不同但意思對的可能被判不過，按「看答案」自己核對。紀錄存在這個瀏覽器。"));
}

/* ===============================================================
   啟動
   =============================================================== */
const nav = $("#chapnav");
CHAPTERS.forEach((ch, i) => {
  const b = el("button", null, String(ch.n).padStart(2,"0") + " " + ch.title);
  b.onclick = () => showChapter(i);
  nav.appendChild(b);
});
initGrip();
$("#zin").onclick = () => setZoom(zoom + .1);
$("#zout").onclick = () => setZoom(zoom - .1);
$("#zrst").onclick = () => setZoom(1);

const tb = $("#themeBtn");
const tlab = () => tb.textContent =
  document.documentElement.getAttribute("data-theme") === "dark" ? "淺色" : "深色";
tb.onclick = () => {
  const d = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", d ? "light" : "dark");
  try { localStorage.setItem("fwconsole.theme", d ? "light" : "dark"); } catch(e){}
  tlab();
};
try { const t = localStorage.getItem("fwconsole.theme");
  if (t) document.documentElement.setAttribute("data-theme", t); } catch(e){}
tlab();

(function(){
  const m = /^#c(\d{1,2})$/.exec(location.hash || "");
  const i = m ? CHAPTERS.findIndex(c => c.n === +m[1]) : 0;
  showChapter(i >= 0 ? i : 0);
})();

</script>
