      <span class=\"tk-f\">Game_NewRound</span>();","            <span class=\"tk-f\">WaitForTouchRelease</span>(<span class=\"tk-n\">5</span>);","            <span class=\"tk-k\">continue</span>;","        }","        <span class=\"tk-k\">if</span> (tapped == <span class=\"tk-n\">2</span>) { <span class=\"tk-f\">WaitForTouchRelease</span>(<span class=\"tk-n\">5</span>); <span class=\"tk-k\">return</span>; }","","        <span class=\"tk-k\">if</span> (d != <span class=\"tk-n\">SW_NONE</span> &amp;&amp; !g_game_over &amp;&amp; !g_game_won) {","            <span class=\"tk-t\">uint32_t</span> before = g_score;","            <span class=\"tk-k\">if</span> (<span class=\"tk-f\">apply_move</span>(d)) {","                <span class=\"tk-f\">Add_RandomTile</span>();","                <span class=\"tk-f\">Draw_Board</span>();","                <span class=\"tk-f\">Draw_Values</span>();","                <span class=\"tk-k\">if</span> (g_score &gt; before) <span class=\"tk-f\">SFX_Merge</span>(); <span class=\"tk-k\">else</span> <span class=\"tk-f\">SFX_Select</span>();","","                <span class=\"tk-k\">if</span> (!g_game_won &amp;&amp; <span class=\"tk-f\">Check_Win</span>()) {","                    g_game_won = <span class=\"tk-n\">1</span>;","                    <span class=\"tk-f\">SFX_Good</span>();","                    <span class=\"tk-f\">Draw_Message</span>(<span class=\"tk-s\">\"  You Win! \"</span>, <span class=\"tk-n\">0x051F</span>);","                } <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> (<span class=\"tk-f\">Check_GameOver</span>()) {","                    g_game_over = <span class=\"tk-n\">1</span>;","                    <span class=\"tk-f\">SFX_Hit</span>();","                    <span class=\"tk-f\">Draw_Message</span>(<span class=\"tk-s\">\" Game Over \"</span>, <span class=\"tk-n\">DARKRED</span>);","                }","            }","        }","","        <span class=\"tk-k\">while</span> (msTick - t0 &lt; <span class=\"tk-n\">10u</span>) { }","    }","}"],"App/game_gate.c":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * game_gate.c - GATE KEEPER</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * You are a core in the middle of four lanes.  Things walk down</span>","<span class=\"tk-c\"> * the lanes towards you.  Tap the button for that lane to fire a</span>","<span class=\"tk-c\"> * pulse up it.  Meanwhile a collector you steer with stick 1</span>","<span class=\"tk-c\"> * has to pick up drops before they expire.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * So: the four buttons are reflex, the stick is navigation, and</span>","<span class=\"tk-c\"> * the game is about not being able to give either your full</span>","<span class=\"tk-c\"> * attention.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> *          UP</span>","<span class=\"tk-c\"> *           |</span>","<span class=\"tk-c\"> *    LEFT --O-- RIGHT        O = the core</span>","<span class=\"tk-c\"> *           |</span>","<span class=\"tk-c\"> *         DOWN</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * WHY THE GEOMETRY LOOKS ODD IN THE CODE</span>","<span class=\"tk-c\"> *   The screen is 320 x 240, so the left/right lanes are 152 px</span>","<span class=\"tk-c\"> *   long and the up/down lanes only 100 px.  If everything moved</span>","<span class=\"tk-c\"> *   at the same pixel speed, the short lanes would be brutally</span>","<span class=\"tk-c\"> *   harder.  So every speed is scaled by that lane's length: an</span>","<span class=\"tk-c\"> *   enemy always takes the same *time* to walk in, whichever</span>","<span class=\"tk-c\"> *   lane it came from.  See lane_scale().</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"console.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"input.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"sound.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"gfx.h\"</span>","<span class=\"tk-p\">#include</span> &lt;stdio.h&gt;","","<span class=\"tk-c\">/* ---- 電競風 palette: neon on black ------------------------- */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_BG</span>        <span class=\"tk-n\">0x0000</span>      <span class=\"tk-c\">/* black                        */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_GRID</span>      <span class=\"tk-n\">0x2124</span>      <span class=\"tk-c\">/* dim blue-grey dots           */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_RAIL</span>      <span class=\"tk-n\">0x18E3</span>      <span class=\"tk-c\">/* lane rail, idle              */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_READY</span>     <span class=\"tk-n\">0x045F</span>      <span class=\"tk-c\">/* lane rail, charged           */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_CORE</span>      <span class=\"tk-n\">0x07FF</span>      <span class=\"tk-c\">/* cyan                         */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_CORE2</span>     <span class=\"tk-n\">0x03BF</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_CORE_HIT</span>  <span class=\"tk-n\">0xF800</span>      <span class=\"tk-c\">/* red flash                    */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_PULSE</span>     <span class=\"tk-n\">0xFFFF</span>      <span class=\"tk-c\">/* white                        */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_PULSE2</span>    <span class=\"tk-n\">0x07FF</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_EN</span>        <span class=\"tk-n\">0xF81F</span>      <span class=\"tk-c\">/* magenta                      */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_EN2</span>       <span class=\"tk-n\">0xB00F</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_FAST</span>      <span class=\"tk-n\">0xFC00</span>      <span class=\"tk-c\">/* orange-red                   */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_FAST2</span>     <span class=\"tk-n\">0xA000</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_COLL</span>      <span class=\"tk-n\">0x07E0</span>      <span class=\"tk-c\">/* lime                         */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_HEAL</span>      <span class=\"tk-n\">0x07E0</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_COIN</span>      <span class=\"tk-n\">0xFFE0</span>      <span class=\"tk-c\">/* yellow                       */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_NUKE</span>      <span class=\"tk-n\">0x981F</span>      <span class=\"tk-c\">/* electric purple              */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_TEXT</span>      <span class=\"tk-n\">0x07FF</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_TEXT2</span>     <span class=\"tk-n\">0x5AEB</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">C_HOT</span>       <span class=\"tk-n\">0xF81F</span>","","<span class=\"tk-c\">/* ---- arena ------------------------------------------------- */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">HUD_H</span>        <span class=\"tk-n\">30</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CX</span>          <span class=\"tk-n\">160</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CY</span>          <span class=\"tk-n\">134</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CORE_R</span>       <span class=\"tk-n\">20</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">LANE_V</span>       <span class=\"tk-n\">92</span>         <span class=\"tk-c\">/* up/down lane length, px       */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">LANE_H</span>      <span class=\"tk-n\">148</span>         <span class=\"tk-c\">/* left/right lane length, px    */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">LANE_PAD</span>     <span class=\"tk-n\">11</span>         <span class=\"tk-c\">/* band overhang, so a diamond at</span>","<span class=\"tk-c\">                                 * the spawn point is not clipped */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">GRID_S</span>       <span class=\"tk-n\">32</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">LANE_W</span>       <span class=\"tk-n\">26</span>         <span class=\"tk-c\">/* lane strip width, px          */</span>","","<span class=\"tk-k\">enum</span> { <span class=\"tk-n\">LN_UP</span> = <span class=\"tk-n\">0</span>, <span class=\"tk-n\">LN_DOWN</span>, <span class=\"tk-n\">LN_LEFT</span>, <span class=\"tk-n\">LN_RIGHT</span>, <span class=\"tk-n\">LN_N</span> };","","<span class=\"tk-k\">typedef</span> <span class=\"tk-k\">struct</span> { <span class=\"tk-t\">int16_t</span> bx, by; <span class=\"tk-t\">uint16_t</span> bw, bh; } Band;","","<span class=\"tk-c\">/* The strip of screen each lane owns.  Every one of these stops</span>","<span class=\"tk-c\"> * short of the core box, so redrawing a lane can never erase the</span>","<span class=\"tk-c\"> * core and the two never fight over a pixel. */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Band <span class=\"tk-n\">LB</span>[<span class=\"tk-n\">LN_N</span>] = {","    { <span class=\"tk-n\">CX</span> - <span class=\"tk-n\">LANE_W</span> / <span class=\"tk-n\">2</span>,       <span class=\"tk-n\">CY</span> - <span class=\"tk-n\">LANE_V</span> - <span class=\"tk-n\">LANE_PAD</span>, <span class=\"tk-n\">LANE_W</span>, <span class=\"tk-n\">LANE_V</span> - <span class=\"tk-n\">CORE_R</span> + <span class=\"tk-n\">LANE_PAD</span> },","    { <span class=\"tk-n\">CX</span> - <span class=\"tk-n\">LANE_W</span> / <span class=\"tk-n\">2</span>,       <span class=\"tk-n\">CY</span> + <span class=\"tk-n\">CORE_R</span> + <span class=\"tk-n\">1</span>,        <span class=\"tk-n\">LANE_W</span>, <span class=\"tk-n\">LANE_V</span> - <span class=\"tk-n\">CORE_R</span> + <span class=\"tk-n\">LANE_PAD</span> },","    { <span class=\"tk-n\">CX</span> - <span class=\"tk-n\">LANE_H</span> - <span class=\"tk-n\">LANE_PAD</span>, <span class=\"tk-n\">CY</span> - <span class=\"tk-n\">LANE_W</span> / <span class=\"tk-n\">2</span>,       <span class=\"tk-n\">LANE_H</span> - <span class=\"tk-n\">CORE_R</span> + <span class=\"tk-n\">LANE_PAD</span>, <span class=\"tk-n\">LANE_W</span> },","    { <span class=\"tk-n\">CX</span> + <span class=\"tk-n\">CORE_R</span> + <span class=\"tk-n\">1</span>,        <span class=\"tk-n\">CY</span> - <span class=\"tk-n\">LANE_W</span> / <span class=\"tk-n\">2</span>,       <span class=\"tk-n\">LANE_H</span> - <span class=\"tk-n\">CORE_R</span> + <span class=\"tk-n\">LANE_PAD</span>, <span class=\"tk-n\">LANE_W</span> },","};","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">int16_t</span> <span class=\"tk-f\">lane_len</span>(<span class=\"tk-t\">uint8_t</span> l) { <span class=\"tk-k\">return</span> (l &lt; <span class=\"tk-n\">LN_LEFT</span>) ? <span class=\"tk-n\">LANE_V</span> : <span class=\"tk-n\">LANE_H</span>; }","","<span class=\"tk-c\">/* speed multiplier so a short lane is not a harder lane */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">int16_t</span> <span class=\"tk-f\">lane_scale</span>(<span class=\"tk-t\">uint8_t</span> l, <span class=\"tk-t\">int16_t</span> v)","{","    <span class=\"tk-k\">return</span> (l &lt; <span class=\"tk-n\">LN_LEFT</span>) ? (<span class=\"tk-t\">int16_t</span>)((<span clas pan>(<span class=\"tk-n\">5</span>);","            <span class=\"tk-k\">if</span> (hit) <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","        }","","        <span class=\"tk-k\">if</span> (step &lt; <span class=\"tk-n\">2</span>) {","            <span class=\"tk-c\">/* keep exactly one slow enemy walking down the demo lane */</span>","            busy = <span class=\"tk-n\">0</span>;","            <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_EN</span>; i++) <span class=\"tk-k\">if</span> (s_en[i].active) busy = <span class=\"tk-n\">1</span>;","            <span class=\"tk-k\">if</span> (!busy) {","                s_en[<span class=\"tk-n\">0</span>].active = <span class=\"tk-n\">1</span>;","                s_en[<span class=\"tk-n\">0</span>].lane   = <span class=\"tk-n\">LANE</span>[step];","                s_en[<span class=\"tk-n\">0</span>].kind   = <span class=\"tk-n\">0</span>;","                s_en[<span class=\"tk-n\">0</span>].d16    = (<span class=\"tk-t\">int16_t</span>)(<span class=\"tk-f\">lane_len</span>(<span class=\"tk-n\">LANE</span>[step]) * <span class=\"tk-n\">16</span>);","                s_en[<span class=\"tk-n\">0</span>].spd16  = <span class=\"tk-f\">lane_scale</span>(<span class=\"tk-n\">LANE</span>[step], <span class=\"tk-n\">10</span>);","            }","            <span class=\"tk-k\">if</span> (p &amp; <span class=\"tk-n\">WANT</span>[step]) <span class=\"tk-f\">fire</span>(<span class=\"tk-n\">LANE</span>[step]);","        } <span class=\"tk-k\">else</span> {","            busy = <span class=\"tk-n\">0</span>;","            <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_PU</span>; i++) <span class=\"tk-k\">if</span> (s_pu[i].active) busy = <span class=\"tk-n\">1</span>;","            <span class=\"tk-k\">if</span> (!busy &amp;&amp; s_score == <span class=\"tk-n\">0</span>) {","                <span class=\"tk-f\">spawn_pickup</span>();","                <span class=\"tk-c\">/* a HEAL drop scores nothing, and the step below</span>","<span class=\"tk-c\">                 * watches the score - so force a coin here */</span>","                <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_PU</span>; i++)","                    <span class=\"tk-k\">if</span> (s_pu[i].active) s_pu[i].kind = <span class=\"tk-n\">PU_COIN</span>;","            }","            <span class=\"tk-f\">move_collector</span>();","        }","","        <span class=\"tk-f\">step_world</span>();","        s_hp = <span class=\"tk-n\">MAX_HP</span>;          <span class=\"tk-c\">/* the tutorial never actually hurts you */</span>","        <span class=\"tk-f\">render</span>();","","        <span class=\"tk-c\">/* Prompt and SKIP are painted after render(), because the</span>","<span class=\"tk-c\">         * lane strips and the collector wipe would otherwise erase</span>","<span class=\"tk-c\">         * them.  Repainting text over itself does not flicker: the</span>","<span class=\"tk-c\">         * font routine writes foreground and background together,</span>","<span class=\"tk-c\">         * so there is never a blank frame in between.            */</span>","        <span class=\"tk-f\">LCD_SetFont</span>(&amp;Font12);","        <span class=\"tk-f\">LCD_SetColors</span>(<span class=\"tk-n\">C_TEXT</span>, <span class=\"tk-n\">C_BG</span>);","        <span class=\"tk-f\">LCD_DisplayStringAt</span>(<span class=\"tk-n\">6</span>, <span class=\"tk-n\">44</span>, (<span class=\"tk-t\">char</span> *)<span class=\"tk-n\">L1</span>[step], <span class=\"tk-n\">LEFT_MODE</span>);","        <span class=\"tk-f\">LCD_SetColors</span>(step == <span class=\"tk-n\">2</span> ? <span class=\"tk-n\">C_COLL</span> : <span class=\"tk-n\">C_TEXT2</span>, <span class=\"tk-n\">C_BG</span>);","        <span class=\"tk-f\">LCD_DisplayStringAt</span>(<span class=\"tk-n\">6</span>, <span class=\"tk-n\">58</span>, (<span class=\"tk-t\">char</span> *)<span class=\"tk-n\">L2</span>[step], <span class=\"tk-n\">LEFT_MODE</span>);","        <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">232</span>, <span class=\"tk-n\">214</span>, <span class=\"tk-n\">80</span>, <span class=\"tk-n\">22</span>, <span class=\"tk-s\">\"SKIP\"</span>, <span class=\"tk-n\">0x39C7</span>, <span class=\"tk-n\">0xFFFF</span>, &amp;Font12);","","        <span class=\"tk-k\">if</span> (step &lt; <span class=\"tk-n\">2</span>) {","            busy = <span class=\"tk-n\">0</span>;","            <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_EN</span>; i++) <span class=\"tk-k\">if</span> (s_en[i].active) busy = <span class=\"tk-n\">1</span>;","            <span class=\"tk-k\">if</span> (!busy &amp;&amp; s_score &gt; <span class=\"tk-n\">0</span>) {              <span class=\"tk-c\">/* shot it, not missed */</span>","                s_score = <span class=\"tk-n\">0</span>; s_combo = <span class=\"tk-n\">0</span>;","                <span class=\"tk-f\">SFX_Good</span>();","                <span class=\"tk-f\">flash_msg</span>(<span class=\"tk-s\">\"GOOD\"</span>, <span class=\"tk-n\">C_COLL</span>);","                <span class=\"tk-f\">App_Wait</span>(<span class=\"tk-n\">700</span>);","                <span class=\"tk-f\">arena_clear</span>();","                step++;","                <span class=\"tk-f\">Input_Flush</span>();","            }","        } <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> (s_score &gt; <span class=\"tk-n\">0</span>) {","            <span class=\"tk-f\">SFX_Good</span>();","            <span class=\"tk-f\">flash_msg</span>(<span class=\"tk-s\">\"READY\"</span>, <span class=\"tk-n\">C_CORE</span>);","            <span class=\"tk-f\">App_Wait</span>(<span class=\"tk-n\">900</span>);","            <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","        }","","        <span class=\"tk-k\">while</span> (msTick - t0 &lt; <span class=\"tk-n\">TICK_MS</span>) { }","    }","}","","<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * the round</span>","<span class=\"tk-c\"> * ========================================================== */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span> <span class=\"tk-f\">gate_play</span>(<span class=\"tk-t\">void</span>)      <span class=\"tk-c\">/* 1 = core destroyed, 0 = quit */</span>","{","    <span class=\"tk-f\">reset_round</span>();","    <span class=\"tk-f\">hud_frame</span>();","    <span class=\"tk-f\">arena_clear</span>();","    <span class=\"tk-f\">hud_update</span>();","    <span class=\"tk-f\">Input_Flush</span>();","","    <span class=\"tk-k\">for</span> (;;) {","        <span class=\"tk-t\">uint32_t</span> t0 = msTick;","        <span class=\"tk-t\">uint16_t</span> p;","","        <span class=\"tk-f\">Input_Poll</span>();","        <span class=\"tk-f\">Sound_Update</span>();","","        p = <span class=\"tk-f\">Input_Pressed</span>();","        <span class=\"tk-k\">if</span> (p &amp; <span class=\"tk-n\">BTN_BACK</span>) { <span class=\"tk-k\">if</span> (s_score &gt; s_best) s_best = s_score; <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>; }","","        <span class=\"tk-k\">if</span> (p &amp; <span class=\"tk-n\">BTN_UP</span>)    <span class=\"tk-f\">fire</span>(<span class=\"tk-n\">LN_UP</span>);","        <span class=\"tk-k\">if</span> (p &amp; <span class=\"tk-n\">BTN_DOWN</span>)  <span class=\"tk-f\">fire</span>(<span class=\"tk-n\">LN_DOWN</span>);","        <span class=\"tk-k\">if</span> (p &amp; <span class=\"tk-n\">BTN_LEFT</span>)  <span class=\"tk-f\">fire</span>(<span class=\"tk-n\">LN_LEFT</span>);","        <span class=\"tk-k\">if</span> (p &amp; <span class=\"tk-n\">BTN_RIGHT</span>) <span class=\"tk-f\">fire</span>(<span class=\"tk-n\">LN_RIGHT</span>);","","        <span class=\"tk-c\">/* ---- waves ---- */</span>","        <span class=\"tk-k\">if</span> (s_left == <span class=\"tk-n\">0</span>) {","            <span class=\"tk-t\">uint8_t</span> i, clear = <span class=\"tk-n\">1</span>;","            <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_EN</span>; i++) <span class=\"tk-k\">if</span> (s_en[i].active) clear = <span class=\"tk-n\">0</span>;","            <span class=\"tk-k\">if</span> (clear) {","                s_wave++;","                s_left = <span class=\"tk-f\">wave_size</span>(s_wave);","                s_nextSpawn = msTick + <span class=\"tk-n\">700u</span>;","                s_score += <span class=\"tk-n\">50u</span> * s_wave;","                <span class=\"tk-f\">SFX_Start</span>();","                <span class=\"tk-f\">flash_msg</span>(<span class=\"tk-s\">\"WAVE UP\"</span>, <span class=\"tk-n\">C_HOT</span>);","                <span class=\"tk-f\">App_Wait</span>(<span class=\"tk-n\">900</span>);","                <span class=\"tk-f\">arena_clear</span>();","            }","        } <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> ((<span class=\"tk-t\">int32_t</span>)(msTick - s_nextSpawn) &gt;= <span class=\"tk-n\">0</span>) {","            <span class=\"tk-f\">spawn_enemy</span>();","            s_nextSpawn = msTick + <span class=\"tk-f\">spawn_gap</span>(s_wave);","        }","","        <span class=\"tk-k\">if</span> ((<span class=\"tk-t\">int32_t</span>)(msTick - s_nextPu) &gt;= <span class=\"tk-n\">0</span>) {","            <span class=\"tk-f\">spawn_pickup</span>();","            s_nextPu = msTick + <span class=\"tk-n\">5200u</span> + (<span class=\"tk-f\">rnd</span>() % <span class=\"tk-n\">3000u</span>);","        }","","        <span class=\"tk-f\">move_collector</span>();","        <span class=\"tk-f\">step_world</span>();","        <span class=\"tk-f\">render</span>();","","        <span class=\"tk-k\">if</span> (s_hp == <span class=\"tk-n\">0</span>) {","            <span class=\"tk-k\">if</span> (s_score &gt; s_best) s_best = s_score;","            <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","        }","","        <span class=\"tk-k\">while</span> (msTick - t0 &lt; <span class=\"tk-n\">TICK_MS</span>) { }","    }","}","","<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * game over</span>","<span class=\"tk-c\"> * ========================================================== */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span> <span class=\"tk-f\">gate_over</span>(<span class=\"tk-t\">void</span>)      <span class=\"tk-c\">/* 1 = retry, 0 = menu */</span>","{","    TS_StateTypeDef ts;","    <span class=\"tk-t\">char</span> buf[<span class=\"tk-n\">32</span>];","","    <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">0x1082</span>);","    <span class=\"tk-f\">LCD_FillRect</span>(<span class=\"tk-n\">20</span>, <span class=\"tk-n\">76</span>, <span class=\"tk-n\">280</span>, <span class=\"tk-n\">92</span>);","    <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">C_CORE_HIT</span>);","    <span class=\"tk-f\">LCD_FillRect</span>(<span class=\"tk-n\">20</span>, <span class=\"tk-n\">76</span>, <span class=\"tk-n\">280</span>, <span class=\"tk-n\">2</span>);","","    <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">84</span>, <span class=\"tk-s\">\"CORE BREACHED\"</span>, <span class=\"tk-n\">C_HOT</span>, <span class=\"tk-n\">0x1082</span>, &amp;Font16);","    <span class=\"tk-f\">sprintf</span>(buf, <span class=\"tk-s\">\"SCORE %06lu\"</span>, (<span class=\"tk-t\">unsigned</span> <span class=\"tk-t\">long</span>)s_score);","    <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">110</span>, buf, <span class=\"tk-n\">C_TEXT</span>, <span class=\"tk-n\">0x1082</span>, &amp;Font16);","    <span class=\"tk-f\">sprintf</span>(buf, <span class=\"tk-s\">\"BEST %06lu   COMBO x%u\"</span>,","            (<span class=\"tk-t\">unsigned</span> <span class=\"tk-t\">long</span>)s_best, s_bestCombo);","    <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">130</span>, buf, <span class=\"tk-n\">C_TEXT2</span>, <span class=\"tk-n\">0x1082</span>, &amp;Font12);","","    <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">58</span>, <span class=\"tk-n\">146</span>, <span class=\"tk-n\">90</span>, <span class=\"tk-n\">18</span>, <span class=\"tk-s\">\"RETRY\"</span>, <span class=\"tk-n\">C_CORE2</span>, <span class=\"tk-n\">0x0000</span>, &amp;Font12);","    <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">172</span>, <span class=\"tk-n\">146</span>, <span class=\"tk-n\">90</span>, <span class=\"tk-n\">18</span>, <span class=\"tk-s\">\"MENU\"</span>, <span class=\"tk-n\">0x39C7</span>, <span class=\"tk-n\">0xFFFF</span>, &amp;Font12);","","    <span class=\"tk-f\">Input_Flush</span>();","    <span class=\"tk-f\">WaitForTouchRelease</span>(<span class=\"tk-n\">5</span>);","","    <span class=\"tk-k\">for</span> (;;) {","        <span class=\"tk-t\">uint32_t</span> t0 = msTick;","        <span class=\"tk-t\">uint16_t</span> p;","","        <span class=\"tk-f\">Input_Poll</span>();","        <span class=\"tk-f\">Sound_Update</span>();","        p = <span class=\"tk-f\">Input_Pressed</span>();","","        <span class=\"tk-k\">if</span> (p &amp; <span class=\"tk-n\">BTN_BACK</span>) <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>;","        <span class=\"tk-k\">if</span> (p &amp; (<span class=\"tk-n\">BTN_UP</span> | <span class=\"tk-n\">BTN_J1SW</span> | <span class=\"tk-n\">BTN_J2SW</span>)) <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","","        <span class=\"tk-f\">TS_GetState</span>(&amp;ts);","        <span class=\"tk-k\">if</span> (ts.TouchDetected) {","            <span class=\"tk-f\">WaitForTouchRelease</span>(<span class=\"tk-n\">5</span>);","            <span class=\"tk-k\">if</span> (<span class=\"tk-f\">UI_HitBox</span>(ts.x, ts.y, <span class=\"tk-n\">172</span>, <span class=\"tk-n\">146</span>, <span class=\"tk-n\">90</span>, <span class=\"tk-n\">18</span>)) <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>;","            <span class=\"tk-k\">if</span> (<span class=\"tk-f\">UI_HitBox</span>(ts.x, ts.y, <span class=\"tk-n\">58</span>, <span class=\"tk-n\">146</span>, <span class=\"tk-n\">90</span>, <span class=\"tk-n\">18</span>))  <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","        }","","        <span class=\"tk-k\">while</span> (msTick - t0 &lt; <span class=\"tk-n\">10u</span>) { }","    }","}","","<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * entry point</span>","<span class=\"tk-c\"> * ========================================================== */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Gate_Run</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-k\">if</span> (!<span class=\"tk-f\">gate_tutorial</span>()) <span class=\"tk-k\">return</span>;","","    <span class=\"tk-k\">for</span> (;;) {","        <span class=\"tk-k\">if</span> (!<span class=\"tk-f\">gate_play</span>()) <span class=\"tk-k\">return</span>;","        <span class=\"tk-k\">if</span> (!<span class=\"tk-f\">gate_over</span>()) <span class=\"tk-k\">return</span>;","    }","}"],"App/iotest.c":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * iotest.c - live wiring diagnostic</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Solder one thing, come here, see it move.  That is the whole</span>","<span class=\"tk-c\"> * point: it turns \"the game does not respond\" into \"pin PE3 is</span>","<span class=\"tk-c\"> * dead\", which is a question you can actually answer.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * What each row tells you</span>","<span class=\"tk-c\"> *   raw 0..4095    the ADC count for that joystick axis</span>","<span class=\"tk-c\"> *   a centred stick should read near the boot centre shown in</span>","<span class=\"tk-c\"> *   brackets; ~0 or ~4095 at rest means the axis is shorted to</span>","<span class=\"tk-c\"> *   GND or 3V3, i.e. the wire is on the wrong pin</span>","<span class=\"tk-c\"> *   a button box lights up while that button is held</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"console.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"input.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"sound.h\"</span>","<span class=\"tk-p\">#include</span> &lt;stdio.h&gt;","","<span class=\"tk-c\">/* BEEP now runs a 2.5 s sweep from 400 Hz to 4 kHz instead of a</span>","<span class=\"tk-c\"> * short jingle.  Two reasons:</span>","<span class=\"tk-c\"> *   - a small speaker is far louder at its resonance than away</span>","<span class=\"tk-c\"> *     from it, and a sweep is guaranteed to cross it</span>","<span class=\"tk-c\"> *   - it holds the pin toggling long enough to put a multimeter</span>","<span class=\"tk-c\"> *     on PA6.  A 50% square wave at 3.3 V averages about 1.65 V,</span>","<span class=\"tk-c\"> *     so a DC reading near half rail proves the timer is running</span>","<span class=\"tk-c\"> *     and moves the blame to the speaker side.</span>","<span class=\"tk-c\"> */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">DC_MS</span>      <span class=\"tk-n\">1500u</span>        < -f\">LCD_FillRect</span>(<span class=\"tk-n\">0</span>, <span class=\"tk-n\">0</span>, <span class=\"tk-n\">SCR_W</span>, <span class=\"tk-n\">SCR_H</span>);","","    <span class=\"tk-f\">LCD_SetFont</span>(&amp;Font16);","    <span class=\"tk-f\">LCD_SetColors</span>(<span class=\"tk-n\">BAR_FG</span>, <span class=\"tk-n\">BG</span>);","    <span class=\"tk-f\">LCD_DisplayStringAt</span>(<span class=\"tk-n\">8</span>, <span class=\"tk-n\">4</span>, <span class=\"tk-s\">\"I/O TEST\"</span>, <span class=\"tk-n\">LEFT_MODE</span>);","","    <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">BACK_X</span>, <span class=\"tk-n\">BACK_Y</span>, <span class=\"tk-n\">BACK_W</span>, <span class=\"tk-n\">BACK_H</span>, <span class=\"tk-s\">\"BACK\"</span>, <span class=\"tk-n\">0x39C7</span>, <span class=\"tk-n\">FG</span>, &amp;Font12);","    <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">CAL_X</span>,  <span class=\"tk-n\">CAL_Y</span>,  <span class=\"tk-n\">CAL_W</span>,  <span class=\"tk-n\">CAL_H</span>,  <span class=\"tk-s\">\"CENTRE STICKS\"</span>, <span class=\"tk-n\">0x8400</span>, <span class=\"tk-n\">FG</span>, &amp;Font12);","    <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">BEEP_X</span>, <span class=\"tk-n\">BEEP_Y</span>, <span class=\"tk-n\">BEEP_W</span>, <span class=\"tk-n\">BEEP_H</span>, <span class=\"tk-s\">\"BEEP\"</span>, <span class=\"tk-n\">0x0410</span>, <span class=\"tk-n\">FG</span>, &amp;Font12);","    <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">FIND_X</span>, <span class=\"tk-n\">FIND_Y</span>, <span class=\"tk-n\">FIND_W</span>, <span class=\"tk-n\">FIND_H</span>, <span class=\"tk-s\">\"FIND\"</span>, <span class=\"tk-n\">0x8400</span>, <span class=\"tk-n\">FG</span>, &amp;Font12);","","    <span class=\"tk-f\">LCD_SetFont</span>(&amp;Font12);","    <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">4</span>; i++) {","        <span class=\"tk-f\">LCD_Set n\">J1_UP</span>)    ? <span class=\"tk-s\">'U'</span> : <span class=\"tk-s\">'-'</span>, (held &amp; <span class=\"tk-n\">J1_DOWN</span>)  ? <span class=\"tk-s\">'D'</span> : <span class=\"tk-s\">'-'</span>,","            (held &amp; <span class=\"tk-n\">J1_LEFT</span>)  ? <span class=\"tk-s\">'L'</span> : <span class=\"tk-s\">'-'</span>, (held &amp; <span class=\"tk-n\">J1_RIGHT</span>) ? <span class=\"tk-s\">'R'</span> : <span class=\"tk-s\">'-'</span>,","            (held &amp; <span class=\"tk-n\">J2_UP</span>)    ? <span class=\"tk-s\">'U'</span> : <span class=\"tk-s\">'-'</span>, (held &amp; <span class=\"tk-n\">J2_DOWN</span>)  ? <span class=\"tk-s\">'D'</span> : <span class=\"tk-s\">'-'</span>,","            (held &amp; <span class=\"tk-n\">J2_LEFT</span>)  ? <span class=\"tk-s\">'L'</span> : <span class=\"tk-s\">'-'</span>, (held &amp; <span class=\"tk-n\">J2_RIGHT</span>) ? <span class=\"tk-s\">'R'</span> : <span class=\"tk-s\">'-'</span>);","","    <span class=\"tk-f\">LCD_SetFont</span>(&amp;Font12);","    <span class=\"tk-f\">LCD_SetColors</span>(<span class=\"tk-n\">BAR_FG</span>, <span class=\"tk-n\">BG</span>);","    <span class=\"tk-f\">LCD_DisplayStringAt</span>(<span class=\"tk-n\">8</span>, <span class=\"tk-n\">124</span>, buf, <span class=\"tk-n\">LEFT_MODE</span>);","}","","<span class=\"tk-c\">/* One line of hard numbers about the sound path. */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">draw_sound</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">char</span>     buf[<span class=\"tk-n\">36</span>];","    <span class=\"tk-t\">uint32_t</span> clk;","    <span class=\"tk-t\">uint16_t</span> psc, arr, f;","","    <span class=\"tk-f\">Sound_Debug</span>(&amp;clk, &amp;psc, &amp;arr, &amp;f);","    (<span class=\"tk-t\">void</span>)psc;","    <span class=\"tk-f\">sprintf</span>(buf, <span class=\"tk-s\">\"SPK %s %luk ARR%u %uHz    \"</span>,","            s_phase, (<span class=\"tk-t\">unsigned</span> <span class=\"tk-t\">long</span>)(clk / <span class=\"tk-n\">1000u</span>), arr, f);","","    <span class=\"tk-f\">LCD_SetFont</span>(&amp;Font12);","    <span class=\"tk-f\">LCD_SetColors</span>((clk &gt; <span class=\"tk-n\">1000000u</span>) ? <span class=\"tk-n\">DIM</span> : <span class=\"tk-n\">0xF800</span>, <span class=\"tk-n\">BG</span>);","    <span class=\"tk-f\">LCD_DisplayStringAt</span>(<span class=\"tk-n\">4</span>, <span class=\"tk-n\">108</span>, buf, <span class=\"tk-n\">LEFT_MODE</span>);","}","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">draw_touch</span>(<span class=\"tk-t\">uint16_t</span> x, <span class=\"tk-t\">uint16_t</span> y, <span class=\"tk-t\">uint8_t</span> down)","{","    <span class=\"tk-t\">char</span> buf[<span class=\"tk-n\">26</span>];","    <span class=\"tk-f\">sprintf</span>(buf, down ? <span class=\"tk-s\">\"TOUCH x=%3u y=%3u\"</span> : <span class=\"tk-s\">\"TOUCH   --    --  \"</span>, x, y);","    <span class=\"tk-f\">LCD_SetFont</span>(&amp;Font12);","    <span class=\"tk-f\">LCD_SetColors</span>(down ? <span class=\"tk-n\">HOT</span> : <span class=\"tk-n\">DIM</span>, <span class=\"tk-n\">BG</span>);","    <span class=\"tk-f\">LCD_DisplayStringAt</span>(<span class=\"tk-n\">180</span>, <span class=\"tk-n\">124</span>, buf, <span class=\"tk-n\">LEFT_MODE</span>);","}","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * FIND: which pin is the buzzer wire actually on?</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Walks PA1..PA8, squaring each one at roughly 3 kHz for 600 ms</span>","<span class=\"tk-c\"> * and naming it on screen.  Clip the buzzer to the wire you</span>","<span class=\"tk-c\"> * soldered and listen: the pin that makes a noise is the pin you</span>","<span class=\"tk-c\"> * are really connected to.  It bit-bangs rather than using TIM3,</span>","<span class=\"tk-c\"> * so it works on every pin regardless of which timer that pin</span>","<span class=\"tk-c\"> * belongs to, and it drives both buzzer types.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * PA0 is skipped (often a wake button tied to 3V3), as are</span>","<span class=\"tk-c\"> * PA9..PA12 (USART/USB) and PA13/PA14, which are the SWD debug</span>","<span class=\"tk-c\"> * pins - driving those would drop the ST-Link mid-session.</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">pin_warble</span>(<span class=\"tk-t\">uint8_t</span> pin, <span class=\"tk-t\">uint32_t</span> ms)","{","    <span class=\"tk-t\">uint32_t</span> t0 = msTick;","    <span class=\"tk-k\">while</span> (msTick - t0 &lt; ms) {","        <span class=\"tk-k\">volatile</span> <span class=\"tk-t\">uint32_t</span> d;","        <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">BSRR</span> = (<span class=\"tk-n\">1UL</span> &lt;&lt; pin);","        <span class=\"tk-k\">for</span> (d = <span class=\"tk-n\">4000</span>; d; d--) { }","        <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">BSRR</span> = (<span class=\"tk-n\">1UL</span> &lt;&lt; (pin + <span class=\"tk-n\">16</span>));","        <span class=\"tk-k\">for</span> (d = <span class=\"tk-n\">4000</span>; d; d--) { }","    }","}","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">find_pin</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">uint8_t</span> pin;","","    <span class=\"tk-n\">RCC</span>-&gt;<span class=\"tk-n\">AHB1ENR</span> |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">0</span>);                 <span class=\"tk-c\">/* GPIOA */</span>","    <span class=\"tk-f\">Sound_Stop</span>();","","    <span class=\"tk-k\">for</span> (pin = <span class=\"tk-n\">1</span>; pin &lt;= <span class=\"tk-n\">8</span>; pin++) {","        <span class=\"tk-t\">char</span> buf[<span class=\"tk-n\">20</span>];","        <span class=\"tk-t\">uint32_t</span> saveMode = <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span>;","","        <span class=\"tk-f\">sprintf</span>(buf, <span class=\"tk-s\">\"TESTING  PA%u\"</span>, pin);","        <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">BG</span>);","        <span class=\"tk-f\">LCD_FillRect</span>(<span class=\"tk-n\">0</span>, <span class=\"tk-n\">56</span>, <span class=\"tk-n\">SCR_W</span>, <span class=\"tk-n\">40</span>);","        <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">62</span>, buf, <span class=\"tk-n\">HOT</span>, <span class=\"tk-n\">BG</span>, &amp;Font16);","","        <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span>   = (<span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span> &amp; ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (pin * <span class=\"tk-n\">2</span>)))","                       | (<span class=\"tk-n\">1UL</span> &lt;&lt; (pin * <span class=\"tk-n\">2</span>));    <span class=\"tk-c\">/* 01 = output */</span>","        <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">OTYPER</span> &amp;= ~(<span class=\"tk-n\">1UL</span> &lt;&lt; pin);         <span class=\"tk-c\">/* push-pull   */</span>","","        <span class=\"tk-f\">pin_warble</span>(pin, <span class=\"tk-n\">600</span>);","","        <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">BSRR</span>  = (<span class=\"tk-n\">1UL</span> &lt;&lt; (pin + <span class=\"tk-n\">16</span>));     <span class=\"tk-c\">/* park low    */</span>","        <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span> = saveMode;                <span class=\"tk-c\">/* put it back */</span>","    }","","    <span class=\"tk-f\">Sound_Init</span>();        <span class=\"tk-c\">/* FIND left PA6 as a plain GPIO; restore the timer */</span>","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">IoTest_Run</span>(<span class=\"tk-t\">void</span>)","{","    TS_StateTypeDef ts;","    <span class=\"tk-t\">uint16_t</span> centre[<span class=\"tk-n\">4</span>];","    <span class=\"tk-t\">uint16_t</span> shownBtn = <span class=\"tk-n\">0</span>;","    <span class=\"tk-t\">uint16_t</span> tx = <span class=\"tk-n\">0</span>, ty = <span class=\"tk-n\">0</span>;","    <span class=\"tk-t\">uint8_t</span>  tdown = <span class=\"tk-n\">0</span>, tshown = <span class=\"tk-n\">0xFF</span>;","    <span class=\"tk-t\">uint16_t</span> backHold = <span class=\"tk-n\">0</span>;","    <span class=\"tk-t\">uint32_t</span> sweepEnd = <span class=\"tk-n\">0</span>, dcEnd = <span class=\"tk-n\">0</span>;","","    <span class=\"tk-f\">draw_frame</span>();","    <span class=\"tk-f\">Input_DiagInit</span>();          <span class=\"tk-c\">/* pull up every candidate button pin */</span>","    <span class=\"tk-f\">Input_JoyCentre</span>(&amp;centre[<span class=\"tk-n\">0</span>], &amp;centre[<span class=\"tk-n\">1</span>], &amp;centre[<span class=\"tk-n\">2</span>], &amp;centre[<span class=\"tk-n\">3</span>]);","    <span class=\"tk-f\">Input_Flush</span>();","    <span class=\"tk-f\">WaitForTouchRelease</span>(<span class=\"tk-n\">5</span>);","","    <span class=\"tk-k\">for</span> (;;) {","        <span class=\"tk-t\">uint32_t</span> t0 = msTick;","        <span class=\"tk-t\">uint16_t</span> held, pressed;","        <span class=\"tk-t\">uint8_t</span>  i;","","        <span class=\"tk-f\">Input_Poll</span>();","        <span class=\"tk-f\">Sound_Update</span>();","","        held    = <span class=\"tk-f\">Input_Held</span>();","        pressed = <span class=\"tk-f\">Input_Pressed</span>();","","        <span class=\"tk-c\">/* every button press also proves the speaker works */</span>","        <span class=\"tk-k\">if</span> (pressed &amp; (<span class=\"tk-n\">BTN_UP</span> | <span class=\"tk-n\">BTN_DOWN</span> | <span class=\"tk-n\">BTN_LEFT</span> | <span class=\"tk-n\">BTN_RIGHT</span> |","                       <span class=\"tk-n\">BTN_J1SW</span> | <span class=\"tk-n\">BTN_J2SW</span>))","            <span class=\"tk-f\">Sound_Tone</span>(<span class=\"tk-n\">NOTE_G5</span>, <span class=\"tk-n\">60</span>);","","        <span class=\"tk-c\">/* KEY1 is one of the inputs under test, so a tap must stay a</span>","<span class=\"tk-c\">         * tap.  Holding it for 1.5 s is the way out when the touch</span>","<span class=\"tk-c\">         * panel is the thing that is broken.                       */</span>","        backHold = (<span class=\"tk-t\">uint16_t</span>)((held &amp; <span class=\"tk-n\">BTN_BACK</span>) ? (backHold + <span class=\"tk-n\">1</span>) : <span class=\"tk-n\">0</span>);","        <span class=\"tk-k\">if</span> (backHold &gt; <span class=\"tk-n\">30</span>) <span class=\"tk-k\">return</span>;","","        <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">4</span>; i++)","            <span class=\"tk-f\">draw_axis</span>(i, <span class=\"tk-f\">Input_AdcRaw</span>(<span class=\"tk-n\">AXIS_CH</span>[i]), centre[i]);","","        <span class=\"tk-c\">/* ---- speaker test: DC first, then a swept tone ----</span>","<span class=\"tk-c\">         * One press covers both device types.  An ACTIVE buzzer</span>","<span class=\"tk-c\">         * sounds during the DC half and goes quiet for the sweep;</span>","<span class=\"tk-c\">         * a PASSIVE buzzer or a speaker does the opposite.  So</span>","<span class=\"tk-c\">         * whichever half makes a noise also tells you which kind</span>","<span class=\"tk-c\">         * of part is plugged in.                                */</span>","        <span class=\"tk-k\">if</span> (dcEnd) {","            <span class=\"tk-k\">if</span> ((<span class=\"tk-t\">int32_t</span>)(msTick - SPIMOSI</span>(<span class=\"tk-n\">0</span>);","\t\t\t\t","\t\t\t\tVal &lt;&lt;= <span class=\"tk-n\">1</span>;","        <span class=\"tk-f\">Driver_SPISCK</span>(<span class=\"tk-n\">0</span>);\t<span class=\"tk-c\">// load at the FALLing edge of SCK clock</span>","\t\t\t\t<span class=\"tk-f\">Delay_SPI</span>(<span class=\"tk-n\">1</span>);\t\t\t\t\t<span class=\"tk-c\">// hold half period</span>","        <span class=\"tk-f\">Driver_SPISCK</span>(<span class=\"tk-n\">1</span>);\t<span class=\"tk-c\">// capture at the RISing edge of SCK Clock</span>","\t\t\t\t<span class=\"tk-f\">Delay_SPI</span>(<span class=\"tk-n\">1</span>);\t\t\t\t\t<span class=\"tk-c\">// hold half period</span>","    }","\t\t<span class=\"tk-f\">Driver_SPISCK</span>(<span class=\"tk-n\">0</span>);\t\t\t<span class=\"tk-c\">// idle mode</span>","\t\t<span class=\"tk-f\">Delay_SPI</span>(<span class=\"tk-n\">1</span>);","}","","<span class=\"tk-c\">//--------- Receive Data from SPI</span>","","<span class=\"tk-c\">//====================================</span>","<span class=\"tk-c\">//#define Test_CaseNormal</span>","<span class=\"tk-c\">//====================================</span>","<span class=\"tk-t\">uint16_t</span> <span class=\"tk-f\">Touch_SPIRead</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">uint8_t</span> i;","    <span class=\"tk-t\">uint16_t</span> Val = <span class=\"tk-n\">0</span>;","","<span class=\"tk-c\">//\tfor(i=0; i&lt;12; i++)\t\t\t// 12-bit data: max value = 4095</span>","\t\t\t\t\t\t\t\t\t\t\t\t\t  <span class=\"tk-c\">// the least 4 significant bits are ignorable</span>","\t<span class=\"tk-k\">for</span>(i=<span class=\"tk-n\">0</span>; i&lt;<span class=\"tk-n\">16</span>; i++)\t\t\t<span class=\"tk-c\">// 16-bit data: max value = 65536</span>","\t\t{","        Val &lt;&lt;= <span class=\"tk-n\">1</span>;","<span class=\"tk-p\">#ifndef</span> Test_CaseNormal\t\t\t","        <span class=\"tk-f\">Driver_SPISCK</span>(<span class=\"tk-n\">1</span>);\t<span class=\"tk-c\">// as soon as the master captures data</span>","\t\t\t  <span class=\"tk-f\">Delay_SPI</span>(<span class=\"tk-n\">1</span>);","<span class=\"tk-p\">#endif</span>","        <span class=\"tk-f\">Driver_SPISCK</span>(<span class=\"tk-n\">0</span>);\t<span class=\"tk-c\">// slave loads data</span>","\t\t\t\t<span class=\"tk-f\">Delay_SPI</span>(<span class=\"tk-n\">1</span>);","        <span class=\"tk-k\">if</span>(<span class=\"tk-f\">Driver_SPIMISO</span>()){ <span class=\"tk-c\">// if MISO is high</span>","\t\t\t\t\tVal++;","\t\t\t\t}","<span class=\"tk-p\">#ifdef</span> Test_CaseNormal\t\t\t","        <span class=\"tk-f\">Driver_SPISCK</span>(<span class=\"tk-n\">1</span>);\t<span class=\"tk-c\">// master captures data</span>","\t\t\t  <span class=\"tk-f\">Delay_SPI</span>(<span class=\"tk-n\">1</span>);","<span class=\"tk-p\">#endif</span>","    }","<span class=\"tk-p\">#ifdef</span> Test_CaseNormal\t\t\t","\t\t<span class=\"tk-f\">Driver_SPISCK</span>(<span class=\"tk-n\">0</span>);\t\t\t<span class=\"tk-c\">// idle mode</span>","\t\t<span class=\"tk-f\">Delay_SPI</span>(<span class=\"tk-n\">1</span>);","<span class=\"tk-p\">#endif</span>","    <span class=\"tk-k\">return</span> Val;","}"]};
const CHAPTERS=[{n:1,title:"開機",problem:"七個初始化呼叫，每一個都可能依賴前一個已經做完的事。順序排錯的症狀不是當機，而是「某個功能就是不會動」，而你找不到原因。這一章講清楚每一步在等什麼。",files:["App/app_main.c","App/console.h"],focus:{f:"App/app_main.c",l:98},flowName:"main() 的啟動順序",flowHint:"橘色邊框的節點有前置依賴，順序不能換。雙擊任何節點跳到程式。",flow:{w:560,h:700,nodes:[{id:"pw",x:180,y:8,w:180,h:40,t:"電源接上",cls:"ev",sub:"CPU 從 Reset_Handler 開始",cap:"啟動碼把 SRAM 清好、把初值搬進 RAM，然後跳進 <b>main()</b>。"},{id:"hw",x:150,y:72,w:240,h:54,t:"stm32f4_Hardware_Init()",cls:"dec",sub:"PLL · SysTick · 算出四個匯流排頻率",cap:"<b>必須第一個。</b>它設好時脈樹並把 PCLK1_Freq 等四個值算出來，後面每一步都建立在這上面。",tgt:{f:"App/app_main.c",l:98}},{id:"lcd",x:150,y:150,w:240,h:48,t:"LCD_Init()",sub:"FSMC + ILI9341 初始化序列",cap:"設定 FSMC、把螢幕用到的腳位交給它、送出面板的初始化指令、開背光。",tgt:{f:"App/app_main.c",l:100}},{id:"on",x:150,y:222,w:240,h:40,t:"LCD_DisplayOn()",sub:"打開顯示輸出",cap:"到這裡畫面才真的會亮。",tgt:{f:"App/app_main.c",l:101}},{id:"cal",x:150,y:286,w:240,h:54,t:"Default_Calibration()",cls:"dec",sub:"觸控座標係數",cap:"<b>必須在 LCD_Init() 之後。</b>它算係數時要問螢幕多寬，而那個值在面板初始化前沒有意義。",tgt:{f:"App/app_main.c",l:102}},{id:"drv",x:150,y:364,w:240,h:48,t:"Driver_GPIO()",sub:"觸控的 SPI 腳位 + 板載 KEY1",cap:"設定觸控那四條線，順手把 KEY1（PB8）設成輸入上拉。",tgt:{f:"App/app_main.c",l:103}},{id:"inp",x:150,y:436,w:240,h:54,t:"Input_Init()",cls:"dec",sub:"按鍵 · 搖桿 ADC · 量中心值",cap:"<b>這一刻不要碰搖桿。</b>最後一步會把「現在的讀數」定義成中心，你推著它就會被記進去。",tgt:{f:"App/app_main.c",l:105}},{id:"snd",x:150,y:514,w:240,h:54,t:"Sound_Init()",cls:"dec",sub:"PA6 交給 TIM3，設成 PWM",cap:"<b>需要第一步算出的 PCLK1_Freq</b> 才能知道計時器跑多快，所以不能提前。",tgt:{f:"App/app_main.c",l:106}},{id:"sp",x:150,y:592,w:240,h:48,t:"splash()",cls:"io",sub:"4.5 秒，顯示四軸即時讀數",cap:"開機畫面兼第一道診斷：四個 ADC 數字在這裡就會告訴你搖桿有沒有接好。",tgt:{f:"App/app_main.c",l:33}},{id:"lp",x:150,y:656,w:240,h:38,t:"for (;;) { Menu_Run(); … }",cls:"io",sub:"永遠不回傳",cap:"第 2 章的主題。",tgt:{f:"App/app_main.c",l:111}}],edges:[{a:"pw",b:"hw"},{a:"hw",b:"lcd"},{a:"lcd",b:"on"},{a:"on",b:"cal"},{a:"cal",b:"drv"},{a:"drv",b:"inp"},{a:"inp",b:"snd"},{a:"snd",b:"sp"},{a:"sp",b:"lp"}]},html:"\n<h3>七步，三個真正的依賴</h3>\n<p>整個 <code>main()</code> 只有十幾行，但檔案開頭那段註解把每一步為什麼排在那裡都列出來了。實際上只有三處是「換了就壞」：</p>\n<ul>\n<li><b>時脈要第一個。</b><button class=\"jump\" data-f=\"App/app_main.c\" data-l=\"98\">app_main.c 的第一行呼叫</button> 設好 PLL 並算出 <code>SYS_Freq</code>、<code>HCLK_Freq</code>、<code>PCLK1_Freq</code>、<code>PCLK2_Freq</code>。後面所有周邊的時間計算都讀這幾個值。</li>\n<li><b>觸控校正要在螢幕之後。</b><button class=\"jump\" data-f=\"App/app_main.c\" data-l=\"102\">Default_Calibration()</button> 把觸控的原始讀數換算成像素座標，係數算的時候要知道螢幕多寬。在 <code>LCD_Init()</code> 之前問，答案是沒有意義的。</li>\n<li><b>發聲要在時脈之後。</b><button class=\"jump\" data-f=\"App/sound.c\" data-l=\"28\">sound.c 的 timer_clock()</button> 直接讀 <code>PCLK1_Freq</code>。第一步沒跑完，它會拿到 0，然後 <code>tone_on()</code> 裡的除法會算出 0 並直接靜音——而且不會有任何錯誤訊息。</li>\n</ul>\n<p>其餘四步的順序是為了讀起來合理，不是硬性要求。</p>\n\n<h3>splash 為什麼要印四個數字</h3>\n<p>開機畫面停 4.5 秒，中間一直更新一行 <button class=\"jump\" data-f=\"App/app_main.c\" data-l=\"80\">四軸的即時 ADC 讀數</button>。這不是裝飾。</p>\n<p>搖桿的兩軸是分壓電路，要有電源才會輸出電壓；而搖桿上的按鍵只是一個對地的開關，<b>沒有接電源也能正常工作</b>。所以「按下去有反應、推動沒反應」這個組合，幾乎一定是 3.3 V 那條線沒接上。把四個數字放在開機畫面，是讓這個判斷在進選單之前就能做完。</p>\n<p>正常接好的搖桿靜止時會落在 2000 附近；讀到 0 表示那一軸沒有電源或沒有接線。</p>\n\n<h3>那兩次看起來多餘的 Input_Poll</h3>\n<p><button class=\"jump\" data-f=\"App/app_main.c\" data-l=\"61\">splash() 裡的三行</button>長這樣：連續呼叫 <code>Input_Poll()</code> 兩次，然後 <code>Input_Flush()</code>。</p>\n<p>原因是開機畫面允許「按任意鍵跳過」，而跳過的判斷用的是<b>邊緣</b>——「剛剛才按下去」。輸入層記錄上一次的狀態來算邊緣，而那個變數一開始是 0。如果有一顆按鍵因為接線錯誤一直被拉低，第一次 poll 就會產生一個假的「剛按下」，開機畫面瞬間閃過，而你完全不知道為什麼。</p>\n<p>連 poll 兩次讓去彈跳濾波器有兩筆資料可以比對，把狀態填成真實值；<code>Input_Flush()</code> 再把累積的邊緣丟掉。之後出現的任何邊緣都是人真的按的。第 4 章會看去彈跳本身怎麼寫。</p>\n\n<div class=\"note\"><b>順帶一提：</b><code>main()</code> 結尾是 <code>for(;;)</code> 而不是 <code>return 0;</code>。沒有作業系統可以接收回傳值，跳出 <code>main()</code> 就無處可去。韌體的主迴圈本身就是程式的終點。</div>\n",demos:[],ex:[{id:"c1a",type:"mc",q:"如果把 <code>Sound_Init()</code> 搬到 <code>stm32f4_Hardware_Init()</code> 前面，會發生什麼？",opts:["編譯失敗","程式當機在 Sound_Init 裡","能跑但完全沒聲音，而且 TIM3 的暫存器值看起來都正常","聲音會變成正確音高的兩倍"],ans:2,fb:"<code>timer_clock()</code> 會讀到還沒被算出來的 <code>PCLK1_Freq</code>（0），於是 <code>tone_on()</code> 裡 <code>total = 0 / freq</code> 得到 0，函式直接走進 <code>Sound_Stop()</code> 就回來了。沒有錯誤、沒有當機，只是永遠安靜——這種失敗最難查，也是為什麼那段註解要把依賴寫出來。"},{id:"c1b",type:"mc",q:"開機時你正好推著搖桿。之後放手，選單的選擇框自己往下跑。為什麼？",opts:["搖桿壞了","去彈跳濾波器把搖桿當成按鍵","<code>Input_Init()</code> 把你推著的位置記成中心，放手後真正的中心相對基準就有偏移","splash 的 4.5 秒不夠久"],ans:2,fb:"中心值是開機那一刻量的。你推著的讀數變成基準，放手後偏移量超過門檻就一直被判定成有方向。I/O TEST 裡的 CENTRE STICKS 可以重新量。"}]},{n:2,title:"主迴圈與畫面切換",problem:"一台機器有選單和三款遊戲，玩家要能進去、玩、退出、再進別的。這需要一個「現在在哪個畫面」的概念，以及一條乾淨的回家路。這裡用的是最樸素的做法，而它剛好也是最好維護的做法。",files:["App/app_main.c","App/console.h"],focus:{f:"App/app_main.c",l:113},flowName:"狀態機",flowHint:"四個遊戲都是「跑到玩家退出才 return」。雙擊節點看程式。",flow:{w:620,h:480,nodes:[{id:"m",x:215,y:16,w:190,h:46,t:"Menu_Run()",cls:"io",sub:"阻塞，直到玩家選了一個",cap:"它自己有主迴圈，選到才回傳一個 <b>AppScreen</b>。",tgt:{f:"App/menu.c",l:77}},{id:"sw",x:235,y:96,w:150,h:42,t:"switch (screen)",cls:"dec",sub:"一個列舉，四條路",cap:"整個狀態機就是這個 switch。加遊戲＝加一個 case。",tgt:{f:"App/app_main.c",l:113}},{id:"d",x:18,y:180,w:140,h:52,t:"Dino_Run()",sub:"教學 → 跑酷 → 結束畫面",cap:"第 8 章。",tgt:{f:"App/game_dino.c",l:643}},{id:"t",x:172,y:180,w:140,h:52,t:"Game2048_Run()",sub:"教學 → 盤面",cap:"第 9 章。",tgt:{f:"App/game_2048.c",l:572}},{id:"g",x:326,y:180,w:140,h:52,t:"Gate_Run()",sub:"教學 → 波次",cap:"第 10 章。",tgt:{f:"App/game_gate.c",l:804}},{id:"i",x:480,y:180,w:124,h:52,t:"IoTest_Run()",cls:"hw",sub:"接線診斷",cap:"第 11 章，也是唯一講硬體的一章。",tgt:{f:"App/iotest.c",l:279}},{id:"k",x:205,y:286,w:210,h:44,t:"玩家按 KEY1",cls:"ev",sub:"每個 *_Run 內部都在看它",cap:"KEY1（PB8）在任何畫面都是返回。遊戲的主迴圈看到它就 <code>return</code>。"},{id:"s",x:220,y:370,w:180,h:42,t:"Sound_Stop()",sub:"離開遊戲一定關聲音",cap:"防止某個音符卡在播放狀態被帶回選單。",tgt:{f:"App/app_main.c",l:121}}],edges:[{a:"m",b:"sw"},{a:"sw",b:"d",side:"r"},{a:"sw",b:"t"},{a:"sw",b:"g",side:"r"},{a:"sw",b:"i",side:"r"},{a:"d",b:"k",side:"r"},{a:"t",b:"k"},{a:"g",b:"k",side:"l"},{a:"i",b:"k",side:"l"},{a:"k",b:"s"},{a:"s",b:"m",side:"back",lab:"回選單"}]},html:"\n<h3>狀態機就是一個列舉加一個 switch</h3>\n<p><button class=\"jump\" data-f=\"App/console.h\" data-l=\"29\">console.h 的 AppScreen</button> 列出所有畫面。<code>Menu_Run()</code> 回傳玩家選了哪一個，<code>main()</code> 的 switch 呼叫對應的函式。</p>\n<p>沒有框架、沒有函式指標表、沒有註冊機制。三十行以內就講完，而且它有一個不明顯的好處：<b>每個遊戲完全獨立</b>。它們不共用全域狀態，不互相呼叫，也不需要知道彼此存在。</p>\n\n<h3>「跑到玩家退出才 return」這個約定</h3>\n<p>每個 <code>*_Run()</code> 內部有自己的主迴圈。它不是「更新一幀然後回來」，而是整場玩完才回來。第 7 章會看那個迴圈長什麼樣。</p>\n<p>這個選擇的代價是每個遊戲要自己處理退出；好處是遊戲內部可以有自己的子狀態（教學、遊玩、結束畫面）而完全不用讓 <code>main()</code> 知道。<code>Dino_Run()</code> 的結構就是這樣：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">void Dino_Run(void)\n{\n    if (!dino_tutorial()) return;          /* 教學裡按 KEY1 直接回選單 */\n\n    for (;;) {\n        if (!dino_play())     return;      /* 遊戲中按 KEY1            */\n        if (!dino_gameover()) return;      /* 結束畫面選 MENU          */\n    }                                      /* 選 RETRY 就再玩一場      */\n}</pre>\n<p>「重玩」在這裡只是一個 <code>for</code> 迴圈，不需要回到 <code>main()</code> 再進來一次。</p>\n\n<h3>回傳值當作退出原因</h3>\n<p>注意 <code>dino_play()</code> 回傳的是 <code>uint8_t</code>：1 代表「玩家死了」，0 代表「玩家按 KEY1 要走」。兩種結束要走不同的路——死了要看結束畫面，主動離開要直接回選單。用回傳值區分比用全域旗標乾淨。</p>\n\n<div class=\"note\"><b>如果要加第四款遊戲：</b>在 <code>AppScreen</code> 加一個列舉、在 switch 加一個 case、在 <code>menu.c</code> 的項目表加一行、寫一個新的 <code>.c</code> 檔提供 <code>Xxx_Run(void)</code>。第 12 章會把完整清單列出來。</div>\n",demos:[],ex:[{id:"c2a",type:"mc",q:"<code>dino_play()</code> 為什麼要回傳值，而不是直接 <code>void</code>？",opts:["為了讓編譯器檢查","為了區分「玩家死了」和「玩家按 KEY1 要離開」，兩者接下來要做的事不同","為了回傳分數","為了相容 AppScreen 列舉"],ans:1,fb:"死掉要顯示結束畫面並讓玩家選重玩或回選單；主動離開要立刻回選單。用回傳值把這個決定交給呼叫者，比在函式裡塞一個全域旗標好追。"}]},{n:3,title:"選單",problem:"選單是全機唯一必須同時支援觸控和按鍵的畫面。原因很實際：觸控校正跑掉是展示場合最常見的故障，如果選單只能用觸控，機器就等於整台壞掉。",files:["App/menu.c","App/ui.c"],focus:{f:"App/menu.c",l:77},flowName:"Menu_Run() 的一次輪詢",flowHint:"兩條輸入路徑並存。雙擊節點跳到程式。",flow:{w:620,h:520,nodes:[{id:"dr",x:210,y:12,w:200,h:44,t:"draw_all(sel)",sub:"整頁畫一次，只在進入時",cap:"標題、四個項目、底部提示。之後只重畫變動的項目。",tgt:{f:"App/menu.c",l:56}},{id:"t0",x:240,y:78,w:140,h:38,t:"t0 = msTick",cls:"ev",sub:"10 ms 一輪",cap:"選單不需要 50 fps，10 毫秒一輪已經很流暢。"},{id:"ip",x:210,y:140,w:200,h:44,t:"Input_Poll()",cls:"io",sub:"按鍵 + 搖桿",cap:"第 4 章。這裡只取用它的結果。",tgt:{f:"App/input.c",l:205}},{id:"pr",x:30,y:210,w:190,h:50,t:"Input_Pressed()",cls:"dec",sub:"上下移動 / 押下確認",cap:"用<b>邊緣</b>而不是電位：按著上鍵不會一直往上跑。",tgt:{f:"App/menu.c",l:95}},{id:"ts",x:400,y:210,w:190,h:50,t:"TS_GetState(&ts)",cls:"dec",sub:"觸控座標",cap:"有人在摸才回傳座標。",tgt:{f:"App/menu.c",l:114}},{id:"mv",x:30,y:288,w:190,h:46,t:"sel 改變 → 重畫兩項",sub:"舊的取消亮，新的亮",cap:"只重畫變動的兩個項目，不是整頁。這是全機通用的做法。",tgt:{f:"App/menu.c",l:103}},{id:"hb",x:400,y:288,w:190,h:46,t:"UI_HitBox()",sub:"點擊落在哪個矩形裡",cap:"四個邊界比較，回傳 0 或 1。",tgt:{f:"App/ui.c",l:41}},{id:"rt",x:215,y:368,w:190,h:46,t:"return APP_DINO + i",cls:"io",sub:"告訴 main() 選了誰",cap:"列舉的順序和項目表的順序刻意對齊，所以可以直接相加。",tgt:{f:"App/menu.c",l:122}},{id:"wt",x:215,y:446,w:190,h:40,t:"等到 10 ms",cls:"ev",sub:"while (msTick - t0 < 10)",cap:"第 7 章會講這個寫法為什麼能扛住溢位。"}],edges:[{a:"dr",b:"t0"},{a:"t0",b:"ip"},{a:"ip",b:"pr"},{a:"ip",b:"ts"},{a:"pr",b:"mv"},{a:"ts",b:"hb"},{a:"mv",b:"rt"},{a:"hb",b:"rt"},{a:"rt",b:"wt",lab:"沒選就繼續"},{a:"wt",b:"t0",side:"back",lab:"下一輪"}]},html:"\n<h3>命中判定只有兩行</h3>\n<p><button class=\"jump\" data-f=\"App/ui.c\" data-l=\"41\">UI_HitBox()</button> 判斷一個座標有沒有落在矩形裡。它是四個邊界比較，寫成一個回傳 <code>uint8_t</code> 的小函式，然後全機所有可點的東西都用它——選單項目、2048 的 NEW 和 MENU 按鈕、教學畫面的 SKIP、I/O TEST 的每一顆按鈕。</p>\n<p>值得注意的是它<b>沒有</b>被做成「按鈕物件」。沒有註冊、沒有回呼、沒有清單。每個畫面自己知道自己有哪些矩形，自己比對。畫面數量有限的時候，這樣比一套按鈕框架短得多，而且看一眼就知道會發生什麼。</p>\n\n<h3>兩條輸入路徑寫在同一個迴圈裡</h3>\n<p><button class=\"jump\" data-f=\"App/menu.c\" data-l=\"77\">Menu_Run()</button> 的迴圈裡兩段並存：先看按鍵的邊緣、再看觸控。兩者都可能造成回傳，互不干擾。</p>\n<p>按鍵那段用的是 <button class=\"jump\" data-f=\"App/menu.c\" data-l=\"95\">Input_Pressed()</button>，也就是<b>邊緣</b>。如果用 <code>Input_Held()</code>，按著上鍵選擇框會以每 10 毫秒一格的速度飛過去。這是「電位」和「邊緣」語意差別的第一個實例，第 4 章會講清楚。</p>\n\n<h3>只重畫變動的部分</h3>\n<p>選擇框移動時，程式重畫<b>兩個</b>項目——舊的那個取消高亮、新的那個加上高亮：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">if (sel != old) {\n    SFX_Select();\n    draw_item(old, 0);\n    draw_item(sel, 1);\n}</pre>\n<p>整頁重畫在這裡也不會慢到看得出來，但這個習慣在遊戲畫面裡是必要的。第 5 章會看到同樣的原則被推到極致。</p>\n\n<h3>列舉順序和項目表順序刻意對齊</h3>\n<p><button class=\"jump\" data-f=\"App/menu.c\" data-l=\"122\">回傳的那一行</button>是 <code>APP_DINO + i</code>。這依賴一個約定：<code>AppScreen</code> 裡 <code>APP_DINO</code>、<code>APP_2048</code>、<code>APP_GATE</code>、<code>APP_IOTEST</code> 的順序，必須和 <code>ITEM_NAME[]</code> 的順序一致。</p>\n<p>這是一個省掉對應表的小技巧，代價是<b>加遊戲時兩邊都要改，而且順序要一致</b>。如果只改一邊，選單會進錯遊戲。這種隱含約定值得在加東西時特別注意。</p>\n",demos:[],ex:[{id:"c3a",type:"mc",q:"選單的上下移動如果改用 <code>Input_Held()</code> 而不是 <code>Input_Pressed()</code>，會怎樣？",opts:["完全一樣","按著方向鍵時選擇框會以每 10 毫秒一格的速度衝過去","按鍵會失效","會需要重新校正觸控"],ans:1,fb:"<code>Held</code> 是電位：按著的每一輪都成立。<code>Pressed</code> 是邊緣：只在按下去那一輪成立。選單要的是後者。反過來說，Dino 的「蹲下」要的是 <code>Held</code>，因為那是持續狀態。"},{id:"c3b",type:"fill",q:"補完 <code>UI_HitBox()</code> 的判斷式：點 (tx, ty) 落在以 (x, y) 為左上角、寬 w 高 h 的矩形內。",ph:"return (tx >= x && ...);",need:[[/tx\s*>=\s*x/,"要先判斷 tx 不小於 x"],[/tx\s*<\s*\(?\s*x\s*\+\s*w/,"右邊界是 x + w，而且用 &lt; 不用 &lt;=（寬 w 的矩形佔 x 到 x+w-1）"],[/ty\s*>=\s*y/,"y 方向也要下界"],[/ty\s*<\s*\(?\s*y\s*\+\s*h/,"y 方向的上界是 y + h"]],ans:"return (uint8_t)(tx &gt;= x &amp;&amp; tx &lt; (uint16_t)(x + w) &amp;&amp;\n                 ty &gt;= y &amp;&amp; ty &lt; (uint16_t)(y + h));",fb:"四個比較，用 <code>&amp;&amp;</code> 串起來。右／下邊界用 <code>&lt;</code> 而不是 <code>&lt;=</code>，因為寬度 w 的矩形佔的是 x 到 x+w-1 這 w 個像素。"}]},{n:4,title:"輸入層",problem:"遊戲程式需要知道「玩家要跳」，不需要知道那是哪一支腳位、按鍵接地還是接電源、有沒有彈跳。這一章講輸入層怎麼把這些擋在下面，以及它對外只留四個函式的理由。",files:["App/input.c","App/input.h","App/menu.c"],focus:{f:"App/input.c",l:205},flowName:"Input_Poll() 的一次取樣",flowHint:"左邊是四顆按鍵，右邊是四軸搖桿，最後合成同一個 16 位元遮罩。",flow:{w:640,h:560,nodes:[{id:"call",x:230,y:10,w:190,h:40,t:"每一幀呼叫一次",cls:"ev",sub:"遊戲迴圈的第一件事",cap:"10 或 20 毫秒一次。取樣間隔決定了去彈跳的時間常數。"},{id:"btn",x:20,y:76,w:200,h:56,t:"讀四顆按鍵",cls:"hw",sub:"active low：按下讀 0",cap:"按鍵接地、內部上拉，所以判斷要取反。第 11 章補硬體細節。",tgt:{f:"App/input.c",l:214}},{id:"adc",x:420,y:76,w:200,h:56,t:"讀四軸 ADC",cls:"hw",sub:"12 位元，0 到 4095",cap:"每軸一次轉換，約 6 微秒。第 11 章補硬體細節。",tgt:{f:"App/input.c",l:61}},{id:"ax",x:420,y:156,w:200,h:56,t:"axis_bits()",cls:"dec",sub:"兩個門檻做遲滯",cap:"已經推著的軸用比較寬鬆的門檻判斷是否還推著，避免在門檻附近抖動。",tgt:{f:"App/input.c",l:184}},{id:"raw",x:225,y:236,w:200,h:48,t:"raw：這次的原始狀態",sub:"16 個位元，按鍵和搖桿混在一起",cap:"按鍵和搖桿方向共用一個遮罩，遊戲因此可以寫 <code>pressed & ANY_UP</code> 一視同仁。",tgt:{f:"App/input.h",l:30}},{id:"deb",x:225,y:308,w:200,h:56,t:"去彈跳",cls:"dec",sub:"兩次取樣一致才准改變",cap:"三行位元運算換掉一整組計時器。",tgt:{f:"App/input.c",l:238}},{id:"held",x:80,y:392,w:180,h:48,t:"s_held",cls:"io",sub:"電位：現在按著嗎",cap:"用於持續狀態，例如 Dino 的蹲下。",tgt:{f:"App/input.c",l:273}},{id:"edge",x:390,y:392,w:180,h:48,t:"s_edge",cls:"io",sub:"邊緣：剛剛才按下",cap:"用於一次性動作，例如跳躍、開火、選單移動。讀走就清掉。",tgt:{f:"App/input.c",l:242}},{id:"game",x:225,y:470,w:200,h:48,t:"遊戲只看這兩個",sub:"從不自己讀腳位",cap:"這是分層的意義：遊戲邏輯不知道 active low、不知道 ADC、不知道腳位編號。"}],edges:[{a:"call",b:"btn"},{a:"call",b:"adc"},{a:"adc",b:"ax"},{a:"btn",b:"raw"},{a:"ax",b:"raw"},{a:"raw",b:"deb"},{a:"deb",b:"held"},{a:"deb",b:"edge"},{a:"held",b:"game"},{a:"edge",b:"game"}]},html:"\n<h3>對外只有四個函式</h3>\n<p>整個輸入層對遊戲只露出四個名字：</p>\n<ul>\n<li><code>Input_Poll()</code> — 取樣一次。每幀呼叫，其他三個都只是讀它的結果。</li>\n<li><code>Input_Held()</code> — <b>電位</b>。現在按著嗎？用於持續狀態。</li>\n<li><code>Input_Pressed()</code> — <b>邊緣</b>。剛剛才按下嗎？<b>讀走就清掉</b>，所以每個按下只會被消費一次。</li>\n<li><code>Input_Flush()</code> — 把累積的邊緣丟掉。切換畫面時用，避免上一個畫面殘留的按鍵被下一個畫面吃到。</li>\n</ul>\n<p>Dino 的兩個動作剛好示範了前兩者的差別：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">if (pressed &amp; ANY_UP)  { ... 起跳 ... }      /* 邊緣：只在按下那一幀 */\ns_ducking = (held &amp; ANY_DOWN) ? 1 : 0;      /* 電位：按著就蹲       */</pre>\n\n<h3>去彈跳：三行，不用計時器</h3>\n<p>機械接點按下的瞬間會連續通斷幾毫秒。常見做法是為每顆按鍵配一個計時器，這裡<button class=\"jump\" data-f=\"App/input.c\" data-l=\"238\">用三行做完</button>：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">agree     = (uint16_t)~(raw ^ s_lastRaw);\ns_held    = (uint16_t)((s_held &amp; ~agree) | (raw &amp; agree));\ns_lastRaw = raw;</pre>\n<p><code>raw ^ s_lastRaw</code> 是「這次和上次不同的位元」，取反之後 <code>agree</code> 就是「這兩次一致的位元」。第二行的意思是：<b>只有連續兩次取樣一致的位元，才准改變 s_held</b>；其他位元沿用舊值。</p>\n<p>迴圈 10 毫秒一輪，所以這是一個 20 毫秒的濾波器，比輕觸開關的彈跳時間長。而且它<b>一次處理 16 個位元</b>——四顆按鍵、兩個搖桿鍵、KEY1、八個搖桿方向，全部同時被過濾。這是把狀態擠進一個整數的回報。</p>\n\n<h3>邊緣的累積與清空</h3>\n<p><button class=\"jump\" data-f=\"App/input.c\" data-l=\"242\">邊緣計算</button>用 <code>|=</code> 而不是 <code>=</code>，這一點很重要：如果遊戲某一幀特別忙、<code>Input_Poll()</code> 被呼叫了兩次才輪到 <code>Input_Pressed()</code>，中間那次的按下不會被蓋掉。按鍵不會漏。</p>\n<p>反過來 <code>Input_Pressed()</code> 讀完就清零，所以同一個按下也不會被吃兩次。</p>\n\n<h3>搖桿：開機量中心，兩個門檻做遲滯</h3>\n<p>搖桿靜止時的讀數不是理論上的 2048。電位器有公差、電源有誤差，每一支都不一樣。所以 <button class=\"jump\" data-f=\"App/input.c\" data-l=\"159\">Input_Recalibrate()</button> 把「現在的讀數」定義成中心，每軸平均 16 次。這直接推導出「開機不要碰搖桿」這條使用規則。</p>\n<p>有了中心值，方向判定還有第二個問題：搖桿停在門檻附近時，雜訊會讓它反覆跨越，方向訊號一秒抖幾十次。<button class=\"jump\" data-f=\"App/input.c\" data-l=\"184\">axis_bits()</button> 的解法是進入和離開用不同的門檻：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">if ((was &amp; posBit) &amp;&amp; d &gt;  JOY_OFF) out |= posBit;   /* 已經推著：用低門檻 */\nelse if (d &gt;  JOY_ON)               out |= posBit;   /* 還沒推：用高門檻   */</pre>\n<p><code>was</code> 是上一幀的結果。<button class=\"jump\" data-f=\"App/input.c\" data-l=\"39\">JOY_ON 是 700、JOY_OFF 是 450</button>，中間那 250 個計數就是不會抖動的緩衝區。</p>\n\n<h3>類比值走另一條路</h3>\n<p>方向位元夠 Dino 用，但 Gate Keeper 的收集器要平滑移動，所以另外有 <button class=\"jump\" data-f=\"App/input.c\" data-l=\"254\">Input_JoyAxis()</button> 回傳 −512 到 +511。裡面有一個容易忽略的細節：死區是<b>減掉</b>而不是歸零。</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">if (d &gt; -JOY_DEAD &amp;&amp; d &lt; JOY_DEAD) return 0;\nd = (d &gt; 0) ? (d - JOY_DEAD) : (d + JOY_DEAD);   /* 減掉，不是照原值 */</pre>\n<p>如果死區外照原值回傳，搖桿一離開死區輸出就從 0 跳到 250，收集器會瞬間彈開。減掉之後，輸出從死區邊緣的 0 平滑爬升。</p>\n\n<div class=\"note\"><b>分層的價值：</b>遊戲程式裡沒有一行 <code>GPIOE-&gt;IDR</code>。按鍵改接哪支腳、搖桿反了要不要翻轉、去彈跳要幾毫秒，全部是 <code>input.c</code> 內部的事。<span class=\"deepslot\" data-k=\"gpio\" data-l=\"GPIO 與上拉的硬體細節\"></span></div>\n",demos:[],ex:[{id:"c4a",type:"mc",q:"<code>s_edge |= (s_held &amp; ~s_prev);</code> 這一行用 <code>|=</code> 而不是 <code>=</code>。差別是什麼？",opts:["沒有差別，每幀都會被讀走","如果 Input_Poll() 在兩次 Input_Pressed() 之間跑了不只一次，用 = 會把中間那次的按下蓋掉","|= 比較快","= 會讓邊緣永遠不清空"],ans:1,fb:"邊緣是「累積到被讀走為止」。用 <code>|=</code> 讓多次取樣之間的按下都保留下來，<code>Input_Pressed()</code> 讀完才清零。改成 <code>=</code> 的話，忙碌的那一幀裡玩家的按鍵可能直接消失。"},{id:"c4b",type:"mc",q:"某人在 Dino 的主迴圈裡直接寫 <code>if (!(GPIOE-&gt;IDR &amp; (1UL &lt;&lt; 1))) jump();</code>，繞過輸入層。除了破壞分層，最直接的功能問題是什麼？",opts:["讀不到腳位","沒有去彈跳也沒有邊緣偵測，一次按下會觸發好幾次跳躍","會讓 ADC 停止工作","編譯不過"],ans:1,fb:"腳位讀得到，但那是<b>瞬時電位</b>：彈跳期間會讀到好幾次 0，而且按著不放的每一幀都成立。跳躍會連發。輸入層存在的理由就是把這兩件事處理掉。"},{id:"c4c",type:"fill",q:"寫出 <code>axis_bits()</code> 裡「已經推著、判斷是否還推著」那一行的條件部分（正方向）。",ph:"if ( ... ) out |= posBit;",need:[[/was/,"要看上一幀的狀態 was"],[/posBit/,"要檢查的是 posBit 這一位"],[/JOY_OFF/,"已經推著的時候用的是比較寬鬆的 JOY_OFF"],[/d\s*>/,"比較的是偏移量 d 大於門檻"]],ans:"if ((was &amp; posBit) &amp;&amp; d &gt; JOY_OFF) out |= posBit;",fb:"關鍵是 <code>was &amp; posBit</code>：只有「上一幀就已經是這個方向」才走寬鬆門檻。還沒推的軸要跨過比較嚴格的 <code>JOY_ON</code>。兩個門檻之間的差距就是遲滯帶。"}]},{n:5,title:"畫面層",problem:"把舊位置擦掉再畫新位置，在螢幕上是兩次可見的寫入，眼睛會看到中間那個空白的瞬間——這就是閃爍。gfx.h 開頭的註解把問題和解法都寫了，這一章把它拆開。",files:["App/gfx.h","App/gfx.c"],focus:{f:"App/gfx.h",l:31},flowName:"一次 band 合成",flowHint:"三個呼叫要按順序。雙擊節點看程式。",flow:{w:600,h:560,nodes:[{id:"p",x:175,y:10,w:250,h:50,t:"問題：擦掉再畫 = 兩次寫入",cls:"ev",sub:"中間那一瞬間是空白的",cap:"面板上的像素先變成背景色、再變成新顏色。眼睛抓到中間那格，就是閃爍。"},{id:"b1",x:175,y:88,w:250,h:52,t:"Gfx_BandBegin(w, h, bg)",sub:"在 RAM 裡開一塊，填滿背景色",cap:"w×h 超過 GFX_BUF_PIX 就<b>拒絕</b>並讓後續呼叫變成空操作，而不是寫壞別人的記憶體。",tgt:{f:"App/gfx.c",l:10}},{id:"b2",x:30,y:168,w:230,h:50,t:"Gfx_BandRect(...)",sub:"地面線、格線、方塊",cap:"全部畫在 RAM 裡，面板還沒看到任何東西。",tgt:{f:"App/gfx.c",l:24}},{id:"b3",x:340,y:168,w:230,h:50,t:"Gfx_BandSprite(...)",sub:"1bpp 點陣圖 + 指定顏色",cap:"位元是 1 才寫顏色，是 0 就留著背景——這就是透明。",tgt:{f:"App/gfx.c",l:44}},{id:"b4",x:175,y:248,w:250,h:52,t:"Gfx_BandEnd(x, y)",cls:"dec",sub:"一次寫入面板",cap:"開一個視窗，連續送出 w×h 個顏色。每個像素只被寫一次。",tgt:{f:"App/gfx.c",l:69}},{id:"r",x:175,y:330,w:250,h:46,t:"面板上沒有中間狀態",cls:"io",sub:"所以沒有東西可以閃",cap:"像素從舊值<b>直接</b>變成新值。"},{id:"tr",x:175,y:408,w:250,h:56,t:"順手擦掉尾巴",sub:"區塊寬 = sprite 寬 + step",cap:"障礙物往左移，多出來的 step 像素是背景色，剛好蓋掉剛剛讓出來的位置。一次寫入完成畫和擦。",tgt:{f:"App/game_dino.c",l:196}},{id:"o",x:175,y:492,w:250,h:50,t:"繪製順序 = 圖層",sub:"後畫的蓋住先畫的",cap:"Gate Keeper 的收集器最後畫，所以它在最上層。",tgt:{f:"App/game_gate.c",l:546}}],edges:[{a:"p",b:"b1"},{a:"b1",b:"b2"},{a:"b1",b:"b3"},{a:"b2",b:"b4"},{a:"b3",b:"b4"},{a:"b4",b:"r"},{a:"r",b:"tr"},{a:"tr",b:"o"}]},html:"\n<h3>先在 RAM 裡組好，再一次推出去</h3>\n<p><button class=\"jump\" data-f=\"App/gfx.h\" data-l=\"31\">gfx.h</button> 開頭的註解把這件事講完了：直覺的畫法是「用背景色把舊位置擦掉，再在新位置畫」，而那在螢幕上是兩次可見的寫入。</p>\n<p>解法是把整塊區域——背景、地面線、角色，全部——畫進一塊 RAM 緩衝區，然後一次送到面板。像素從來沒有處在中間狀態，所以沒有東西可以閃。三個呼叫固定這個順序：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">Gfx_BandBegin(w, h, 背景色);        /* 開一塊，填滿   */\nGfx_BandHLine(...);                 /* 想畫什麼就畫   */\nGfx_BandSprite(&amp;SPR_dino_run1, x, y, 前景色);\nGfx_BandEnd(螢幕x, 螢幕y);          /* 一次送出       */</pre>\n\n<h3>GFX_BUF_PIX 4800 這個數字怎麼來的</h3>\n<p><button class=\"jump\" data-f=\"App/gfx.h\" data-l=\"31\">那一行</button>是 4800 個像素，也就是 9600 位元組——整支韌體 RAM 用量最大的單一配置。</p>\n<p>數字不是隨便挑的，它由<b>最大的使用者</b>決定。Dino 的恐龍區塊要蓋住從最高跳躍點到地面的整條垂直帶，寬度要容納最寬的姿勢（蹲下時 43 像素）：44 × 100 = 4400。Gate Keeper 最寬的橫向車道是 139 × 26 = 3614。取 4800 留一點餘裕。</p>\n<p>更值得注意的是超過會怎樣：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">if ((uint32_t)w * h &gt; GFX_BUF_PIX) {   /* 拒絕，而不是蓋掉別的 RAM */\n    s_w = s_h = 0;\n    return;\n}</pre>\n<p>它<b>拒絕</b>，並把尺寸設成 0，讓後續的 <code>BandRect</code>、<code>BandSprite</code>、<code>BandEnd</code> 全部變成空操作。症狀是「那一塊沒畫出來」，而不是「隨機的記憶體被寫壞、幾分鐘後在別的地方當掉」。前者十秒鐘就找到，後者可以耗掉一個晚上。</p>\n<div class=\"warn\"><h4>這個保護真的救過一次</h4><p>Gate Keeper 有一個函式想一次清掉整個競技場：320 × 210 = 67200 個像素，是緩衝區的十四倍。因為有這個檢查，症狀是「格線沒有畫出來」而不是記憶體損毀。後來改成直接呼叫面板的填色函式，不經過 band。</p></div>\n\n<h3>sprite 怎麼存</h3>\n<p><button class=\"jump\" data-f=\"App/gfx.c\" data-l=\"51\">取位元那一段</button>是整份程式最密的幾行：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">stride = (uint16_t)((s-&gt;w + 7) / 8);        /* 一列佔幾個位元組 */\n...\nif (row[sx &gt;&gt; 3] &amp; (0x80u &gt;&gt; (sx &amp; 7)))    /* 第 sx 個位元是 1 嗎 */\n    s_buf[(uint32_t)dy * s_w + dx] = ink;</pre>\n<p>一個像素一個位元。<code>sx &gt;&gt; 3</code> 是「第幾個位元組」，<code>sx &amp; 7</code> 是「位元組裡的第幾位」。位元是 1 就寫前景色，是 0 就<b>什麼都不做</b>——背景色已經在那裡了，所以留白自動變成透明。</p>\n<p>16 個 sprite 總共 2050 位元組。同樣的圖存成每像素 16 位元的話，光恐龍的六個姿勢就超過 12 KB。代價是一張圖只能一個顏色，而 Chrome Dino 本來就是單色的。</p>\n\n<h3>繪製順序就是圖層</h3>\n<p>沒有 z-order、沒有排序，後畫的就在上面。<button class=\"jump\" data-f=\"App/game_gate.c\" data-l=\"546\">Gate Keeper 的 render()</button> 因此有一個講究的順序：先擦掉收集器的舊位置，再畫四條車道、核心、掉落物，最後才畫收集器。</p>\n<p>先擦的理由是：擦掉的動作可能會挖掉車道的一部分，而下面的車道重繪會把它補回來。如果反過來，挖出來的洞會留在畫面上。</p>\n",demos:[],ex:[{id:"c5a",type:"sort",q:"把一次 band 合成的步驟排成正確順序。",items:["<code>Gfx_BandBegin(w, h, 背景色)</code> — 在 RAM 開一塊並填滿背景","<code>Gfx_BandRect(...)</code> — 把地面線、格線畫進緩衝區","<code>Gfx_BandSprite(...)</code> — 把角色疊上去","<code>Gfx_BandEnd(x, y)</code> — 一次寫到面板"],hintFirst:"想一想：在往緩衝區畫任何東西之前，必須先有緩衝區、而且它要已經填好背景色。",wrongFb:"順序錯的後果各不相同：先 <code>BandEnd</code> 會送出一塊還沒畫東西的區域；<code>BandBegin</code> 放在中間會把先前畫的內容用背景色覆蓋掉；sprite 畫在 <code>BandRect</code> 之前則會被後畫的矩形蓋住。",fb:"<code>BandBegin</code> 必須先跑，因為它決定尺寸並填滿背景；中間想畫幾層就畫幾層，後畫的蓋住先畫的；<code>BandEnd</code> 是唯一真正碰到面板的一步，所以一定在最後。"},{id:"c5b",type:"mc",q:"障礙物每幀往左移 <code>step</code> 像素，送出的區塊寬度取 <code>sprite 寬 + step</code>。多出來的那幾個像素是什麼用途？",opts:["預留給下一個障礙物","填成背景色，用來擦掉障礙物剛剛讓出來的尾巴","避免 sprite 被螢幕邊緣截掉","讓移動看起來更平滑"],ans:1,fb:"障礙物往左走，右邊會露出一條剛剛還被它蓋住的區域。把區塊加寬 <code>step</code> 並填背景色，等於在<b>同一次寫入</b>裡順手把尾巴擦掉——不需要第二次寫入，也就不會閃。"}]},{n:6,title:"聲音層",problem:"音效不能讓遊戲停下來等它播完。這一章講一個非阻塞的音符佇列怎麼寫、為什麼每一幀都要呼叫它一次，以及為什麼遊戲裡的等待要用 App_Wait 而不是 delay_ms。",files:["App/sound.c","App/sound.h","App/ui.c"],focus:{f:"App/sound.c",l:147},flowName:"旋律怎麼非阻塞地走完",flowHint:"Sound_Update() 每幀被呼叫一次，只在時間到的時候做事。",flow:{w:620,h:500,nodes:[{id:"sfx",x:210,y:10,w:200,h:46,t:"SFX_Jump()",cls:"ev",sub:"遊戲呼叫，立刻回來",cap:"八個現成音效都是 <code>Sound_Melody(表, 長度)</code> 的包裝。",tgt:{f:"App/sound.c",l:195}},{id:"mel",x:210,y:86,w:200,h:52,t:"Sound_Melody(notes, n)",sub:"記下表、播第一個音",cap:"設定 <code>s_noteEnd = msTick + 這個音的長度</code>，然後回傳。",tgt:{f:"App/sound.c",l:137}},{id:"tone",x:420,y:160,w:190,h:52,t:"tone_on(freq)",cls:"hw",sub:"算 PSC/ARR，啟動 TIM3",cap:"硬體自己產生方波，CPU 不用管。第 11 章補細節。",tgt:{f:"App/sound.c",l:72}},{id:"upd",x:210,y:174,w:190,h:52,t:"Sound_Update()",cls:"dec",sub:"每一幀呼叫一次",cap:"整個佇列的引擎。不呼叫它，第一個音就會一直響下去。",tgt:{f:"App/sound.c",l:147}},{id:"chk",x:205,y:252,w:200,h:52,t:"時間到了嗎",cls:"dec",sub:"(int32_t)(msTick - end) >= 0",cap:"用相減再轉號誌，第 7 章會講為什麼這樣能扛住溢位。",tgt:{f:"App/sound.c",l:150}},{id:"nxt",x:40,y:340,w:180,h:50,t:"還有下一個音",sub:"tone_on 下一個，更新 end",cap:"表往前走一格。"},{id:"stp",x:400,y:340,w:180,h:50,t:"表播完了",sub:"Sound_Stop()，關掉腳位",cap:"把 PA6 從計時器收回來並拉低，確保安靜。",tgt:{f:"App/sound.c",l:100}},{id:"wait",x:205,y:430,w:200,h:54,t:"App_Wait(ms)",cls:"io",sub:"會繼續呼叫 Sound_Update 的等待",cap:"遊戲裡需要停一下時用它，不要用 delay_ms。",tgt:{f:"App/ui.c",l:8}}],edges:[{a:"sfx",b:"mel"},{a:"mel",b:"upd"},{a:"mel",b:"tone",side:"r"},{a:"upd",b:"chk"},{a:"chk",b:"nxt",lab:"是"},{a:"chk",b:"stp",lab:"是，但沒了"},{a:"nxt",b:"upd",side:"back",lab:"下一幀"},{a:"stp",b:"wait"}]},html:"\n<h3>旋律是一張表</h3>\n<p><button class=\"jump\" data-f=\"App/sound.h\" data-l=\"43\">Note 結構</button>只有兩個欄位：頻率和長度。一段旋律就是一個陣列：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">static const Note MEL_JUMP[]   = { {NOTE_G5, 40}, {NOTE_C6, 55} };\nstatic const Note MEL_HIT[]    = { {NOTE_G4, 70}, {NOTE_E4, 70}, {NOTE_C4, 160} };\nstatic const Note MEL_START[]  = { {NOTE_C5, 90}, {NOTE_REST, 40}, {NOTE_C5, 90},\n                                   {NOTE_REST, 40}, {NOTE_C6, 180} };</pre>\n<p>八個 <code>SFX_*</code> 函式都是同一個巨集的包裝，<button class=\"jump\" data-f=\"App/sound.c\" data-l=\"182\">表都在 sound.c 下半</button>。<code>NOTE_REST</code> 是 0，<code>tone_on()</code> 收到 0 就靜音——休止符不需要特別處理。</p>\n\n<h3>為什麼每一幀都要呼叫 Sound_Update()</h3>\n<p><code>Sound_Melody()</code> 只做兩件事：播第一個音、記下它該在什麼時候結束，然後<b>立刻回傳</b>。它不等。</p>\n<p>所以一定要有人在後面推進這張表，那就是 <button class=\"jump\" data-f=\"App/sound.c\" data-l=\"147\">Sound_Update()</button>。它每幀被呼叫一次，絕大多數時候什麼都不做（時間還沒到就直接 return）；時間到了才換下一個音或關掉。</p>\n<p>忘記呼叫的後果很好認：<b>第一個音會一直響下去</b>，因為沒有人去把它關掉。這是新增畫面時最容易漏的一行。</p>\n\n<h3>App_Wait 和 delay_ms 的差別</h3>\n<p><button class=\"jump\" data-f=\"App/ui.c\" data-l=\"8\">App_Wait()</button> 只有三行，而它存在的理由就是上面那個問題：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">void App_Wait(uint32_t ms)\n{\n    uint32_t until = msTick + ms;\n    while ((int32_t)(msTick - until) &lt; 0) Sound_Update();\n}</pre>\n<p>它一樣是阻塞的——遊戲在這段時間裡真的停住了。差別是它在等的時候<b>繼續推進音效引擎</b>。</p>\n<p>具體場景：教學關答對時顯示「GOOD!」並停 700 毫秒。<code>SFX_Good()</code> 是一段四個音的旋律。如果用 <code>delay_ms(700)</code>，第一個音會卡住整整 700 毫秒然後突然跳到結束；用 <code>App_Wait(700)</code>，四個音正常播完。</p>\n<div class=\"note\"><b>什麼時候用哪個：</b>畫面切換、開機、結束畫面這種「本來就不需要反應」的地方用 <code>App_Wait</code>。<b>遊戲主迴圈裡兩個都不要用</b>——那裡要用第 7 章的固定步長寫法。</div>\n\n<h3>硬體被包在最下面</h3>\n<p>整個聲音層只有 <button class=\"jump\" data-f=\"App/sound.c\" data-l=\"72\">tone_on()</button> 碰硬體。上面的旋律佇列完全是邏輯，連「頻率」以外的硬體概念都不知道。</p>\n<p>這個分層有一個實際回報：診斷蜂鳴器不響的時候，可以加一個 <button class=\"jump\" data-f=\"App/sound.c\" data-l=\"113\">Sound_DC()</button> 繞過整個計時器、直接把腳位拉高——因為呼叫它的人只需要「發出聲音」這個語意，不在乎底下怎麼做。第 11 章會用到它。<span class=\"deepslot\" data-k=\"tim\" data-l=\"計時器與 PWM 的硬體細節\"></span></p>\n",demos:[],ex:[{id:"c6a",type:"mc",q:"你加了一個新畫面，忘記在迴圈裡呼叫 <code>Sound_Update()</code>。症狀是什麼？",opts:["完全沒有聲音","第一個音一直響個不停","聲音變成正確音高的一半","程式當在 Sound_Melody 裡"],ans:1,fb:"<code>Sound_Melody()</code> 已經把第一個音打開了，而關掉它和換下一個音都是 <code>Sound_Update()</code> 的工作。沒有人推進，那個音就沒有終點。"},{id:"c6b",type:"mc",q:"在遊戲主迴圈裡用 <code>App_Wait(200)</code> 做一個短暫停頓，會有什麼問題？",opts:["沒問題，這就是它的用途","音效會斷掉","它仍然是阻塞的：那 200 毫秒裡不讀輸入、不更新世界、不繪製，玩家的按鍵會消失","會讓 msTick 停止累加"],ans:2,fb:"<code>App_Wait</code> 只解決「音效不要卡住」，沒有解決「遊戲不要停住」。遊戲迴圈裡需要延遲的話，正確做法是記一個截止時刻放進狀態、每幀檢查它有沒有到——Gate Keeper 的開火冷卻就是這樣做的。"}]},{n:7,title:"遊戲迴圈骨架",problem:"三款遊戲的主迴圈長得一樣，因為它們解的是同一個問題：讓世界以固定速度前進，而且不管這一幀畫得多複雜都一樣快。這一章也講那個到處出現的 (int32_t)(msTick - deadline) 寫法為什麼必要。",files:["App/game_dino.c","App/game_gate.c","User_common/user_defined.c"],focus:{f:"App/game_dino.c",l:585},flowName:"固定步長的一幀",flowHint:"注意等待在最後。順序換了就不是固定步長了。",flow:{w:600,h:600,nodes:[{id:"t0",x:190,y:10,w:220,h:42,t:"t0 = msTick",cls:"ev",sub:"記住這一幀的起點",cap:"先取時間，之後所有工作都算在這一幀裡。"},{id:"in",x:190,y:80,w:220,h:46,t:"Input_Poll()",cls:"io",sub:"取樣一次",cap:"第 4 章。一定在最前面，因為後面的邏輯要用它的結果。",tgt:{f:"App/input.c",l:205}},{id:"su",x:190,y:152,w:220,h:46,t:"Sound_Update()",sub:"推進音符佇列",cap:"第 6 章。放這裡是因為它便宜且與其他事無關。",tgt:{f:"App/sound.c",l:147}},{id:"pr",x:190,y:224,w:220,h:46,t:"p = Input_Pressed()",cls:"dec",sub:"取出邊緣，讀走即清",cap:"一幀只取一次，避免同一個按下被兩段程式各吃一次。",tgt:{f:"App/input.c",l:275}},{id:"bk",x:190,y:296,w:220,h:46,t:"KEY1 → return",cls:"dec",sub:"最早的出口",cap:"先處理退出，省掉後面所有工作。",tgt:{f:"App/game_gate.c",l:709}},{id:"w",x:190,y:368,w:220,h:46,t:"更新世界",sub:"物理 · 生成 · 碰撞",cap:"純邏輯，完全不碰畫面。",tgt:{f:"App/game_gate.c",l:463}},{id:"rd",x:190,y:440,w:220,h:46,t:"render()",sub:"只重畫變動的區塊",cap:"第 5 章。畫面永遠是世界狀態的函數，不是反過來。",tgt:{f:"App/game_gate.c",l:546}},{id:"wt",x:170,y:512,w:260,h:54,t:"while (msTick - t0 < TICK_MS)",cls:"dec",sub:"把剩下的時間補滿",cap:"<b>一定在最後。</b>工作久一點，等待就自動短一點，一幀總長不變。"}],edges:[{a:"t0",b:"in"},{a:"in",b:"su"},{a:"su",b:"pr"},{a:"pr",b:"bk"},{a:"bk",b:"w"},{a:"w",b:"rd"},{a:"rd",b:"wt"},{a:"wt",b:"t0",side:"back",lab:"下一幀"}]},html:"\n<h3>先做事，最後才等</h3>\n<p>三款遊戲的主迴圈都是這個形狀：取 <code>t0</code>、讀輸入、更新世界、繪製、然後等到這一幀的時間額度用完。</p>\n<p>關鍵是<b>等待在最後</b>。如果某一幀因為障礙物多而畫得久，等待自動變短，一幀的總長仍然是 <code>TICK_MS</code>。換成「先 <code>delay_ms(20)</code> 再做事」的話，總長就變成「工作 + 20」，畫面越複雜遊戲越慢。</p>\n<p>這也讓「每幀移動幾個像素」這種說法有意義。Dino 的速度常數從 3.0 爬到 8.0 像素／幀，配 20 毫秒一幀，就是 150 到 400 像素／秒。沒有固定步長的話這些數字什麼都不代表。</p>\n\n<h3>順序不是隨便排的</h3>\n<ul>\n<li><b>輸入在最前</b>，因為後面每一段都要用它的結果。</li>\n<li><b>邊緣只取一次</b>。<code>Input_Pressed()</code> 讀走就清，所以一幀裡只能呼叫一次，結果存進區域變數給後面用。呼叫兩次的話第二次會拿到空的。</li>\n<li><b>退出判斷很早</b>，省掉後面所有工作。</li>\n<li><b>更新世界完全不碰畫面</b>，繪製完全不改世界。這個分界讓「畫面是世界狀態的函數」成立，除錯時只要盯狀態就好。</li>\n</ul>\n\n<h3>那個到處出現的相減寫法</h3>\n<p><code>msTick</code> 是 32 位元的毫秒計數器，約 49.7 天後會繞回 0。程式裡所有時間比較都寫成相減：</p>\n<pre class=\"note\" style=\"font-family:var(--sm);font-size:12.5px;white-space:pre\">while (msTick - t0 &lt; TICK_MS) { }                   /* 等一幀       */\nif ((int32_t)(msTick - s_noteEnd) &gt;= 0) { ... }     /* 音符時間到了 */\nif (s_pulse[lane].readyAt &gt; msTick) return;         /* 還在冷卻     */</pre>\n<p>為什麼不寫 <code>msTick &gt; t0 + TICK_MS</code>：假設 <code>t0</code> 是 0xFFFFFFF8、<code>TICK_MS</code> 是 20，那麼 <code>t0 + 20</code> 會溢位成 12。條件 <code>msTick &gt; 12</code> 在 <code>msTick</code> 還是 0xFFFFFFFA 的時候就成立了，於是那一幀完全不等。</p>\n<p>改成相減就沒事：<code>0xFFFFFFFA - 0xFFFFFFF8</code> 在無號數運算下正好是 2，完全正確。<b>無號數的減法在模 2³² 下是封閉的</b>，差值永遠是真實的間隔，只要間隔小於 2³¹。</p>\n<p>需要判斷「某個時刻到了沒有」而不是「過了多久」時，要多一個轉型：<code>(int32_t)(msTick - deadline) &gt;= 0</code>。把差值當成有號數，於是「還沒到」是負數、「到了」是零或正數，同樣能跨越繞回點。</p>\n<div class=\"note\"><b>49.7 天聽起來不重要，</b>但這個寫法不是為了那一天。它的價值是「不需要想」——所有時間比較都用同一個形狀，就不會有某一處剛好寫錯。<span class=\"deepslot\" data-k=\"systick\" data-l=\"msTick 是怎麼來的\"></span></div>\n",demos:["frame"],ex:[{id:"c7a",type:"mc",q:"把主迴圈結尾的 <code>while (msTick - t0 &lt; TICK_MS) { }</code> 換成開頭的 <code>delay_ms(20);</code>，其他不動。症狀是？",opts:["恐龍不動","閃爍變嚴重","幀率不再固定：障礙物多的時候那一幀變長，遊戲速度跟著飄","按鍵反應變快"],ans:2,fb:"原本是「補滿剩下的時間」，總長固定。換成固定延遲後總長變成「工作 + 20」。上面的示範把滑桿拉過 TICK_MS 就能看到這個效果。"},{id:"c7b",type:"mc",q:"某人把冷卻判斷寫成 <code>if (msTick &lt; s_ready) return;</code>，而 <code>s_ready = msTick + 260</code>。這在什麼情況下會出錯？",opts:["永遠不會出錯","<code>msTick + 260</code> 溢位繞回 0 附近時，比較會得到相反的結果","260 太小","只有在 TICK_MS 是 25 的時候"],ans:1,fb:"<code>s_ready</code> 溢位成一個很小的數，於是 <code>msTick &lt; s_ready</code> 立刻不成立，冷卻被跳過。寫成 <code>(int32_t)(msTick - s_ready) &lt; 0</code> 就沒有這個問題。專案裡這一處恰好是 <code>readyAt &gt; msTick</code>，也有同樣的風險，只是要跑 49.7 天才會遇到一次。"},{id:"c7c",type:"fill",q:"寫出「距離 <code>last</code> 已經超過 <code>PERIOD</code> 毫秒」的判斷，要能扛住溢位。",ph:"if ( ... ) { ... }",need:[[/msTick/,"要用 msTick"],[/msTick\s*-\s*last/,"關鍵是用減法 msTick - last"],[/PERIOD/,"要和 PERIOD 比較"],[/>=|>/,"用大於或大於等於"]],ans:"if (msTick - last &gt;= PERIOD) { ... }",fb:"減法在無號數下跨越繞回點仍然正確。寫成 <code>msTick &gt;= last + PERIOD</code> 就會在 <code>last + PERIOD</code> 溢位時失效。"}]},{n:8,title:"Dino Run",problem:"一個只有跳和蹲的遊戲，難的不是操作而是手感：跳躍弧線要好看、障礙物間距要過得去、速度要越來越快但不能忽然變不可能。這一章看這些數字怎麼被挑出來，以及那個五步教學關怎麼做到邊教邊讓恐龍是活的。",files:["App/game_dino.c","App/gfx.c"],focus:{f:"App/game_dino.c",l:57},flowName:"一幀的 Dino",flowHint:"物理、生成、碰撞、繪製四段。雙擊節點看程式。",flow:{w:640,h:620,nodes:[{id:"st",x:200,y:10,w:230,h:50,t:"dino_step(held, pressed)",cls:"dec",sub:"跳 / 蹲 / 重力，回傳做了什麼",cap:"教學關和正式遊戲共用這一段，所以恐龍在教學時是活的。",tgt:{f:"App/game_dino.c",l:272}},{id:"gr",x:30,y:90,w:180,h:54,t:"在地面上？",sub:"pressed 有 UP → 起跳",cap:"起跳給一個負的垂直速度；蹲下只有在地面才成立。",tgt:{f:"App/game_dino.c",l:278}},{id:"ai",x:420,y:90,w:190,h:54,t:"在空中",sub:"vy += 重力，y += vy",cap:"全部用 1/16 像素的整數，沒有浮點。",tgt:{f:"App/game_dino.c",l:291}},{id:"sc",x:205,y:166,w:220,h:46,t:"捲動距離 step",sub:"速度累加，取整數部分",cap:"速度是 1/16 像素，餘數留到下一幀，所以慢速也能平滑。",tgt:{f:"App/game_dino.c",l:553}},{id:"sp",x:205,y:238,w:220,h:50,t:"obst_maybe_spawn()",cls:"dec",sub:"間距夠了才生成",cap:"間距和速度成正比，否則變快之後會變成不可能。",tgt:{f:"App/game_dino.c",l:340}},{id:"cl",x:30,y:318,w:180,h:46,t:"draw_clouds(step)",sub:"雲以 1/3 速度飄",cap:"視差：遠景比近景慢，畫面才有深度。",tgt:{f:"App/game_dino.c",l:213}},{id:"gd",x:225,y:318,w:180,h:46,t:"draw_ground(step)",sub:"地面虛線捲動",cap:"用一個 0..23 的偏移量做出無限捲動。",tgt:{f:"App/game_dino.c",l:167}},{id:"dd",x:425,y:318,w:185,h:46,t:"draw_dino()",sub:"整條垂直帶一次送出",cap:"帶寬 44、帶高 100，就是 GFX_BUF_PIX 的由來。",tgt:{f:"App/game_dino.c",l:182}},{id:"mv",x:205,y:394,w:220,h:46,t:"障礙物往左移",sub:"x -= step，逐一繪製",cap:"區塊寬 = sprite 寬 + step，順手擦掉尾巴。",tgt:{f:"App/game_dino.c",l:192}},{id:"hit",x:205,y:466,w:220,h:50,t:"dino_hits()",cls:"dec",sub:"兩個矩形重疊嗎",cap:"框比 sprite 內縮幾個像素，讓差一
