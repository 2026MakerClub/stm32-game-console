Len, s_seqIdx;","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint16_t</span> s_lastFreq;        <span class=\"tk-c\">/* last pitch actually programmed */</span>","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * How fast does TIM3 actually count?</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * On the F4, an APB1 timer is fed PCLK1 when the APB1 prescaler</span>","<span class=\"tk-c\"> * is 1, and 2 x PCLK1 for every other prescaler value.  On the</span>","<span class=\"tk-c\"> * usual 168 MHz course clock tree that means 42 MHz x 2 = 84 MHz.</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint32_t</span> <span class=\"tk-f\">timer_clock</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">uint32_t</span> ppre1 = (<span class=\"tk-n\">RCC</span>-&gt;<span class=\"tk-n\">CFGR</span> &gt;&gt; <span class=\"tk-n\">10</span>) &amp; <span class=\"tk-n\">0x7</span>;   <span class=\"tk-c\">/* bits 12:10 */</span>","    <span class=\"tk-k\">return</span> (ppre1 &lt; <span class=\"tk-n\">4</span>) ? PCLK1_Freq : (PCLK1_Freq * <span class=\"tk-n\">2</span>);","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Init</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-c\">/* --- PA6 to alternate function 2 ---------------------------- */</span>","    <span class=\"tk-n\">RCC</span>-&gt;<span class=\"tk-n\">AHB1ENR</span> |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">0</span>);                         <span class=\"tk-c\">/* GPIOA clock */</span>","","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span>   = (<span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span>   &amp; ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>)))","                   | (<span class=\"tk-n\">2UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>));            <span class=\"tk-c\">/* 10 = AF     */</span>","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">OTYPER</span> &amp;= ~(<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">PIN_SPK</span>);                 <span class=\"tk-c\">/* push-pull   */</span>","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">OSPEEDR</span> = (<span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">OSPEEDR</span> &amp; ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>)))","                   | (<span class=\"tk-n\">1UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>));            <span class=\"tk-c\">/* medium      */</span>","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">PUPDR</span>  &amp;= ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>));           <span class=\"tk-c\">/* no pull     */</span>","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">AFR</span>[<span class=\"tk-n\">0</span>]  = (<span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">AFR</span>[<span class=\"tk-n\">0</span>]  &amp; ~(<span class=\"tk-n\">0xFUL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">4</span>)))","                   | ((<span class=\"tk-t\">uint32_t</span>)<span class=\"tk-n\">AF_TIM3</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">4</span>));","","    <span class=\"tk-c\">/* --- TIM3 --------------------------------------------------- */</span>","    <span class=\"tk-n\">RCC</span>-&gt;<span class=\"tk-n\">APB1ENR</span> |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">1</span>);                         <span class=\"tk-c\">/* TIM3EN      */</span>","","    s_timClk = <span class=\"tk-f\">timer_clock</span>();","","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CR1</span>  = <span class=\"tk-n\">0</span>;","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CCMR1</span> = (<span class=\"tk-n\">6UL</span> &lt;&lt; <span class=\"tk-n\">4</span>)      <span class=\"tk-c\">/* OC1M = 110 -&gt; PWM mode 1          */</span>","                | (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">3</span>);     <span class=\"tk-c\">/* OC1PE: preload CCR1               */</span>","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CCER</span>  = <span class=\"tk-n\">0</span>;              <span class=\"tk-c\">/* channel stays off until a note    */</span>","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CR1</span>  |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">7</span>);     <span class=\"tk-c\">/* ARPE: preload ARR                 */</span>","","    s_muted   = <span class=\"tk-n\">0</span>;","    s_seq     = <span class=\"tk-n\">0</span>;","    s_noteEnd = <span class=\"tk-n\">0</span>;","}","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * Pick a prescaler/reload pair that lands on the wanted pitch.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> *   f = timClk / ((PSC + 1) * (ARR + 1))</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * ARR is only 16 bits, so divide the total count down with PSC</span>","<span class=\"tk-c\"> * until the remainder fits.</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">tone_on</span>(<span class=\"tk-t\">uint16_t</span> freq)","{","    <span class=\"tk-t\">uint32_t</span> total, psc, arr;","","    s_lastFreq = freq;","    <span class=\"tk-k\">if</span> (freq == <span class=\"tk-n\">0</span> || s_muted) { <span class=\"tk-f\">Sound_Stop</span>(); <span class=\"tk-k\">return</span>; }","","    total = s_timClk / freq;","    <span class=\"tk-k\">if</span> (total == <span class=\"tk-n\">0</span>) { <span class=\"tk-f\">Sound_Stop</span>(); <span class=\"tk-k\">return</span>; }","","    psc = (total + <span class=\"tk-n\">65535UL</span>) / <span class=\"tk-n\">65536UL</span>;     <span class=\"tk-c\">/* smallest PSC+1 that fits  */</span>","    <span class=\"tk-k\">if</span> (psc == <span class=\"tk-n\">0</span>) psc = <span class=\"tk-n\">1</span>;","    arr = total / psc;","    <span class=\"tk-k\">if</span> (arr == <span class=\"tk-n\">0</span>) arr = <span class=\"tk-n\">1</span>;","    <span class=\"tk-k\">if</span> (arr &gt; <span class=\"tk-n\">65536UL</span>) arr = <span class=\"tk-n\">65536UL</span>;","","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">PSC</span>  = (<span class=\"tk-t\">uint16_t</span>)(psc - <span class=\"tk-n\">1</span>);","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">ARR</span>  = (<span class=\"tk-t\">uint16_t</span>)(arr - <span class=\"tk-n\">1</span>);","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CCR1</span> = (<span class=\"tk-t\">uint16_t</span>)(arr / <span class=\"tk-n\">2</span>);      <span class=\"tk-c\">/* 50% duty = square wave    */</span>","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">EGR</span>  = <span class=\"tk-n\">1UL</span>;                      <span class=\"tk-c\">/* UG: load the new values   */</span>","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CCER</span> |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">0</span>);              <span class=\"tk-c\">/* CC1E: drive the pin       */</span>","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CR1</span>  |= (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">0</span>);              <span class=\"tk-c\">/* CEN: run                  */</span>","","    <span class=\"tk-c\">/* hand PA6 back to the timer */</span>","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span> = (<span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span> &amp; ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>)))","                 | (<span class=\"tk-n\">2UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>));           <span class=\"tk-c\">/* 10 = AF */</span>","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Stop</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CCER</span> &amp;= ~(<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">0</span>);             <span class=\"tk-c\">/* release the compare output */</span>","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CR1</span>  &amp;= ~(<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">0</span>);             <span class=\"tk-c\">/* stop counting              */</span>","","    <span class=\"tk-c\">/* Take the pin back off the timer and hold it low.  Leaving it</span>","<span class=\"tk-c\">     * on an idle alternate function can park it high, which would</span>","<span class=\"tk-c\">     * push a steady 15 mA through the speaker for no sound at all. */</span>","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span> = (<span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span> &amp; ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>)))","                 | (<span class=\"tk-n\">1UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>));           <span class=\"tk-c\">/* 01 = output */</span>","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">BSRR</span>  = (<span class=\"tk-n\">1UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> + <span class=\"tk-n\">16</span>));          <span class=\"tk-c\">/* drive low   */</span>","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_DC</span>(<span class=\"tk-t\">uint8_t</span> on)","{","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CCER</span> &amp;= ~(<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">0</span>);          <span class=\"tk-c\">/* let go of the compare output */</span>","    <span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">CR1</span>  &amp;= ~(<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">0</span>);          <span class=\"tk-c\">/* stop the timer               */</span>","","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span> = (<span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">MODER</span> &amp; ~(<span class=\"tk-n\">3UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>)))","                 | (<span class=\"tk-n\">1UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> * <span class=\"tk-n\">2</span>));            <span class=\"tk-c\">/* 01 = output    */</span>","    <span class=\"tk-n\">GPIOA</span>-&gt;<span class=\"tk-n\">BSRR</span>  = on ? (<span class=\"tk-n\">1UL</span> &lt;&lt; <span class=\"tk-n\">PIN_SPK</span>) : (<span class=\"tk-n\">1UL</span> &lt;&lt; (<span class=\"tk-n\">PIN_SPK</span> + <span class=\"tk-n\">16</span>));","}","","<span class=\"tk-c\">/* msTick is a free-running ms counter; a note end of exactly 0 is</span>","<span class=\"tk-c\"> * used as the \"nothing playing\" marker, so nudge past it. */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">set_end</span>(<span class=\"tk-t\">uint32_t</span> when)","{","    s_noteEnd = when ? when : <span class=\"tk-n\">1u</span>;","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Tone</span>(<span class=\"tk-t\">uint16_t</span> freq, <span class=\"tk-t\">uint16_t</span> ms)","{","    s_seq = <span class=\"tk-n\">0</span>;                             <span class=\"tk-c\">/* a single tone cancels a melody */</span>","    <span class=\"tk-f\">tone_on</span>(freq);","    <span class=\"tk-f\">set_end</span>(msTick + ms);","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Melody</span>(<span class=\"tk-k\">const</span> Note *notes, <span class=\"tk-t\">uint8_t</span> count)","{","    <span class=\"tk-k\">if</span> (!notes || count == <span class=\"tk-n\">0</span>) <span class=\"tk-k\">return</span>;","    s_seq    = notes;","    s_seqLen = count;","    s_seqIdx = <span class=\"tk-n\">0</span>;","    <span class=\"tk-f\">tone_on</span>(notes[<span class=\"tk-n\">0</span>].freq);","    <span class=\"tk-f\">set_end</span>(msTick + notes[<span class=\"tk-n\">0</span>].ms);","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Update</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-k\">if</span> (s_noteEnd == <span class=\"tk-n\">0</span>) <span class=\"tk-k\">return</span>;","    <span class=\"tk-k\">if</span> ((<span class=\"tk-t\">int32_t</span>)(msTick - s_noteEnd) &lt; <span class=\"tk-n\">0</span>) <span class=\"tk-k\">return</span>;   <span class=\"tk-c\">/* still playing */</span>","","    <span class=\"tk-k\">if</span> (s_seq &amp;&amp; (s_seqIdx + <span class=\"tk-n\">1</span>) &lt; s_seqLen) {","        s_seqIdx++;","        <span class=\"tk-f\">tone_on</span>(s_seq[s_seqIdx].freq);","        <span class=\"tk-f\">set_end</span>(msTick + s_seq[s_seqIdx].ms);","    } <span class=\"tk-k\">else</span> {","        <span class=\"tk-f\">Sound_Stop</span>();","        s_seq     = <span class=\"tk-n\">0</span>;","        s_noteEnd = <span class=\"tk-n\">0</span>;","    }","}","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Mute</span>(<span class=\"tk-t\">uint8_t</span> on)","{","    s_muted = on ? <span class=\"tk-n\">1</span> : <span class=\"tk-n\">0</span>;","    <span class=\"tk-k\">if</span> (s_muted) { <span class=\"tk-f\">Sound_Stop</span>(); s_seq = <span class=\"tk-n\">0</span>; s_noteEnd = <span class=\"tk-n\">0</span>; }","}","","<span class=\"tk-t\">uint8_t</span> <span class=\"tk-f\">Sound_IsMuted</span>(<span class=\"tk-t\">void</span>) { <span class=\"tk-k\">return</span> s_muted; }","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Debug</span>(<span class=\"tk-t\">uint32_t</span> *timClk, <span class=\"tk-t\">uint16_t</span> *psc, <span class=\"tk-t\">uint16_t</span> *arr, <span class=\"tk-t\">uint16_t</span> *freq)","{","    <span class=\"tk-k\">if</span> (timClk) *timClk = s_timClk;","    <span class=\"tk-k\">if</span> (psc)    *psc    = (<span class=\"tk-t\">uint16_t</span>)<span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">PSC</span>;","    <span class=\"tk-k\">if</span> (arr)    *arr    = (<span class=\"tk-t\">uint16_t</span>)<span class=\"tk-n\">TIM3</span>-&gt;<span class=\"tk-n\">ARR</span>;","    <span class=\"tk-k\">if</span> (freq)   *freq   = s_lastFreq;","}","","<span class=\"tk-c\">/* ------------------------------------------------------------</span>","<span class=\"tk-c\"> * Canned effects</span>","<span class=\"tk-c\"> * ---------------------------------------------------------- */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Note <span class=\"tk-n\">MEL_JUMP</span>[]   = { {<span class=\"tk-n\">NOTE_G5</span>, <span class=\"tk-n\">40</span>}, {<span class=\"tk-n\">NOTE_C6</span>, <span class=\"tk-n\">55</span>} };","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Note <span class=\"tk-n\">MEL_DUCK</span>[]   = { {<span class=\"tk-n\">NOTE_E4</span>, <span class=\"tk-n\">50</span>}, {<span class=\"tk-n\">NOTE_C4</span>, <span class=\"tk-n\">55</span>} };","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Note <span class=\"tk-n\">MEL_POINT</span>[]  = { {<span class=\"tk-n\">NOTE_E6</span>, <span class=\"tk-n\">35</span>}, {<span class=\"tk-n\">NOTE_G6</span>, <span class=\"tk-n\">45</span>} };","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Note <span class=\"tk-n\">MEL_MERGE</span>[]  = { {<span class=\"tk-n\">NOTE_C5</span>, <span class=\"tk-n\">40</span>}, {<span class=\"tk-n\">NOTE_E5</span>, <span class=\"tk-n\">40</span>}, {<span class=\"tk-n\">NOTE_G5</span>, <span class=\"tk-n\">60</span>} };","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Note <span class=\"tk-n\">MEL_GOOD</span>[]   = { {<span class=\"tk-n\">NOTE_C5</span>, <span class=\"tk-n\">60</span>}, {<span class=\"tk-n\">NOTE_E5</span>, <span class=\"tk-n\">60</span>}, {<span class=\"tk-n\">NOTE_G5</span>, <span class=\"tk-n\">60</span>},","                                   {<span class=\"tk-n\">NOTE_C6</span>, <span class=\"tk-n\">110</span>} };","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Note <span class=\"tk-n\">MEL_HIT</span>[]    = { {<span class=\"tk-n\">NOTE_G4</span>, <span class=\"tk-n\">70</span>}, {<span class=\"tk-n\">NOTE_E4</span>, <span class=\"tk-n\">70</span>}, {<span class=\"tk-n\">NOTE_C4</span>, <span class=\"tk-n\">160</span>} };","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Note <span class=\"tk-n\">MEL_SELECT</span>[] = { {<span class=\"tk-n\">NOTE_C5</span>, <span class=\"tk-n\">30</span>}, {<span class=\"tk-n\">NOTE_G5</span>, <span class=\"tk-n\">45</span>} };","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> Note <span class=\"tk-n\">MEL_START</span>[]  = { {<span class=\"tk-n\">NOTE_C5</span>, <span class=\"tk-n\">90</span>}, {<span class=\"tk-n\">NOTE_REST</span>, <span class=\"tk-n\">40</span>}, {<span class=\"tk-n\">NOTE_C5</span>, <span class=\"tk-n\">90</span>},","                                   {<span class=\"tk-n\">NOTE_REST</span>, <span class=\"tk-n\">40</span>}, {<span class=\"tk-n\">NOTE_C6</span>, <span class=\"tk-n\">180</span>} };","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">PLAY</span>(m)  <span class=\"tk-f\">Sound_Melody</span>((m), (<span class=\"tk-t\">uint8_t</span>)(<span class=\"tk-k\">sizeof</span>(m)/<span class=\"tk-k\">sizeof</span>((m)[<span class=\"tk-n\">0</span>])))","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Jump</span>(<span class=\"tk-t\">void</span>)   { <span class=\"tk-n\">PLAY</span>(<span class=\"tk-n\">MEL_JUMP</span>);   }","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Duck</span>(<span class=\"tk-t\">void</span>)   { <span class=\"tk-n\">PLAY</span>(<span class=\"tk-n\">MEL_DUCK</span>);   }","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Point</span>(<span class=\"tk-t\">void</span>)  { <span class=\"tk-n\">PLAY</span>(<span class=\"tk-n\">MEL_POINT</span>);  }","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Merge</span>(<span class=\"tk-t\">void</span>)  { <span class=\"tk-n\">PLAY</span>(<span class=\"tk-n\">MEL_MERGE</span>);  }","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Good</span>(<span class=\"tk-t\">void</span>)   { <span class=\"tk-n\">PLAY</span>(<span class=\"tk-n\">MEL_GOOD</span>);   }","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Hit</span>(<span class=\"tk-t\">void</span>)    { <span class=\"tk-n\">PLAY</span>(<span class=\"tk-n\">MEL_HIT</span>);    }","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Select</span>(<span class=\"tk-t\">void</span>) { <span class=\"tk-n\">PLAY</span>(<span class=\"tk-n\">MEL_SELECT</span>); }","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Start</span>(<span class=\"tk-t\">void</span>)  { <span class=\"tk-n\">PLAY</span>(<span class=\"tk-n\">MEL_START</span>);  }"],"App/sound.h":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * sound.h - square-wave sound effects on a passive speaker</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * WIRING</span>","<span class=\"tk-c\"> *   PA6 (TIM3_CH1) ---[ 220 ohm ]--- speaker + ... speaker - --- GND</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> *   The 220 ohm resistor is NOT optional.  A 4 ohm speaker wired</span>","<span class=\"tk-c\"> *   straight to a GPIO pin would ask for 3.3 V / 4 ohm = 825 mA;</span>","<span class=\"tk-c\"> *   an STM32 pin is rated for 25 mA.  220 ohm limits the current</span>","<span class=\"tk-c\"> *   to about 15 mA, which is safe and still clearly audible.</span>","<span class=\"tk-c\"> *   Do not lower it.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * HOW IT MAKES A NOTE</span>","<span class=\"tk-c\"> *   TIM3 is run as a PWM generator at the note frequency with a</span>","<span class=\"tk-c\"> *   50% duty cycle, i.e. a square wave.  Pitch comes from the</span>","<span class=\"tk-c\"> *   timer period, not the duty cycle.</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#ifndef</span> __SOUND_H","<span class=\"tk-p\">#define</span> __SOUND_H","","<span class=\"tk-p\">#include</span> &lt;stdint.h&gt;","","<span class=\"tk-c\">/* note frequencies, Hz (equal temperament, A4 = 440) */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_C4</span>   <span class=\"tk-n\">262</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_D4</span>   <span class=\"tk-n\">294</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_E4</span>   <span class=\"tk-n\">330</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_F4</span>   <span class=\"tk-n\">349</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_G4</span>   <span class=\"tk-n\">392</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_A4</span>   <span class=\"tk-n\">440</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_B4</span>   <span class=\"tk-n\">494</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_C5</span>   <span class=\"tk-n\">523</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_D5</span>   <span class=\"tk-n\">587</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_E5</span>   <span class=\"tk-n\">659</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_G5</span>   <span class=\"tk-n\">784</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_C6</span>   <span class=\"tk-n\">1047</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_E6</span>   <span class=\"tk-n\">1319</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_G6</span>   <span class=\"tk-n\">1568</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">NOTE_REST</span> <span class=\"tk-n\">0</span>","","<span class=\"tk-k\">typedef</span> <span class=\"tk-k\">struct</span> {","    <span class=\"tk-t\">uint16_t</span> freq;   <span class=\"tk-c\">/* Hz, or NOTE_REST for silence */</span>","    <span class=\"tk-t\">uint16_t</span> ms;     <span class=\"tk-c\">/* duration                      */</span>","} Note;","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Init</span>(<span class=\"tk-t\">void</span>);","","<span class=\"tk-c\">/* Start one note and let it run for ms; non-blocking.</span>","<span class=\"tk-c\"> * Sound_Update() turns it off when the time is up.   */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Tone</span>(<span class=\"tk-t\">uint16_t</span> freq, <span class=\"tk-t\">uint16_t</span> ms);","","<span class=\"tk-c\">/* Queue a short melody; non-blocking, same rule.      */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Melody</span>(<span class=\"tk-k\">const</span> Note *notes, <span class=\"tk-t\">uint8_t</span> count);","","<span class=\"tk-c\">/* Call once per game tick.                            */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Update</span>(<span class=\"tk-t\">void</span>);","","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Stop</span>(<span class=\"tk-t\">void</span>);","","<span class=\"tk-c\">/* Drive the speaker pin as a plain DC output, bypassing the timer.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * This is what an ACTIVE buzzer (有源蜂鳴器) wants: it contains its</span>","<span class=\"tk-c\"> * own oscillator, so it sounds whenever it has voltage and ignores</span>","<span class=\"tk-c\"> * any waveform you send it.  It is also the simplest possible proof</span>","<span class=\"tk-c\"> * that PA6 can drive anything at all.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * A PASSIVE buzzer (無源蜂鳴器) or a speaker will click once and</span>","<span class=\"tk-c\"> * then sit silent on DC - those need Sound_Tone().               */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_DC</span>(<span class=\"tk-t\">uint8_t</span> on);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Mute</span>(<span class=\"tk-t\">uint8_t</span> on);","<span class=\"tk-t\">uint8_t</span> <span class=\"tk-f\">Sound_IsMuted</span>(<span class=\"tk-t\">void</span>);","","<span class=\"tk-c\">/* What the timer is actually doing right now.  If timClk is not</span>","<span class=\"tk-c\"> * about 84000000 on the standard course clock tree, the problem</span>","<span class=\"tk-c\"> * is the clock setup, not the speaker.  If it is right and the</span>","<span class=\"tk-c\"> * pin still does nothing, the fault is on the board. */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Sound_Debug</span>(<span class=\"tk-t\">uint32_t</span> *timClk, <span class=\"tk-t\">uint16_t</span> *psc, <span class=\"tk-t\">uint16_t</span> *arr, <span class=\"tk-t\">uint16_t</span> *freq);","","<span class=\"tk-c\">/* ready-made effects */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Jump</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Duck</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Point</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Merge</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Good</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Hit</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Select</span>(<span class=\"tk-t\">void</span>);","<span class=\"tk-t\">void</span> <span class=\"tk-f\">SFX_Start</span>(<span class=\"tk-t\">void</span>);","","<span class=\"tk-p\">#endif</span> <span class=\"tk-c\">/* __SOUND_H */</span>"],"App/game_dino.c":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * game_dino.c - Chrome dinosaur runner</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Sprites are the real Chrome-Dino-Runner artwork, converted to</span>","<span class=\"tk-c\"> * 1-bit-per-pixel masks by scratchpad/gen_sprites.py.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * SCREEN (320 x 240 landscape)</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> *    y=0    +--------------------------------------+</span>","<span class=\"tk-c\"> *           |  HI 00000                   00000    |  score strip</span>","<span class=\"tk-c\"> *    y=56   |       (cloud)        (cloud)         |</span>","<span class=\"tk-c\"> *    y=96   +--- dino band (x 30..74) -------------+</span>","<span class=\"tk-c\"> *           |    |&gt;|                    |cactus|   |</span>","<span class=\"tk-c\"> *    y=196  +--------------------------------------+  ground line</span>","<span class=\"tk-c\"> *           |  - -   - -   - -   - -   - -   - -   |  scrolling dashes</span>","<span class=\"tk-c\"> *    y=240  +--------------------------------------+</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * CONTROLS</span>","<span class=\"tk-c\"> *    UP button / stick up      jump</span>","<span class=\"tk-c\"> *    DOWN button / stick down  duck</span>","<span class=\"tk-c\"> *    KEY1 (PB8)                back to menu</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"console.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"input.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"sound.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"gfx.h\"</span>","<span class=\"tk-p\">#include</span> &lt;stdio.h&gt;","<span class=\"tk-p\">#include</span> &lt;string.h&gt;","","<span class=\"tk-c\">/* ---- palette ------------------------------------------------ */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">SKY</span>        <span class=\"tk-n\">0xF7BE</span>          <span class=\"tk-c\">/* very light grey, like the browser page */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">INK</span>        <span class=\"tk-n\">0x528A</span>          <span class=\"tk-c\">/* Chrome's #535353                       */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">DIMINK</span>     <span class=\"tk-n\">0xB596</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">OKBG</span>       <span class=\"tk-n\">0x0480</span>          <span class=\"tk-c\">/* dark green, for the tutorial \"GOOD!\"   */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BADBG</span>      <span class=\"tk-n\">0x9000</span>          <span class=\"tk-c\">/* dark red                               */</span>","","<span class=\"tk-c\">/* ---- world geometry ----------------------------------------- */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">GROUND_Y</span>     <span class=\"tk-n\">196</span>           <span class=\"tk-c\">/* y of the ground line                   */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">DINO_X</span>        <span class=\"tk-n\">30</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">DINO_BAND_W</span>   <span class=\"tk-n\">44</span>           <span class=\"tk-c\">/* widest dino pose (duck) + 1            */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">DINO_BAND_TOP</span> <span class=\"tk-n\">96</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">DINO_BAND_H</span>  (<span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">DINO_BAND_TOP</span>)      <span class=\"tk-c\">/* 100 -&gt; 4400 px       */</span>","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">STAND_H</span>       <span class=\"tk-n\">34</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">DUCK_H</span>        <span class=\"tk-n\">22</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">STAND_TOP</span>    (<span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">STAND_H</span>)            <span class=\"tk-c\">/* 162 */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">DUCK_TOP</span>     (<span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">DUCK_H</span>)             <span class=\"tk-c\">/* 174 */</span>","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CLOUD_Y</span>       <span class=\"tk-n\">56</span>","","<span class=\"tk-c\">/* ---- physics, in 1/16 pixel ---------------------------------</span>","<span class=\"tk-c\"> * A jump impulse of -102 against a gravity of +5 per frame peaks</span>","<span class=\"tk-c\"> * after about 20 frames at roughly 64 px, and lands after 40</span>","<span class=\"tk-c\"> * frames.  At a 20 ms tick that is a 0.8 s hop, which feels</span>","<span class=\"tk-c\"> * right next to obstacles moving at 150-400 px/s.</span>","<span class=\"tk-c\"> * ------------------------------------------------------------ */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">GRAVITY16</span>      <span class=\"tk-n\">5</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">JUMP_V16</span>    (-<span class=\"tk-n\">102</span>)","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">SPEED_MIN16</span>   <span class=\"tk-n\">48</span>           <span class=\"tk-c\">/* 3.0 px per frame */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">SPEED_MAX16</span>  <span class=\"tk-n\">128</span>           <span class=\"tk-c\">/* 8.0 px per frame */</span>","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">TICK_MS</span>       <span class=\"tk-n\">20</span>","","<span class=\"tk-c\">/* ---- obstacle catalogue ------------------------------------- */</span>","<span class=\"tk-k\">typedef</span> <span class=\"tk-k\">struct</span> {","    <span class=\"tk-k\">const</span> Sprite *spr;","    <span class=\"tk-t\">int16_t</span>       top;             <span class=\"tk-c\">/* absolute y of the sprite top */</span>","} ObstDef;","","<span class=\"tk-k\">enum</span> { <span class=\"tk-n\">O_CS1</span> = <span class=\"tk-n\">0</span>, <span class=\"tk-n\">O_CS2</span>, <span class=\"tk-n\">O_CS3</span>, <span class=\"tk-n\">O_CL1</span>, <span class=\"tk-n\">O_CL2</span>, <span class=\"tk-n\">O_BIRD_MID</span>, <span class=\"tk-n\">O_BIRD_LOW</span>, <span class=\"tk-n\">O_COUNT</span> };","","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> ObstDef <span class=\"tk-n\">OBST</span>[<span class=\"tk-n\">O_COUNT</span>] = {","    { &amp;<span class=\"tk-n\">SPR_CAC_S1</span>, <span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">26</span> },","    { &amp;<span class=\"tk-n\">SPR_CAC_S2</span>, <span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">26</span> },","    { &amp;<span class=\"tk-n\">SPR_CAC_S3</span>, <span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">26</span> },","    { &amp;<span class=\"tk-n\">SPR_CAC_L1</span>, <span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">34</span> },","    { &amp;<span class=\"tk-n\">SPR_CAC_L2</span>, <span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">34</span> },","    <span class=\"tk-c\">/* 150..174: clears a ducking dino (174..196), hits a standing one */</span>","    { &amp;<span class=\"tk-n\">SPR_BIRD1</span>,  <span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">46</span> },","    <span class=\"tk-c\">/* 170..194: must be jumped */</span>","    { &amp;<span class=\"tk-n\">SPR_BIRD2</span>,  <span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">26</span> },","};","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">MAX_OBST</span> <span class=\"tk-n\">3</span>","<span class=\"tk-k\">typedef</span> <span class=\"tk-k\">struct</span> {","    <span class=\"tk-t\">int16_t</span> x;","    <span class=\"tk-t\">uint8_t</span> kind;","    <span class=\"tk-t\">uint8_t</span> active;","    <span class=\"tk-t\">uint8_t</span> passed;                <span class=\"tk-c\">/* already counted for the score */</span>","} Obst;","","<span class=\"tk-c\">/* ---- module state ------------------------------------------- */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">int32_t</span>  s_y16, s_vy16;     <span class=\"tk-c\">/* dino vertical position / velocity */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span>  s_ducking;","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span>  s_onGround;","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span>  s_dead;","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span>  s_animCnt /span>, <span class=\"tk-n\">DINO_BAND_TOP</span>);","}","","<span class=\"tk-c\">/* Draw one obstacle and, in the same write, wipe the strip it</span>","<span class=\"tk-c\"> * just vacated on its right-hand side. */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">draw_obst</span>(Obst *o, <span class=\"tk-t\">uint8_t</span> step)","{","    <span class=\"tk-k\">const</span> Sprite *s = <span class=\"tk-n\">OBST</span>[o-&gt;kind].spr;","    <span class=\"tk-t\">int16_t</span> bx = o-&gt;x;","    <span class=\"tk-t\">int16_t</span> bw = (<span class=\"tk-t\">int16_t</span>)(s-&gt;w + step);","    <span class=\"tk-t\">int16_t</span> sx = <span class=\"tk-n\">0</span>;","","    <span class=\"tk-c\">/* Obstacles are spawned just off the right edge, so \"not on</span>","<span class=\"tk-c\">     * screen yet\" must not be confused with \"scrolled away\". */</span>","    <span class=\"tk-k\">if</span> (bx &gt;= <span class=\"tk-n\">SCR_W</span>) <span class=\"tk-k\">return</span>;","    <span class=\"tk-k\">if</span> (bx + bw &lt;= <span class=\"tk-n\">0</span>) { o-&gt;active = <span class=\"tk-n\">0</span>; <span class=\"tk-k\">return</span>; }","","    <span class=\"tk-k\">if</span> (bx &lt; <span class=\"tk-n\">0</span>) { sx = bx; bw = (<span class=\"tk-t\">int16_t</span>)(bw + bx); bx = <span class=\"tk-n\">0</span>; }","    <span class=\"tk-k\">if</span> (bx + bw &gt; <span class=\"tk-n\">SCR_W</span>) bw = (<span class=\"tk-t\">int16_t</span>)(<span class=\"tk-n\">SCR_W</span> - bx);","    <span class=\"tk-k\">if</span> (bw &lt;= <span class=\"tk-n\">0</span>) <span class=\"tk-k\">return</span>;","","    <span class=\"tk-f\">Gfx_BandBegin</span>((<span class=\"tk-t\">uint16_t</span>)bw, s-&gt;h, <span class=\"tk-n\">SKY</span>);","    <span class=\"tk-f\">Gfx_BandSprite</span>(s, sx, <span class=\"tk-n\">0</span>, <span class=\"tk-n\">INK</span>);","    <span class=\"tk-f\">Gfx_BandEnd</span>(bx, <span class=\"tk- class=\"tk-k\">continue</span>;","","            <span class=\"tk-f\">Gfx_BandBegin</span>((<span class=\"tk-t\">uint16_t</span>)bw, <span class=\"tk-n\">SPR_CLOUD</span>.h, <span class=\"tk-n\">SKY</span>);","            <span class=\"tk-f\">Gfx_BandSprite</span>(&amp;<span class=\"tk-n\">SPR_CLOUD</span>, sx, <span class=\"tk-n\">0</span>, <span class=\"tk-n\">DIMINK</span>);","            <span class=\"tk-f\">Gfx_BandEnd</span>(bx, <span class=\"tk-n\">CLOUD_Y</span>);","        }","    }","}","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">draw_score</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">char</span> buf[<span class=\"tk-n\">26</span>];","","    <span class=\"tk-k\">if</span> (s_score == s_shown) <span class=\"tk-k\">return</span>;","    s_shown = s_score;","","    <span class=\"tk-f\">sprintf</span>(buf, <span class=\"tk-s\">\"HI %05lu   %05lu\"</span>,","            (<span class=\"tk-t\">unsigned</span> <span class=\"tk-t\">long</span>)s_hi, (<span class=\"tk-t\">unsigned</span> <span class=\"tk-t\">long</span>)s_score);","    <span class=\"tk-f\">LCD_SetFont</span>(&amp;Font12);","    <span class=\"tk-f\">LCD_SetColors</span>(<span class=\"tk-n\">INK</span>, <span class=\"tk-n\">SKY</span>);","    <span class=\"tk-f\">LCD_DisplayStringAt</span>(<span class=\"tk-n\">174</span>, <span class=\"tk-n\">8</span>, buf, <span class=\"tk-n\">LEFT_MODE</span>);","}","","<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * dino physics, shared by the tutorial and the real game</span>","<span class=\"tk-c\"> * ========================================================== */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">dino_reset</span>(<span class=\"tk-t\">void</span>)","{","    s_y16      = (<span class=\"tk-t\">int32_t</span>)<span class=\"tk-n\">STAND_TOP</span> * <span class=\"tk-n\">16</span>;","    s_vy16     = <span class=\"tk-n\">0</span>;","    s_ducking  = <span class=\"tk-n\">0</span>;","    s_onGround = <span class=\"tk-n\">1</span>;","    s_dead     = <span class=\"tk-n\">0</span>;","    s_animCnt  = <span class=\"tk-n\">0</span>;","    s_animFrame = <span class=\"tk-n\">0</span>;","}","","<span class=\"tk-c\">/* Returns a bit mask of what the player just did, so the</span>","<span class=\"tk-c\"> * tutorial can check it off:  1 = jumped, 2 = ducked. */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span> <span class=\"tk-f\">dino_step</span>(<span class=\"tk-t\">uint16_t</span> held, <span class=\"tk-t\">uint16_t</span> pressed)","{","    <span class=\"tk-t\">uint8_t</span> did = <span class=\"tk-n\">0</span>;","","    <span class=\"tk-k\">if</span> (s_onGround) {","        <span class=\"tk-k\">if</span> (pressed &amp; <span class=\"tk-n\">ANY_UP</span>) {","            s_vy16     = <span class=\"tk-n\">JUMP_V16</span>;","            s_onGround = <span class=\"tk-n\">0</span>;","            s_ducking  = <span class=\"tk-n\">0</span>;","            did |= <span class=\"tk-n\">1</span>;","            <span class=\"tk-f\">SFX_Jump</span>();","        } <span class=\"tk-k\">else</span> {","            <span class=\"tk-t\">uint8_t</span> wantDuck = (held &amp; <span class=\"tk-n\">ANY_DOWN</span>) ? <span class=\"tk-n\">1</span> : <span class=\"tk-n\">0</span>;","            <span class=\"tk-k\">if</span> (wantDuck &amp;&amp; !s_ducking) { did |= <span class=\"tk-n\">2</span>; <span class=\"tk-f\">SFX_Duck</span>(); }","            s_ducking = wantDuck;","        }","    }","","    <span class=\"tk-k\">if</span> (!s_onGround) {","        s_vy16 += <span class=\"tk-n\">GRAVITY16</span>;","        s_y16  += s_vy16;","        <span class=\"tk-k\">if</span> (s_y16 &gt;= (<span class=\"tk-t\">int32_t</span>)<span class=\"tk-n\">STAND_TOP</span> * <span class=\"tk-n\">16</span>) {","            s_y16      = (<span class=\"tk-t\">int32_t</span>)<span class=\"tk-n\">STAND_TOP</span> * <span class=\"tk-n\">16</span>;","            s_vy16     = <span class=\"tk-n\">0</span>;","            s_onGround = <span class=\"tk-n\">1</span>;","        }","        <span class=\"tk-c\">/* pulling down in mid-air drops you faster, as in the original */</span>","        <span class=\"tk-k\">if</span> ((held &amp; <span class=\"tk-n\">ANY_DOWN</span>) &amp;&amp; s_vy16 &lt; <span class=\"tk-n\">40</span>) s_vy16 += <span class=\"tk-n\">GRAVITY16</span>;","    }","","    <span class=\"tk-k\">if</span> (++s_animCnt &gt;= <span class=\"tk-n\">6</span>) { s_animCnt = <span class=\"tk-n\">0</span>; s_animFrame ^= <span class=\"tk-n\">1</span>; }","    <span class=\"tk-k\">return</span> did;","}","","<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * obstacles</span>","<span class=\"tk-c\"> * ========================================================== */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">obst_clear</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">uint8_t</span> i;","    <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_OBST</span>; i++) s_obst[i].active = <span class=\"tk-n\">0</span>;","}","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">int16_t</span> <span class=\"tk-f\">rightmost_obst</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">int16_t</span> best = -<span class=\"tk-n\">1000</span>;","    <span class=\"tk-t\">uint8_t</span> i;","    <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_OBST</span>; i++)","        <span class=\"tk-k\">if</span> (s_obst[i].active) {","            <span class=\"tk-t\">int16_t</span> r = (<span class=\"tk-t\">int16_t</span>)(s_obst[i].x + <span class=\"tk-n\">OBST</span>[s_obst[i].kind].spr-&gt;w);","            <span class=\"tk-k\">if</span> (r &gt; best) best = r;","        }","    <span class=\"tk-k\">return</span> best;","}","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">obst_spawn</span>(<span class=\"tk-t\">uint8_t</span> kind, <span class=\"tk-t\">int16_t</span> x)","{","    <span class=\"tk-t\">uint8_t</span> i;","    <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_OBST</span>; i++)","        <span class=\"tk-k\">if</span> (!s_obst[i].active) {","            s_obst[i].x      = x;","            s_obst[i].kind   = kind;","            s_obst[i].active = <span class=\"tk-n\">1</span>;","            s_obst[i].passed = <span class=\"tk-n\">0</span>;","            <span class=\"tk-k\">return</span>;","        }","}","","<span class=\"tk-k\">static</span> <span class=\"tk-t\">void</span> <span class=\"tk-f\">obst_maybe_spawn</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-c\">/* Keep the gap proportional to the speed, otherwise the game</span>","<span class=\"tk-c\">     * becomes impossible rather than merely hard. */</span>","    <span class=\"tk-t\">int16_t</span> gapMin = (<span class=\"tk-t\">int16_t</span>)(<span class=\"tk-n\">110</span> + (s_speed16 * <span class=\"tk-n\">12</span>) / <span class=\"tk-n\">16</span>);","    <span class=\"tk-t\">int16_t</span> gap    = (<span class=\"tk-t\">int16_t</span>)(gapMin + (<span class=\"tk-t\">int16_t</span>)(<span class=\"tk-f\">rnd</span>() % <span class=\"tk-n\">120</span>));","","    <span class=\"tk-k\">if</span> (<span class=\"tk-f\">rightmost_obst</span>() &gt; (<span class=\"tk-t\">int16_t</span>)(<span class=\"tk-n\">SCR_W</span> - gap)) <span class=\"tk-k\">return</span>;","","    {","        <span class=\"tk-t\">uint32_t</span> r = <span class=\"tk-f\">rnd</span>() % <span class=\"tk-n\">100</span>;","        <span class=\"tk-t\">uint8_t</span>  kind;","        <span class=\"tk-k\">if</span> (s_score &lt; <span class=\"tk-n\">150</span>)      kind = (<span class=\"tk-t\">uint8_t</span>)(r % <span class=\"tk-n\">3</span>);            <span class=\"tk-c\">/* small cacti  */</span>","        <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> (s_score &lt; <span class=\"tk-n\">400</span>) kind = (<span class=\"tk-t\">uint8_t</span>)(r % <span class=\"tk-n\">5</span>);            <span class=\"tk-c\">/* + large cacti*/</span>","        <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> (r &lt; <span class=\"tk-n\">70</span>)        kind = (<span class=\"tk-t\">uint8_t</span>)(r % <span class=\"tk-n\">5</span>);","        <span class=\"tk-k\">else</span>                    kind = (<span class=\"tk-t\">uint8_t</span>)(<span class=\"tk-n\">O_BIRD_MID</span> + (r &amp; <span class=\"tk-n\">1</span>));","        <span class=\"tk-f\">obst_spawn</span>(kind, <span class=\"tk-n\">SCR_W</span> + <span class=\"tk-n\">4</span>);","    }","}","","<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * the tutorial</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Every step is \"do the thing and watch the dino answer\".  The</span>","<span class=\"tk-c\"> * dino stays fully interactive the whole time, so the player is</span>","<span class=\"tk-c\"> * already practising before the run starts.</span>","<span class=\"tk-c\"> * ========================================================== */</span>","<span class=\"tk-k\">typedef</span> <span class=\"tk-k\">struct</span> {","    <span class=\"tk-k\">const</span> <span class=\"tk-t\">char</span> *l1;","    <span class=\"tk-k\">const</span> <span class=\"tk-t\">char</span> *l2;","    <span class=\"tk-t\">uint16_t</span>    want;        <span class=\"tk-c\">/* input bits that complete the step */</span>","    <span class=\"tk-t\">uint8_t</span>     cactus;      <span class=\"tk-c\">/* 1 = the step is \"clear an obstacle\" */</span>","} TutStep;","","<span class=\"tk-k\">static</span> <span class=\"tk-k\">const</span> TutStep <span class=\"tk-n\">TUT</span>[] = {","    { <span class=\"tk-s\">\"PRESS  UP\"</span>,          <span class=\"tk-s\">\"the dino jumps\"</span>,            <span class=\"tk-n\">BTN_UP</span>,            <span class=\"tk-n\">0</span> },","    { <span class=\"tk-s\">\"HOLD  DOWN\"</span>,         <span class=\"tk-s\">\"the dino ducks\"</span>,            <span class=\"tk-n\">BTN_DOWN</span>,          <span class=\"tk-n\">0</span> },","    { <span class=\"tk-s\">\"PUSH A STICK UP\"</span>,    <span class=\"tk-s\">\"either stick jumps too\"</span>,    <span class=\"tk-n\">J1_UP</span> | <span class=\"tk-n\">J2_UP</span>,     <span class=\"tk-n\">0</span> },","    { <span class=\"tk-s\">\"PULL A STICK DOWN\"</span>,  <span class=\"tk-s\">\"either stick ducks too\"</span>,    <span class=\"tk-n\">J1_DOWN</span> | <span class=\"tk-n\">J2_DOWN</span>, <span class=\"tk-n\">0</span> },","    { <span class=\"tk-s\">\"JUMP THE CACTUS\"</span>,    <span class=\"tk-s\">\"wait for it, then press UP\"</span>, <span class=\"tk-n\">0</span>,                <span class=\"tk-n\">1</span> },","};","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">TUT_N</span> (<span class=\"tk-k\">sizeof</span>(<span class=\"tk-n\">TUT</span>) / <span class=\"tk-k\">sizeof</span>(<span class=\"tk-n\">TUT</span>[<span class=\"tk-n\">0</span>]))","","<span class=\"tk-c\">/* Returns 1 to continue into the game, 0 if the player backed out. */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span> <span class=\"tk-f\">dino_tutorial</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-t\">uint8_t</span>  step = <span class=\"tk-n\">0</span>;","    <span class=\"tk-t\">uint32_t</span> okUntil = <span class=\"tk-n\">0</span>;             <span class=\"tk-c\">/* while non-zero, \"GOOD!\" is showing */</span>","    <span class=\"tk-t\">uint32_t</span> t0;","","    <span class=\"tk-f\">draw_static_bg</span>();","    <span class=\"tk-f\">dino_reset</span>();","    <span class=\"tk-f\">obst_clear</span>();","    s_speed16   = <span class=\"tk-n\">SPEED_MIN16</span>;","    s_groundOfs = <span class=\"tk-n\">0</span>;","    s_shown     = <span class=\"tk-n\">0xFFFFFFFF</span>;","    s_score     = <span class=\"tk-n\">0</span>;","","    <span class=\"tk-f\">UI_Banner</span>(<span class=\"tk-n\">TUT</span>[<span class=\"tk-n\">0</span>].l1, <span class=\"tk-n\">TUT</span>[<span class=\"tk-n\">0</span>].l2, <span class=\"tk-n\">INK</span>, <span class=\"tk-n\">SKY</span>);","    <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">232</span>, <span class=\"tk-n\">210</span>, <span class=\"tk-n\">80</span>, <span class=\"tk-n\">24</span>, <span class=\"tk-s\">\"SKIP\"</span>, <span class=\"tk-n\">DIMINK</span>, <span class=\"tk-n\">SKY</span>, &amp;Font12);","    <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">96</span>, <span class=\"tk-n\">216</span>, <span class=\"tk-s\">\"KEY1 = MENU\"</span>, <span class=\"tk-n\">DIMINK</span>, <span class=\"tk-n\">SKY</span>, &amp;Font12);","    <span class=\"tk-f\">draw_ground</span>(<span class=\"tk-n\">0</span>);","    <span class=\"tk-f\">draw_dino</span>();","    <span class=\"tk-f\">Input_Flush</span>();","    <span class=\"tk-f\">WaitForTouchRelease</span>(<span class=\"tk-n\">5</span>);","","    <span class=\"tk-k\">for</span> (;;) {","        <span class=\"tk-t\">uint16_t</span> held, pressed;","        <span class=\"tk-t\">uint8_t</span>  cleared = <span class=\"tk-n\">0</span>, scroll;","        TS_StateTypeDef ts;","","        t0 = msTick;","        <span class=\"tk-f\">Input_Poll</span>();","        <span class=\"tk-f\">Sound_Update</span>();","","        held    = <span class=\"tk-f\">Input_Held</span>();","        pressed = <span class=\"tk-f\">Input_Pressed</span>();","","        <span class=\"tk-k\">if</span> (pressed &amp; <span class=\"tk-n\">BTN_BACK</span>) <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>;","","        <span class=\"tk-c\">/* tapping SKIP jumps straight into the game */</span>","        <span class=\"tk-f\">TS_GetState</span>(&amp;ts);","        <span class=\"tk-k\">if</span> (ts.TouchDetected) {","            <span class=\"tk-t\">uint8_t</span> hit = <span class=\"tk-f\">UI_HitBox</span>(ts.x, ts.y, <span class=\"tk-n\">232</span>, <span class=\"tk-n\">210</span>, <span class=\"tk-n\">80</span>, <span class=\"tk-n\">24</span>);","            <span class=\"tk-f\">WaitForTouchRelease</span>(<span class=\"tk-n\">5</span>);","            <span class=\"tk-k\">if</span> (hit) <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","        }","","        <span class=\"tk-f\">dino_step</span>(held, pressed);","","        <span class=\"tk-c\">/* the world only scrolls during the last step */</span>","        scroll = (<span class=\"tk-t\">uint8_t</span>)(<span class=\"tk-n\">TUT</span>[step].cactus ? <span class=\"tk-n\">3</span> : <span class=\"tk-n\">1</span>);","        <span class=\"tk-f\">draw_ground</span>(scroll);","        <span class=\"tk-f\">draw_dino</span>();","","        <span class=\"tk-k\">if</span> (<span class=\"tk-n\">TUT</span>[step].cactus) {","            <span class=\"tk-t\">uint8_t</span> i;","            <span class=\"tk-k\">if</span> (!s_obst[<span class=\"tk-n\">0</span>].active &amp;&amp; okUntil == <span class=\"tk-n\">0</span>) <span class=\"tk-f\">obst_spawn</span>(<span class=\"tk-n\">O_CS1</span>, <span class=\"tk-n\">SCR_W</span> + <span class=\"tk-n\">4</span>);","            <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_OBST</span>; i++) {","                <span class=\"tk-k\">if</span> (!s_obst[i].active) <span class=\"tk-k\">continue</span>;","                s_obst[i].x = (<span class=\"tk-t\">int16_t</span>)(s_obst[i].x - scroll);","                <span class=\"tk-f\">draw_obst</span>(&amp;s_obst[i], scroll);","                <span class=\"tk-k\">if</span> (!s_obst[i].active) <span class=\"tk-k\">continue</span>;","","                <span class=\"tk-k\">if</span> (<span class=\"tk-f\">dino_hits</span>(&amp;s_obst[i])) {","                    <span class=\"tk-f\">SFX_Hit</span>();","                    <span class=\"tk-f\">UI_Banner</span>(<span class=\"tk-s\">\"OUCH - TRY AGAIN\"</span>, <span class=\"tk-s\">\"jump a little earlier\"</span>,","                              <span class=\"tk-n\">BADBG</span>, <span class=\"tk-n\">0xFFFF</span>);","                    <span class=\"tk-f\">App_Wait</span>(<span class=\"tk-n\">900</span>);","                    <span class=\"tk-f\">UI_Banner</span>(<span class=\"tk-n\">TUT</span>[step].l1, <span class=\"tk-n\">TUT</span>[step].l2, <span class=\"tk-n\">INK</span>, <span class=\"tk-n\">SKY</span>);","                    s_obst[i].active = <span class=\"tk-n\">0</span>;","                    <span class=\"tk-c\">/* wipe whatever the cactus left behind */</span>","                    <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">SKY</span>);","                    <span class=\"tk-f\">LCD_FillRect</span>(<span class=\"tk-n\">0</span>, <span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">40</span>, <span class=\"tk-n\">SCR_W</span>, <span class=\"tk-n\">40</span>);","                    <span class=\"tk-f\">dino_reset</span>();","                    <span class=\"tk-f\">Input_Flush</span>();","                } <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> (!s_obst[i].passed &amp;&amp;","                           s_obst[i].x + <span class=\"tk-n\">OBST</span>[s_obst[i].kind].spr-&gt;w &lt; <span class=\"tk-n\">DINO_X</span>) {","                    <span class=\"tk-c\">/* Cleared it.  This is tracked separately from</span>","<span class=\"tk-c\">                     * \"the player pressed jump\", otherwise the step</span>","<span class=\"tk-c\">                     * would tick itself off the moment UP is pressed,</span>","<span class=\"tk-c\">                     * before the cactus has actually gone past.      */</span>","                    s_obst[i].passed = <span class=\"tk-n\">1</span>;","                    cleared = <span class=\"tk-n\">1</span>;","                }","            }","        }","","        <span class=\"tk-c\">/* ---- step bookkeeping ---- */</span>","        <span class=\"tk-k\">if</span> (okUntil) {","            <span class=\"tk-k\">if</span> ((<span class=\"tk-t\">int32_t</span>)(msTick - okUntil) &gt;= <span class=\"tk-n\">0</span>) {","                okUntil = <span class=\"tk-n\">0</span>;","                step++;","                <span class=\"tk-k\">if</span> (step &gt;= <span class=\"tk-n\">TUT_N</span>) <span class=\"tk-k\">break</span>;","                <span class=\"tk-f\">UI_Banner</span>(<span class=\"tk-n\">TUT</span>[step].l1, <span class=\"tk-n\">TUT</span>[step].l2, <span class=\"tk-n\">INK</span>, <span class=\"tk-n\">SKY</span>);","                <span class=\"tk-f\">obst_clear</span>();","                <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">SKY</span>);","                <span class=\"tk-f\">LCD_FillRect</span>(<span class=\"tk-n\">0</span>, <span class=\"tk-n\">GROUND_Y</span> - <span class=\"tk-n\">40</span>, <span class=\"tk-n\">SCR_W</span>, <span class=\"tk-n\">40</span>);","                <span class=\"tk-f\">Input_Flush</span>();","            }","        } <span class=\"tk-k\">else</span> {","            <span class=\"tk-t\">uint8_t</span> done = <span class=\"tk-n\">0</span>;","            <span class=\"tk-k\">if</span> (<span class=\"tk-n\">TUT</span>[step].cactus) done = cleared;","            <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> (pressed &amp; <span class=\"tk-n\">TUT</span>[step].want) done = <span class=\"tk-n\">1</span>;","            <span class=\"tk-k\">else</span> <span class=\"tk-k\">if</span> ((held &amp; <span class=\"tk-n\">TUT</span>[step].want) &amp;&amp; (<span class=\"tk-n\">TUT</span>[step].want &amp; <span class=\"tk-n\">ANY_DOWN</span>))","                done = <span class=\"tk-n\">1</span>;             <span class=\"tk-c\">/* \"hold down\" is satisfied by holding */</span>","","            <span class=\"tk-k\">if</span> (done) {","                <span class=\"tk-f\">SFX_Good</span>();","                <span class=\"tk-f\">UI_Banner</span>(<span class=\"tk-s\">\"GOOD!\"</span>, <span class=\"tk-s\">\"\"</span>, <span class=\"tk-n\">OKBG</span>, <span class=\"tk-n\">0xFFFF</span>);","                okUntil = msTick + <span class=\"tk-n\">800</span>;","            }","        }","","        <span class=\"tk-k\">while</span> (msTick - t0 &lt; <span class=\"tk-n\">TICK_MS</span>) { }","    }","","    <span class=\"tk-c\">/* ---- 3-2-1 ---- */</span>","    {","        <span class=\"tk-k\">const</span> <span class=\"tk-t\">char</span> *cd[<span class=\"tk-n\">3</span>] = { <span class=\"tk-s\">\"3\"</span>, <span class=\"tk-s\">\"2\"</span>, <span class=\"tk-s\">\"1\"</span> };","        <span class=\"tk-t\">uint8_t</span> i;","        <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">3</span>; i++) {","            <span class=\"tk-f\">UI_Banner</span>(cd[i], <span class=\"tk-s\">\"get ready\"</span>, <span class=\"tk-n\">INK</span>, <span class=\"tk-n\">SKY</span>);","            <span class=\"tk-f\">Sound_Tone</span>(<span class=\"tk-n\">NOTE_C5</span>, <span class=\"tk-n\">120</span>);","            <span class=\"tk-f\">App_Wait</span>(<span class=\"tk-n\">500</span>);","        }","    }","    <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","}","","<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * the run</span>","<span class=\"tk-c\"> * ========================================================== */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span> <span class=\"tk-f\">dino_play</span>(<span class=\"tk-t\">void</span>)      <span class=\"tk-c\">/* 0 = back to menu, 1 = player died */</span>","{","    <span class=\"tk-t\">uint32_t</span> t0;","    <span class=\"tk-t\">uint16_t</span> framesSinceSpeedUp = <span class=\"tk-n\">0</span>;","","    <span class=\"tk-f\">draw_static_bg</span>();","    <span class=\"tk-f\">dino_reset</span>();","    <span class=\"tk-f\">obst_clear</span>();","    s_speed16   = <span class=\"tk-n\">SPEED_MIN16</span>;","    s_scrollRem = <span class=\"tk-n\">0</span>;","    s_dist      = <span class=\"tk-n\">0</span>;","    s_score     = <span class=\"tk-n\">0</span>;","    s_shown     = <span class=\"tk-n\">0xFFFFFFFF</span>;","    s_cloudX[<span class=\"tk-n\">0</span>] = <span class=\"tk-n\">140</span>;","    s_cloudX[<span class=\"tk-n\">1</span>] = <span class=\"tk-n\">250</span>;","    s_cloudRem  = <span class=\"tk-n\">0</span>;","","    <span class=\"tk-f\">draw_ground</span>(<span class=\"tk-n\">0</span>);","    <span class=\"tk-f\">draw_score</span>();","    <span class=\"tk-f\">Input_Flush</span>();","    <span class=\"tk-f\">SFX_Start</span>();","","    <span class=\"tk-k\">for</span> (;;) {","        <span class=\"tk-t\">uint16_t</span> held, pressed;","        <span class=\"tk-t\">uint8_t</span>  step, i;","","        t0 = msTick;","        <span class=\"tk-f\">Input_Poll</span>();","        <span class=\"tk-f\">Sound_Update</span>();","","        held    = <span class=\"tk-f\">Input_Held</span>();","        pressed = <span class=\"tk-f\">Input_Pressed</span>();","        <span class=\"tk-k\">if</span> (pressed &amp; <span class=\"tk-n\">BTN_BACK</span>) {","            <span class=\"tk-k\">if</span> (s_score &gt; s_hi) s_hi = s_score;","            <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>;","        }","","        <span class=\"tk-f\">dino_step</span>(held, pressed);","","        <span class=\"tk-c\">/* ---- how far does the world move this frame? ---- */</span>","        s_scrollRem += s_speed16;","        step = (<span class=\"tk-t\">uint8_t</span>)(s_scrollRem / <span class=\"tk-n\">16</span>);","        s_scrollRem %= <span class=\"tk-n\">16</span>;","","        <span class=\"tk-k\">if</span> (++framesSinceSpeedUp &gt;= <span class=\"tk-n\">45</span> &amp;&amp; s_speed16 &lt; <span class=\"tk-n\">SPEED_MAX16</span>) {","            framesSinceSpeedUp = <span class=\"tk-n\">0</span>;","            s_speed16++;","        }","","        <span class=\"tk-f\">obst_maybe_spawn</span>();","","        <span class=\"tk-f\">draw_clouds</span>(step);","        <span class=\"tk-f\">draw_ground</span>(step);","        <span class=\"tk-f\">draw_dino</span>();","","        <span class=\"tk-k\">for</span> (i = <span class=\"tk-n\">0</span>; i &lt; <span class=\"tk-n\">MAX_OBST</span>; i++) {","            <span class=\"tk-k\">if</span> (!s_obst[i].active) <span class=\"tk-k\">continue</span>;","            s_obst[i].x = (<span class=\"tk-t\">int16_t</span>)(s_obst[i].x - step);","            <span class=\"tk-f\">draw_obst</span>(&amp;s_obst[i], step);","            <span class=\"tk-k\">if</span> (!s_obst[i].active) <span class=\"tk-k\">continue</span>;","","            <span class=\"tk-k\">if</span> (<span class=\"tk-f\">dino_hits</span>(&amp;s_obst[i])) {","                s_dead = <span class=\"tk-n\">1</span>;","                <span class=\"tk-f\">draw_dino</span>();","                <span class=\"tk-f\">SFX_Hit</span>();","                <span class=\"tk-k\">if</span> (s_score &gt; s_hi) s_hi = s_score;","                <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","            }","        }","","        <span class=\"tk-c\">/* ---- score ---- */</span>","        s_dist += step;","        s_score = s_dist / <span class=\"tk-n\">8</span>;","        <span class=\"tk-k\">if</span> (s_score / <span class=\"tk-n\">100</span> != s_shown / <span class=\"tk-n\">100</span> &amp;&amp; s_score &gt;= <span class=\"tk-n\">100</span>) <span class=\"tk-f\">SFX_Point</span>();","        <span class=\"tk-f\">draw_score</span>();","","        <span class=\"tk-k\">while</span> (msTick - t0 &lt; <span class=\"tk-n\">TICK_MS</span>) { }","    }","}","","<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * game-over screen</span>","<span class=\"tk-c\"> * ========================================================== */</span>","<span class=\"tk-k\">static</span> <span class=\"tk-t\">uint8_t</span> <span class=\"tk-f\">dino_gameover</span>(<span class=\"tk-t\">void</span>)   <span class=\"tk-c\">/* 1 = retry, 0 = menu */</span>","{","    TS_StateTypeDef ts;","    <span class=\"tk-t\">char</span> buf[<span class=\"tk-n\">32</span>];","","    <span class=\"tk-f\">LCD_SetTextColor</span>(<span class=\"tk-n\">SKY</span>);","    <span class=\"tk-f\">LCD_FillRect</span>(<span class=\"tk-n\">30</span>, <span class=\"tk-n\">70</span>, <span class=\"tk-n\">260</span>, <span class=\"tk-n\">70</span>);","","    <span class=\"tk-f\">Gfx_Sprite</span>((<span class=\"tk-n\">SCR_W</span> - <span class=\"tk-n\">SPR_GAMEOVER</span>.w) / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">78</span>, &amp;<span class=\"tk-n\">SPR_GAMEOVER</span>, <span class=\"tk-n\">INK</span>, <span class=\"tk-n\">SKY</span>);","","    <span class=\"tk-f\">sprintf</span>(buf, <span class=\"tk-s\">\"SCORE %05lu    HI %05lu\"</span>,","            (<span class=\"tk-t\">unsigned</span> <span class=\"tk-t\">long</span>)s_score, (<span class=\"tk-t\">unsigned</span> <span class=\"tk-t\">long</span>)s_hi);","    <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">104</span>, buf, <span class=\"tk-n\">INK</span>, <span class=\"tk-n\">SKY</span>, &amp;Font12);","","    <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">60</span>, <span class=\"tk-n\">124</span>, <span class=\"tk-n\">90</span>, <span class=\"tk-n\">26</span>, <span class=\"tk-s\">\"RETRY\"</span>, <span class=\"tk-n\">INK</span>, <span class=\"tk-n\">SKY</span>, &amp;Font12);","    <span class=\"tk-f\">UI_Button</span>(<span class=\"tk-n\">172</span>, <span class=\"tk-n\">124</span>, <span class=\"tk-n\">90</span>, <span class=\"tk-n\">26</span>, <span class=\"tk-s\">\"MENU\"</span>, <span class=\"tk-n\">DIMINK</span>, <span class=\"tk-n\">SKY</span>, &amp;Font12);","    <span class=\"tk-f\">UI_TextCentred</span>(<span class=\"tk-n\">SCR_W</span> / <span class=\"tk-n\">2</span>, <span class=\"tk-n\">214</span>, <span class=\"tk-s\">\"UP = RETRY    KEY1 = MENU\"</span>,","                   <span class=\"tk-n\">DIMINK</span>, <span class=\"tk-n\">SKY</span>, &amp;Font12);","","    <span class=\"tk-f\">Input_Flush</span>();","    <span class=\"tk-f\">WaitForTouchRelease</span>(<span class=\"tk-n\">5</span>);","","    <span class=\"tk-k\">for</span> (;;) {","        <span class=\"tk-t\">uint32_t</span> t0 = msTick;","        <span class=\"tk-t\">uint16_t</span> p;","","        <span class=\"tk-f\">Input_Poll</span>();","        <span class=\"tk-f\">Sound_Update</span>();","        p = <span class=\"tk-f\">Input_Pressed</span>();","","        <span class=\"tk-k\">if</span> (p &amp; <span class=\"tk-n\">BTN_BACK</span>) <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>;","        <span class=\"tk-k\">if</span> (p &amp; (<span class=\"tk-n\">ANY_UP</span> | <span class=\"tk-n\">BTN_J1SW</span> | <span class=\"tk-n\">BTN_J2SW</span>)) <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","","        <span class=\"tk-f\">TS_GetState</span>(&amp;ts);","        <span class=\"tk-k\">if</span> (ts.TouchDetected) {","            <span class=\"tk-f\">WaitForTouchRelease</span>(<span class=\"tk-n\">5</span>);","            <span class=\"tk-k\">if</span> (<span class=\"tk-f\">UI_HitBox</span>(ts.x, ts.y, <span class=\"tk-n\">172</span>, <span class=\"tk-n\">124</span>, <span class=\"tk-n\">90</span>, <span class=\"tk-n\">26</span>)) <span class=\"tk-k\">return</span> <span class=\"tk-n\">0</span>;","            <span class=\"tk-k\">if</span> (<span class=\"tk-f\">UI_HitBox</span>(ts.x, ts.y, <span class=\"tk-n\">60</span>, <span class=\"tk-n\">124</span>, <span class=\"tk-n\">90</span>, <span class=\"tk-n\">26</span>))  <span class=\"tk-k\">return</span> <span class=\"tk-n\">1</span>;","        }","","        <span class=\"tk-k\">while</span> (msTick - t0 &lt; <span class=\"tk-n\">10u</span>) { }","    }","}","","<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * entry point</span>","<span class=\"tk-c\"> * ========================================================== */</span>","<span class=\"tk-t\">void</span> <span class=\"tk-f\">Dino_Run</span>(<span class=\"tk-t\">void</span>)","{","    <span class=\"tk-k\">if</span> (!<span class=\"tk-f\">dino_tutorial</span>()) <span class=\"tk-k\">return</span>;","","    <span class=\"tk-k\">for</span> (;;) {","        <span class=\"tk-k\">if</span> (!<span class=\"tk-f\">dino_play</span>()) <span class=\"tk-k\">return</span>;          <span class=\"tk-c\">/* KEY1 during the run */</span>","        <span class=\"tk-k\">if</span> (!<span class=\"tk-f\">dino_gameover</span>()) <span class=\"tk-k\">return</span>;      <span class=\"tk-c\">/* chose MENU          */</span>","    }","}"],"App/game_2048.c":["<span class=\"tk-c\">/* ============================================================</span>","<span class=\"tk-c\"> * game_2048.c - 2048 sliding-tile puzzle</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * Board logic is the course project's original (MCU2026/2048),</span>","<span class=\"tk-c\"> * with three changes:</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> *   1. LAYOUT FIX.  The old top bar printed one long string,</span>","<span class=\"tk-c\"> *      \"Score:%5lu  Best:%5lu\", at x=2 in Font20 (14 px per</span>","<span class=\"tk-c\"> *      character).  23 characters x 14 px = 322 px, on a 320 px</span>","<span class=\"tk-c\"> *      screen, so it ran straight through the New Game button at</span>","<span class=\"tk-c\"> *      x=220.  The bar is now four separate fields with fixed,</span>","<span class=\"tk-c\"> *      non-overlapping boxes.</span>","<span class=\"tk-c\"> *   2. Tile numbers pick a font that actually fits the 44 px</span>","<span class=\"tk-c\"> *      cell, so 1024 and 2048 no longer spill over the edges.</span>","<span class=\"tk-c\"> *   3. A swipe tutorial runs before the first game.</span>","<span class=\"tk-c\"> *</span>","<span class=\"tk-c\"> * SCREEN (320 x 240)</span>","<span class=\"tk-c\"> *   y 0..37   top bar: SCORE | BEST | NEW | MENU</span>","<span class=\"tk-c\"> *   y 39..239 the 4x4 board, 201 px square, centred at x=59</span>","<span class=\"tk-c\"> * ============================================================ */</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"console.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"input.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"sound.h\"</span>","<span class=\"tk-p\">#include</span> <span class=\"tk-s\">\"gfx.h\"</span>","<span class=\"tk-p\">#include</span> &lt;stdio.h&gt;","<span class=\"tk-p\">#include</span> &lt;string.h&gt;","","<span class=\"tk-c\">/* ---- board geometry (unchanged from the original) ---------- */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BOARD_N</span>      <span class=\"tk-n\">4</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CELL_SIZE</span>    <span class=\"tk-n\">44</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">CELL_GAP</span>     <span class=\"tk-n\">5</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">GRID_X</span>       <span class=\"tk-n\">59</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">GRID_Y</span>       <span class=\"tk-n\">39</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">GRID_SIDE</span>   ((<span class=\"tk-n\">BOARD_N</span>) * (<span class=\"tk-n\">CELL_SIZE</span>) + (<span class=\"tk-n\">BOARD_N</span> + <span class=\"tk-n\">1</span>) * (<span class=\"tk-n\">CELL_GAP</span>))  <span class=\"tk-c\">/* 201 */</span>","","<span class=\"tk-c\">/* ---- top bar: every field gets its own box, and they do not</span>","<span class=\"tk-c\"> *      overlap.  Check the arithmetic in the comments before</span>","<span class=\"tk-c\"> *      changing a font here.                                   */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BAR_H</span>        <span class=\"tk-n\">38</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BAR_BG</span>       <span class=\"tk-n\">0x5ACB</span>","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">SCORE_X</span>       <span class=\"tk-n\">6</span>      <span class=\"tk-c\">/* label Font12 5x7=35 px; value Font16 5x11=55 px */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BEST_X</span>       <span class=\"tk-n\">96</span>      <span class=\"tk-c\">/*                        -&gt; 6..61 and 96..151     */</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">LBL_Y</span>         <span class=\"tk-n\">3</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">VAL_Y</span>        <span class=\"tk-n\">18</span>","","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_NEW_X</span>   <span class=\"tk-n\">196</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_MENU_X</span>  <span class=\"tk-n\">258</span>","<span class=\"tk-p\">#define</span> <span class=\"tk-n\">BTN_Y</span>         <span class=\"tk-n\">4</span>","<span class=\"tk-p\">#define</span> <span class=\"
